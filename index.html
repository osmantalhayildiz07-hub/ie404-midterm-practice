<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IE404 Midterm Practice</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --text: #1d2330; --muted: #5d6677; --border: #dde1e8;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --ok: #1f8a4c; --ok-soft: #e3f4ea; --bad: #c33b3b; --bad-soft: #fbe7e7;
  --reading: #8a4fbf; --reading-soft: #f2eafa; --radius: 12px; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 2px 8px rgba(20,30,50,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1b2029; --text: #e7eaf0; --muted: #9aa3b4; --border: #2c3340;
    --accent: #7c9cf5; --accent-soft: #233154; --reading: #c49cf0; --reading-soft: #33244a; --ok: #4cc283; --ok-soft: #173326; --bad: #ef7676; --bad-soft: #3a1d1f;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1b2029; --text: #e7eaf0; --muted: #9aa3b4; --border: #2c3340;
  --accent: #7c9cf5; --accent-soft: #233154; --reading: #c49cf0; --reading-soft: #33244a; --ok: #4cc283; --ok-soft: #173326; --bad: #ef7676; --bad-soft: #3a1d1f;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 1.45rem; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.1rem; margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
button, .btn { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 9px 14px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] button.primary, :root:not([data-theme="light"]) button.primary { color: #fff; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.link { border: none; background: none; color: var(--muted); padding: 4px 6px; text-decoration: underline; }
.sec-card { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 16px; min-height: 132px; }
.sec-card .num { font-size: .75rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.sec-card.reading .num { color: var(--reading); }
.sec-card.reading .bar > span { background: var(--reading); }
.pill.reading { background: var(--reading-soft); color: var(--reading); }
.group-head { margin-bottom: 10px; }
.group.reading { border-top: 1px solid var(--border); padding-top: 16px; }
.sec-card .name { font-weight: 600; line-height: 1.3; }
.bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.bar.ok > span { background: var(--ok); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 8px 14px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
input[type=number] { font: inherit; width: 80px; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
label.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.pill { font-size: .8rem; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.low { color: var(--bad); }
.question { font-size: 1.08rem; font-weight: 600; margin: 4px 0 14px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; width: 100%; line-height: 1.4; }
.opt .key { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); display: grid; place-items: center; font-size: .85rem; font-weight: 600; color: var(--muted); }
.opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.opt.selected .key { border-color: var(--accent); color: var(--accent); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .key { border-color: var(--ok); color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { border-color: var(--bad); color: var(--bad); }
.opt:disabled { opacity: 1; cursor: default; }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); }
.feedback.ok { border-color: var(--ok); background: var(--ok-soft); }
.feedback.bad { border-color: var(--bad); background: var(--bad-soft); }
.feedback strong { display: block; margin-bottom: 4px; }
.source { margin-top: 6px; font-size: .82rem; color: var(--muted); }
.nav { margin-top: 16px; display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.hint { margin-top: 10px; font-size: .8rem; color: var(--muted); }
.big-score { font-size: 2.4rem; font-weight: 700; line-height: 1.1; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
td, th { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.review-item { border-top: 1px solid var(--border); padding-top: 14px; }
.review-item .ans { font-size: .92rem; margin: 3px 0; }
.ans.bad { color: var(--bad); }
.ans.ok { color: var(--ok); }
.palette { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
.palette button { width: 34px; height: 30px; padding: 0; font-size: .75rem; border-radius: 6px; }
.palette button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.palette button.cur { outline: 2px solid var(--text); outline-offset: 1px; }
@media (max-width: 520px) {
  .wrap { padding: 14px 16px 40px; }
  h1 { font-size: 1.25rem; }
  .question { font-size: 1rem; }
  .big-score { font-size: 2rem; }
  .hint { display: none; }
}
</style>
</head>

<div class="wrap" id="app"></div>
<script>
const QUESTIONS = [{"id":"S1-001","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 2","question":"Which of the following is NOT one of the '6 Pillars for Work & Win on Purpose'?","options":["Learn to work with AI","Maximize shareholder returns","Know yourself","Learn to create value"],"answer_index":1,"explanation":"The six pillars are: know yourself, understand people, develop competencies, develop your intelligences, learn to work with AI, and learn to create value."},{"id":"S1-002","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 2","question":"According to the 6 Pillars slide, in what progression should an engineer learn to use AI?","options":["Tool → Replacement → Manager → Leader","Assistant → Thinking partner → Challenger → Simulator","Simulator → Challenger → Assistant → Decision maker → Replacement","Search engine → Calculator → Advisor → Judge"],"answer_index":1,"explanation":"Pillar 5 lists AI as Assistant → Thinking Partner → Challenger → Simulator."},{"id":"S1-003","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 2","question":"According to Pillar 6 ('Learn to create value'), value is created by combining which elements?","options":["Knowledge + discipline + speed + automation + capital","Judgment + competencies + people skills + AI","Capital + labor + technology + time","IQ + experience + seniority + networking"],"answer_index":1,"explanation":"Pillar 6 defines value creation as Judgment + Competencies + People Skills + AI."},{"id":"S1-004","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 4","question":"What formula does the lecture give for 'Your Professional Value'?","options":["Personality + Competencies + IQ/EQ/SQ + AI leverage","Technical skill × Working hours × Years of experience in the field","Degree + GPA + Internships + Certificates","Knowledge + Skills + Abilities + Seniority"],"answer_index":0,"explanation":"Slide 4 states: Your professional value = Personality + Competencies + IQ/EQ/SQ + AI leverage."},{"id":"S1-005","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 7","question":"What is the main message of the lecture about how personality models should be used?","options":["Use them mainly for hiring and firing decisions","Use them mainly to replace performance data in formal evaluations","Use them to ask better questions, not to put people into boxes","Use them to predict exactly how a person will act"],"answer_index":2,"explanation":"Slide 7: 'Use personality models to ask better questions — not to put people into boxes.'"},{"id":"S1-006","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 7","question":"Why does the lecture compare personality models to forecasting, simulation and queuing models used by industrial engineers?","options":["Because all of them produce precise numerical scores","Because all of them eliminate uncertainty from decisions","Because all of them are validated by specialized optimization software","Because all of them are simplifications of reality, not reality itself"],"answer_index":3,"explanation":"'A model is a simplification of reality—not reality itself'; personality and AI models simplify and must not be confused with reality."},{"id":"S1-007","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 9","question":"In the IE 404 4 Business Personas model, what is the 'main drive' of the Peaceful persona?","options":["Results","Accuracy","Excitement","Harmony"],"answer_index":3,"explanation":"Main drives: Playful–Excitement, Precise–Accuracy, Powerful–Results, Peaceful–Harmony."},{"id":"S1-008","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 9","question":"Which persona typically asks 'Is it correct?'","options":["Powerful","Precise","Playful","Peaceful"],"answer_index":1,"explanation":"The Precise persona focuses on facts and details and asks 'Is it correct?'."},{"id":"S1-009","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 9","question":"According to the 4 Personas table, what is the main possible risk of the Powerful persona?","options":["Lack of follow-through","Avoiding confrontation","Impatience","Overanalysis"],"answer_index":2,"explanation":"Possible risks: Playful–lack of follow-through, Precise–overanalysis, Powerful–impatience, Peaceful–avoiding confrontation."},{"id":"S1-010","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 9","question":"A colleague's main question in every project meeting is 'How will people be affected?'. Which persona does this most closely match?","options":["Powerful","Peaceful","Precise","Playful"],"answer_index":1,"explanation":"The Peaceful persona focuses on relationships and stability and asks how people will be affected."},{"id":"S1-011","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 9","question":"Which focus area is attributed to the Playful persona?","options":["People & possibilities","Goals & action","Relationships & stability","Facts & details"],"answer_index":0,"explanation":"Playful focuses on people & possibilities; Precise on facts & details; Powerful on goals & action; Peaceful on relationships & stability."},{"id":"S1-012","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 10","question":"Which equation summarizes the Playful style in the lecture?","options":["Playful = Trust + Stability + Support","Playful = Energy + People + Ideas","Playful = Action + Results + Control","Playful = Facts + Quality + Structure"],"answer_index":1,"explanation":"Slide 10: PLAYFUL = ENERGY + PEOPLE + IDEAS. The other equations describe Precise and Powerful."},{"id":"S1-013","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 10","question":"What is described as the key management challenge for a Playful person?","options":["Confronting poor performance","Making decisions with incomplete information","Listening before deciding","Turning energy into consistent execution"],"answer_index":3,"explanation":"The slide says the management challenge is to turn that energy into consistent execution."},{"id":"S1-014","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 11","question":"When working with a Playful person, besides giving room for ideas, what should a manager ALSO provide?","options":["Clear priorities, deadlines, follow-up and structure","Boundaries, consequences, evidence and some constructive challenge","Detailed data and time to analyze it","Permission to disagree and time to adjust"],"answer_index":0,"explanation":"For Playful people, also provide clear priorities, deadlines, follow-up and structure."},{"id":"S1-015","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 12","question":"Which of the following is listed as a behavior of a Precise person 'when overused'?","options":["Dominating discussions and overlooking people's feelings","Promising more than they can realistically deliver to others","Pursuing perfection when 'good enough' is sufficient","Hesitating to say 'no' and avoiding hard conversations"],"answer_index":2,"explanation":"Overused Precise behaviors include over-analysis, seeking too much information and pursuing perfection when 'good enough' is sufficient."},{"id":"S1-016","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 13","question":"When working with a Precise person, which item should the manager ALSO provide beyond facts and logic?","options":["More time to adjust to change","Permission to act without perfect information","Different viewpoints, clear boundaries and some constructive challenge","More interaction and recognition"],"answer_index":1,"explanation":"Precise people should also be given clear deadlines, decision points, priorities and permission to act without perfect information."},{"id":"S1-017","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 13","question":"What is the 'management message' for working with Precise people?","options":["Accuracy creates value—but perfection can have a cost","Creativity creates ideas—but distraction can be costly","Decisiveness creates momentum—but speed can be costly","Harmony creates relationships—but avoidance can be costly"],"answer_index":0,"explanation":"Slide 13: accuracy creates value but perfection has a cost; sometimes a good decision must be made with incomplete information."},{"id":"S1-018","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 14","question":"What is the management challenge stated for the Powerful persona?","options":["Speak up even when it causes friction","Turn energy into consistent execution","Act decisively—but listen before you decide","Decide quickly, even without having perfect information"],"answer_index":2,"explanation":"The Powerful management challenge is 'Act decisively—but listen before you decide.'"},{"id":"S1-019","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 15","question":"According to the lecture, in which situation is the Powerful style likely to be LESS effective?","options":["When bureaucracy is blocking a project","When team commitment and collaboration are required","During a crisis that requires very fast and firm decisions","When a project needs to be pushed forward"],"answer_index":1,"explanation":"A Powerful style can be very effective in a crisis, but less effective when team commitment and collaboration are required."},{"id":"S1-020","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 16","question":"Which of the following is listed as a Peaceful behavior 'when overused'?","options":["Making decisions too quickly","Becoming overly critical","Delaying confronting poor performance","Struggling with routine and follow-through"],"answer_index":2,"explanation":"Overused Peaceful behaviors: avoiding difficult conversations, hesitating to say no, resisting sudden change, delaying confronting poor performance."},{"id":"S1-021","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 17","question":"When working with a Peaceful person, which of the following should a manager ALSO provide?","options":["Room for ideas and interaction","Encouragement to speak up and permission to disagree","Constructive challenge and consequences","Adequate information, the logic behind it, and permission to ask questions"],"answer_index":1,"explanation":"For Peaceful people, also provide clear expectations, encouragement to speak up, decision deadlines and permission to disagree."},{"id":"S1-022","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 17","question":"What does the lecture warn about the Peaceful tendency to preserve harmony?","options":["Harmony tends to make teams overly competitive and politically divided","Avoiding necessary conflict can create bigger problems later","Too much harmony always reduces the team's productivity","Harmony prevents people from building trust over time"],"answer_index":1,"explanation":"Management message: harmony creates strong relationships, but avoiding necessary conflict can create bigger problems later."},{"id":"S1-023","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 18","question":"What does the lecture say about whether people belong to a single personality type?","options":["Only managers show more than one style","Each person has exactly one dominant type that never varies across situations","Types change every few years with experience","People are a blend; they may show characteristics of more than one style"],"answer_index":3,"explanation":"'People are a blend' — you may show characteristics of more than one style, and some tendencies are stronger than others."},{"id":"S1-024","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 19","question":"On the personality self-assessment word list, 'Mediator', 'Likes routine' and 'Good listener' belong to which style?","options":["Powerful","Peaceful","Precise","Playful"],"answer_index":1,"explanation":"The word table groups 'Mediator', 'Likes routine' and 'Good listener' under Peaceful."},{"id":"S1-025","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 20","question":"Which set of potential strengths is attributed to the Playful style?","options":["Analysis, accuracy, quality, planning","Creativity, energy, networking, enthusiasm","Cooperation, listening, stability and long-term trust","Decisions, action, results, direction"],"answer_index":1,"explanation":"Slide 20: Playful → creativity, energy, networking, enthusiasm."},{"id":"S1-026","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 20","question":"Are all personalities good for a workplace, according to the lecture?","options":["No, only Powerful and Precise suit management","Yes, but not every behavior is effective in every situation","Yes, and every behavior is equally effective in every possible situation","No, the Playful style is unsuitable for engineering"],"answer_index":1,"explanation":"The answer given is 'YES — but not every behavior is effective in every situation'; the best manager is one who can adapt."},{"id":"S1-027","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 21","question":"According to the 'Personality ≠ Competency' slide, what can a Precise manager learn?","options":["To decide under uncertainty","Active listening skills","Assertiveness in meetings","Discipline in follow-up"],"answer_index":0,"explanation":"Peaceful can learn assertiveness, Powerful active listening, Playful discipline, and Precise to decide under uncertainty."},{"id":"S1-028","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 21","question":"Which statement best summarizes the lecture's advice on personality development?","options":["Change your personality to match your boss","Hide your natural tendencies at work","Choose a job that never challenges your natural personality style","Don't try to change who you are; expand what you can do"],"answer_index":3,"explanation":"Slide 21: 'DON'T TRY TO CHANGE WHO YOU ARE. EXPAND WHAT YOU CAN DO.'"},{"id":"S1-029","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 25","question":"According to the 'Overdose of Personality Traits' slide, an overdose of the Precise style can turn into what?","options":["Depression & self-sacrifice","Egocentrism & hysteria","Narcissism","Compulsion & paranoia"],"answer_index":3,"explanation":"Overdoses: Playful – egocentrism & hysteria; Precise – compulsion & paranoia; Powerful – narcissism; Peaceful – depression & self-sacrifice."},{"id":"S1-030","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 25","question":"On the overdose slide, a manager for whom 'nothing is ever their fault' illustrates an overdose of which style?","options":["Playful","Peaceful","Powerful","Precise"],"answer_index":2,"explanation":"Powerful overdose is linked to narcissism, where nothing is ever their fault."},{"id":"S1-031","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 25","question":"Which consequence is linked to an overdose of the Peaceful style?","options":["A series of rituals that serve little purpose","Blaming others for every failure","Subordinates coping with escalating demands","Suffering from burnout"],"answer_index":3,"explanation":"Peaceful overdose (depression & self-sacrifice) leads to suffering from burnout."},{"id":"S1-032","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 26","question":"Which sequence summarizes 'Manage your personality — don't let it manage you'?","options":["Adapt yourself → Know yourself → Promote yourself","Test yourself → Label yourself → Defend yourself","Know yourself → Change yourself → Replace yourself","Know yourself → Stretch yourself → Adapt yourself"],"answer_index":3,"explanation":"Slide 26 ends with KNOW YOURSELF → STRETCH YOURSELF → ADAPT YOURSELF."},{"id":"S1-033","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 27","question":"What does 'watch for overdosing' mean in the personality key takeaways?","options":["Strong personalities should be avoided in teams","A strength used excessively can become a weakness","Too many personality tests distort results","Too many different personalities in one team inevitably cause conflict"],"answer_index":1,"explanation":"Key takeaway 4: a strength used excessively can become a weakness."},{"id":"S1-034","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 28","question":"According to the 'Multiplier Effect' slide, what happens when poor judgment is combined with AI?","options":["Impact stays the same as without AI","Judgment improves over time","Mistakes are automatically corrected","Faster and larger mistakes"],"answer_index":3,"explanation":"Good judgment × AI → greater impact, but poor judgment × AI → faster and larger mistakes."},{"id":"S1-035","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 29","question":"If everybody has access to the same AI, where does the lecture say competitive advantage will come from?","options":["Automating every management task as quickly as possible","Your judgment, experience, creativity and ability to understand people","Writing better, longer and more detailed prompts than all your competitors","Buying more expensive and more advanced AI tools"],"answer_index":1,"explanation":"Slide 29: 'AI may become common. Good judgment will remain scarce.'"},{"id":"S1-036","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 31","question":"How does the lecture distinguish personality from competency?","options":["Personality influences HOW you behave; competency determines WHAT you can do effectively","They are two different words used for exactly the same concept","Personality determines your salary level; competency determines your job title","Personality can be learned in training; competency is innate and fixed from birth"],"answer_index":0,"explanation":"Slide 31: personality influences how you naturally behave, competency determines what you are capable of doing effectively."},{"id":"S1-037","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 32","question":"A competency becomes credible when demonstrated through knowledge, application, results and which fourth element?","options":["Charisma","Confidence","Consistency","Certification"],"answer_index":2,"explanation":"Consistency asks: can you do it repeatedly in different situations?"},{"id":"S1-038","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 32","question":"Why does the lecture recommend replacing 'Excellent problem-solving skills' on a CV with a specific internship story?","options":["Because competency must be demonstrated, not merely claimed","Because soft skills should generally not appear on an engineering CV","Because stories are easier to verify by AI","Because recruiters dislike short sentences"],"answer_index":0,"explanation":"'Don't tell me you are competent — show me.' A concrete example demonstrates the competency."},{"id":"S1-039","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 33","question":"In the KSA model applied to improving a production line, being able to enter a real factory, identify the actual problem, work with people and turn analysis into action is an example of:","options":["Attitude","Ability","Skill","Knowledge"],"answer_index":1,"explanation":"Ability is the capacity to use knowledge and skills effectively in real, different situations."},{"id":"S1-040","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 33","question":"In the KSA production-line example, being able to analyze production data, build a model and communicate the results is an example of:","options":["Knowledge","Judgment","Skill","Ability"],"answer_index":2,"explanation":"Skills are learned proficiencies developed through training and practice (what you can DO)."},{"id":"S1-041","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 34","question":"In the lecture's chain of 'real competency', which step immediately follows 'Communicate the recommendation'?","options":["Develop alternatives","Measure the result","Convince stakeholders","Identify the real problem"],"answer_index":2,"explanation":"The chain is: identify → analyze → develop alternatives → communicate → convince stakeholders → help implement → measure."},{"id":"S1-042","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 35","question":"What is the 'Task vs. Competency' distinction the lecture uses for AI?","options":["AI has true competencies, while humans increasingly perform only routine tasks","AI may perform tasks, but competency requires integrating outputs with context, people, judgment, responsibility and action","AI should perform all tasks and competencies equally, so engineers can focus on coding","Tasks require human judgment, while competencies are performed automatically by AI"],"answer_index":1,"explanation":"Don't compete with AI at doing tasks; learn to manage AI while integrating people, judgment and responsibility."},{"id":"S1-043","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 36","question":"What is the 'AI-era competency model' formula?","options":["Competency = Knowledge + Experience + Seniority","Competency = KSA + Judgment + Responsibility","Competency = IQ + EQ + SQ","Competency = KSA × AI"],"answer_index":1,"explanation":"Slide 36: AI can strengthen KSA, but the professional remains responsible for the result."},{"id":"S1-044","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 36","question":"An AI produces an impressive recommendation for a production problem. Which question is NOT among those the lecture says the engineer should ask before accepting it?","options":["Is the data used by the AI reliable?","How quickly can the AI produce another version?","Are the assumptions behind the recommendation realistic?","How will I verify the result afterwards?"],"answer_index":1,"explanation":"The listed checks include problem definition, assumptions, data reliability, what AI overlooked, who is affected, implementability and verification."},{"id":"S1-045","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 37","question":"How does the lecture define the 'problem solving' competency employers expect in the AI era?","options":["Define the real problem—not merely solve the problem given","Solve as many of the problems you are given as quickly as possible","Use the most advanced mathematics available","Delegate problems to AI tools"],"answer_index":0,"explanation":"Slide 37: Problem solving = define the real problem, not merely solve the problem given."},{"id":"S1-046","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 40","question":"On the 'Are You Intelligent?' slide, the ability to understand people and social situations corresponds to which intelligence?","options":["EQ","AI capability","IQ","SQ"],"answer_index":3,"explanation":"Solve problems → IQ; manage emotions → EQ; understand people and social situations → SQ; use AI → AI capability."},{"id":"S1-047","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 41","question":"Which of the following is listed under EQ (Emotional Intelligence) rather than SQ?","options":["Maintain motivation and respond appropriately under pressure","Read social situations and the political dynamics of a meeting room","Build relationships across different departments","Influence and collaborate with other stakeholders"],"answer_index":0,"explanation":"EQ covers recognizing and managing your emotions, maintaining motivation and responding under pressure; the others are SQ items."},{"id":"S1-048","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 42","question":"Which phrase summarizes the lecture's view on IQ versus EQ in a career?","options":["IQ and EQ matter only at entry level","IQ helps you move up — EQ is what gets you in","EQ matters only for HR roles","IQ may get you in — EQ helps you move up"],"answer_index":3,"explanation":"Slide 42: 'IQ MAY GET YOU IN — EQ HELPS YOU MOVE UP.'"},{"id":"S1-049","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 42","question":"In the 'Mehmet' example, what changes as Mehmet's career progresses?","options":["Mehmet no longer needs to communicate with other departments or functions","The technical problems become much harder than any of the people problems","Mehmet's IQ becomes the only thing that senior management evaluates","The questions shift from solving the problem to leading and aligning people around the solution"],"answer_index":3,"explanation":"First: can he solve it? Later: can he lead a team? Later still: can he align Production, Finance, Sales…? The people problem may become harder than the technical one."},{"id":"S1-050","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 43","question":"You proved a new shift structure cuts cost by 12%. According to the lecture, what should your EQ make you ask?","options":["How can I implement it without informing the supervisors?","Which software package produced the most accurate cost forecast for me?","Can the model be re-optimized to save 15% instead of 12%?","How will employees react and how should I communicate the change?"],"answer_index":3,"explanation":"IQ tells you the alternative reduces cost; EQ asks about reactions, concerns and communication — a correct solution can still become a management failure."},{"id":"S1-051","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 44","question":"In the lecture's EQ sequence (Recognize, Understand, Observe, Listen, Adapt, Respond), which step asks 'What is happening around me?'","options":["Observe","Listen","Recognize","Adapt"],"answer_index":0,"explanation":"Recognize = what am I feeling; Understand = why; Observe = what is happening around me; Listen = what might others experience."},{"id":"S1-052","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 45","question":"Your manager criticizes your analysis in front of the team. In the higher-EQ process, what is the step right after 'Recognize: I am becoming defensive'?","options":["Clarify: ask questions","Respond: address the problem","Observe: what exactly is being criticized","Control: don't react immediately"],"answer_index":3,"explanation":"The process is Recognize → Control → Understand → Observe → Clarify → Respond."},{"id":"S1-053","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 47","question":"On the 'The higher you go, the more EQ matters' ladder, which statement belongs to the Senior Manager level?","options":["I create direction and mobilize the organization","I coordinate the work","I achieve results through people","I align different people and functions"],"answer_index":3,"explanation":"Engineer: I do the work; Team leader: I coordinate; Manager: results through people; Senior manager: align people and functions; Executive: create direction."},{"id":"S1-054","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 47","question":"What happens to the share of purely technical problems as responsibility increases?","options":["It disappears entirely once you reach the manager level","It stays roughly constant at every level of the organization","It tends to decrease while people, priority and judgment problems increase","It increases, because senior roles are more technical than junior ones"],"answer_index":2,"explanation":"Technical competence remains important, but the proportion of purely technical problems tends to decrease."},{"id":"S1-055","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 48","question":"What simple rule does the lecture give in the habit 'Pause before you respond'?","options":["Trigger → Pause → Think → Respond","Observe → Assume → Decide → Respond","Listen → Judge → Act → Review","Feel → React → Apologize → Repeat"],"answer_index":0,"explanation":"The few seconds between emotion and response can make a major difference: TRIGGER → PAUSE → THINK → RESPOND."},{"id":"S1-056","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 48","question":"According to the lecture, how does EQ develop?","options":["Through practice, not through reading about EQ","Mainly through reading about EQ","Only through formal psychometric testing and certification","It is fixed at birth and cannot develop"],"answer_index":0,"explanation":"'EQ develops through practice — not through reading about EQ.' Your default behavior is not your destiny."},{"id":"S1-057","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 49","question":"Which feedback question does the lecture suggest asking people you trust?","options":["Which of the four personality types do you think I belong to?","What is one behavior that makes it easier to work with me—and one that makes it more difficult?","Do you think I have a high EQ compared to others in the team?","Am I performing better than my colleagues in this department?"],"answer_index":1,"explanation":"Habit 4 (Seek feedback) suggests asking for one helpful and one difficult behavior."},{"id":"S1-058","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 50","question":"According to 'Practice your weaker behaviors', a person who tends to overanalyze should practice:","options":["Listening","Deciding","Pausing","Assertiveness"],"answer_index":1,"explanation":"Dominate → listening; avoid conflict → assertiveness; overanalyze → deciding; react quickly → pausing."},{"id":"S1-059","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 53","question":"In the shortcut EQ evaluation, which question corresponds to 'Accountability'?","options":["Can I admit that I was wrong?","Can I receive criticism without becoming defensive?","Can I disagree without making it personal?","Can I change my style depending on the person?"],"answer_index":0,"explanation":"Accountability (Sorumluluk) asks: 'Can I admit that I was wrong?'"},{"id":"S1-060","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 53","question":"Instead of asking 'Do I have high EQ?', what stronger self-awareness question does the lecture recommend?","options":["In which situations does my EQ become weaker?","What is my exact EQ score?","How does my EQ score compare with the scores of my peers?","Which AI tool can measure my EQ?"],"answer_index":0,"explanation":"Asking in which situations EQ becomes weaker is described as a much stronger self-awareness question."},{"id":"S1-061","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 56","question":"When you think 'My manager doesn't trust me' and AI asks 'What other explanations could fit the same behavior?', which benefit of practicing EQ with AI is illustrated?","options":["A safe place to make mistakes without damaging any real relationships","Availability whenever you need to practice a conversation","Different perspectives that help fight premature conclusions","Repeatability of the same scenario five or ten times"],"answer_index":2,"explanation":"Benefit 4 (different perspectives): AI can challenge your first interpretation."},{"id":"S1-062","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 57","question":"How does the lecture describe AI's role in evaluating your EQ?","options":["AI is a mirror, not an EQ test","AI is a reliable EQ test","AI can certify high emotional intelligence","AI should replace feedback from people"],"answer_index":0,"explanation":"AI cannot reliably declare 'You have high EQ'; compare self-perception, AI observation and real feedback."},{"id":"S1-063","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 58","question":"In the 5-step method for developing EQ with AI, why should you reflect first without AI?","options":["Because AI tools cannot process text that describes emotions","Because AI answers about behavior are always unreliable","To reduce the cost and time spent using AI tools","To avoid immediately outsourcing your self-reflection to AI"],"answer_index":3,"explanation":"Step 2 is 'Reflect first — without AI'; we don't want to outsource self-reflection immediately."},{"id":"S1-064","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 60","question":"How does the lecture characterize the IQ, EQ and SQ dimensions?","options":["Measurements that are only valid for engineers and managers","Useful frameworks, not precise scores that completely define a person","Exact scores that reliably predict a person's career success","Fixed traits that cannot be developed after early adulthood"],"answer_index":1,"explanation":"Slide 60: 'These are useful frameworks — not three precise scores that completely define a person.'"},{"id":"S1-065","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 61","question":"Which question does the lecture associate with SQ rather than EQ?","options":["What is happening between us—and how should I navigate the situation?","What triggered my emotional reaction in this situation?","How can I control my own reactions under pressure?","What am I feeling right now, and why exactly am I feeling this way today?"],"answer_index":0,"explanation":"EQ asks what I and the other person are feeling; SQ asks what is happening between us and how to navigate it."},{"id":"S1-066","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 61","question":"In the components of social intelligence, how is 'influence' defined?","options":["Using formal authority to force others' agreement","Winning every argument","Gaining support without manipulation","Controlling others' decisions"],"answer_index":2,"explanation":"SQ components include INFLUENCE — gaining support without manipulation."},{"id":"S1-067","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 62","question":"In the meeting example, Engineer A asks 'Is my proposal correct?'. What does socially intelligent Engineer B ask?","options":["What is happening in this room?","How can I end the meeting quickly?","Is my data more accurate than theirs?","How can I prove Finance wrong?"],"answer_index":0,"explanation":"Engineer B reads the room: who influences whom, who has concerns, who is silent, what priorities differ."},{"id":"S1-068","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 63","question":"SQ is described as 'Understand + Act'. Building rapport and moving people toward action belong to which component?","options":["Social facility","Cognitive intelligence","Social awareness","Self-awareness"],"answer_index":0,"explanation":"Social awareness = 'What is happening?'; social facility = 'What should I do?' (adapt, build rapport, influence, collaborate)."},{"id":"S1-069","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 63","question":"According to the lecture, what does social awareness generate about what another person thinks?","options":["Objective measurements","Certain conclusions","Legal evidence","Hypotheses, not certainty"],"answer_index":3,"explanation":"'Awareness generates hypotheses — not certainty — about what another person thinks.'"},{"id":"S1-070","type":"lecture","week":1,"topic":"Winning on Purpose","doc":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 64","question":"The Aristotle quote on anger used at the end of the lecture emphasizes that the difficult part is to be angry:","options":["With the right person, to the right degree, at the right time, for the right purpose and in the right way","Only with subordinates and never with superiors or customers","Only after consulting a mediator and documenting the reasons","As rarely as possible, and never in public or in front of a team"],"answer_index":0,"explanation":"Anyone can become angry; doing so appropriately in all those respects is not easy."},{"id":"S2-001","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 3","question":"According to the lecture, which question does ethics add to personality, competencies and EQ?","options":["What can I do?","What should I do?","What do I feel?","What will I earn from this?"],"answer_index":1,"explanation":"Personality, competencies and EQ are extended with a fourth question: ETHICS — WHAT SHOULD I DO?"},{"id":"S2-002","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 5","question":"Your manager says: 'This process doesn't fully meet the specification, but production is late. Release it.' Which pair of colliding forces is explicitly listed on the slide?","options":["Loyalty to manager vs. professional responsibility","Centralized vs. decentralized decision-making","Marketing budget targets vs. finance department cost targets","Innovation speed vs. respect for tradition"],"answer_index":0,"explanation":"The slide lists loyalty vs. professional responsibility, target vs. quality, short-term vs. long-term, and company vs. customer interest."},{"id":"S2-003","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 6","question":"Why does the lecture classify the Volkswagen emissions case as 'not legal and not ethical'?","options":["Illegal software was installed in diesel vehicles, violating the Clean Air Act","VW used AI-based pricing that discriminated between customers","VW sold its cars below production cost in developing markets to quickly gain market share","VW delayed payments to its suppliers during a cash shortage"],"answer_index":0,"explanation":"In September 2015 the EPA announced VW had violated the Clean Air Act by installing illegal software in diesel vehicles."},{"id":"S2-004","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 7","question":"In the 'Can we? May we? Should we?' framework, which question is the ethical one?","options":["Should we?","May we?","Can we?","Will we profit?"],"answer_index":0,"explanation":"Can we? → technically possible; May we? → legally permitted; Should we? → ethically acceptable."},{"id":"S2-005","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 8","question":"A soft-drink company sells a less healthy version in India that complies with Indian law, while its European version meets stricter rules. What does this case mainly illustrate?","options":["That the European version of the product is illegal","That complying with the law may not be enough to be ethical","That governments should ban soft drinks altogether","That the company is actually breaking Indian food and health law"],"answer_index":1,"explanation":"The slide asks 'Is complying with the law enough?' and frames dilemmas such as local law vs. global corporate standard."},{"id":"S2-006","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 9","question":"Before an important decision, the lecture asks 'Who is affected?'. What should you do next?","options":["Calculate the net present value","See the decision through their eyes","Ask the legal department to approve","Choose the option with the least paperwork"],"answer_index":1,"explanation":"After listing stakeholders, 'SEE THE DECISION THROUGH THEIR EYES': social awareness → stakeholder awareness → ethical judgment."},{"id":"S2-007","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 10","question":"How does the lecture define an ethical dilemma?","options":["A clear-cut violation of established moral rules for personal gain","A legal dispute between two companies","A decision with no stakeholders","A situation where two or more valid moral principles conflict"],"answer_index":3,"explanation":"An unethical action is a clear-cut violation; an ethical dilemma involves conflicting valid moral principles."},{"id":"S2-008","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 10","question":"What is the core difference between an unethical action and an ethical dilemma?","options":["Whether a manager is involved","Whether any law or regulation has been broken","Whether the 'right' answer is clear","Whether money is involved"],"answer_index":2,"explanation":"The core difference lies in whether the right answer is clear."},{"id":"S2-009","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 10","question":"Which of the following is NOT one of the 'dilemmatic case' categories listed in the lecture?","options":["Immediate vs. Future","Truth vs. Loyalty","Profit vs. Revenue","Justice vs. Mercy"],"answer_index":2,"explanation":"The categories are Truth vs. Loyalty, Group vs. Individual, Immediate vs. Future, Justice vs. Mercy."},{"id":"S2-010","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 11","question":"According to the comparison table, what is the typical outcome of an ethical dilemma?","options":["A legal penalty imposed on the person who made the decision","A clear ethical violation that harms others","An unavoidable compromise of at least one moral value","Full satisfaction of every value involved"],"answer_index":2,"explanation":"Dilemmas result in an unavoidable compromise of at least one moral value; unethical actions result in clear violation."},{"id":"S2-011","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 12","question":"HR manager Göksel must lay off either a single parent with average performance or a top-performing graduate. How does the lecture classify this?","options":["An ethical dilemma","A legal violation","A conflict of interest","An unethical action"],"answer_index":0,"explanation":"Compassion toward Employee A conflicts with fairness and duty to keep the business alive — two valid principles."},{"id":"S2-012","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 12","question":"Project manager Sevil tells engineers to hide critical security bug reports and tells the client the software is 100% secure. How is this classified?","options":["A legitimate business risk","An ethical dilemma","An unethical action","A value-theory solution"],"answer_index":2,"explanation":"This is a clear-cut violation (deception) for organizational gain — the right answer is clear."},{"id":"S2-013","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 14","question":"What is the first step of the lecture's general 3-step approach to solving an ethical dilemma?","options":["Let employees vote on it","Report to the authorities","Refute the dilemma","Choose the greater good"],"answer_index":2,"explanation":"Steps: 1) refute the dilemma, 2) find alternative solutions, 3) value theory approach (greater good or lesser evil)."},{"id":"S2-014","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 14","question":"Why does the lecture say 'refuting the dilemma' is something IE students already understand?","options":["Because it is essentially problem framing: checking facts, assumptions and constraints","Because it is a linear programming technique for finding the optimal choice","Because it relies on statistical sampling of employee opinions","Because it is a form of inventory control applied to ethical risks"],"answer_index":0,"explanation":"The apparent dilemma may exist because the problem is defined incorrectly — a problem-framing issue."},{"id":"S2-015","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 15","question":"In the Enron accounting fraud, what did mark-to-market (MTM) accounting do?","options":["Recorded projected future profits immediately as actual revenue","Valued all assets strictly at their historical purchase cost","Required external auditors to approve every trading contract","Postponed recording revenue until the cash was actually received"],"answer_index":0,"explanation":"MTM recorded projected future profits as actual revenue; SPEs hid billions in debt."},{"id":"S2-016","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 15","question":"What lesson does the lecture draw from the Enron & Arthur Andersen case about auditors and professionals?","options":["Professional independence can be lost gradually","Auditors are never responsible for a client's accounting fraud","Only executives can be held responsible","Independence is guaranteed by regulation"],"answer_index":0,"explanation":"Executives, financial professionals, auditors and boards were all responsible; incentives compromised professional judgment."},{"id":"S2-017","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 18","question":"According to the 'gift or conflict of interest?' slide, when does a gift become a bribe?","options":["When it is worth more than about one week of the receiver's salary","When it is given during a religious or national holiday","When the benefit is intended to influence a decision improperly","When it is given to a member of the colleague's family"],"answer_index":2,"explanation":"Gift → ordinary gesture; conflict of interest → personal benefit may interfere with judgment; bribe → intended to influence a decision improperly."},{"id":"S2-018","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 18","question":"What is the 'acid test' proposed for gifts from important clients?","options":["Would I be comfortable if my colleagues, company and customer knew about the gift?","Is the value of the gift lower than the value of the contract?","Has anyone else in the department received a similar gift?","Can I keep the gift without having to declare it for tax purposes?"],"answer_index":0,"explanation":"The acid test asks whether you'd be comfortable if others knew; boundaries aren't obvious, which is why policies are needed."},{"id":"S2-019","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 19","question":"Which of the following is an excuse the lecture tells you NOT to use when you witness unethical behavior?","options":["'I believed someone else would act on it.'","'I asked my manager for guidance.'","'I reported it through the ethics hotline.'","'I gathered the facts before speaking up.'"],"answer_index":0,"explanation":"Listed excuses include 'none of my business', 'someone else would act', 'it was common practice', 'I didn't know who to contact'."},{"id":"S2-020","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 20","question":"Under 'Do not compromise ethical standards', which reason is listed as a common but unacceptable justification?","options":["'I was following the instructions from my manager.'","'I consulted the code of ethics before I made the decision.'","'I documented the decision carefully.'","'I escalated the issue to compliance.'"],"answer_index":0,"explanation":"Unacceptable justifications include unrealistic targets, manager instructions, pressure to be a team player, fear of job loss."},{"id":"S2-021","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 21","question":"Which single question does the lecture say applies to all six common ethical issues in business?","options":["Who may benefit—and who may be harmed?","Is it legal in every country where we operate?","Will the media find out?","Is it profitable?"],"answer_index":0,"explanation":"One question applies to all six issue areas: who may benefit and who may be harmed?"},{"id":"S2-022","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 21","question":"Monitoring, personal data and AI-based decisions fall under which of the six common ethical issue areas?","options":["Financial integrity","Information & confidentiality","Health & safety","Technology & privacy"],"answer_index":3,"explanation":"Issue 6, Technology & Privacy, covers monitoring, personal data and AI-based decisions."},{"id":"S2-023","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 22","question":"What sequence does the lecture give for dealing with harassment and discrimination?","options":["Report → Publish → Litigate → Settle → Close the file","Prevent → Listen → Investigate → Act → Protect","Listen → Act → Prevent → Audit","Ignore → Warn → Punish → Forget"],"answer_index":1,"explanation":"The slide summarizes: PREVENT → LISTEN → INVESTIGATE → ACT → PROTECT."},{"id":"S2-024","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 22","question":"Which 'important distinction' does the lecture make about harassment complaints?","options":["Only intentional acts count as harassment","Impact matters only if it is reported in writing","Intent and impact are not always the same","Intent always outweighs impact"],"answer_index":2,"explanation":"Behavior can have harmful impact even without harmful intent."},{"id":"S2-025","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 23","question":"What priority hierarchy does the lecture give for health and safety decisions?","options":["Quality → Safety → Cost → Delivery","Safety → Quality → Delivery → Cost","Delivery → Cost → Safety → Quality","Cost → Delivery → Quality → Safety → Service"],"answer_index":1,"explanation":"A manager should not trade unacceptable human risk for cost, productivity or schedule."},{"id":"S2-026","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 23","question":"Maintenance recommends stopping a machine; stopping costs 1 million TL and failure probability is small. What key point does the lecture make?","options":["Production should continue whenever the probability is below 1%","Acceptable risk is not purely a mathematical decision","The cheapest option is always the ethical one","Risk equals cost divided by probability"],"answer_index":1,"explanation":"Although Risk = Probability × Consequence, deciding what risk is acceptable involves ethics, not only math."},{"id":"S2-027","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 24","question":"An AI predictive-maintenance system recommends 'Continue production. Failure probability: 0.7%.' What is the lecture's conclusion?","options":["Production must always stop whenever the AI reports any failure probability","The AI vendor becomes accountable if anyone is injured by the decision","The AI's recommendation should be followed automatically because it is data-driven","AI can estimate risk, but management must decide what risk is acceptable and own the consequences"],"answer_index":3,"explanation":"Questions include what data produced 0.7%, model reliability, who can override, and who is accountable."},{"id":"S2-028","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 25","question":"What ethical conflict does whistleblowing involve, according to the lecture?","options":["Loyalty to the organization vs. responsibility to customers, employees and society","Short-term financing needs vs. long-term investment plans","Speed of reporting vs. accuracy of the evidence collected","Profit targets vs. revenue targets set by the finance department"],"answer_index":0,"explanation":"The slide asks 'Is whistleblowing disloyal?' and frames it as loyalty vs. broader responsibility."},{"id":"S2-029","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 26","question":"What does a healthy organization need for a speak-up culture, according to the lecture?","options":["Social media posts → Public pressure → Official apology","Anonymous gossip → Rumors → Informal investigation → Dismissal","Legal threats → Out-of-court settlement → Confidentiality agreement","Safe channels → Fair investigation → No retaliation → Corrective action"],"answer_index":3,"explanation":"Speak-up culture is a management responsibility built on safe channels, fair investigation, no retaliation and corrective action."},{"id":"S2-030","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 27","question":"An engineer finds the company's approved AI system makes unsafe recommendations; the manager says 'Don't create problems.' What does the lecture conclude?","options":["Speaking up should start with posting the evidence on social media","Approved systems should not be questioned once management has signed off","Using AI does not remove your duty to speak up when you identify a serious risk","The AI vendor alone is responsible for unsafe or unfair recommendations"],"answer_index":2,"explanation":"Speaking up responsibly still respects confidentiality, evidence, due process and appropriate channels."},{"id":"S2-031","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 28","question":"Why does the lecture treat the integrity of business information as an ethical issue?","options":["Because business information legally belongs to the IT department","Because data must always be public","Because information is expensive to store","Because manipulating information means manipulating decisions"],"answer_index":3,"explanation":"Managers decide based on information, so manipulated KPIs, forecasts or safety statistics manipulate decisions."},{"id":"S2-032","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 29","question":"Target defect rate is <2% and actual is 2.6%. A manager says 'Exclude these two unusual batches, then we're below 2%.' What question does the lecture raise?","options":["Should the batches be re-produced?","Should we change the measurement unit of the defect rate?","Is this data cleaning — or data manipulation?","Is the target too ambitious?"],"answer_index":2,"explanation":"Excluding unfavorable data to meet a target may be manipulation rather than legitimate data cleaning."},{"id":"S2-033","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 30","question":"A manager asks AI to 'rewrite this quarterly report so our performance looks stronger.' What does the lecture say?","options":["AI-written reports are automatically objective","AI should be used only to shorten reports","Better writing does not make misleading information ethical","It is acceptable if the numbers are unchanged in the appendix"],"answer_index":2,"explanation":"Never ask AI merely to support the conclusion you want; ask it to challenge the conclusion too."},{"id":"S2-034","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 31","question":"You upload 12 months of confidential production data to an AI tool to reduce costs. What is the key ethical/governance question?","options":["Is the dataset larger than the AI tool's upload limit?","Were you authorized to give that data to the AI system?","Is the AI tool fast enough to process twelve months of data?","Will the AI tool produce clear charts for management?"],"answer_index":1,"explanation":"The fundamental rule: access does not mean ownership or permission to share."},{"id":"S2-035","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 33","question":"What sequence does the lecture propose for responsible data use?","options":["Need → Permission → Purpose → Protection → Accountability","Purpose → Profit → Publication → Protection → Review","Permission → Need → Profit → Publicity → Retention","Collect → Store → Analyze → Sell → Delete"],"answer_index":0,"explanation":"Do we need it? Are we authorized? For what purpose? How protected? Who is responsible?"},{"id":"S2-036","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 35","question":"Which motto appears repeatedly on the ethics slides?","options":["If something is legal, it is automatically ethical as well","The law starts where ethics ends, and ethics should simply follow the law","Ethics starts where the law ends, and the law is founded upon ethics","Ethics is whatever the majority of employees accepts"],"answer_index":2,"explanation":"The slides repeat 'Ethics starts where the law ends and the law is founded upon ethics.'"},{"id":"S2-037","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 38","question":"In the Towers Watson ethical decision model, what is the FIRST question?","options":["Would I be embarrassed if it appeared in the media?","Is it legal?","Is it profitable?","Does my manager approve?"],"answer_index":1,"explanation":"Sequence: Is it legal? → Consistent with values? → Embarrassed if in the media? → Okay to proceed."},{"id":"S2-038","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 40","question":"In Michael Davis's seven-step guide, which step comes right after 'Check the facts'?","options":["Identify relevant factors","Make a choice and accept responsibility","Develop the options","Test the options"],"answer_index":0,"explanation":"1 State the problem, 2 Check the facts, 3 Identify relevant factors, 4 Develop options, 5 Test options, 6 Make a choice, 7 Review & learn."},{"id":"S2-039","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 40","question":"In Davis's model, which step says 'Don't accept only A or B. Generate alternatives'?","options":["Review & learn","State the problem","Develop options","Test the options"],"answer_index":2,"explanation":"Step 4, Develop options, emphasizes generating alternatives."},{"id":"S2-040","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 42","question":"Which step of Davis's model does the lecture call 'the most Industrial Engineering part'?","options":["Make a choice","Review & learn","State the problem","Check the facts"],"answer_index":1,"explanation":"Review & learn asks why the dilemma arose and how to change the system — root-cause and continuous improvement thinking."},{"id":"S2-041","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 42","question":"After an ethical failure such as Volkswagen, what does the lecture recommend beyond punishing one person?","options":["Keep the issue confidential to protect the company's reputation","Replace all engineers involved immediately and move on","Increase sales targets to recover the financial losses quickly","Change the system — ask what organizational conditions allowed the behavior"],"answer_index":3,"explanation":"'CHANGE THE SYSTEM — NOT ONLY THE DECISION': check targets, incentives, processes, culture and controls."},{"id":"S2-042","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 43","question":"How does the lecture summarize ethical decision-making for engineers?","options":["An intuitive process that cannot really be structured or taught","A purely legal compliance exercise","Structured problem solving with human values included","A task best delegated to AI"],"answer_index":2,"explanation":"It mirrors Define → Analyze → Generate → Evaluate → Decide → Improve."},{"id":"S2-043","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 43","question":"What role does the lecture give AI in ethical decisions?","options":["Use AI to make your ethical reasoning more complete, not to make the decision","Let AI make the ethical decision, since it removes human bias","Use AI only to write the final justification after deciding","Avoid using AI in any question that has an ethical dimension"],"answer_index":0,"explanation":"'Don't ask AI to make the ethical decision. Use AI to make your ethical reasoning more complete.'"},{"id":"S2-044","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 44","question":"Which test asks 'Would I consider this fair if I were the person negatively affected?'","options":["Reversibility test","Publicity (acid) test","Harm test","Organization test"],"answer_index":0,"explanation":"The reversibility test puts you on the other side of the decision."},{"id":"S2-045","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 45","question":"What important limitation does the lecture note about the publicity ('acid') test?","options":["It has replaced the law as the main standard in most countries","It is the only test that really matters in practice","It applies only to publicly listed companies with media exposure","Public acceptability is not automatically ethical, so it is a warning signal, not the final decision rule"],"answer_index":3,"explanation":"Something popular can be ethically questionable, and something ethically defensible can be unpopular."},{"id":"S2-046","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 45","question":"What is the 'AI-era acid test'?","options":["Could the AI have reached the same decision much faster than me?","Is using the AI cheaper than hiring a human analyst?","Would the AI system itself approve of my decision?","Would I be comfortable disclosing that AI was used this way?"],"answer_index":3,"explanation":"If management wants to hide the role AI played, ask 'why?' — an excellent transparency test."},{"id":"S2-047","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 47","question":"Which statement is acceptable according to the lecture's 'last warning'?","options":["'My boss told me to do it, so the responsibility is theirs.'","'Everybody in the meeting agreed, so it was a team decision.'","'The model recommended it, so I simply followed the data.'","'I made the best defensible decision with the information available, and I own it.'"],"answer_index":3,"explanation":"Never hide behind the boss, the model, AI or consensus — make the best defensible decision and own it."},{"id":"S2-048","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 48","question":"Why does the lecture say business ethics is not only individual ethics?","options":["Systems are always more ethical than people","Individuals never really influence the ethics of their organization at all","Good people can make bad decisions inside badly designed systems","Only the CEO's ethics matter"],"answer_index":2,"explanation":"Ethical business = ethical people + ethical systems; targets, incentives and pressure shape behavior."},{"id":"S2-049","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 49","question":"According to the lecture, ethical behavior equals:","options":["Profit + Compliance + Reputation","Values + Judgment + Courage","Rules + Fear + Control","Knowledge + Skills + Abilities"],"answer_index":1,"explanation":"Values (what is important), judgment (what is right), courage (willingness to act)."},{"id":"S2-050","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 50","question":"In Kohlberg's levels of moral reasoning shown in the lecture, what is the LOWEST level?","options":["Good person attitude","Aiming at reward","Law & order","Avoiding punishment"],"answer_index":3,"explanation":"The pyramid from bottom to top: avoiding punishment, aiming at reward, good person attitude, law & order, justice, ethics."},{"id":"S2-051","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 50","question":"In the Kohlberg pyramid presented, which level lies directly above 'Law & order'?","options":["Ethics","Good person attitude","Aiming at reward","Justice"],"answer_index":3,"explanation":"Order: avoiding punishment → aiming at reward → good person attitude → law & order → justice → ethics."},{"id":"S2-052","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 51","question":"When does the lecture say ethics 'becomes visible'?","options":["When everyone agrees","When a new law is passed","When a company formally publishes its list of values","When there is a cost to your choice"],"answer_index":3,"explanation":"The real test comes when doing the right thing may cost money, promotion, approval or relationships."},{"id":"S2-053","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 54","question":"Your colleague confides they will leave in two months. How does the situation change if they instead confide 'I discovered a serious safety problem, but please don't tell anyone'?","options":["Confidentiality becomes even more binding because safety is sensitive","Confidentiality may no longer be absolute because serious harm to others is involved","Nothing changes, because a promise of confidentiality is always absolute","You must immediately post the information publicly to warn others"],"answer_index":1,"explanation":"A promise of confidentiality is important but not necessarily absolute when serious harm is involved."},{"id":"S2-054","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 55","question":"In the departing-colleague case, what does the lecture suggest as a socially intelligent 'responsible C'?","options":["Ask HR to fire the colleague early","Immediately tell the manager everything without telling the colleague first","Speak first with the colleague about how and when to communicate the departure","Say nothing until the colleague leaves"],"answer_index":2,"explanation":"This attempts to protect both legitimate interests instead of choosing one side."},{"id":"S2-055","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 56","question":"The railway-track case (one child on the unused track vs. many on the active track) is used to illustrate which point?","options":["Not everything important can be reduced to one objective function","An individual's rights should always override the group's interests","Engineers should avoid making moral decisions altogether","The majority's interests should always override the individual's"],"answer_index":0,"explanation":"Majority interests and individual rights can conflict; both must be considered (Group vs. Individual)."},{"id":"S2-056","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 59","question":"An excellent employee is at the top of his salary range and cannot be promoted. Which question does the lecture ask about the organization?","options":["Should formal performance reviews simply be abolis
