hed?","Should the employee be asked to leave?","Should the salary range be kept secret?","Do our systems reward the behavior we say we value?"],"answer_index":3,"explanation":"Alternatives include a recognition bonus or expanded responsibilities; ethics includes consistency between promises and systems."},{"id":"S2-057","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 61","question":"You built a powerful spreadsheet program at work in your spare time. Which question is NOT among those the lecture uses to decide ownership?","options":["What do the employment or IP provisions say?","How much would a competitor pay for it?","Was it developed during working hours?","Were company computers, software or data used?"],"answer_index":1,"explanation":"Ownership questions: When? With what? Why? Using what information? What does the agreement say?"},{"id":"S2-058","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 63","question":"What key distinction does the lecture make about employee-created work products?","options":["Ownership always belongs to the employee","Confidentiality ends when the employee leaves","Creating something automatically allows you to sell it","Ownership and confidentiality are different questions"],"answer_index":3,"explanation":"Even if you own a spreadsheet, it may contain company formulas, customer data or proprietary processes."},{"id":"S2-059","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 64","question":"According to the CSR 'responsible to whom?' slide, what does a company owe its CUSTOMERS?","options":["Sustainable use of resources","Return and long-term value","Fairness, safety and personal development","Quality, safety and honest information"],"answer_index":3,"explanation":"Shareholders → return; employees → fairness, safety, development; customers → quality, safety, honest information; environment → sustainability."},{"id":"S2-060","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 65","question":"An IE project cuts cost by 15% but eliminates 100 jobs, increases energy use and waste. What does the lecture recommend?","options":["Declare the project a success, since a 15% cost reduction meets the stated objective","Expand the objective function — optimize value subject to safety, employee, environmental and ethical constraints","Cancel all cost-reduction projects because they always end up harming employees","Ignore the non-financial effects, because they cannot be measured reliably"],"answer_index":1,"explanation":"Success depends on how it is defined; responsible management optimizes value, not only minimizes cost."},{"id":"S2-061","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 66","question":"In the four-level CSR view, which level is described as 'Be viable — create value, remain competitive, provide jobs'?","options":["Philanthropic","Legal","Ethical","Economic"],"answer_index":3,"explanation":"A company that cannot survive economically cannot sustain its other responsibilities."},{"id":"S2-062","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 66","question":"What does the lecture say about philanthropy as part of CSR?","options":["Philanthropy can replace ethical responsibilities if the donations are large","Philanthropy is a legal requirement for companies above a certain size","Philanthropy is the most important of the four CSR levels for any company","A company cannot mistreat stakeholders and then become 'responsible' simply by donating money"],"answer_index":3,"explanation":"Philanthropic contributions are voluntary and cannot compensate for unethical conduct."},{"id":"S2-063","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 68","question":"According to Milton Friedman's Free Market View, what is the primary responsibility of business?","options":["To maximize employee satisfaction even above profitability","To create economic value for owners while operating within the rules","To donate a fixed share of its profits to social causes","To solve every social problem in the community where it operates today"],"answer_index":1,"explanation":"FMV: create economic value, serve owners' interests, compete, and operate within law and ethical norms."},{"id":"S2-064","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 70","question":"According to the 'New Frontier — AI Ethics' slide, what does AI do to good and bad decisions?","options":["It eliminates bad decisions","It makes decisions slower but fairer","It scales only good decisions","It scales both"],"answer_index":3,"explanation":"AI can make millions of decisions quickly, scaling both good and bad ones."},{"id":"S2-065","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 71","question":"Which principle does the lecture state as an IE 404 principle?","options":["Profitable is always ethical in the long run","Efficient is always ethical","Optimal is not necessarily ethical","Legal is always ethical"],"answer_index":2,"explanation":"OPTIMAL ≠ NECESSARILY ETHICAL; likewise technically feasible, legal, profitable and efficient ≠ ethical."},{"id":"S2-066","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 72","question":"Among the 5 pillars of responsible AI, which pillar asks 'What happens when the AI is wrong?'","options":["Fairness & bias","Transparency & explainability","Accountability","Safety & reliability"],"answer_index":3,"explanation":"Fairness (treated fairly?), Transparency (can we explain?), Privacy (should we collect?), Safety (when wrong?), Accountability (who owns it?)."},{"id":"S2-067","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 74","question":"What are the steps to establish an ethics management program?","options":["Run engagement surveys, set ethics targets, and pay bonuses","Write a code of ethics, write and apply policies and procedures, give training","Create a hotline, dismiss offenders, and issue a press release","Hire auditors, fine every violator, and publish the results annually"],"answer_index":1,"explanation":"Ethics should be managed as a program rather than a one-shot effort."},{"id":"S2-068","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 75","question":"'Employees will work in compliance with working hours defined by law' versus 'Working hours are 3 shifts/day totalling 45 hours/week'. How are these two statements classified?","options":["Both statements are legally binding clauses of the employment contract","The first is a code of ethics statement; the second is a policy/procedure (code of conduct)","The first is a policy/procedure; the second is a code of ethics statement","Both statements are codes of ethics written at different levels of detail"],"answer_index":1,"explanation":"The code of ethics states the principle; the policy/procedure operationalizes it."},{"id":"S2-069","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 83","question":"According to the lecture, what is one of the STRONGEST forms of ethics training?","options":["Practice in resolving complex ethical dilemmas","Watching a short video at orientation","Signing a compliance form","Reading the code of ethics carefully once a year"],"answer_index":0,"explanation":"Involving staff in reviewing codes and policies is also strong training."},{"id":"S2-070","type":"lecture","week":2,"topic":"Ethics","doc":"Ethics","source":"LectureNotes - Ethics.pdf, p. 84","question":"Rationalizations like 'Everyone else does it' and 'No one will know' should be prevented by considering 'RRR'. What does RRR stand for?","options":["Respect, Responsibility, Results","Reputation, Revenue, Return on investment","Report, Review, Repeat","Rules, Rewards, Risks"],"answer_index":0,"explanation":"The slide asks you to 'feel' Respect, Responsibility, Results."},{"id":"S3-001","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 3","question":"According to the lecture, what does 'Own the Room' mean?","options":["Speaking louder and longer than others so you dominate the meeting","Controlling the agenda so that others cannot raise objections","Using as many slides and data points as possible to impress","Understanding yourself, reading others, communicating clearly and adapting authentically"],"answer_index":3,"explanation":"You own the room by being understood, trusted and remembered."},{"id":"S3-002","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 4","question":"In the 'Know yourself → Understand others → Work better together' model, observing how others communicate and what concerns them belongs to which step?","options":["What do I want? — Goal setting","How should I adapt? — Communication competence","Who am I? — Self-awareness","Who am I working with? — Social awareness"],"answer_index":3,"explanation":"Step 2 (social awareness) observes how others communicate, what information they need and what concerns them."},{"id":"S3-003","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 6","question":"According to the lecture, assertiveness equals:","options":["Confidence + Volume","Confidence + Respect","Certainty + Authority","Respect + Silence"],"answer_index":1,"explanation":"CONFIDENCE + RESPECT = ASSERTIVENESS; confidence without respect can become arrogance."},{"id":"S3-004","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 6","question":"'Based on our analysis, I recommend Option B. Here are the reasons.' Which communication style does this statement illustrate?","options":["Insecure","Aggressive","Assertive","Passive"],"answer_index":2,"explanation":"It states a recommendation with evidence while staying open to discussion."},{"id":"S3-005","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 6","question":"'This is obviously the correct solution.' Which style does the lecture assign to this statement?","options":["Insecure","Assertive","Aggressive","Passive"],"answer_index":2,"explanation":"The aggressive style asserts correctness without respect for other views."},{"id":"S3-006","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 6","question":"'Whatever you think is fine.' Which style does the lecture assign to this statement?","options":["Assertive","Aggressive","Passive","Insecure"],"answer_index":2,"explanation":"Passive communication gives up one's own view entirely."},{"id":"S3-007","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 8","question":"How does the lecture distinguish hearing from listening?","options":["They are the same thing; the lecture uses both terms interchangeably","Hearing is the sound reaching you; listening is deliberately trying to understand the meaning","Listening is passive reception, while hearing requires active effort","Hearing requires eye contact, while listening can be done while multitasking"],"answer_index":1,"explanation":"Active listening additionally demonstrates understanding and checks whether you understood correctly."},{"id":"S3-008","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 8","question":"What sequence describes active listening in the lecture?","options":["Hear → Judge → Interrupt → Respond","Respond → Hear → Check → Understand → Agree","Hear → Understand → Check → Respond","Listen → Agree → Respond → Close"],"answer_index":2,"explanation":"HEAR → UNDERSTAND → CHECK → RESPOND."},{"id":"S3-009","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 8","question":"According to the lecture, what is the first job of a communicator?","options":["To understand","To speak first","To persuade","To be understood"],"answer_index":0,"explanation":"'The first job of a communicator is not to be understood. It is to understand.' Listening is a form of data collection."},{"id":"S3-010","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 9","question":"Saying 'So, if I understand correctly, your main concern is…' and letting the other person correct you is which active-listening step?","options":["Give the speaker your full attention","Stay curious","Check your understanding","Don't interrupt"],"answer_index":2,"explanation":"Step 5: check understanding by paraphrasing."},{"id":"S3-011","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 9","question":"Which phrase does the lecture suggest to replace immediate judgment when listening?","options":["'Let me stop you there.'","'That's not what I meant.'","'I already know the answer.'","'Help me understand.'"],"answer_index":3,"explanation":"Step 3, Stay curious, replaces judgment with 'Help me understand.'"},{"id":"S3-012","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 10","question":"Which of the following is NOT one of the four 'listening killers' in the lecture?","options":["Paraphrasing","Mental distraction","Multitasking","Preparing your response"],"answer_index":0,"explanation":"The four killers: multitasking, digital distraction, mental distraction, preparing your response."},{"id":"S3-013","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 10","question":"What management message does the lecture attach to divided attention?","options":["Attention is a form of respect","Attention is a waste of management time","AI makes attention unnecessary","Attention matters only in formal meetings"],"answer_index":0,"explanation":"'AI can capture the meeting. You still need to be present in it.'"},{"id":"S3-014","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 12","question":"What central principle does the lecture give for staying calm?","options":["You should let others manage the emotions in the room","You cannot always control the situation, but you can control your response","You must first control the whole situation before you respond to anyone at all","You should avoid all situations that might cause you stress"],"answer_index":1,"explanation":"Self-awareness → self-regulation → constructive communication."},{"id":"S3-015","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 12","question":"Which sequence does the communication lecture use for managing irritation?","options":["Trigger → React → Regret → Apologize","Pause → Ignore → Forget → Move on","Listen → Judge → Decide → Act","Trigger → Pause → Choose → Respond"],"answer_index":3,"explanation":"TRIGGER → PAUSE → CHOOSE → RESPOND."},{"id":"S3-016","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 12","question":"According to the lecture, does staying calm mean avoiding disagreement?","options":["Yes — disagreement should only be expressed later, in writing","No — calm people should disagree loudly so that they are heard","Yes — calm communicators never express disagreement openly","No — you can say 'I disagree with that conclusion' without saying 'That's ridiculous'"],"answer_index":3,"explanation":"Staying calm does not mean avoiding disagreement; it means disagreeing respectfully."},{"id":"S3-017","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 13","question":"Which principle summarizes how to handle disagreements respectfully?","options":["Be hard on the problem, be respectful to the person","Be soft on the problem, hard on the person","Win the argument first, then repair the relationship later","Avoid the problem, protect the person"],"answer_index":0,"explanation":"Slide 13: BE HARD ON THE PROBLEM. BE RESPECTFUL TO THE PERSON."},{"id":"S3-018","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 13","question":"What does the lecture say about the advice 'Good communicators should always smile'?","options":["Smiling is only necessary when dealing with external customers","Smiling should generally be avoided at work to appear professional","Match your tone to the situation; a smile may be inappropriate when discussing an accident or redundancy","It is always correct, because a smile builds trust in every situation"],"answer_index":2,"explanation":"Authenticity and appropriateness matter more than mechanically displaying friendliness."},{"id":"S3-019","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 13","question":"What is the '10-minute rule' for non-urgent, emotionally charged communication?","options":["Write → Wait → Reread → Send","Call → Shout → Hang up → Email","Write → Send → Delete → Rewrite","Send → Wait → Apologize → Resend"],"answer_index":0,"explanation":"Waiting and rereading prevents messages you would later regret."},{"id":"S3-020","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 13","question":"How does the lecture say you 'own the room'?","options":["By speaking first and having the last word","By controlling the people in it and the agenda of the meeting","By holding the most senior title in the room","By controlling yourself, not by controlling other people"],"answer_index":3,"explanation":"'You don't own the room by controlling other people. You own the room by controlling yourself.'"},{"id":"S3-021","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 16","question":"According to the lecture, what does confidence NOT require?","options":["Certainty","Evidence","Clarity","Preparation"],"answer_index":0,"explanation":"Saying 'I don't know' or 'the data isn't sufficient' is not weakness; false certainty is more dangerous."},{"id":"S3-022","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 16","question":"How does the lecture define confidence?","options":["'I can explain what I think, why I think it, and what could change my mind.'","'I can speak for an hour without any notes.'","'Once I decide, I never change my mind.'","'I am always right, so I don't need to explain my reasoning or listen to objections.'"],"answer_index":0,"explanation":"Confidence is not 'I am right' — be confident about what you know and what you don't know."},{"id":"S3-023","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 17","question":"Which behavior is listed as typical of confident (rather than insecure) people?","options":["Hiding flaws","Blaming others","Admitting mistakes","Acting like a know-it-all"],"answer_index":2,"explanation":"Confident people celebrate others' success, admit mistakes and accept responsibility."},{"id":"S3-024","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 19","question":"Which four voice elements does the lecture highlight?","options":["Loudness, repetition, humor, gestures","Tone, grammar, vocabulary, length","Volume, pace, pause, emphasis","Pitch, accent, speed, slang"],"answer_index":2,"explanation":"VOLUME — PACE — PAUSE — EMPHASIS."},{"id":"S3-025","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 19","question":"Which voice element asks 'Are you allowing important ideas to land?'","options":["Emphasis","Pause","Volume","Pace"],"answer_index":1,"explanation":"Pause allows ideas to land; pace gives time to process; emphasis shows what matters most."},{"id":"S3-026","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 19","question":"Which statement appears on the 'Your voice is part of your message' slide?","options":["More information = better communication","Monotone speech signals expertise","Louder voices are more credible","More volume ≠ more authority"],"answer_index":3,"explanation":"Also: more information ≠ better communication. The goal is to make listening easy, not to sound theatrical."},{"id":"S3-027","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 20","question":"For international engineers, what does the lecture say matters more than accent?","options":["Native-like pronunciation","Speaking speed","Clarity","Vocabulary size"],"answer_index":2,"explanation":"The goal is to be understandable, well paced, confident and easy to follow — not to imitate an accent."},{"id":"S3-028","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 20","question":"What rehearsal advice does the lecture give?","options":["Don't only rehearse what you will say; rehearse how you will say it","Rehearse only the opening sentence and improvise the rest","Memorize your slides word for word so you never hesitate","Avoid rehearsing altogether so that you sound natural and spontaneous"],"answer_index":0,"explanation":"Your words carry the information; your voice helps people understand what matters."},{"id":"S3-029","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 22","question":"According to the lecture, what does empathy mean?","options":["Agreeing with the other person so that the relationship is protected","Avoiding difficult topics that might upset the other person","Understanding how a situation may look and feel from the other person's perspective","Feeling sorry for the other person and expressing sympathy"],"answer_index":2,"explanation":"Empathy does not mean 'I agree with you' — a distinction that is very important for managers."},{"id":"S3-030","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 23","question":"An employee says 'This new schedule is impossible.' The manager replies 'Everyone is under pressure. Just make it work.' Which response type is this?","options":["Dismissive","Sympathetic","Assertive","Empathetic"],"answer_index":0,"explanation":"The lecture contrasts dismissive, sympathetic and empathetic responses."},{"id":"S3-031","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 23","question":"Which response does the lecture classify as empathetic?","options":["'I'm sorry you're having such a difficult time with this.'","'It sounds as though the schedule is creating pressure your team can't absorb. Help me understand where the biggest problem is.'","'Let's not talk about this now; we'll revisit it next quarter.'","'Everyone is under pressure. Just make it work somehow.'"],"answer_index":1,"explanation":"The empathetic response creates both information and connection."},{"id":"S3-032","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 23","question":"Why does the lecture consider the empathetic response superior to the sympathetic one?","options":["It avoids discussing the problem","It transfers responsibility to the employee","It creates information and connection","It is shorter"],"answer_index":2,"explanation":"A sympathetic response expresses sorrow; an empathetic one seeks to understand and solve."},{"id":"S3-033","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 24","question":"Which of the following is listed as a way to be empathetic in communication?","options":["Validate how the other person is feeling","Assume you know their preferred resolution","Correct their emotions immediately","Change the subject to facts only"],"answer_index":0,"explanation":"Other listed ways: ask questions, determine the preferred resolution, offer to help, challenge your biases."},{"id":"S3-034","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 27","question":"What does the lecture say the full message consists of?","options":["Title + Authority + Volume","Words + Voice + Body","Words only","Slides + Data + Charts"],"answer_index":1,"explanation":"When verbal and nonverbal signals conflict, trust can suffer."},{"id":"S3-035","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 27","question":"A manager says 'I'm very interested in your idea' while checking the phone and rushing. What is the likely result?","options":["The message is clear, because the spoken words themselves were positive","The employee receives the nonverbal message, and trust may suffer","The employee believes the words","The employee feels highly valued"],"answer_index":1,"explanation":"When verbal and nonverbal signals conflict, the nonverbal message often dominates."},{"id":"S3-036","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 28","question":"Why does the lecture say crossed arms do not automatically mean someone is defensive?","options":["Because only facial expressions carry reliable meaning","Because body language is irrelevant to communication","Because one signal should not be interpreted in isolation — the person may simply be comfortable or cold","Because crossed arms always signal agreement and openness"],"answer_index":2,"explanation":"Rule 1: don't interpret one signal in isolation."},{"id":"S3-037","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 28","question":"Which approach to nonverbal cues does the lecture recommend?","options":["Observe → Assume → Judge","Assume → Confront → Decide → Document","Observe → Form a hypothesis → Ask","Ignore → Proceed → Review"],"answer_index":2,"explanation":"Culture, personality, comfort, disability and hierarchy influence nonverbal behavior, so verify by asking."},{"id":"S3-038","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 28","question":"Someone suddenly becomes quieter and stops participating after your proposal. What does the lecture suggest you say?","options":["'Great, I can see from the silence that everyone in the room agrees with the plan.'","'I sense some hesitation. Is there something about the proposal that concerns you?'","'Why are you being so negative about this proposal?'","'Let's move on — silence means everyone consents.'"],"answer_index":1,"explanation":"Rule 2: look for changes and clusters, then ask rather than conclude."},{"id":"S3-039","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 29","question":"Presenting a redesign, nobody objects but operators exchange glances and hesitate. What does a perceptive manager think?","options":["'Excellent. Everyone agrees.'","'The operators are simply resisting any change.'","'The proposal is approved.'","'There may be information I'm not hearing.'"],"answer_index":3,"explanation":"Nonverbal signals are clues, not proof — so ask about implementation concerns."},{"id":"S3-040","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 31","question":"In the Face–Voice–Body model, which statement does the lecture make about voice?","options":["Words carry content; voice adds context","Voice matters only in phone calls","Voice is less important than posture","Voice carries content; words add context"],"answer_index":0,"explanation":"The same sentence ('That's an interesting idea') can communicate interest, doubt, surprise or politeness."},{"id":"S3-041","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 31","question":"Which item does the lecture explicitly say it would remove as a recommended communication technique?","options":["Posture","Eye contact","Pauses","Touch"],"answer_index":3,"explanation":"The slide notes: 'I would remove Touch as a recommended communication technique.'"},{"id":"S3-042","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 32","question":"What is the key takeaway about body language versus conversation?","options":["Body language helps you notice what may be happening; conversation helps you find out what is actually happening","Body language reveals the truth, while conversation tends to hide it","Conversation becomes unnecessary once you read body language well","Body language matters only in formal negotiations, not in daily work"],"answer_index":0,"explanation":"Body language should make you more curious, not more certain."},{"id":"S3-043","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 33","question":"A relaxed participant's behavior changes suddenly when you mention three months of weekend shifts. What type of signal is this?","options":["An open/engaged signal","A change signal","A cultural signal","An authority signal"],"answer_index":1,"explanation":"Change signals — sudden shifts after a specific topic — justify curiosity."},{"id":"S3-044","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 36","question":"How does the lecture describe 'respect and responsiveness'?","options":["Agreeing with senior people to show respect for hierarchy","Speaking only when someone explicitly asks for your view","Letting others speak and knowing when to initiate conversation or respond","Always responding immediately to every single message that you receive at work"],"answer_index":2,"explanation":"One of its essential skills is listening actively and empathetically."},{"id":"S3-045","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 38","question":"Which principle does the lecture give for choosing a communication channel?","options":["Match the medium to the message","Use the fastest channel available","Always use face-to-face","Always use email for a record"],"answer_index":0,"explanation":"The wrong channel can damage an otherwise good message."},{"id":"S3-046","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 38","question":"Which four questions does the lecture use to select a channel?","options":["Hierarchy, location, language and time zone of the receiver","Audience, budget, deadline, tool","Cost, speed, length, format","Complexity, sensitivity, urgency, record"],"answer_index":3,"explanation":"These make channel selection systematic; the more complex or emotional, the richer the channel should be."},{"id":"S3-047","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 38","question":"According to the lecture, the more complex or emotional a message is:","options":["The richer the communication channel should be","The later in the day the message should be sent","The shorter and more formal the email should be","The more people should be copied on the message"],"answer_index":0,"explanation":"Richer channels (face-to-face, video) carry more nuance."},{"id":"S3-048","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 39","question":"According to the channel table, what should you use for a sensitive discussion?","options":["Email with a read receipt","Face-to-face or video","A formal written report","Instant message or chat"],"answer_index":1,"explanation":"Quick coordination → chat; documentation → email; immediate interaction → phone; sensitive → face-to-face/video."},{"id":"S3-049","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 39","question":"According to the channel table, what is recommended for a complex decision?","options":["A phone call with no follow-up","A post on the company's internal social media page","A meeting plus a supporting document","A quick chat message to the team"],"answer_index":2,"explanation":"Complex decisions need interaction and documentation together."},{"id":"S3-050","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 40","question":"Which of the following is an example of synchronous communication?","options":["Messaging app thread answered later","Video meeting","Email","Shared document"],"answer_index":1,"explanation":"Synchronous: everyone communicates at the same time (face-to-face, phone, video)."},{"id":"S3-051","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 40","question":"Asynchronous communication is best when you need:","options":["Rapid feedback, live clarification and real-time negotiation with others","Emotional nuance and real-time discussion","Flexibility, reflection, documentation and detailed information","Immediate clarification during a crisis"],"answer_index":2,"explanation":"Synchronous suits discussion, rapid feedback, negotiation and emotional nuance."},{"id":"S3-052","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 40","question":"Which pair of warnings appears on the synchronous vs. asynchronous slide?","options":["Avoid meetings entirely, and communicate only through email","Never use chat at work, and always write formal reports instead","Always meet in person, and never use email for important decisions","Don't schedule a meeting when asynchronous communication will do; don't send 15 messages when a 5-minute conversation will solve it"],"answer_index":3,"explanation":"Choose the mode that fits the problem."},{"id":"S3-053","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 41","question":"What does the lecture say about richer communication?","options":["Richer communication is not automatically better communication","Email is always the most efficient channel available","Video calls are always superior to phone calls","Face-to-face communication is always the best option for every message"],"answer_index":0,"explanation":"A 30-minute meeting for a three-sentence message is inefficient; use enough capacity without waste."},{"id":"S3-054","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 41","question":"According to the lecture, what is the result of 'right message + wrong medium'?","options":["Better documentation of decisions","Partial success","Faster agreement","Communication failure"],"answer_index":3,"explanation":"Choose the channel before you craft the message."},{"id":"S3-055","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 42","question":"Which are the three main communication styles named in the lecture?","options":["Formal, informal, technical and visual","Passive, aggressive, assertive","Verbal, nonverbal, written","Direct, indirect, neutral"],"answer_index":1,"explanation":"Assertive communication is the goal: meeting your needs and those of the other person."},{"id":"S3-056","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 43","question":"When learning to say 'No' assertively, which word does the lecture call a powerful game-changer?","options":["'Because'","'Never'","'Maybe'","'Sorry'"],"answer_index":0,"explanation":"Explaining your reasons with 'because' helps others accept a negative answer."},{"id":"S3-057","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 44","question":"When watching tone and pace to be assertive, what does the lecture recommend?","options":["Speaking quickly and firmly so you keep control of the conversation","Using a harsh tone so that no hesitation is shown","Raising your voice to show determination and strength","Speaking slowly with a calm, relaxed, somewhat quieter voice"],"answer_index":3,"explanation":"Keep it friendly and calm; the slide suggests a level around 6 on a 1–10 scale."},{"id":"S3-058","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 45","question":"When you don't get the answer you want, which behavior is passive according to the lecture?","options":["Continuing calmly until the issue is resolved","Listening more carefully to find a solution","Asking more questions to explore options","Just agreeing and walking away"],"answer_index":3,"explanation":"Assertiveness means continuing in a calm, respectful way until a solution is found (give and take)."},{"id":"S3-059","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 48","question":"Which benefit of assertiveness is explained by 'Aggressive communication is stressful. Passive is humiliating'?","options":["Better communication","More trust","Less stress","More confidence"],"answer_index":2,"explanation":"Benefits listed: better communication, less stress, more trust, more confidence."},{"id":"S3-060","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 50","question":"What risk of being assertive does the lecture mention?","options":["Assertiveness always damages working relationships in the long run","Some organizational and national cultures prefer passivity and may view assertiveness as rude","Assertiveness is prohibited by law in some workplaces","Assertive people are rarely promoted to management positions"],"answer_index":1,"explanation":"The slide cites cultures such as China as an example where assertiveness may be seen as offensive."},{"id":"S3-061","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 51","question":"Which statement is a MYTH about assertiveness according to the lecture?","options":["Assertiveness means expressing your view honestly","You can be assertive on behalf of someone else","Assertiveness means getting your own way all the time","Assertiveness shows respect for both yourself and other people"],"answer_index":2,"explanation":"Myths: #1 always getting your way; #2 being selfish; #3 passivity is the way to be loved."},{"id":"S3-062","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 51","question":"'I would like Dilara to choose the restaurant this week.' What myth does this example refute?","options":["That passivity is the way to be loved","That assertiveness is aggressive","That assertiveness means always winning the argument","That being assertive means being selfish"],"answer_index":3,"explanation":"You can also be assertive on behalf of someone else."},{"id":"S3-063","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 54","question":"How many attention-getting devices does the lecture recommend using in an introduction?","options":["At least five","None — start directly with data","One, two or three at most","All of them for maximum impact"],"answer_index":2,"explanation":"Devices include telling a story, asking a provocative question or showing a compelling image."},{"id":"S3-064","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 55","question":"In the second phase of an effective introduction, what should the speaker do?","options":["Tell a joke to relax the audience before starting the content","Focus the presentation (state the goal or thesis) and preview what follows","Present the detailed data and analysis immediately","Ask each member of the audience to introduce themselves"],"answer_index":1,"explanation":"Phase 2: tell listeners what it's about and what they'll learn."},{"id":"S3-065","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 56","question":"How does the lecture recommend making statistics meaningful?","options":["Present raw numbers with many decimals to show precision","Show every data point in one large, detailed table","Round off big numbers, interpret them and translate them into human terms","Avoid statistics entirely and use only stories instead"],"answer_index":2,"explanation":"Also use graphics, comparisons and analogies."},{"id":"S3-066","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 57","question":"Phrases like 'In the first place…' and 'The key argument is…' are examples of what?","options":["Summaries","Transitions to the conclusion only","Analogies","Signposts"],"answer_index":3,"explanation":"Signposts guide listeners; transitions show how pieces of content relate."},{"id":"S3-067","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 58","question":"What should you AVOID in the conclusion of a presentation?","options":["Returning to the opening anecdote, quotation or remark with a twist","Introducing new evidence or a new line of argument","Restating your recommendation","Recapping the main points"],"answer_index":1,"explanation":"The conclusion should summarize, refocus and create closure."},{"id":"S3-068","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 60","question":"Why does the lecture recommend recapping important details in online communication?","options":["Because nonverbal and interpersonal cues can be lost online","Because online participants generally prefer repetition","Because online meetings are usually much longer than live ones","Because meeting recordings are usually unreliable"],"answer_index":0,"explanation":"Recap key points in the meeting or with a summary at the end of a lengthy email."},{"id":"S3-069","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 61","question":"Why does the lecture recommend responding even with a quick acknowledgment (like a 'like' or WhatsApp blue tick)?","options":["Because a quick acknowledgment politely ends the conversation","Because a written reply is a legal requirement in most companies","Because a short reaction can replace a full answer later","Because the sender otherwise has no way of knowing the message was received"],"answer_index":3,"explanation":"Tip 6: don't forget to respond — inform that you received the message."},{"id":"S3-070","type":"lecture","week":3,"topic":"Effective Communication","doc":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 53","question":"Which tip for keeping audiences engaged is listed in the preparation phase?","options":["Hide your personality","Avoid nonverbal communication","Don't use 10 words when one will do","Read your slides word for word to avoid mistakes"],"answer_index":2,"explanation":"Also: prepare and rehearse, know your audience, organize your material, adapt to feedback."},{"id":"BT-001","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 1","question":"According to the opening slide of the team lecture, what 'makes the difference'?","options":["A team made up only of the most technically gifted engineers available","A team of members who all share the same personality type, background and working style, chosen for harmony","A team whose members work independently with minimal coordination","A team with different personalities, competences and intelligences serving the organization's strategy"],"answer_index":3,"explanation":"The slide: your competences lead you to form a team with different personalities, competences & intelligences serving the strategy of the organization."},{"id":"BT-002","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 3","question":"What does the acronym TEAM stand for in the lecture?","options":["Targets, Execution, Accountability, Measurement","Trust Enables Agile Management","Together Everyone Accomplishes More","Talent, Effort, Ability, Motivation"],"answer_index":2,"explanation":"TEAM = Together Everyone Accomplishes More — but 'a team can generate magic, don't count on it always.'"},{"id":"BT-003","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 3","question":"What warning does the lecture give right after saying 'A team can generate magic'?","options":["Teams generate magic automatically if they are well paid","Don't count on it always; first make sure you know who is on the team","Magic is guaranteed once a strong leader is appointed","Magic is guaranteed once a strong and experienced leader has been appointed to it"],"answer_index":1,"explanation":"If you're going to lead a team, first make sure that you know who's on it."},{"id":"BT-004","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 5","question":"Members reduce their individual effort when working in a team. Which issue is this, and what is the manager's response?","options":["Storming — let the conflict resolve itself over time","Coordination loss — clarify the roles, dependencies and working methods of members","Social loafing — make contributions visible and follow up on commitments","Coordination loss — clarify roles, dependencies and methods"],"answer_index":2,"explanation":"The 'why more people may not mean better performance' table pairs each issue with a manager response."},{"id":"BT-005","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 5","question":"Members spend effort, but duplication, delays or poor integration reduce results. Which issue is this?","options":["Effective collaboration loss","Social loafing","Coordination loss","Adjourning"],"answer_index":2,"explanation":"Response: clarify roles, dependencies and working methods."},{"id":"BT-006","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 5","question":"Members combine few complementary contributions toward a shared result. What does the lecture recommend?","options":["Assign the whole task to the strongest single member","Support information sharing and joint review","Add more members so that more ideas are generated","Reduce the frequency of meetings to save time"],"answer_index":1,"explanation":"This is 'effective collaboration loss'."},{"id":"BT-007","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 5","question":"Before adding more people to a team, what does the lecture say you should do?","options":["Double the deadline","Replace the team leader","Identify what limits performance","Increase the team's budget first"],"answer_index":2,"explanation":"More people may not mean better performance."},{"id":"BT-008","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 6","question":"According to the 'Teams are great' slide, at what team size does social loafing become likely?","options":["3 or more members","Only above 50 members","5 or more members","10 or more members"],"answer_index":3,"explanation":"The slide recommends no more than 6 people and warns that teams of 10 or more are good for social loafing."},{"id":"BT-009","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 6","question":"What composition rule of thumb about Playful members appears on the 'Teams are great' slide?","options":["No team should contain any Playful members","At least half of the team should be Playful","Only the leader should be Playful","About 1 in 3 members should be Playful"],"answer_index":3,"explanation":"Slide 6: 'No more than 6 people … 1 in 3 to be playful.'"},{"id":"BT-010","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 6","question":"Team A has six strong members, informal allocation and separate solutions; Team B has four complementary members, agreed responsibilities and weekly reviews. What does the lecture suggest?","options":["Team B will suffer from social loafing because it is smaller","Both teams will perform equally because talent is similar","Team A will perform better because it simply has more technically strong members available","Team B is more likely to perform better; Team A is more exposed to social loafing"],"answer_index":3,"explanation":"Clear responsibilities, shared assumptions and regular reviews of working outputs reduce loafing and coordination loss."},{"id":"BT-011","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 7","question":"How does the lecture define social loafing?","options":["A team deliberately slows down to protest against management","Individuals reduce their effort when working collectively compared with working individually","Team members spend too much of their working time socializing with each other instead of working","Members work harder in teams than when working alone"],"answer_index":1,"explanation":"It is encouraged when contributions are hard to identify, responsibilities unclear or poor work gets no follow-up."},{"id":"BT-012","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 7","question":"Which of the following is a condition that can encourage social loafing?","options":["Each member owns a named deliverable","Individual contributions are difficult to identify","Each member owns a clearly named deliverable with a deadline","Progress is reviewed at agreed milestones"],"answer_index":1,"explanation":"Other conditions: unclear responsibilities, too many members, expecting others to do the work."},{"id":"BT-013","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 8","question":"Which three measures does the lecture name for eliminating social loafing?","options":["Selecting effective members, making individual performance visible, and motivating","Increasing meetings, monitoring emails, and fining latecomers","Adding more members, extending the deadlines, and lowering the team's performance targets","Hiring consultants, removing the leader, and cutting budgets"],"answer_index":0,"explanation":"Slide 8 lists these three, followed by practical steps."},{"id":"BT-014","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 8","question":"'Assign a named owner, deliverable and deadline' is which practical step for reducing social loafing?","options":["Clarify ownership","Make progress visible","Follow up fairly","Balance workloads"],"answer_index":0,"explanation":"Others: make progress visible, explain the contribution, balance workloads, follow up fairly."},{"id":"BT-015","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 8","question":"'Check capability, available time and access to resources' is which step for reducing social loafing?","options":["Balance workloads","Make progress visible","Explain the contribution","Clarify ownership"],"answer_index":0,"explanation":"Balancing workloads ensures each member can realistically deliver."},{"id":"BT-016","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 9","question":"In the five stages of team development, members get to know each other and seek to establish ground rules during:","options":["Norming","Storming","Performing","Forming"],"answer_index":3,"explanation":"Forming → Storming → Norming → Performing → Adjourning."},{"id":"BT-017","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 9","question":"In which stage do members resist control by leaders and show hostility?","options":["Forming","Norming","Adjourning","Storming"],"answer_index":3,"explanation":"Storming comes after forming; even well-selected teams pass through it."},{"id":"BT-018","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 9","question":"In which stage do members develop close relationships and feelings of camaraderie?","options":["Storming","Forming","Norming","Performing"],"answer_index":2,"explanation":"Norming precedes performing, where members work toward getting their jobs done."},{"id":"BT-019","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 9","question":"The team disbands, either after achieving its goals or because members leave. Which stage is this?","options":["Adjourning","Norming","Storming","Performing"],"answer_index":0,"explanation":"Adjourning is the fifth stage."},{"id":"BT-020","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 9","question":"What point does the lecture make with 'Don't forget, even if you select the effective members…'?","options":["Motivation will no longer be needed","There will be no conflict in the team","There will still be the five stages of team development","There will be no conflict at all in the team from the very first meeting"],"answer_index":2,"explanation":"Good selection does not remove the developmental stages."},{"id":"BT-021","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 10","question":"Which of the following is listed among the factors for organizing effective teams?","options":["Choosing members only by seniority","Avoiding commitment to the team","Establishing team norms — team contracts","Keeping goals vague to allow flexibility"],"answer_index":2,"explanation":"Others: clear objectives, appropriate leadership, suitable membership, commitment, supportive climate."},{"id":"BT-022","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 10","question":"In the lecture's 7-step team management process, what is step 1?","options":["Evaluating the performance of the team","Determining the sources of recruitment of team members","Training employees according to need","Training the employees according to the needs of the team"],"answer_index":1,"explanation":"Steps: recruitment sources → selection → training → goals & objectives → motivation → evaluation → control."},{"id":"BT-023","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 10","question":"In the 7-step process, which step comes right after 'Training the employees according to need'?","options":["Arranging motivation policies","Assigning the goals and objectives to your team","Controlling the implementation policy","Selecting the capable who really want the job"],"answer_index":1,"explanation":"Step 3 training → step 4 goals & objectives → step 5 motivation."},{"id":"BT-024","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 10","question":"What is the LAST step of the lecture's 7-step team management process?","options":["Arranging motivation policies for members","Controlling the implementation policy","Evaluating the performance of the team","Determining sources of recruitment"],"answer_index":1,"explanation":"Step 6 is evaluating performance; step 7 is controlling the implementation policy."},{"id":"BT-025","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 11","question":"LinkedIn, headhunters, university visits and referrals are discussed on which slide theme?","options":["Criteria for team evaluation","Stages of team development from forming to adjourning","Sources of recruitment in the war for talent","Stages of team development"],"answer_index":2,"explanation":"The slide contrasts passive and active recruiting: 'Do not forget that there is a war for talent.'"},{"id":"BT-026","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 12","question":"Besides skills and expertise, what must the right team mix include according to the lecture?","options":["The same personality type","Family relationships with managers","Cultural fit and values","Identical educational backgrounds"],"answer_index":2,"explanation":"Organize teams by selecting the right mix of skills and expertise and cultural fit and values."},{"id":"BT-027","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 13","question":"Which item appears in the lecture's list of competencies to assess candidates against?","options":["Physical appearance","Family background","AI capabilities","Political opinions"],"answer_index":2,"explanation":"The list includes communication, conflict management, leadership, teamwork, AI capabilities, values and ethics, learning capability, etc."},{"id":"BT-028","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 14","question":"Which rule does the lecture give 'before you start the recruiting process'?","options":["Hire relatives first because they are more loyal","Never compromise for relatives; set clear criteria and high barriers","Hire relatives first, because family members tend to be more loyal to you","Keep selection criteria flexible and undefined"],"answer_index":1,"explanation":"Also: seek 'star employees' contributing to strategic goals and define clear roles and responsibilities."},{"id":"BT-029","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 15","question":"If the strategic priority is 'consistent quality', which capabilities should the team seek?","options":["Systems thinking, waste reduction and cost analysis","Process analysis, root-cause investigation and attention to detail","Scheduling, coordination and managing disruptions","Experimentation, close customer understanding and continuous learning"],"answer_index":1,"explanation":"Each strategic priority maps to capabilities: reliable delivery, consistent quality, product innovation, cost efficiency."},{"id":"BT-030","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 15","question":"If the strategic priority is 'product innovation', which capabilities should the team seek?","options":["Process analysis, root-cause investigation and detail","Systems thinking, waste reduction and cost analysis","Experimentation, customer understanding and learning","Scheduling, coordination and managing disruptions"],"answer_index":2,"explanation":"Capabilities should follow the strategy the team serves."},{"id":"BT-031","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 15","question":"Which capabilities does the lecture link to the strategic priority 'reliable delivery'?","options":["Scheduling, coordination and managing disruptions","Root-cause investigation and attention to detail","Experimentation and customer understanding","Waste reduction and cost analysis"],"answer_index":0,"explanation":"Reliable delivery depends on planning and handling disruptions."},{"id":"BT-032","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 16","question":"In the 6 steps for selecting the star employee, what is the FIRST step?","options":["Interviews with one or more interviewers","Tests","Application forms and/or CV evaluation","Telephone conversation"],"answer_index":2,"explanation":"Steps: CV → telephone → tests → interviews → reference check → health control."},{"id":"BT-033","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 16","question":"In the 6 selection steps, which step comes right after the interviews?","options":["Telephone conversation","References check","Health control","Tests"],"answer_index":1,"explanation":"Interviews (step 4) → references check (5) → health control (6)."},{"id":"BT-034","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 16","question":"What is the LAST step in the lecture's 6-step selection process?","options":["Health control","Interviews","Job offer negotiation","References check"],"answer_index":0,"explanation":"Health control is step 6."},{"id":"BT-035","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 16","question":"Which types of tests are listed in step 3 of the selection process?","options":["Only physical fitness, medical and eyesight tests carried out by a company doctor","Only language and typing tests","Mental ability, personality, aptitude, intelligence, interest and knowledge tests","Credit history and social media checks"],"answer_index":2,"explanation":"The slide also stresses: standardize questions and take commitment."},{"id":"BT-036","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 17","question":"Which behavior during an interview should receive NEGATIVE points?","options":["Knowing facts and figures about the company","Criticizing past or present managers or employers","Asking the interviewer several questions about the role and team","Arriving about ten minutes early"],"answer_index":1,"explanation":"Other negatives: mobile on, chewing gum, yes/no answers, vague answers, unexplained technical claims."},{"id":"BT-037","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 17","question":"A candidate answers every question with just 'yes' or 'no'. How should this be scored?","options":["Positive points — short answers show confidence","Neutral — answer length does not matter","Negative points — candidates should provide detail","Positive points — short answers show confidence and efficiency"],"answer_index":2,"explanation":"Answering with just yes or no is listed among negatives."},{"id":"BT-038","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 18","question":"According to the lecture, how early should a well-prepared candidate arrive?","options":["A few minutes late to look relaxed","At least one hour early","Around 10 minutes early","Exactly on time, never earlier"],"answer_index":2,"explanation":"Arriving around 10 minutes early earns positive points."},{"id":"BT-039","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 19","question":"If an insufficient job description has been provided, what should a strong candidate do?","options":["End the interview early","Ask the interviewer to describe the position and duties","Avoid asking anything, so as not to appear uninformed about the company","Assume the duties from similar jobs"],"answer_index":1,"explanation":"This is listed among behaviors deserving positive points."},{"id":"BT-040","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 20","question":"How should a candidate approach the interview to earn positive points?","options":["As a two-way conversation, also interviewing the manager","As a one-way test in which only the employer is allowed to ask questions","As a negotiation focused only on salary","As a formality before an inevitable offer"],"answer_index":0,"explanation":"The candidate also assesses whether this is a unit they want to work for."},{"id":"BT-041","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 21","question":"Which framework does the lecture use for questions that let candidates demonstrate competence?","options":["Situation, Task, Action, Result, plus Follow-up","Specific, Measurable, Achievable, Relevant, Time-bound","Plan, Do, Check, Act","Strengths, Weaknesses, Opportunities, Threats"],"answer_index":0,"explanation":"Follow-up asks what the candidate would do differently next time."},{"id":"BT-042","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 21","question":"In the STAR questions, 'What were you personally responsible for?' corresponds to:","options":["Task","Action","Result","Situation"],"answer_index":0,"explanation":"Situation = context; Task = personal responsibility; Action = what you did and why; Result = what changed and how measured."},{"id":"BT-043","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 21","question":"A METU graduate says 'Our team improved productivity by 20% using line balancing.' Which follow-up question does the lecture suggest?","options":["Would you accept a lower starting salary?","Which university did your teammates attend?","Which university did each of your teammates attend, and what were their grades?","What was your individual contribution, and how was productivity measured?"],"answer_index":3,"explanation":"Also: did it last after implementation, and what happened to quality, overtime and WIP?"},{"id":"BT-044","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 22","question":"'How will you evaluate my performance?' is a question explored by whom in the two-way interview?","options":["The employer","The HR auditor","The reference","The candidate"],"answer_index":3,"explanation":"The interview is a two-way assessment: the employer and the candidate both explore."},{"id":"BT-045","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 23","question":"What advice from Steve Jobs about selection does the lecture highlight?","options":["Select the talented one who really wants the job","Select the cheapest qualified candidate","Select whoever interviews most confidently","Select the candidate with the most degrees and certificates"],"answer_index":0,"explanation":"Desire for the job matters alongside talent."},{"id":"BT-046","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 25","question":"After selection, which of the following does even a very capable new employee need?","options":["Clear expectations, organizational understanding, support, resources and early feedback","A promise of promotion within six months","Complete independence from the first day, with no reviews or feedback, to build confidence quickly","Only a higher salary than colleagues"],"answer_index":0,"explanation":"Key question: what must this person learn before working independently?"},{"id":"BT-047","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 26","question":"Strategy, core values, culture, code of ethics and safety are covered at which training stage?","options":["Off-the-job training","Orientation training","Management development","On-the-job training"],"answer_index":1,"explanation":"Management development covers self-awareness, strengthening weaknesses, career plan and milestones."},{"id":"BT-048","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 27","question":"Preparing a production schedule alongside an experienced planner is an example of:","options":["On-the-job learning","Management development","Orientation","Off-the-job learning"],"answer_index":0,"explanation":"On-the-job learning develops capability through supported work."},{"id":"BT-049","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 27","question":"Completing a simulation workshop using sample data, away from daily production pressure, is an example of:","options":["Off-the-job learning","On-the-job learning","Orientation","Management development"],"answer_index":0,"explanation":"Off-the-job learning lets people practise away from daily pressure."},{"id":"BT-050","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 27","question":"Leading an improvement project with coaching and feedback to prepare for broader responsibility is:","options":["Orientation","Management development","Off-the-job learning","On-the-job learning"],"answer_index":1,"explanation":"Management development prepares people for broader responsibility."},{"id":"BT-051","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 30","question":"In the umbrella analogy, what do the spokes represent?","options":["Goals","Objectives","Tasks","The mission"],"answer_index":1,"explanation":"The umbrella is the goal; the spokes are objectives — an umbrella cannot go up and down without spokes."},{"id":"BT-052","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 31","question":"Which description fits OBJECTIVES rather than goals?","options":["Unmeasurable aspirations with no deadline","The whole; the final result; the broad direction","Large in size; the end result; longer term","Sub-goals; the means to the end; shorter term"],"answer_index":3,"explanation":"Goals are the end, the whole, longer term; objectives are steps, part of the whole, shorter term. Both can be measured."},{"id":"BT-053","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 31","question":"'I want to complete the thesis on genetic research within this month' is an example of:","options":["An objective","A vision","A core value","A goal"],"answer_index":0,"explanation":"'Achieve success in genetic research and do what no one has done' is the goal."},{"id":"BT-054","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 32","question":"In the engineering example, 'Reduce unplanned downtime from 12% to 8% within six months' is a(n):","options":["Task","Mission","Goal","Objective"],"answer_index":3,"explanation":"Goal: improve production reliability in 12 months; task: analyse failure records and pilot preventive maintenance."},{"id":"BT-055","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 32","question":"'Analyse failure records and pilot a preventive-maintenance schedule every week' is a(n):","options":["Outcome","Task","Goal","Objective"],"answer_index":1,"explanation":"Tasks are actions undertaken to achieve an objective."},{"id":"BT-056","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 33","question":"In the road-building example, 'number of highway miles constructed or repaired' is an example of:","options":["Goals","Outcomes","Core values","Outputs"],"answer_index":3,"explanation":"Outputs are the amount of something; outcomes are consequences such as improved traffic flow."},{"id":"BT-057","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 33","question":"Improved traffic flow, reduced travel time and fewer accidents are examples of:","options":["Tasks","Outcomes","Inputs","Outputs"],"answer_index":1,"explanation":"Outcomes are the consequences of outputs."},{"id":"BT-058","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 35","question":"Which SMART criterion asks 'What baseline, target and measure will we use?'","options":["Measurable","Specific","Time-bound","Achievable"],"answer_index":0,"explanation":"Specific: what result will change and where; Achievable: feasible with resources; Time-bound: when."},{"id":"BT-059","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 35","question":"Which SMART criterion asks 'How does it support the team's purpose and organizational priorities?'","options":["Specific","Measurable","Achievable","Relevant"],"answer_index":3,"explanation":"On slide 35 the R is 'Relevant'; slide 34 lists it as 'Realistic'."},{"id":"BT-060","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 37","question":"In the cascade from strategy to team work, which level answers 'Who will do what, and by when?'","options":["Objectives","Tasks and responsibilities","Goals","Objectives and measurable targets"],"answer_index":1,"explanation":"Corporate → business strategy → vision/mission → goals → objectives → tasks and responsibilities."},{"id":"BT-061","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 38","question":"In the solar company example, 'Improve the customer service score by at least 10% next month by improving reaction time to complaints' is listed as a:","options":["Vision","Strategic goal","Core value","Related task"],"answer_index":3,"explanation":"Strategic goals were e.g. investing in own PV production; core values were innovation and integrity."},{"id":"BT-062","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage You
