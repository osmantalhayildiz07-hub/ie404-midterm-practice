exist; opposite ones (authority & purpose, safety & learning) are harder."},{"id":"S4-081","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"Which pair of styles is located across from each other and requires more organizational energy to maintain simultaneously?","options":["Caring and purpose","Learning and enjoyment","Safety and order","Safety and learning"],"answer_index":3,"explanation":"Opposite styles are less likely to be found together."},{"id":"S4-082","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"In the article's leader statements, Huawei's CEO describing a 'wolf spirit' illustrates which culture style?","options":["Authority","Learning","Results","Enjoyment"],"answer_index":0,"explanation":"The wolf metaphor reflects strength, decisiveness and a strong desire to win."},{"id":"S4-083","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"In the article's leader statements, Zappos' Tony Hsieh ('Have fun…') illustrates which style?","options":["Enjoyment","Caring","Learning","Purpose"],"answer_index":0,"explanation":"Enjoyment is expressed through fun and excitement."},{"id":"S4-084","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"In the article's leader statements, Whole Foods' John Mackey on 'a deeper, more transcendent purpose' illustrates which style?","options":["Caring","Purpose","Order","Results"],"answer_index":1,"explanation":"Purpose is exemplified by idealism and altruism."},{"id":"S4-085","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"In the article's leader statements, the SEC chairman's remarks about rule making illustrate which style?","options":["Safety","Order","Results","Authority"],"answer_index":1,"explanation":"Order focuses on respect, structure and shared norms."},{"id":"S4-086","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"What do the authors say about whether one culture style is better than another?","options":["Each style has advantages and disadvantages; no style is inherently better","Results is always the best style because it drives measurable financial performance","Caring should dominate every culture to keep employees loyal","Learning is always superior in any industry or context"],"answer_index":0,"explanation":"The framework involves trade-offs and difficult choices."},{"id":"S4-087","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"A culture emphasizing both caring and order brings loyalty and engagement, but which challenge?","options":["A tendency toward groupthink, consensus-based decisions and avoidance of difficult issues","High internal competition and a psychologically unsafe climate","A lack of rules and structure that causes compliance problems","Excessive risk taking and a lack of planning or preparation"],"answer_index":0,"explanation":"It can also produce a calcified sense of 'us versus them'."},{"id":"S4-088","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"Why can a culture that emphasizes both results and caring confuse employees?","options":["Both styles reject a focus on customers and external markets","Both styles avoid change and resist new strategic directions","Both styles demand strict rules that limit individual autonomy","They may not know whether to optimize individual goals or emphasize collaboration and shared success"],"answer_index":3,"explanation":"The nature of the work or strategy may make it hard to be equally results-focused and caring."},{"id":"S4-089","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 7","question":"According to the 'pros and cons' table, which culture style was ranked 1st or 2nd most frequently (89%) among companies studied?","options":["Learning","Caring","Results","Order"],"answer_index":2,"explanation":"Results 89%, Caring 63%, Order 15%, Purpose 9%, Safety 8%, Learning 7%, Authority 4%, Enjoyment 2%."},{"id":"S4-090","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 7","question":"What disadvantage does the article list for an overemphasis on the Authority style?","options":["Reduced individualism and stifled creativity","Bureaucracy and inflexibility","A lack of focus and an inability to exploit the existing advantages","Politics, conflict and a psychologically unsafe work environment"],"answer_index":3,"explanation":"Authority's advantage is faster decision making and responsiveness to threats or crises."},{"id":"S4-091","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 7","question":"What disadvantage does the article list for an overemphasis on the Learning style?","options":["Slow consensus-based decisions","Politics, conflict and a psychologically unsafe environment for staff","Higher stress and anxiety","A lack of focus and an inability to exploit existing advantages"],"answer_index":3,"explanation":"Learning improves innovation, agility and organizational learning."},{"id":"S4-092","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 7","question":"What disadvantage does the article list for an overemphasis on the Safety style?","options":["A lack of discipline and possible compliance or governance issues","Neglect of practical and immediate concerns in favor of long-term ideals","Communication breakdowns and higher levels of stress and anxiety","Bureaucracy, inflexibility and dehumanization of the work environment"],"answer_index":3,"explanation":"Safety improves risk management, stability and business continuity."},{"id":"S4-093","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 8","question":"The retailer with the simple rule 'Do right by the customer' illustrates which insight?","options":["When aligned with strategy and leadership, a strong culture drives positive outcomes","A strong culture is always a liability in fast-growing retail markets","Retailers should avoid hiring outside leaders to protect culture","Culture is largely irrelevant to the quality of customer service"],"answer_index":0,"explanation":"Its culture combined results and caring with flexibility, learning and purpose."},{"id":"S4-094","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 8","question":"Facing hostile-takeover rumors, the agriculture business's board chose which type of new CEO?","options":["A hard-driving, competitive leader with an authority style","A risk-taking candidate with a learning style","The internal successor with a safety and order style","An external candidate aligned with the current purpose culture"],"answer_index":0,"explanation":"The new CEO navigated a hostile takeover attempt — showing leader selection requires a forward-looking strategy and culture."},{"id":"S4-095","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 8","question":"What do the authors say about cultural dynamics in mergers and acquisitions?","options":["They matter only in cross-border deals between different countries","They rarely affect integration success if the deal is well financed","They are one of the greatest yet most frequently overlooked determinants of post-merger performance","They can safely be ignored if the financial case is strong"],"answer_index":2,"explanation":"Designing a new culture on complementary strengths can speed integration."},{"id":"S4-096","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 9","question":"The European industrial-services firm whose strategy had to shift from cost leadership to service differentiation illustrates which insight?","options":["Culture cannot be changed in traditional industrial firms","Cost leadership strategies always require a strongly learning-oriented culture to succeed","A strong culture always helps a company execute any strategy","A strong culture can be a significant liability when it is misaligned with strategy"],"answer_index":3,"explanation":"Its results-, caring- and order-oriented culture with top-down authority became a roadblock."},{"id":"S4-097","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 9","question":"Which of the following is one of the four levers for evolving a culture?","options":["Keep the cultural aspiration confidential among top leaders","Freeze all hiring until the new culture has fully taken hold","Delegate culture change entirely to the HR department","Use organizational conversations about culture to underscore the importance of change"],"answer_index":3,"explanation":"The four levers: articulate the aspiration, select and develop aligned leaders, use organizational conversations, reinforce through organizational design."},{"id":"S4-098","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 9","question":"Why should culture change be framed in terms of tangible problems such as market pressures or growth challenges?","options":["Because regulators require culture change to be justified financially","Because tangible problems are easier to hide from competitors","Because employees tend to ignore any discussion of cultural topics","Because culture is ambiguous and hidden, tangible problems help people connect to the need for change"],"answer_index":3,"explanation":"This is part of articulating the aspiration."},{"id":"S4-099","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 9","question":"Although learning ranks fourth overall, which organizations accord it higher value?","options":["Small companies (200 employees or fewer) and those in newer industries like software and technology","Companies operating in very stable, mature industries","Large state-owned enterprises with thousands of employees","Firms with very tall hierarchies and centralized decisions"],"answer_index":0,"explanation":"In dynamic, uncertain environments learning gains importance."},{"id":"S4-100","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 10","question":"According to the research summary, culture most directly affects which outcome?","options":["Tax obligations, followed by regulatory compliance","Stock price volatility, followed by dividend policy","Employee engagement and motivation, followed by customer orientation","Supplier payment terms, followed by inventory turnover and stock levels"],"answer_index":2,"explanation":"Engagement is most strongly related to flexibility styles: enjoyment, learning, purpose and caring."},{"id":"S5-071","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"Which conflict-analysis approach emphasizes the difference between positions (what people say they want) and interests (why they want it)?","options":["Multi-Causal Role Model","The Harvard Approach","Conflict Transformation approach","Human Needs Theory"],"answer_index":1,"explanation":"It argues conflicts can be resolved by focusing on interests and jointly accepted criteria."},{"id":"S5-072","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"Which approach argues that conflicts are caused by unsatisfied basic 'universal' human needs?","options":["Human Needs Theory","Conflict Transformation","The Harvard Approach","Glasl's Escalation Model"],"answer_index":0,"explanation":"The needs should be analyzed, communicated and satisfied for the conflict to be resolved."},{"id":"S5-073","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"Which approach views conflicts as destructive or constructive interactions depending on how they are dealt with, and seeks to empower actors?","options":["Needs-Fears Mapping","Conflict Transformation","Harvard Approach","Human Needs Theory"],"answer_index":1,"explanation":"It emphasizes perceptions and the social and cultural context in which reality is constructed."},{"id":"S5-074","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"How does the tip sheet define a conflict?","options":["A legal dispute between parties that reaches a court","A difference in personality types within a team","Any disagreement between two people about any topic","An incompatible interaction between at least two actors, where one experiences damage and the other causes it intentionally or ignores it"],"answer_index":3,"explanation":"This definition is part of the key messages."},{"id":"S5-075","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"What does the tip sheet say about the objectivity of conflict analysis?","options":["It produces a fully objective picture of the conflict if done carefully","It is only valid when it is carried out by neutral outsiders","It removes the influence of world-views from the analysis","It does not lead to an objective understanding; it makes subjective perceptions transparent"],"answer_index":3,"explanation":"Making perceptions transparent allows them to be reflected on and communicated."},{"id":"S5-076","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"Why should any intervention in a conflict focus on supporting creative, positive energies?","options":["Because interventions from outside never really affect conflicts","Because only third parties are allowed to intervene in conflicts","Because conflicts are dynamic systems and any intervention becomes part of the system","Because negative energy in a conflict cannot be measured"],"answer_index":2,"explanation":"Conflict analysis supports orientation for future action."},{"id":"S5-077","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 2","question":"According to the tip sheet, where is a conflict often enacted?","options":["Always at exactly the same place where it was originally caused by the parties","At a system's weakest point, not necessarily where it is caused","Only at the top of the organizational hierarchy","Only in the larger super-system surrounding it"],"answer_index":1,"explanation":"That is why system boundaries must be considered and periodically revised."},{"id":"S5-078","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 2","question":"Which tool is described as a 'meta' tool that organizes the other conflict analysis tools?","options":["Needs-Fears Mapping","Glasl's Escalation Model","The Conflict Wheel","The Conflict Tree"],"answer_index":2,"explanation":"It introduces six dimensions and gives a first overview."},{"id":"S5-079","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 3","question":"Which of the following is NOT one of the six dimensions of the Conflict Wheel?","options":["Actors/relations","Budgets","Dynamics","Causation"],"answer_index":1,"explanation":"The six: actors/relations, issues, dynamics, context/structures, causation, options/strategies."},{"id":"S5-080","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 3","question":"In the Conflict Wheel, people who have an interest in the conflict or its outcome but are not directly involved are called:","options":["Catalysts","Third parties","Conflict parties","Stakeholders"],"answer_index":3,"explanation":"Directly involved = conflict parties; those transforming the conflict = third parties."},{"id":"S5-081","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 3","question":"What does the term 'structural violence' refer to in the tip sheet?","options":["Coercive pressure used by mediators to force agreement","Damage to buildings and infrastructure during conflict","Violence not directly caused by people but by economic and political systems, e.g., causing poverty","Physical violence directly between two individuals"],"answer_index":2,"explanation":"It belongs to the context/structures dimension."},{"id":"S5-082","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 3","question":"What does the Conflict Wheel say about causation?","options":["Conflicts are never mono-causal; multiple systemic factors interact","Only economic causes need to be considered","Every conflict can be traced back to exactly one identifiable root cause","Causes are irrelevant once the issues are identified"],"answer_index":0,"explanation":"It is helpful to differentiate between different causes or influence factors."},{"id":"S5-083","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 4","question":"In the Conflict Tree, what do the ROOTS symbolize?","options":["Dynamic factors like escalation level","Third-party interventions","Manifest issues the parties talk about","Structural, 'static' root causes"],"answer_index":3,"explanation":"Roots = structural factors; trunk = manifest issues; leaves/branches = dynamic factors."},{"id":"S5-084","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 4","question":"In the Conflict Tree, the trunk represents:","options":["The manifest issues linking structural and dynamic factors","The structural, static root causes","The current escalation level and intensity of the parties' interaction","The third parties and mediators involved"],"answer_index":0,"explanation":"Issues are what the parties want to talk about — the 'topic' of the conflict."},{"id":"S5-085","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 4","question":"Why does the tip sheet say 'quick money is often more important than big money' for dynamic factors?","options":["Because donors generally prefer small projects","Because root causes are cheap and quick to fix","Because dynamic factors almost never change","Because dynamic factors have a short time horizon and react quickly and sometimes unpredictably"],"answer_index":3,"explanation":"Structural factors, by contrast, are difficult to influence in the short term."},{"id":"S5-086","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 4","question":"What happens if structural root causes are avoided, according to the tip sheet?","options":["Escalation automatically reverses","Dynamic factors disappear","The conflict is permanently solved for both parties","The conflict may pop up again later"],"answer_index":3,"explanation":"Root causes are the typical area for long-term development cooperation."},{"id":"S5-087","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 5","question":"Which tool focuses on actors and their interrelationships, representing power by circle size, and is a good tool to start analyzing a conflict?","options":["Conflict Mapping","Glasl's Escalation Model","Conflict Tree","Multi-Causal Role Model"],"answer_index":0,"explanation":"A conflict map is like a photograph: a specific viewpoint at a specific moment."},{"id":"S5-088","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 5","question":"When drawing a conflict map, what does the tip sheet remind you to include?","options":["Yourself as an actor if you or your organization is involved, plus a title and date","Only the two most powerful actors, to keep the map simple","Only the third parties, since conflict parties are already known","Every actor in the country, however distant from the conflict"],"answer_index":0,"explanation":"Third parties are shown as semi-circles; issues in square boxes."},{"id":"S5-089","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 6","question":"In Glasl's escalation model, what is the FIRST level of escalation?","options":["Actions, not words","Debate, polemics","Loss of face","Hardening"],"answer_index":3,"explanation":"Positions harden but parties still believe the conflict can be solved by discussion."},{"id":"S5-090","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 6","question":"In Glasl's model, a public and direct attack on the opponent's moral integrity is which level?","options":["Strategies of threats (level 6)","Loss of face (level 5)","Debate, polemics (level 2)","Images, coalitions (level 4)"],"answer_index":1,"explanation":"Loss of face is described as a major escalation step."},{"id":"S5-091","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 6","question":"In Glasl's model, at which level do parties say 'Speaking will not help anymore' and present the opponent with a fait accompli?","options":["Fragmentation (level 8)","Images, coalitions (level 4)","Actions, not words (level 3)","Hardening (level 1)"],"answer_index":2,"explanation":"Empathy is lost and there's a danger of false interpretation."},{"id":"S5-092","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 6","question":"What is the final (ninth) level of Glasl's escalation model?","options":["Fragmentation of the enemy","Together into the abyss","Strategies of threats","Limited destructive blows"],"answer_index":1,"explanation":"Destruction of oneself is accepted as the price of destroying the opponent."},{"id":"S5-093","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 7","question":"According to Glasl's model, as escalation increases, what happens to third-party intervention?","options":["It should always remain facilitative mediation at every level","It must become more forceful because the parties' self-help potential decreases","It becomes less necessary because the parties exhaust themselves","It should be replaced by self-help as the parties learn"],"answer_index":1,"explanation":"Interventions range from self-help/moderation to arbitration and power intervention."},{"id":"S5-094","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 7","question":"Which form of intervention corresponds to the HIGHEST escalation levels in Glasl's model?","options":["Power intervention","Self-help and moderation","Process accompaniment","Facilitative mediation"],"answer_index":0,"explanation":"At high levels parties often must be forced to accept intervention."},{"id":"S5-095","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 8","question":"In Inmedio's Conflict Perspective Analysis (CPA), what should the 'Facts' phase contain?","options":["The facilitator's personal opinion about who is right","Only observable facts that could be recorded on video, free of interpretations","Brainstormed options for possible solutions and next steps","Hypotheses about the parties' hidden motivations and fears"],"answer_index":1,"explanation":"Direct quotations ('O-sounds') are written on separate cards."},{"id":"S5-096","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 8","question":"In CPA's 'Background interests and motivations' phase, how should outsider colleagues express each party's view?","options":["Judge which of the parties is right and explain why","List only the verifiable facts without any feelings","Propose the final solution on behalf of both of the conflict parties","Step into their shoes and begin with 'I, conflict party A, feel…'"],"answer_index":3,"explanation":"This phase is hypothetical and requires empathy; there are often 'good' motivations for 'bad' behavior."},{"id":"S5-097","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 8","question":"In CPA, when is brainstorming on options appropriate?","options":["At the very beginning of the process, before any facts are collected","Before the actors involved have been identified","Only after the parties' motivations have become plausible","Only after a court or arbitrator has made a ruling"],"answer_index":2,"explanation":"Brainstorming rules: all ideas are good, no corrections, no editing, no comments."},{"id":"S5-098","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 2","question":"What limitation does the tip sheet note about CPA?","options":["It cannot be used at all without a professional, certified mediator","It ignores the parties' perspectives","It only applies to international conflicts","It does not look explicitly at structures or context"],"answer_index":3,"explanation":"CPA focuses on perspectives of the parties and follows the phases of mediation."},{"id":"S5-099","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 10","question":"Which columns does the Needs-Fears Mapping table use for each actor?","options":["Facts, quotes, dates, places, witnesses and evidence","Revenue, cost, profit, risk, return","Roots, trunk, branches, leaves, birds","Issues, interests/needs, fears, means, options"],"answer_index":3,"explanation":"In the irrigation example, farmers and pastoralists differ in fears and means."},{"id":"S5-100","type":"reading","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Conflict Analysis Tools","source":"Reading - Conflict Analysis Tools.pdf, p. 11","question":"In the Multi-Causal Role Model, what are 'triggers'?","options":["Root causes that the parties perceive as historical problems","Factors that initiate a new level of conflict and are hard to identify in advance","Lines of political, social or economic cleavage that group people and form identity","The positions and aims the parties say they are fighting about"],"answer_index":1,"explanation":"Reasons = root causes; targets = aims/positions; channels = group-identity cleavages; catalysts = affect rate, intensity and duration."}];
/* Documents (lecture decks and readings) in display order: lectures first, then readings, by week. */
const DOCS = [];
QUESTIONS.forEach(q => { if (!DOCS.some(d => d.doc === q.doc)) DOCS.push({ doc: q.doc, type: q.type, week: q.week, topic: q.topic }); });
DOCS.sort((a, b) => (a.type === b.type ? 0 : a.type === "lecture" ? -1 : 1) || a.week - b.week);
const STORE_KEY = "ie404-midterm-progress-v1";
const LETTERS = ["A", "B", "C", "D"];

/* ---------- storage (wrapped: may be unavailable) ---------- */
function loadProgress() {
  try { const raw = localStorage.getItem(STORE_KEY); const p = raw ? JSON.parse(raw) : null; if (p && p.stats) return p; } catch (e) {}
  return { stats: {} };
}
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} }
let progress = loadProgress();

function record(q, chosen) {
  const s = progress.stats[q.id] || { a: 0, c: 0, last: null };
  s.a += 1;
  const ok = chosen === q.answer_index;
  if (ok) s.c += 1;
  s.last = ok;
  progress.stats[q.id] = s;
}
const wrongIds = () => Object.keys(progress.stats).filter(id => progress.stats[id].last === false);

/* ---------- helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(n, d) { return d ? Math.round(100 * n / d) : 0; }
function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, "0")}`; }
const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const TYPE_LABEL = { lecture: "Lecture slides", reading: "Reading" };
const qLabel = q => `${q.type === "lecture" ? "Lecture" : "Reading"} · W${q.week} · ${q.doc}`;
const docsOf = type => DOCS.filter(d => d.type === type);
const poolOf = scope => scope === "all" ? QUESTIONS : QUESTIONS.filter(q => q.type === scope);

/* Weighted draw: each document contributes in proportion to its share of the pool (largest-remainder). */
function drawExam(n, pool) {
  if (n >= pool.length) return shuffle(pool);
  const groups = DOCS.map(d => pool.filter(q => q.doc === d.doc)).filter(g => g.length);
  const exact = groups.map(g => n * g.length / pool.length);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a, b) => a + b, 0);
  exact.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => take[i]++);
  return shuffle(groups.flatMap((g, i) => shuffle(g).slice(0, take[i])));
}

function startSession(opts) {
  stopTimer();
  session = { mode: opts.mode, title: opts.title, items: opts.items, idx: 0, answers: {}, start: Date.now(),
              limit: opts.limit || null, finished: false };
  if (session.limit) {
    timerHandle = setInterval(() => {
      const t = $("#timer");
      const rem = session.limit - (Date.now() - session.start) / 1000;
      if (t) { t.textContent = fmtTime(rem); t.classList.toggle("low", rem < 60); }
      if (rem <= 0) finishSession(true);
    }, 500);
  }
  renderQuiz();
}

/* ---------- home ---------- */
function statLine(qs) {
  const st = qs.map(q => progress.stats[q.id]).filter(Boolean);
  const a = st.reduce((x, y) => x + y.a, 0), c = st.reduce((x, y) => x + y.c, 0);
  return { seen: st.length, text: `${st.length}/${qs.length} seen${a ? ` · ${pct(c, a)}% correct` : ""}` };
}
function docCard(d) {
  const qs = QUESTIONS.filter(q => q.doc === d.doc);
  const s = statLine(qs);
  return `<button class="card sec-card ${d.type}" data-doc="${DOCS.indexOf(d)}">
      <span class="num">Week ${d.week} · ${qs.length} questions</span>
      <span class="name">${esc(d.doc)}</span>
      <span class="small muted">${s.text}</span>
      <span class="bar"><span style="width:${pct(s.seen, qs.length)}%"></span></span>
    </button>`;
}
function groupBlock(type, intro) {
  const pool = poolOf(type);
  return `<section class="group ${type}">
      <div class="row spread group-head">
        <div><h2 style="margin:0">${TYPE_LABEL[type] === "Reading" ? "Readings" : TYPE_LABEL[type]}</h2>
          <div class="small muted">${intro} · ${pool.length} questions · ${statLine(pool).text}</div></div>
        <button data-all="${type}">Practice all ${pool.length}</button>
      </div>
      <div class="grid">${docsOf(type).map(docCard).join("")}</div>
    </section>`;
}
function renderHome() {
  stopTimer(); session = null;
  const seen = Object.keys(progress.stats).filter(id => byId[id]).length;
  const wrong = wrongIds().filter(id => byId[id]).length;
  const pool = poolOf(examCfg.scope);
  const counts = [50, 100].filter(n => n < pool.length).concat([pool.length]);
  if (!counts.includes(examCfg.count)) examCfg.count = counts[0];
  $("#app").innerHTML = `
    <header class="top">
      <div><h1>IE404 Midterm Practice</h1><div class="muted small">Management for Engineers · ${QUESTIONS.length} questions · lecture slides and reading assignments kept separate</div></div>
      <div class="small muted">${seen}/${QUESTIONS.length} seen</div>
    </header>
    <div class="stack">
      ${groupBlock("lecture", "Questions from the instructor's slides")}
      ${groupBlock("reading", "Questions from the weekly reading assignments")}
      <div class="small muted">Practice mode: random order, answer and explanation right after each question.</div>
      <section class="card stack">
        <h2>Full exam</h2>
        <div class="small muted">Random questions drawn in proportion to each document's share. Answers are shown at the end.</div>
        <div class="row">
          <span class="small muted" style="min-width:74px">Content</span>
          <div class="seg" role="group" aria-label="Exam content">
            ${[["all", "Slides + readings"], ["lecture", "Slides only"], ["reading", "Readings only"]].map(([k, l]) => `<button data-scope="${k}" aria-pressed="${examCfg.scope === k}">${l}</button>`).join("")}
          </div>
        </div>
        <div class="row">
          <span class="small muted" style="min-width:74px">Questions</span>
          <div class="seg" role="group" aria-label="Number of questions">
            ${counts.map(n => `<button data-count="${n}" aria-pressed="${examCfg.count === n}">${n === pool.length ? `All ${n}` : n}</button>`).join("")}
          </div>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="useTimer" ${examCfg.timer ? "checked" : ""}> Timer</label>
          <input type="number" id="minutes" min="1" max="900" value="${examCfg.minutes}" ${examCfg.timer ? "" : "disabled"} aria-label="Minutes"> <span class="small muted">minutes</span>
        </div>
        <div><button class="primary" id="startExam">Start exam</button></div>
      </section>
      <section class="card row spread">
        <div><h2 style="margin:0">My mistakes</h2><div class="small muted">${wrong ? `${wrong} question${wrong > 1 ? "s" : ""} you last answered wrong. Answer correctly to clear them.` : "No open mistakes yet."}</div></div>
        <button class="primary" id="startWrong" ${wrong ? "" : "disabled"}>Practice mistakes${wrong ? ` (${wrong})` : ""}</button>
      </section>
      <div class="row spread small muted">
        <span>Keys: 1–4 or A–D to answer · Enter for next · ← previous (exam)</span>
        <button class="link" id="reset">Reset progress</button>
      </div>
    </div>`;
  document.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => {
    const d = DOCS[+b.dataset.doc];
    startSession({ mode: "practice", title: `${TYPE_LABEL[d.type]} · ${d.doc}`, items: shuffle(QUESTIONS.filter(q => q.doc === d.doc)) });
  });
  document.querySelectorAll("[data-all]").forEach(b => b.onclick = () => {
    const t = b.dataset.all;
    startSession({ mode: "practice", title: t === "lecture" ? "All lecture-slide questions" : "All reading questions", items: shuffle(poolOf(t)) });
  });
  const setMinutes = () => { examCfg.minutes = Math.max(1, Math.round(examCfg.count * 1.2)); };
  document.querySelectorAll("[data-scope]").forEach(b => b.onclick = () => {
    examCfg.scope = b.dataset.scope;
    const p = poolOf(examCfg.scope).length;
    if (examCfg.count > p) examCfg.count = p;
    setMinutes(); renderHome();
  });
  document.querySelectorAll("[data-count]").forEach(b => b.onclick = () => { examCfg.count = +b.dataset.count; setMinutes(); renderHome(); });
  $("#useTimer").onchange = e => { examCfg.timer = e.target.checked; $("#minutes").disabled = !examCfg.timer; };
  $("#minutes").onchange = e => { examCfg.minutes = Math.max(1, Math.min(900, +e.target.value || 1)); e.target.value = examCfg.minutes; };
  $("#startExam").onclick = () => {
    const scopeName = { all: "slides + readings", lecture: "slides only", reading: "readings only" }[examCfg.scope];
    startSession({ mode: "exam", title: `Full exam · ${examCfg.count} questions · ${scopeName}`,
      items: drawExam(examCfg.count, poolOf(examCfg.scope)), limit: examCfg.timer ? examCfg.minutes * 60 : null });
  };
  $("#startWrong").onclick = () => startSession({ mode: "practice", title: "My mistakes",
    items: shuffle(wrongIds().map(id => byId[id]).filter(Boolean)) });
  $("#reset").onclick = () => { if (confirm("Reset all saved progress and mistakes?")) { progress = { stats: {} }; saveProgress(); renderHome(); } };
}

/* ---------- quiz ---------- */
function renderQuiz() {
  const s = session, q = s.items[s.idx], n = s.items.length;
  const chosen = s.answers[q.id];
  const answered = chosen !== undefined;
  const reveal = s.mode === "practice" && answered;
  const opts = q.options.map((o, i) => {
    let cls = "opt";
    if (reveal) { if (i === q.answer_index) cls += " correct"; else if (i === chosen) cls += " wrong"; }
    else if (i === chosen) cls += " selected";
    return `<button class="${cls}" data-opt="${i}" ${reveal ? "disabled" : ""}><span class="key">${LETTERS[i]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const ok = chosen === q.answer_index;
  const feedback = reveal ? `<div class="feedback ${ok ? "ok" : "bad"}" role="status">
      <strong>${ok ? "Correct" : `Incorrect — the answer is ${LETTERS[q.answer_index]}`}</strong>${esc(q.explanation)}
      <div class="source">Source: ${esc(q.source)}</div></div>` : "";
  const isLast = s.idx === n - 1;
  let nav;
  if (s.mode === "practice") {
    nav = `<button class="link" id="quit">End session</button>
           <button class="primary" id="next" ${answered ? "" : "disabled"}>${isLast ? "See results" : "Next"}</button>`;
  } else {
    nav = `<div class="row"><button id="prev" ${s.idx ? "" : "disabled"}>Previous</button>
           <button id="next" ${isLast ? "disabled" : ""}>Next</button></div>
           <button class="primary" id="finish">Finish exam</button>`;
  }
  const doneCount = Object.keys(s.answers).length;
  const palette = s.mode === "exam" && n <= 100 ? `<div class="palette" aria-label="Jump to question">${s.items.map((it, i) =>
      `<button data-jump="${i}" class="${s.answers[it.id] !== undefined ? "done" : ""} ${i === s.idx ? "cur" : ""}">${i + 1}</button>`).join("")}</div>` : "";
  const remaining = s.limit ? s.limit - (Date.now() - s.start) / 1000 : 0;
  $("#app").innerHTML = `
    <header class="top">
      <div><h1 style="font-size:1.15rem">${esc(s.title)}</h1>
        <div class="small muted">Question ${s.idx + 1} of ${n} · ${doneCount} answered${s.mode === "exam" ? " · answers revealed at the end" : ""}</div></div>
      <div class="row">${s.limit ? `<span class="timer ${remaining < 60 ? "low" : ""}" id="timer">${fmtTime(remaining)}</span>` : ""}
        <button class="link" id="home">Home</button></div>
    </header>
    <div class="bar" style="margin-bottom:14px"><span style="width:${pct(s.mode === "exam" ? doneCount : s.idx + (answered ? 1 : 0), n)}%"></span></div>
    <article class="card">
      <div class="qhead"><span class="pill ${q.type}">${esc(qLabel(q))}</span><span class="small muted">${q.id}</span></div>
      <div class="question">${esc(q.question)}</div>
      <div class="opts">${opts}</div>
      ${feedback}
      <div class="nav">${nav}</div>
      ${palette}
      <div class="hint">1–4 / A–D to answer · Enter: ${s.mode === "practice" ? "next question" : "next"}${s.mode === "exam" ? " · ←: previous" : ""}</div>
    </article>`;
  document.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => choose(+b.dataset.opt));
  document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { s.idx = +b.dataset.jump; renderQuiz(); });
  $("#home").onclick = () => { if (s.mode === "practice" || confirm("Leave the exam? Your answers will be lost.")) renderHome(); };
  if (s.mode === "practice") {
    $("#quit").onclick = () => finishSession(false);
    $("#next").onclick = next;
  } else {
    $("#prev").onclick = prev;
    $("#next").onclick = next;
    $("#finish").onclick = () => {
      const left = n - Object.keys(s.answers).length;
      if (!left || confirm(`${left} question${left > 1 ? "s are" : " is"} unanswered. Finish anyway?`)) finishSession(false);
    };
  }
}

function choose(i) {
  const s = session; if (!s || s.finished) return;
  const q = s.items[s.idx];
  if (s.mode === "practice") {
    if (s.answers[q.id] !== undefined) return;
    s.answers[q.id] = i; record(q, i); saveProgress();
  } else {
    s.answers[q.id] = i;
  }
  renderQuiz();
  if (s.mode === "practice") { const nb = $("#next"); if (nb) nb.focus({ preventScroll: true }); }
}
function next() {
  const s = session; if (!s || s.finished) return;
  const q = s.items[s.idx];
  if (s.mode === "practice") {
    if (s.answers[q.id] === undefined) return;
    if (s.idx === s.items.length - 1) return finishSession(false);
  } else if (s.idx === s.items.length - 1) return;
  s.idx++; renderQuiz(); window.scrollTo({ top: 0 });
}
function prev() { const s = session; if (s && s.mode === "exam" && s.idx > 0) { s.idx--; renderQuiz(); } }

/* ---------- results ---------- */
function finishSession(timedOut) {
  const s = session; if (!s || s.finished) return;
  s.finished = true; stopTimer();
  const elapsed = (Date.now() - s.start) / 1000;
  if (s.mode === "exam") { s.items.forEach(q => { if (s.answers[q.id] !== undefined) record(q, s.answers[q.id]); }); saveProgress(); }
  // In practice mode only answered questions count; in exam mode every drawn question counts.
  const pool = s.mode === "exam" ? s.items : s.items.filter(q => s.answers[q.id] !== undefined);
  const correct = pool.filter(q => s.answers[q.id] === q.answer_index);
  const missed = pool.filter(q => s.answers[q.id] !== q.answer_index);
  const rows = DOCS.map(d => {
    const p = pool.filter(q => q.doc === d.doc); if (!p.length) return "";
    const c = p.filter(q => s.answers[q.id] === q.answer_index).length;
    return `<tr><td>${d.type === "lecture" ? "Lecture" : "Reading"} · W${d.week} · ${esc(d.doc)}</td><td class="num">${c}/${p.length}</td>
      <td style="width:30%"><div class="bar ok"><span style="width:${pct(c, p.length)}%"></span></div></td><td class="num">${pct(c, p.length)}%</td></tr>`;
  }).join("");
  const review = missed.map((q, k) => {
    const ch = s.answers[q.id];
    return `<div class="review-item">
      <div class="small muted">${k + 1}. ${q.id} · ${esc(qLabel(q))}</div>
      <div style="font-weight:600;margin:4px 0 6px">${esc(q.question)}</div>
      <div class="ans bad">Your answer: ${ch === undefined ? "— (not answered)" : `${LETTERS[ch]}. ${esc(q.options[ch])}`}</div>
      <div class="ans ok">Correct: ${LETTERS[q.answer_index]}. ${esc(q.options[q.answer_index])}</div>
      <div class="small" style="margin-top:6px">${esc(q.explanation)}</div>
      <div class="source">Source: ${esc(q.source)}</div></div>`;
  }).join("");
  $("#app").innerHTML = `
    <header class="top"><div><h1 style="font-size:1.15rem">${esc(s.title)} — results</h1>
      <div class="small muted">${timedOut ? "Time is up. " : ""}Time used: ${fmtTime(elapsed)}</div></div>
      <button class="link" id="home">Home</button></header>
    <div class="stack">
      <section class="card row spread">
        <div><div class="big-score">${pct(correct.length, pool.length)}%</div>
          <div class="muted">${correct.length} of ${pool.length} correct${s.mode === "exam" && missed.some(q => s.answers[q.id] === undefined) ? ` · ${missed.filter(q => s.answers[q.id] === undefined).length} unanswered` : ""}</div></div>
        <div class="row">
          ${missed.length ? `<button class="primary" id="retry">Practice these ${missed.length} again</button>` : ""}
          <button id="home2">Back to home</button>
        </div>
      </section>
      ${pool.length ? `<section class="card"><h2>By document</h2><table><thead><tr><th>Document</th><th class="num">Score</th><th></th><th class="num">%</th></tr></thead><tbody>${rows}</tbody></table></section>` : ""}
      <section class="card stack"><h2>${missed.length ? `Review: ${missed.length} missed question${missed.length > 1 ? "s" : ""}` : pool.length ? "No mistakes — well done." : "No questions answered."}</h2>${review}</section>
    </div>`;
  $("#home").onclick = renderHome; $("#home2").onclick = renderHome;
  const r = $("#retry"); if (r) r.onclick = () => startSession({ mode: "practice", title: "Retry missed questions", items: shuffle(missed) });
  window.scrollTo({ top: 0 });
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (!session || session.finished || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
  if (k in map) { e.preventDefault(); choose(map[k]); }
  else if (k === "enter") { e.preventDefault(); next(); }
  else if (k === "arrowright" && session.mode === "exam") { e.preventDefault(); next(); }
  else if (k === "arrowleft") { e.preventDefault(); prev(); }
});

renderHome();
</script>
</body>
</html>
