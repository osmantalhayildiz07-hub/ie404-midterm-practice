ns":["When you need time to think and gather information","When the conflict is likely to resolve itself soon","When the issue is trivial and simply not worth the considerable time and effort","When the issue is important or the conflict will grow worse without attention"],"answer_index":3,"explanation":"Avoiding is useful only for trivial or self-resolving issues, or to buy time."},{"id":"S5-038","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 41","question":"Gülay thinks color B is slightly better but lets Kerim choose color A to avoid arguing. Which style is this?","options":["Accommodating","Collaborating","Avoiding","Compromising"],"answer_index":0,"explanation":"Accommodating fits when the issue is more important to the other person."},{"id":"S5-039","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 41","question":"When is accommodating appropriate?","options":["When maintaining the relationship is more important than winning","When the other party is taking advantage","When many stakeholders' needs must be integrated into one solution","When the decision is urgent and unpopular"],"answer_index":0,"explanation":"It is not appropriate when it won't permanently solve the problem."},{"id":"S5-040","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 42","question":"Rasim wants a full-time social media hire; Ceylan wants more digital ads. They hire a part-time person and spend the rest on ads. Which style is this?","options":["Competing","Collaborating","Compromising","Accommodating"],"answer_index":2,"explanation":"Each side gives up something; both are partially satisfied."},{"id":"S5-041","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 42","question":"When is compromising NOT appropriate, according to the lecture?","options":["When power among the parties is equal","When resolving the conflict matters more than each side winning","When a decision is needed sooner rather than later","When one person holds more power than the other"],"answer_index":3,"explanation":"Compromising also fails when a variety of important needs must be met or the situation is extremely urgent."},{"id":"S5-042","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 42","question":"Why might compromising be used as a first step between parties?","options":["When the parties don't know each other well or haven't developed mutual trust","When one party has full authority over the decision","When the issue is trivial to everyone involved","When trust between the parties is already very high"],"answer_index":0,"explanation":"It can provide temporary settlements on complex issues."},{"id":"S5-043","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 43","question":"Tarık and Jale discuss each feature, why it matters, and agree on a mix including new features they discovered. Which style is this?","options":["Collaborating","Compromising","Competing","Accommodating"],"answer_index":0,"explanation":"Collaborating seeks a win-win solution meeting everyone's needs."},{"id":"S5-044","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 43","question":"When is collaborating NOT appropriate?","options":["When an important decision needs to be made","When previous attempts at resolving the conflict have already failed","When many people across teams are involved","When a decision must be made urgently or the matter is trivial"],"answer_index":3,"explanation":"Collaboration takes time, so it fits non-urgent, important, multi-party issues."},{"id":"S5-045","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 44","question":"Which of the following is listed as a way to become more adept at collaborating?","options":["View the other party as a partner","Focus only on your own goals","Hold your position firmly until they give in","Avoid asking questions to save time"],"answer_index":0,"explanation":"Others: articulate your goal and listen, look at the big picture, stay calm, ask questions, put yourself in their shoes."},{"id":"S5-046","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 46","question":"In the Yalım and Levent case, scheduling a meeting where Levent and the coworkers discuss their working relationship is which style?","options":["Avoiding","Accommodating, smoothing","Compromising","Collaborating, integrating"],"answer_index":3,"explanation":"Both parties talk about the relationship to promote more effective interaction."},{"id":"S5-047","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 46","question":"In the Yalım and Levent case, Yalım telling coworkers they are unfair to Levent because he is new is which style?","options":["Compromising","Accommodating","Competing","Collaborating"],"answer_index":2,"explanation":"Yalım sticks to Levent's side and pushes his own view."},{"id":"S5-048","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 48","question":"According to the lecture, in which of the five conflict-resolution strategies will there be negotiation?","options":["Only in compromising","In all five strategies","Only in competing","Only in collaborating and compromising"],"answer_index":1,"explanation":"'In all 5 strategies of conflict resolution there will be negotiation.'"},{"id":"S5-049","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 53","question":"What does BATNA stand for?","options":["Basic Agreement Toward Negotiated Arbitration","Best Alternative To a Negotiated Agreement","Bargaining Alternative To No Agreement","Best Approach To Negotiating Assertively"],"answer_index":1,"explanation":"BATNA determines the point at which a negotiator is prepared to walk away."},{"id":"S5-050","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 53","question":"How should a negotiator use their BATNA?","options":["Reveal it at the very start of the negotiation so as to build trust quickly","Ignore it once the negotiation has formally begun","Accept any terms superior to the BATNA and reject outcomes worse than it","Accept any offer rather than walking away from the table"],"answer_index":2,"explanation":"BATNA is the reference point for walking away."},{"id":"S5-051","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 53","question":"What is WATNA?","options":["The best offer received from the other side during the negotiation","The average of both parties' initial positions","The opening position announced by the other party","The worst result a party would ultimately achieve if it called off negotiations"],"answer_index":3,"explanation":"WATNA = Worst Alternative To a Negotiated Agreement."},{"id":"S5-052","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 54","question":"A person negotiating for a used car at a car yard could instead buy directly from private owners online. What is this option?","options":["Bottom line","WATNA","BATNA","Concession"],"answer_index":2,"explanation":"Their WATNA is to keep driving the faulty car until it breaks down."},{"id":"S5-053","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 55","question":"How does the lecture distinguish negotiation from bargaining?","options":["They are identical terms for the same win-lose process","Negotiation is only about price; bargaining is about relationships","Bargaining is only about price and winning; negotiation is a communication and problem-solving process aiming at win-win","Bargaining always produces win-win outcomes for both sides"],"answer_index":2,"explanation":"'Do not mix' negotiation and bargaining."},{"id":"S5-054","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 56","question":"In the lecture's model of negotiation, what happens if the answer to 'Negotiate?' is No?","options":["Use the auction tactic","Proceed directly to documenting an agreement","Turn to the BATNA / Plan B","Choose a negotiation team"],"answer_index":2,"explanation":"Negotiation may not be the only way."},{"id":"S5-055","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 56","question":"In the negotiation model, which items belong to the 'Preparation' stage?","options":["Walking away from the table and trying again later","Signing the contract, documenting the deal and celebrating","Research, goals, positions, interests, fallbacks, concessions, territory, power, time, publics, packaging, stress","Choosing tactics such as flinch, nibble and bogey only"],"answer_index":2,"explanation":"Preparation precedes choosing people (individual/team) and tools."},{"id":"S5-056","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 57","question":"According to the lecture, what is the essence of all good negotiation, and of good preparation?","options":["Negotiation's essence is power; preparation's essence is threats","Negotiation's essence is luck; preparation's essence is timing","Negotiation's essence is speed; preparation's essence is intuition and instinct","Negotiation's essence is preparation; preparation's essence is research"],"answer_index":3,"explanation":"Research the other side's financial health, industry position and people."},{"id":"S5-057","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 59","question":"The 'irreducible minimum point beyond which a negotiator will not or cannot go' is called the:","options":["Bottom line / resistance point","Opening offer or anchor","Packaging of the deal","BATNA (best alternative to agreement)"],"answer_index":0,"explanation":"Negotiators often conceal it, though announcing it can sometimes be tactical."},{"id":"S5-058","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 60","question":"According to the lecture, what is the worst-case situation when trading concessions?","options":["Asking for something in return for every concession you make","Trading something expensive or valuable for you that the other side doesn't value","Refusing to make any concessions at all during the talks","Trading something cheap for you in return for something the other side values highly"],"answer_index":1,"explanation":"Concessions are perceived differently by each side."},{"id":"S5-059","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 62","question":"Which is listed as an advantage of negotiating at THEIR place?","options":["You have familiarity with and full control of the environment and timing","It is easier to walk out and to use the limited-authority tactic","You have easy access to your own experts and resources","You can do other work whenever you are not at the table"],"answer_index":1,"explanation":"Disadvantages include unfamiliarity, higher stress, distance from advisers and travel cost."},{"id":"S5-060","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 62","question":"When might a neutral 'another place' be the only alternative for a negotiation?","options":["When the parties want to save on costs","When hostility between the parties is high","When resources are needed nearby","When one party wants control of the environment"],"answer_index":1,"explanation":"A neutral place gives neither side special advantages."},{"id":"S5-061","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 63","question":"To uncover common interests during negotiation, what does the lecture advise?","options":["Avoid asking questions so that you don't reveal your own interests","Speed up the pace to put pressure on the other side","Shout out your opening positions clearly and early","Slow down the pace and use listening, questioning and feedback"],"answer_index":3,"explanation":"Impatience or shouting positions means little real negotiation takes place."},{"id":"S5-062","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 65","question":"Offering free goods and services as incentives to close a deal is an example of which preparation element?","options":["Packaging","Place","Stress","Publics"],"answer_index":0,"explanation":"Look beyond raw price at the When, How and Who of the deal."},{"id":"S5-063","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 70","question":"Demanding small, previously undiscussed concessions just before closing the deal is which tactic?","options":["Nibble","Snow job","Flinch","Bogey"],"answer_index":0,"explanation":"Nibbling is also called the salami tactic or quivering quill."},{"id":"S5-064","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 70","question":"Overwhelming the other party with so much information that they can't tell what matters is which tactic?","options":["Deadlines","Snow job","Chicken","Mirroring"],"answer_index":1,"explanation":"The snow job buries important information among diversions."},{"id":"S5-065","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 70","question":"Proposing extreme measures, often bluffs, to force the other party to back down is which tactic?","options":["Bogey","Chicken","Nibble","Calling a higher authority"],"answer_index":1,"explanation":"In 'chicken', negotiators hope the other side will 'chicken out'."},{"id":"S5-066","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 72","question":"Pretending that an unimportant issue is very important so it can later be traded for a major concession is which tactic?","options":["Brinkmanship","Mirroring","Bogey","Snow job"],"answer_index":2,"explanation":"The bogey creates a fake bargaining chip."},{"id":"S5-067","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 71","question":"Aggressively pursuing terms until the other party must either agree or walk away is which tactic?","options":["Flinch","Auction","Deadlines","Brinkmanship"],"answer_index":3,"explanation":"Brinkmanship pushes the other party to the 'brink' of what it will accept."},{"id":"S5-068","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 76","question":"How does the lecture recommend dealing with difficult negotiators showing RED behaviors such as intimidation and threats?","options":["Respond with equally aggressive behavior so they respect you","Give in quickly to end the stress and save the relationship","Don't react to their behavior; focus on the outcome and the merits, using 'If… then' (PURPLE) conditional offers","Walk out at the first sign of intimidation and end the talks"],"answer_index":2,"explanation":"They behave this way because the other party often backs down — don't let them get to you."},{"id":"S5-069","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 77","question":"According to the lecture, what determines how effectively a chosen conflict response is carried out?","options":["Analysis","Strategy","Seniority","Skills"],"answer_index":3,"explanation":"Analysis identifies the conflict, strategy selects the response, skills determine execution."},{"id":"S5-070","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 79","question":"What is the lecture's final take-away about conflict-resolution styles?","options":["There is no right or wrong style; each has its time and place","Collaborating is always the best style to use","Competing should be avoided in every situation, including emergencies","Avoiding is the safest style for most managers"],"answer_index":0,"explanation":"Treating employees with respect and empathy is always the first step."},{"id":"S5-071","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"Which conflict-analysis approach emphasizes the difference between positions (what people say they want) and interests (why they want it)?","options":["Conflict Transformation approach","The Harvard Approach","Human Needs Theory","Multi-Causal Role Model"],"answer_index":1,"explanation":"It argues conflicts can be resolved by focusing on interests and jointly accepted criteria."},{"id":"S5-072","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"Which approach argues that conflicts are caused by unsatisfied basic 'universal' human needs?","options":["Conflict Transformation","The Harvard Approach","Human Needs Theory","Glasl's Escalation Model"],"answer_index":2,"explanation":"The needs should be analyzed, communicated and satisfied for the conflict to be resolved."},{"id":"S5-073","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"Which approach views conflicts as destructive or constructive interactions depending on how they are dealt with, and seeks to empower actors?","options":["Human Needs Theory","Needs-Fears Mapping","Harvard Approach","Conflict Transformation"],"answer_index":3,"explanation":"It emphasizes perceptions and the social and cultural context in which reality is constructed."},{"id":"S5-074","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"How does the tip sheet define a conflict?","options":["A difference in personality types within a team","Any disagreement between two people about any topic","A legal dispute between parties that reaches a court","An incompatible interaction between at least two actors, where one experiences damage and the other causes it intentionally or ignores it"],"answer_index":3,"explanation":"This definition is part of the key messages."},{"id":"S5-075","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"What does the tip sheet say about the objectivity of conflict analysis?","options":["It is only valid when it is carried out by neutral outsiders","It removes the influence of world-views from the analysis","It produces a fully objective picture of the conflict if done carefully","It does not lead to an objective understanding; it makes subjective perceptions transparent"],"answer_index":3,"explanation":"Making perceptions transparent allows them to be reflected on and communicated."},{"id":"S5-076","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 1","question":"Why should any intervention in a conflict focus on supporting creative, positive energies?","options":["Because interventions from outside never really affect conflicts","Because conflicts are dynamic systems and any intervention becomes part of the system","Because only third parties are allowed to intervene in conflicts","Because negative energy in a conflict cannot be measured"],"answer_index":1,"explanation":"Conflict analysis supports orientation for future action."},{"id":"S5-077","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 2","question":"According to the tip sheet, where is a conflict often enacted?","options":["Only in the larger super-system surrounding it","Only at the top of the organizational hierarchy","Always at exactly the same place where it was originally caused by the parties","At a system's weakest point, not necessarily where it is caused"],"answer_index":3,"explanation":"That is why system boundaries must be considered and periodically revised."},{"id":"S5-078","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 2","question":"Which tool is described as a 'meta' tool that organizes the other conflict analysis tools?","options":["The Conflict Tree","Glasl's Escalation Model","Needs-Fears Mapping","The Conflict Wheel"],"answer_index":3,"explanation":"It introduces six dimensions and gives a first overview."},{"id":"S5-079","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 3","question":"Which of the following is NOT one of the six dimensions of the Conflict Wheel?","options":["Budgets","Dynamics","Actors/relations","Causation"],"answer_index":0,"explanation":"The six: actors/relations, issues, dynamics, context/structures, causation, options/strategies."},{"id":"S5-080","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 3","question":"In the Conflict Wheel, people who have an interest in the conflict or its outcome but are not directly involved are called:","options":["Catalysts","Conflict parties","Stakeholders","Third parties"],"answer_index":2,"explanation":"Directly involved = conflict parties; those transforming the conflict = third parties."},{"id":"S5-081","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 3","question":"What does the term 'structural violence' refer to in the tip sheet?","options":["Damage to buildings and infrastructure during conflict","Violence not directly caused by people but by economic and political systems, e.g., causing poverty","Physical violence directly between two individuals","Coercive pressure used by mediators to force agreement"],"answer_index":1,"explanation":"It belongs to the context/structures dimension."},{"id":"S5-082","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 3","question":"What does the Conflict Wheel say about causation?","options":["Every conflict can be traced back to exactly one identifiable root cause","Only economic causes need to be considered","Causes are irrelevant once the issues are identified","Conflicts are never mono-causal; multiple systemic factors interact"],"answer_index":3,"explanation":"It is helpful to differentiate between different causes or influence factors."},{"id":"S5-083","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 4","question":"In the Conflict Tree, what do the ROOTS symbolize?","options":["Dynamic factors like escalation level","Structural, 'static' root causes","Third-party interventions","Manifest issues the parties talk about"],"answer_index":1,"explanation":"Roots = structural factors; trunk = manifest issues; leaves/branches = dynamic factors."},{"id":"S5-084","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 4","question":"In the Conflict Tree, the trunk represents:","options":["The structural, static root causes","The current escalation level and intensity of the parties' interaction","The third parties and mediators involved","The manifest issues linking structural and dynamic factors"],"answer_index":3,"explanation":"Issues are what the parties want to talk about — the 'topic' of the conflict."},{"id":"S5-085","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 4","question":"Why does the tip sheet say 'quick money is often more important than big money' for dynamic factors?","options":["Because dynamic factors almost never change","Because donors generally prefer small projects","Because root causes are cheap and quick to fix","Because dynamic factors have a short time horizon and react quickly and sometimes unpredictably"],"answer_index":3,"explanation":"Structural factors, by contrast, are difficult to influence in the short term."},{"id":"S5-086","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 4","question":"What happens if structural root causes are avoided, according to the tip sheet?","options":["Dynamic factors disappear","The conflict is permanently solved for both parties","The conflict may pop up again later","Escalation automatically reverses"],"answer_index":2,"explanation":"Root causes are the typical area for long-term development cooperation."},{"id":"S5-087","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 5","question":"Which tool focuses on actors and their interrelationships, representing power by circle size, and is a good tool to start analyzing a conflict?","options":["Conflict Tree","Multi-Causal Role Model","Glasl's Escalation Model","Conflict Mapping"],"answer_index":3,"explanation":"A conflict map is like a photograph: a specific viewpoint at a specific moment."},{"id":"S5-088","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 5","question":"When drawing a conflict map, what does the tip sheet remind you to include?","options":["Only the third parties, since conflict parties are already known","Every actor in the country, however distant from the conflict","Yourself as an actor if you or your organization is involved, plus a title and date","Only the two most powerful actors, to keep the map simple"],"answer_index":2,"explanation":"Third parties are shown as semi-circles; issues in square boxes."},{"id":"S5-089","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 6","question":"In Glasl's escalation model, what is the FIRST level of escalation?","options":["Hardening","Actions, not words","Debate, polemics","Loss of face"],"answer_index":0,"explanation":"Positions harden but parties still believe the conflict can be solved by discussion."},{"id":"S5-090","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 6","question":"In Glasl's model, a public and direct attack on the opponent's moral integrity is which level?","options":["Images, coalitions (level 4)","Strategies of threats (level 6)","Loss of face (level 5)","Debate, polemics (level 2)"],"answer_index":2,"explanation":"Loss of face is described as a major escalation step."},{"id":"S5-091","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 6","question":"In Glasl's model, at which level do parties say 'Speaking will not help anymore' and present the opponent with a fait accompli?","options":["Actions, not words (level 3)","Hardening (level 1)","Fragmentation (level 8)","Images, coalitions (level 4)"],"answer_index":0,"explanation":"Empathy is lost and there's a danger of false interpretation."},{"id":"S5-092","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 6","question":"What is the final (ninth) level of Glasl's escalation model?","options":["Strategies of threats","Together into the abyss","Fragmentation of the enemy","Limited destructive blows"],"answer_index":1,"explanation":"Destruction of oneself is accepted as the price of destroying the opponent."},{"id":"S5-093","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 7","question":"According to Glasl's model, as escalation increases, what happens to third-party intervention?","options":["It becomes less necessary because the parties exhaust themselves","It must become more forceful because the parties' self-help potential decreases","It should always remain facilitative mediation at every level","It should be replaced by self-help as the parties learn"],"answer_index":1,"explanation":"Interventions range from self-help/moderation to arbitration and power intervention."},{"id":"S5-094","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 7","question":"Which form of intervention corresponds to the HIGHEST escalation levels in Glasl's model?","options":["Process accompaniment","Self-help and moderation","Facilitative mediation","Power intervention"],"answer_index":3,"explanation":"At high levels parties often must be forced to accept intervention."},{"id":"S5-095","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 8","question":"In Inmedio's Conflict Perspective Analysis (CPA), what should the 'Facts' phase contain?","options":["Hypotheses about the parties' hidden motivations and fears","Only observable facts that could be recorded on video, free of interpretations","Brainstormed options for possible solutions and next steps","The facilitator's personal opinion about who is right"],"answer_index":1,"explanation":"Direct quotations ('O-sounds') are written on separate cards."},{"id":"S5-096","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 8","question":"In CPA's 'Background interests and motivations' phase, how should outsider colleagues express each party's view?","options":["List only the verifiable facts without any feelings","Step into their shoes and begin with 'I, conflict party A, feel…'","Judge which of the parties is right and explain why","Propose the final solution on behalf of both of the conflict parties"],"answer_index":1,"explanation":"This phase is hypothetical and requires empathy; there are often 'good' motivations for 'bad' behavior."},{"id":"S5-097","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 8","question":"In CPA, when is brainstorming on options appropriate?","options":["Only after the parties' motivations have become plausible","Before the actors involved have been identified","At the very beginning of the process, before any facts are collected","Only after a court or arbitrator has made a ruling"],"answer_index":0,"explanation":"Brainstorming rules: all ideas are good, no corrections, no editing, no comments."},{"id":"S5-098","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 2","question":"What limitation does the tip sheet note about CPA?","options":["It ignores the parties' perspectives","It cannot be used at all without a professional, certified mediator","It only applies to international conflicts","It does not look explicitly at structures or context"],"answer_index":3,"explanation":"CPA focuses on perspectives of the parties and follows the phases of mediation."},{"id":"S5-099","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 10","question":"Which columns does the Needs-Fears Mapping table use for each actor?","options":["Issues, interests/needs, fears, means, options","Revenue, cost, profit, risk, return","Roots, trunk, branches, leaves, birds","Facts, quotes, dates, places, witnesses and evidence"],"answer_index":0,"explanation":"In the irrigation example, farmers and pastoralists differ in fears and means."},{"id":"S5-100","section":"Crisis and Conflict Management and Negotiation","source":"Reading - Conflict Analysis Tools.pdf, p. 11","question":"In the Multi-Causal Role Model, what are 'triggers'?","options":["Factors that initiate a new level of conflict and are hard to identify in advance","The positions and aims the parties say they are fighting about","Root causes that the parties perceive as historical problems","Lines of political, social or economic cleavage that group people and form identity"],"answer_index":0,"explanation":"Reasons = root causes; targets = aims/positions; channels = group-identity cleavages; catalysts = affect rate, intensity and duration."}];
const SECTIONS = [...new Set(QUESTIONS.map(q => q.section))];
const STORE_KEY = "ie404-midterm-progress-v1";
const LETTERS = ["A", "B", "C", "D"];

/* ---------- storage (wrapped: may be unavailable) ---------- */
function loadProgress() {
  try { const raw = localStorage.getItem(STORE_KEY); const p = raw ? JSON.parse(raw) : null; if (p && p.stats) return p; } catch (e) {}
  return { stats: {} };
}
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} }
let progress = loadProgress();

function record(q, chosen) {
  const s = progress.stats[q.id] || { a: 0, c: 0, last: null };
  s.a += 1;
  const ok = chosen === q.answer_index;
  if (ok) s.c += 1;
  s.last = ok;
  progress.stats[q.id] = s;
}
const wrongIds = () => Object.keys(progress.stats).filter(id => progress.stats[id].last === false);

/* ---------- helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(n, d) { return d ? Math.round(100 * n / d) : 0; }
function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, "0")}`; }
const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const sectionIndex = name => SECTIONS.indexOf(name) + 1;

/* Weighted draw: each section contributes in proportion to its share of the bank (largest-remainder). */
function drawExam(n) {
  if (n >= QUESTIONS.length) return shuffle(QUESTIONS);
  const groups = SECTIONS.map(s => QUESTIONS.filter(q => q.section === s));
  const exact = groups.map(g => n * g.length / QUESTIONS.length);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a, b) => a + b, 0);
  exact.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => take[i]++);
  return shuffle(groups.flatMap((g, i) => shuffle(g).slice(0, take[i])));
}

/* ---------- state ---------- */
let session = null;     // active quiz
let examCfg = { count: 50, timer: false, minutes: 60 };
let timerHandle = null;

function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

function startSession(opts) {
  stopTimer();
  session = { mode: opts.mode, title: opts.title, items: opts.items, idx: 0, answers: {}, start: Date.now(),
              limit: opts.limit || null, finished: false };
  if (session.limit) {
    timerHandle = setInterval(() => {
      const t = $("#timer");
      const rem = session.limit - (Date.now() - session.start) / 1000;
      if (t) { t.textContent = fmtTime(rem); t.classList.toggle("low", rem < 60); }
      if (rem <= 0) finishSession(true);
    }, 500);
  }
  renderQuiz();
}

/* ---------- home ---------- */
function renderHome() {
  stopTimer(); session = null;
  const seen = Object.keys(progress.stats).length;
  const totalA = Object.values(progress.stats).reduce((a, s) => a + s.a, 0);
  const totalC = Object.values(progress.stats).reduce((a, s) => a + s.c, 0);
  const wrong = wrongIds().length;
  const cards = SECTIONS.map((s, i) => {
    const qs = QUESTIONS.filter(q => q.section === s);
    const st = qs.map(q => progress.stats[q.id]).filter(Boolean);
    const a = st.reduce((x, y) => x + y.a, 0), c = st.reduce((x, y) => x + y.c, 0);
    return `<button class="card sec-card" data-sec="${i}">
      <span class="num">Section ${i + 1} · ${qs.length} questions</span>
      <span class="name">${esc(s)}</span>
      <span class="small muted">${st.length}/${qs.length} seen${a ? ` · ${pct(c, a)}% correct` : ""}</span>
      <span class="bar"><span style="width:${pct(st.length, qs.length)}%"></span></span>
    </button>`;
  }).join("");
  $("#app").innerHTML = `
    <header class="top">
      <div><h1>IE404 Midterm Practice</h1><div class="muted small">Management for Engineers · ${QUESTIONS.length} questions from lecture notes and readings</div></div>
      <div class="small muted">${seen}/${QUESTIONS.length} seen${totalA ? ` · ${pct(totalC, totalA)}% correct overall` : ""}</div>
    </header>
    <div class="stack">
      <section>
        <h2>Practice by section</h2>
        <div class="grid">${cards}</div>
        <div class="small muted" style="margin-top:8px">Questions come in random order; you see the answer and explanation right after each one.</div>
      </section>
      <section class="card stack">
        <h2>Full exam</h2>
        <div class="small muted">Random questions drawn across all sections in proportion to each section's weight. Answers are shown at the end.</div>
        <div class="row">
          <span class="small muted">Questions</span>
          <div class="seg" role="group" aria-label="Number of questions">
            ${[50, 100, QUESTIONS.length].map(n => `<button data-count="${n}" aria-pressed="${examCfg.count === n}">${n === QUESTIONS.length ? `All ${n}` : n}</button>`).join("")}
          </div>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="useTimer" ${examCfg.timer ? "checked" : ""}> Timer</label>
          <input type="number" id="minutes" min="1" max="600" value="${examCfg.minutes}" ${examCfg.timer ? "" : "disabled"} aria-label="Minutes"> <span class="small muted">minutes</span>
        </div>
        <div><button class="primary" id="startExam">Start exam</button></div>
      </section>
      <section class="card row spread">
        <div><h2 style="margin:0">My mistakes</h2><div class="small muted">${wrong ? `${wrong} question${wrong > 1 ? "s" : ""} you last answered wrong. Answer correctly to clear them.` : "No open mistakes yet."}</div></div>
        <button class="primary" id="startWrong" ${wrong ? "" : "disabled"}>Practice mistakes${wrong ? ` (${wrong})` : ""}</button>
      </section>
      <div class="row spread small muted">
        <span>Keys: 1–4 or A–D to answer · Enter for next · ← previous (exam)</span>
        <button class="link" id="reset">Reset progress</button>
      </div>
    </div>`;
  document.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => {
    const s = SECTIONS[+b.dataset.sec];
    startSession({ mode: "practice", title: s, items: shuffle(QUESTIONS.filter(q => q.section === s)) });
  });
  document.querySelectorAll("[data-count]").forEach(b => b.onclick = () => {
    examCfg.count = +b.dataset.count;
    examCfg.minutes = Math.round(examCfg.count * 1.2);
    renderHome();
  });
  $("#useTimer").onchange = e => { examCfg.timer = e.target.checked; $("#minutes").disabled = !examCfg.timer; };
  $("#minutes").onchange = e => { examCfg.minutes = Math.max(1, Math.min(600, +e.target.value || 1)); e.target.value = examCfg.minutes; };
  $("#startExam").onclick = () => startSession({ mode: "exam", title: `Full exam · ${examCfg.count} questions`,
    items: drawExam(examCfg.count), limit: examCfg.timer ? examCfg.minutes * 60 : null });
  $("#startWrong").onclick = () => startSession({ mode: "practice", title: "My mistakes",
    items: shuffle(wrongIds().map(id => byId[id]).filter(Boolean)) });
  $("#reset").onclick = () => { if (confirm("Reset all saved progress and mistakes?")) { progress = { stats: {} }; saveProgress(); renderHome(); } };
}

/* ---------- quiz ---------- */
function renderQuiz() {
  const s = session, q = s.items[s.idx], n = s.items.length;
  const chosen = s.answers[q.id];
  const answered = chosen !== undefined;
  const reveal = s.mode === "practice" && answered;
  const opts = q.options.map((o, i) => {
    let cls = "opt";
    if (reveal) { if (i === q.answer_index) cls += " correct"; else if (i === chosen) cls += " wrong"; }
    else if (i === chosen) cls += " selected";
    return `<button class="${cls}" data-opt="${i}" ${reveal ? "disabled" : ""}><span class="key">${LETTERS[i]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const ok = chosen === q.answer_index;
  const feedback = reveal ? `<div class="feedback ${ok ? "ok" : "bad"}" role="status">
      <strong>${ok ? "Correct" : `Incorrect — the answer is ${LETTERS[q.answer_index]}`}</strong>${esc(q.explanation)}
      <div class="source">Source: ${esc(q.source)}</div></div>` : "";
  const isLast = s.idx === n - 1;
  let nav;
  if (s.mode === "practice") {
    nav = `<button class="link" id="quit">End session</button>
           <button class="primary" id="next" ${answered ? "" : "disabled"}>${isLast ? "See results" : "Next"}</button>`;
  } else {
    nav = `<div class="row"><button id="prev" ${s.idx ? "" : "disabled"}>Previous</button>
           <button id="next" ${isLast ? "disabled" : ""}>Next</button></div>
           <button class="primary" id="finish">Finish exam</button>`;
  }
  const doneCount = Object.keys(s.answers).length;
  const palette = s.mode === "exam" && n <= 100 ? `<div class="palette" aria-label="Jump to question">${s.items.map((it, i) =>
      `<button data-jump="${i}" class="${s.answers[it.id] !== undefined ? "done" : ""} ${i === s.idx ? "cur" : ""}">${i + 1}</button>`).join("")}</div>` : "";
  const remaining = s.limit ? s.limit - (Date.now() - s.start) / 1000 : 0;
  $("#app").innerHTML = `
    <header class="top">
      <div><h1 style="font-size:1.15rem">${esc(s.title)}</h1>
        <div class="small muted">Question ${s.idx + 1} of ${n} · ${doneCount} answered${s.mode === "exam" ? " · answers revealed at the end" : ""}</div></div>
      <div class="row">${s.limit ? `<span class="timer ${remaining < 60 ? "low" : ""}" id="timer">${fmtTime(remaining)}</span>` : ""}
        <button class="link" id="home">Home</button></div>
    </header>
    <div class="bar" style="margin-bottom:14px"><span style="width:${pct(s.mode === "exam" ? doneCount : s.idx + (answered ? 1 : 0), n)}%"></span></div>
    <article class="card">
      <div class="qhead"><span class="pill">S${sectionIndex(q.section)} · ${esc(q.section)}</span><span class="small muted">${q.id}</span></div>
      <div class="question">${esc(q.question)}</div>
      <div class="opts">${opts}</div>
      ${feedback}
      <div class="nav">${nav}</div>
      ${palette}
      <div class="hint">1–4 / A–D to answer · Enter: ${s.mode === "practice" ? "next question" : "next"}${s.mode === "exam" ? " · ←: previous" : ""}</div>
    </article>`;
  document.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => choose(+b.dataset.opt));
  document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { s.idx = +b.dataset.jump; renderQuiz(); });
  $("#home").onclick = () => { if (s.mode === "practice" || confirm("Leave the exam? Your answers will be lost.")) renderHome(); };
  if (s.mode === "practice") {
    $("#quit").onclick = () => finishSession(false);
    $("#next").onclick = next;
  } else {
    $("#prev").onclick = prev;
    $("#next").onclick = next;
    $("#finish").onclick = () => {
      const left = n - Object.keys(s.answers).length;
      if (!left || confirm(`${left} question${left > 1 ? "s are" : " is"} unanswered. Finish anyway?`)) finishSession(false);
    };
  }
}

function choose(i) {
  const s = session; if (!s || s.finished) return;
  const q = s.items[s.idx];
  if (s.mode === "practice") {
    if (s.answers[q.id] !== undefined) return;
    s.answers[q.id] = i; record(q, i); saveProgress();
  } else {
    s.answers[q.id] = i;
  }
  renderQuiz();
  if (s.mode === "practice") { const nb = $("#next"); if (nb) nb.focus({ preventScroll: true }); }
}
function next() {
  const s = session; if (!s || s.finished) return;
  const q = s.items[s.idx];
  if (s.mode === "practice") {
    if (s.answers[q.id] === undefined) return;
    if (s.idx === s.items.length - 1) return finishSession(false);
  } else if (s.idx === s.items.length - 1) return;
  s.idx++; renderQuiz(); window.scrollTo({ top: 0 });
}
function prev() { const s = session; if (s && s.mode === "exam" && s.idx > 0) { s.idx--; renderQuiz(); } }

/* ---------- results ---------- */
function finishSession(timedOut) {
  const s = session; if (!s || s.finished) return;
  s.finished = true; stopTimer();
  const elapsed = (Date.now() - s.start) / 1000;
  if (s.mode === "exam") { s.items.forEach(q => { if (s.answers[q.id] !== undefined) record(q, s.answers[q.id]); }); saveProgress(); }
  // In practice mode only answered questions count; in exam mode every drawn question counts.
  const pool = s.mode === "exam" ? s.items : s.items.filter(q => s.answers[q.id] !== undefined);
  const correct = pool.filter(q => s.answers[q.id] === q.answer_index);
  const missed = pool.filter(q => s.answers[q.id] !== q.answer_index);
  const rows = SECTIONS.map(sec => {
    const p = pool.filter(q => q.section === sec); if (!p.length) return "";
    const c = p.filter(q => s.answers[q.id] === q.answer_index).length;
    return `<tr><td>S${sectionIndex(sec)} · ${esc(sec)}</td><td class="num">${c}/${p.length}</td>
      <td style="width:30%"><div class="bar ok"><span style="width:${pct(c, p.length)}%"></span></div></td><td class="num">${pct(c, p.length)}%</td></tr>`;
  }).join("");
  const review = missed.map((q, k) => {
    const ch = s.answers[q.id];
    return `<div class="review-item">
      <div class="small muted">${k + 1}. ${q.id} · S${sectionIndex(q.section)} ${esc(q.section)}</div>
      <div style="font-weight:600;margin:4px 0 6px">${esc(q.question)}</div>
      <div class="ans bad">Your answer: ${ch === undefined ? "— (not answered)" : `${LETTERS[ch]}. ${esc(q.options[ch])}`}</div>
      <div class="ans ok">Correct: ${LETTERS[q.answer_index]}. ${esc(q.options[q.answer_index])}</div>
      <div class="small" style="margin-top:6px">${esc(q.explanation)}</div>
      <div class="source">Source: ${esc(q.source)}</div></div>`;
  }).join("");
  $("#app").innerHTML = `
    <header class="top"><div><h1 style="font-size:1.15rem">${esc(s.title)} — results</h1>
      <div class="small muted">${timedOut ? "Time is up. " : ""}Time used: ${fmtTime(elapsed)}</div></div>
      <button class="link" id="home">Home</button></header>
    <div class="stack">
      <section class="card row spread">
        <div><div class="big-score">${pct(correct.length, pool.length)}%</div>
          <div class="muted">${correct.length} of ${pool.length} correct${s.mode === "exam" && missed.some(q => s.answers[q.id] === undefined) ? ` · ${missed.filter(q => s.answers[q.id] === undefined).length} unanswered` : ""}</div></div>
        <div class="row">
          ${missed.length ? `<button class="primary" id="retry">Practice these ${missed.length} again</button>` : ""}
          <button id="home2">Back to home</button>
        </div>
      </section>
      ${pool.length ? `<section class="card"><h2>By section</h2><table><thead><tr><th>Section</th><th class="num">Score</th><th></th><th class="num">%</th></tr></thead><tbody>${rows}</tbody></table></section>` : ""}
      <section class="card stack"><h2>${missed.length ? `Review: ${missed.length} missed question${missed.length > 1 ? "s" : ""}` : pool.length ? "No mistakes — well done." : "No questions answered."}</h2>${review}</section>
    </div>`;
  $("#home").onclick = renderHome; $("#home2").onclick = renderHome;
  const r = $("#retry"); if (r) r.onclick = () => startSession({ mode: "practice", title: "Retry missed questions", items: shuffle(missed) });
  window.scrollTo({ top: 0 });
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (!session || session.finished || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
  if (k in map) { e.preventDefault(); choose(map[k]); }
  else if (k === "enter") { e.preventDefault(); next(); }
  else if (k === "arrowright" && session.mode === "exam") { e.preventDefault(); next(); }
  else if (k === "arrowleft") { e.preventDefault(); prev(); }
});

renderHome();
</script>
</body>
</html>
