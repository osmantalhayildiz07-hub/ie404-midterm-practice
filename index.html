ey discovered. Which style is this?","options":["Accommodating","Competing","Collaborating","Compromising"],"answer_index":2,"explanation":"Collaborating seeks a win-win solution meeting everyone's needs."},{"id":"S5-044","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 43","question":"When is collaborating NOT appropriate?","options":["When previous attempts at resolving the conflict have already failed","When an important decision needs to be made","When a decision must be made urgently or the matter is trivial","When many people across teams are involved"],"answer_index":2,"explanation":"Collaboration takes time, so it fits non-urgent, important, multi-party issues."},{"id":"S5-045","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 44","question":"Which of the following is listed as a way to become more adept at collaborating?","options":["View the other party as a partner","Hold your position firmly until they give in","Avoid asking questions to save time","Focus only on your own goals"],"answer_index":0,"explanation":"Others: articulate your goal and listen, look at the big picture, stay calm, ask questions, put yourself in their shoes."},{"id":"S5-046","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 46","question":"In the Yalım and Levent case, scheduling a meeting where Levent and the coworkers discuss their working relationship is which style?","options":["Compromising","Avoiding","Accommodating, smoothing","Collaborating, integrating"],"answer_index":3,"explanation":"Both parties talk about the relationship to promote more effective interaction."},{"id":"S5-047","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 46","question":"In the Yalım and Levent case, Yalım telling coworkers they are unfair to Levent because he is new is which style?","options":["Accommodating","Competing","Collaborating","Compromising"],"answer_index":1,"explanation":"Yalım sticks to Levent's side and pushes his own view."},{"id":"S5-048","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 48","question":"According to the lecture, in which of the five conflict-resolution strategies will there be negotiation?","options":["In all five strategies","Only in collaborating and compromising","Only in compromising","Only in competing"],"answer_index":0,"explanation":"'In all 5 strategies of conflict resolution there will be negotiation.'"},{"id":"S5-049","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 53","question":"What does BATNA stand for?","options":["Bargaining Alternative To No Agreement","Best Alternative To a Negotiated Agreement","Basic Agreement Toward Negotiated Arbitration","Best Approach To Negotiating Assertively"],"answer_index":1,"explanation":"BATNA determines the point at which a negotiator is prepared to walk away."},{"id":"S5-050","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 53","question":"How should a negotiator use their BATNA?","options":["Accept any offer rather than walking away from the table","Reveal it at the very start of the negotiation so as to build trust quickly","Accept any terms superior to the BATNA and reject outcomes worse than it","Ignore it once the negotiation has formally begun"],"answer_index":2,"explanation":"BATNA is the reference point for walking away."},{"id":"S5-051","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 53","question":"What is WATNA?","options":["The opening position announced by the other party","The worst result a party would ultimately achieve if it called off negotiations","The average of both parties' initial positions","The best offer received from the other side during the negotiation"],"answer_index":1,"explanation":"WATNA = Worst Alternative To a Negotiated Agreement."},{"id":"S5-052","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 54","question":"A person negotiating for a used car at a car yard could instead buy directly from private owners online. What is this option?","options":["Bottom line","Concession","WATNA","BATNA"],"answer_index":3,"explanation":"Their WATNA is to keep driving the faulty car until it breaks down."},{"id":"S5-053","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 55","question":"How does the lecture distinguish negotiation from bargaining?","options":["Bargaining is only about price and winning; negotiation is a communication and problem-solving process aiming at win-win","Bargaining always produces win-win outcomes for both sides","Negotiation is only about price; bargaining is about relationships","They are identical terms for the same win-lose process"],"answer_index":0,"explanation":"'Do not mix' negotiation and bargaining."},{"id":"S5-054","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 56","question":"In the lecture's model of negotiation, what happens if the answer to 'Negotiate?' is No?","options":["Proceed directly to documenting an agreement","Turn to the BATNA / Plan B","Choose a negotiation team","Use the auction tactic"],"answer_index":1,"explanation":"Negotiation may not be the only way."},{"id":"S5-055","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 56","question":"In the negotiation model, which items belong to the 'Preparation' stage?","options":["Walking away from the table and trying again later","Choosing tactics such as flinch, nibble and bogey only","Research, goals, positions, interests, fallbacks, concessions, territory, power, time, publics, packaging, stress","Signing the contract, documenting the deal and celebrating"],"answer_index":2,"explanation":"Preparation precedes choosing people (individual/team) and tools."},{"id":"S5-056","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 57","question":"According to the lecture, what is the essence of all good negotiation, and of good preparation?","options":["Negotiation's essence is preparation; preparation's essence is research","Negotiation's essence is luck; preparation's essence is timing","Negotiation's essence is speed; preparation's essence is intuition and instinct","Negotiation's essence is power; preparation's essence is threats"],"answer_index":0,"explanation":"Research the other side's financial health, industry position and people."},{"id":"S5-057","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 59","question":"The 'irreducible minimum point beyond which a negotiator will not or cannot go' is called the:","options":["Bottom line / resistance point","Opening offer or anchor","Packaging of the deal","BATNA (best alternative to agreement)"],"answer_index":0,"explanation":"Negotiators often conceal it, though announcing it can sometimes be tactical."},{"id":"S5-058","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 60","question":"According to the lecture, what is the worst-case situation when trading concessions?","options":["Trading something expensive or valuable for you that the other side doesn't value","Refusing to make any concessions at all during the talks","Trading something cheap for you in return for something the other side values highly","Asking for something in return for every concession you make"],"answer_index":0,"explanation":"Concessions are perceived differently by each side."},{"id":"S5-059","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 62","question":"Which is listed as an advantage of negotiating at THEIR place?","options":["You can do other work whenever you are not at the table","It is easier to walk out and to use the limited-authority tactic","You have easy access to your own experts and resources","You have familiarity with and full control of the environment and timing"],"answer_index":1,"explanation":"Disadvantages include unfamiliarity, higher stress, distance from advisers and travel cost."},{"id":"S5-060","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 62","question":"When might a neutral 'another place' be the only alternative for a negotiation?","options":["When one party wants control of the environment","When resources are needed nearby","When the parties want to save on costs","When hostility between the parties is high"],"answer_index":3,"explanation":"A neutral place gives neither side special advantages."},{"id":"S5-061","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 63","question":"To uncover common interests during negotiation, what does the lecture advise?","options":["Speed up the pace to put pressure on the other side","Avoid asking questions so that you don't reveal your own interests","Slow down the pace and use listening, questioning and feedback","Shout out your opening positions clearly and early"],"answer_index":2,"explanation":"Impatience or shouting positions means little real negotiation takes place."},{"id":"S5-062","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 65","question":"Offering free goods and services as incentives to close a deal is an example of which preparation element?","options":["Place","Publics","Packaging","Stress"],"answer_index":2,"explanation":"Look beyond raw price at the When, How and Who of the deal."},{"id":"S5-063","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 70","question":"Demanding small, previously undiscussed concessions just before closing the deal is which tactic?","options":["Flinch","Snow job","Nibble","Bogey"],"answer_index":2,"explanation":"Nibbling is also called the salami tactic or quivering quill."},{"id":"S5-064","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 70","question":"Overwhelming the other party with so much information that they can't tell what matters is which tactic?","options":["Mirroring","Chicken","Deadlines","Snow job"],"answer_index":3,"explanation":"The snow job buries important information among diversions."},{"id":"S5-065","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 70","question":"Proposing extreme measures, often bluffs, to force the other party to back down is which tactic?","options":["Bogey","Nibble","Chicken","Calling a higher authority"],"answer_index":2,"explanation":"In 'chicken', negotiators hope the other side will 'chicken out'."},{"id":"S5-066","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 72","question":"Pretending that an unimportant issue is very important so it can later be traded for a major concession is which tactic?","options":["Snow job","Brinkmanship","Bogey","Mirroring"],"answer_index":2,"explanation":"The bogey creates a fake bargaining chip."},{"id":"S5-067","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 71","question":"Aggressively pursuing terms until the other party must either agree or walk away is which tactic?","options":["Brinkmanship","Flinch","Auction","Deadlines"],"answer_index":0,"explanation":"Brinkmanship pushes the other party to the 'brink' of what it will accept."},{"id":"S5-068","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 76","question":"How does the lecture recommend dealing with difficult negotiators showing RED behaviors such as intimidation and threats?","options":["Give in quickly to end the stress and save the relationship","Don't react to their behavior; focus on the outcome and the merits, using 'If… then' (PURPLE) conditional offers","Walk out at the first sign of intimidation and end the talks","Respond with equally aggressive behavior so they respect you"],"answer_index":1,"explanation":"They behave this way because the other party often backs down — don't let them get to you."},{"id":"S5-069","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 77","question":"According to the lecture, what determines how effectively a chosen conflict response is carried out?","options":["Seniority","Skills","Analysis","Strategy"],"answer_index":1,"explanation":"Analysis identifies the conflict, strategy selects the response, skills determine execution."},{"id":"S5-070","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 79","question":"What is the lecture's final take-away about conflict-resolution styles?","options":["Competing should be avoided in every situation, including emergencies","Avoiding is the safest style for most managers","There is no right or wrong style; each has its time and place","Collaborating is always the best style to use"],"answer_index":2,"explanation":"Treating employees with respect and empathy is always the first step."},{"id":"S1-071","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 1","question":"According to Anthony Tjan, why is self-awareness essential for leaders?","options":["It lies at the root of strong character and helps us know what we need from others to complement our deficiencies","It guarantees promotion to senior positions within a few years","It allows leaders to work independently and avoid teamwork","It removes the need for feedback from peers, friends and mentors"],"answer_index":0,"explanation":"Tjan writes that self-awareness gives purpose, authenticity, openness and trust, and shows what we need from others."},{"id":"S1-072","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 2","question":"Which of the following is NOT one of Tjan's five ways to become more self-aware?","options":["Take psychometric tests","Write down key plans and priorities","Meditate","Delegate all decisions to a mentor"],"answer_index":3,"explanation":"The five ways are: meditate, write down plans and priorities, take psychometric tests, ask trusted friends, get regular feedback at work."},{"id":"S1-073","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 2","question":"Which question does Tjan ask himself during meditation?","options":["How can I outperform all of my competitors this year?","How can I avoid feedback?","Who is to blame for my failures?","What am I doing that is slowing me down?"],"answer_index":3,"explanation":"His questions: What am I trying to achieve? What is working? What is slowing me down? What can I do to change?"},{"id":"S1-074","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 2","question":"What does Tjan describe as his most frequent form of 'meditation'?","options":["Carrying out mundane tasks such as washing dishes or gardening","Using biofeedback devices during working hours","Attending formal week-long meditation retreats at least once every year","Reading leadership books for an hour every night"],"answer_index":0,"explanation":"He finds therapeutic serenity in mundane tasks like washing dishes and gardening."},{"id":"S1-075","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 2","question":"Why does Warren Buffett write down the reasons for an investment at the time he makes it?","options":["To reduce the taxes owed on successful investments","To satisfy the legal reporting requirements that apply to all of his investors","To share his reasoning publicly with competing investors","To later assess whether outcomes came from sound judgment or plain luck"],"answer_index":3,"explanation":"His journal entries are a historical record for judging sound judgment versus luck."},{"id":"S1-076","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 2","question":"What practice, inspired by Benjamin Franklin, did investor Li Lu follow?","options":["Meditating for an hour at sunrise before any decision","Keeping a detailed list of every investment loss he made","Asking strangers for anonymous feedback on his leadership","Keeping a 'balance sheet' of the assets and liabilities of his personal traits"],"answer_index":3,"explanation":"Franklin's 'balance sheet' tracks personal strengths and weaknesses to see whether the 'net worth' of character grows."},{"id":"S1-077","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 3","question":"What design point do psychometric tests such as Myers-Briggs and Predictive Index share, according to Tjan?","options":["There are no right or wrong answers","They give a single final score of leadership ability","They measure IQ rather than traits","They must be administered by a psychiatrist"],"answer_index":0,"explanation":"They compel respondents to consider which traits describe them relative to others, without right or wrong answers."},{"id":"S1-078","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 3","question":"The Heart, Smarts, Guts and Luck test asks questions like 'Is your success best described by analytics or instincts?'. What type of question format is this?","options":["True/false questions that test business knowledge","Forced choices in paired question sets","Peer ratings on a 1-10 scale","Open-ended essay questions"],"answer_index":1,"explanation":"Reflecting on forced trade-off questions helps test-takers understand their true characters."},{"id":"S1-079","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 3","question":"When asking trusted friends for feedback, what should you do to let them act as an 'honest mirror'?","options":["Ask only friends who usually agree with you, to avoid conflict","Ask them to write anonymous letters about you to your boss","Let them know you want candid, critical feedback and make them feel safe giving it","Avoid explaining why you are asking, so their answers stay natural"],"answer_index":2,"explanation":"Tjan advises signaling that you seek candid, critical perspectives and making it safe to be direct."},{"id":"S1-080","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 3","question":"Tjan gives the example of a 'story-topper' to illustrate which strategy?","options":["Hiring an external facilitator to run a 360 feedback process","Writing a personal balance sheet of strengths and weaknesses","Taking forced-choice psychometric tests to reveal hidden traits","Asking friends to call you out when you repeat a behavior you want to change"],"answer_index":3,"explanation":"You can ask friends to point out — preferably discreetly — when you one-up conversations."},{"id":"S1-081","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 4","question":"According to Tjan, what are the two keys to effective formal feedback?","options":["High frequency and very short feedback forms","Having a process and having an effective manager of it","Full anonymity for respondents and financial rewards for honesty","Using AI tools and avoiding the HR department"],"answer_index":1,"explanation":"The keys to effective formal feedback are a) a process and b) an effective manager of it."},{"id":"S1-082","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 4","question":"Why did Tjan's firm find external facilitators more effective for feedback processes?","options":["They are considerably cheaper than internal HR staff","They have the authority to fire underperforming founders","They guarantee that the feedback will be mostly positive","They come without the baggage of preconceived biases or reporting lines"],"answer_index":3,"explanation":"External facilitators lack preconceived biases and reporting-line baggage."},{"id":"S1-083","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 4","question":"What formal feedback process did Cue Ball encourage founders to institute?","options":["A quarterly peer ranking","A weekly psychometric test","An annual 360-degree feedback process","A monthly anonymous suggestion box for all employees"],"answer_index":2,"explanation":"Cue Ball encouraged a formal, annual 360-feedback process across competencies and work styles."},{"id":"S1-084","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 4","question":"What does Tjan mean by 'self-congruence'?","options":["Having the same personality type as most members of one's team","Agreement between a leader and their board","A state in which what we say, think and feel are consistent","Matching one's goals to the company's goals"],"answer_index":2,"explanation":"Self-awareness helps one move toward self-congruence: consistency between saying, thinking and feeling."},{"id":"S1-085","type":"reading","week":1,"topic":"Winning on Purpose","doc":"5 Ways to Become More Self-Aware","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 4","question":"According to Tjan, when is the work of building self-awareness complete?","options":["After completing a 360 feedback cycle","After taking three psychometric tests","Never; it is a life-long effort","After becoming a senior leader"],"answer_index":2,"explanation":"Building self-awareness is a life-long effort; you're never 'done'."},{"id":"S1-086","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 2","question":"According to Tasha Eurich's research, what share of people think they are self-aware versus actually are?","options":["About 50% think they are; around 40% actually are","75% think they are; 60% actually are","30% think they are; 5% actually are","95% think they are; only 10–15% actually are"],"answer_index":3,"explanation":"Her five-year research program found 95% believe they are self-aware but only 10–15% are."},{"id":"S1-087","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 3","question":"In Eurich's survey of 467 working adults, which group was most frequently reported as unaware colleagues?","options":["Clients","Bosses","Peers","Direct reports"],"answer_index":2,"explanation":"Peers (73%) were the most frequent offenders, followed by direct reports (33%), bosses (32%) and clients (16%)."},{"id":"S1-088","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 3","question":"What impact can un-self-aware colleagues have on a team, according to the article's subtitle and research?","options":["They can cut a team's chances of success in half","They double the team's workload","They have no measurable effect","They usually improve team performance by adding pressure"],"answer_index":0,"explanation":"Other consequences include increased stress, decreased motivation and a higher likelihood of leaving one's job."},{"id":"S1-089","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 3","question":"Before trying to help a difficult colleague, what does Eurich say you must first determine?","options":["Whether the source of the problem is truly a lack of self-awareness","Whether the colleague has a higher IQ than the rest of the team members","Whether the colleague is more senior than you in the hierarchy","Whether HR has a written policy covering this kind of behavior"],"answer_index":0,"explanation":"Tension may also come from different priorities, incompatible communication styles or a lack of trust."},{"id":"S1-090","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 4","question":"How can you tell you are truly dealing with an un-self-aware person rather than a personal clash?","options":["There is usually a consensus about their behavior — it won't just be you","They usually admit their mistakes once you point them out","They are typically new to the organization and its norms","They have usually received several promotions recently"],"answer_index":0,"explanation":"Consider how others around them feel; typically there is a consensus about the unaware person's behavior."},{"id":"S1-091","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 4","question":"Which of the following is NOT listed as a consistent behavior of un-self-aware individuals?","options":["They have difficulty reading a room","They take credit for successes and blame others for failures","They have an inflated opinion of their performance","They frequently ask colleagues for critical feedback"],"answer_index":3,"explanation":"Unaware individuals won't listen to or accept critical feedback."},{"id":"S1-092","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 4","question":"What is the biggest difference between the unaware and the 'Aware-Don't-Care'?","options":["Their technical skills","Their intentions","Their seniority","Their personality type"],"answer_index":1,"explanation":"The unaware genuinely want to be effective but don't know they fall short; the Aware-Don't-Care know and won't change."},{"id":"S1-093","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 4","question":"A COO says 'The best management tool is fear. If they fear you, they will get the work done.' Which category does he illustrate?","options":["Highly self-aware leader","Unaware but well-intentioned","Aware-Don't-Care","Strategically patient leader"],"answer_index":2,"explanation":"He knew exactly what he was doing and was unwilling to change; he was fired months later."},{"id":"S1-094","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 5","question":"In Eurich's survey, what proportion of people who tried to help an unaware colleague were successful or very successful?","options":["70%","50%","31%","21%"],"answer_index":2,"explanation":"70% tried to help, but only 31% were successful; among those who didn't help, only 21% regretted it."},{"id":"S1-095","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 5","question":"What was the number one reason respondents gave for NOT helping an unaware colleague?","options":["They feared the colleague would be promoted","They had no time because of their own workload","HR policy explicitly forbade giving such feedback","They didn't think they were the right messenger"],"answer_index":3,"explanation":"Trust is needed; the person must believe the messenger has their best interests at heart."},{"id":"S1-096","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 6","question":"According to Eurich, with which group is the risk of giving feedback about unawareness usually LOWEST?","options":["Peers","Bosses","Clients","Direct reports"],"answer_index":3,"explanation":"Risk is highest with bosses, lower with peers and lower still with direct reports — for whom it's literally your job."},{"id":"S1-097","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 6","question":"Eurich's research found that feedback delivered via email was how much less successful than in person?","options":["33% less successful","50% less successful","About equally successful","10% less successful"],"answer_index":0,"explanation":"First practice: talk to them in person; email feedback is 33% less successful."},{"id":"S1-098","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 6","question":"What does Eurich mean by practicing 'strategic patience' when helping an unaware colleague?","options":["Waiting until HR formally intervenes in the situation","Waiting until they decide to leave the company on their own","Waiting until their next annual performance review comes around","Waiting until they express frustration that is actually caused by their unawareness"],"answer_index":3,"explanation":"Then ask if you can offer an 'observation' (the word 'feedback' risks defensiveness)."},{"id":"S1-099","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 7","question":"Eurich imagined a 'laugh track' behind her Aware-Don't-Care boss's comments. Which strategy does this illustrate?","options":["Finding their humanity","Mindfully reframing their behavior","Playing the long game","Escalating the issue to senior management and HR"],"answer_index":1,"explanation":"Noticing feelings in the moment lets us reframe the situation and be more resilient."},{"id":"S1-100","type":"reading","week":1,"topic":"Winning on Purpose","doc":"Working with People Who Aren't Self-Aware","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 8","question":"What does Eurich conclude we have complete control over, regardless of whether others change?","options":["The choice to improve our own self-awareness","Our colleagues' willingness to accept feedback","The organization's culture","Our boss's management style"],"answer_index":0,"explanation":"Whether or not others improve, we fully control improving our own self-awareness — perhaps where energy is best spent."},{"id":"S2-071","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 2","question":"According to Badaracco, where do the toughest management calls arise?","options":["In decisions that are fully covered by an existing company policy","In emergencies, where there is no time at all to gather data","In gray areas, where facts and analysis are done but you still don't know what to do","In routine operational decisions that are repeated every day"],"answer_index":2,"explanation":"Gray areas are situations where you've gathered facts and analyzed but the answer remains unclear."},{"id":"S2-072","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 2","question":"How does Badaracco describe 'judgment'?","options":["A fusion of thinking, feelings, experience, imagination and character","A purely rational calculation of all the measurable costs and benefits","Following the majority opinion of the management team","An inborn instinct that cannot be improved through practice"],"answer_index":0,"explanation":"Judgment is hard to define but blends these elements; five questions can improve it."},{"id":"S2-073","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"Which of the following is NOT one of Badaracco's five questions?","options":["What are the net, net consequences of all my options?","What can I live with?","What are my core obligations?","What would maximize next quarter's profit?"],"answer_index":3,"explanation":"The five: net, net consequences; core obligations; what will work in the world as it is; who are we; what can I live with."},{"id":"S2-074","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"What is the FIRST of Badaracco's five questions?","options":["What will work in the world as it is?","What can I personally live with?","Who are we, and what do we stand for as an organization?","What are the net, net consequences of all my options?"],"answer_index":3,"explanation":"The first question asks you to consider every course of action and its full human consequences."},{"id":"S2-075","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"What does Badaracco warn about the 'net, net consequences' question?","options":["It should be answered alone, without involving advisers or experts","It only applies to the financial outcomes of each option","It requires precise and accurate forecasting of the future","Don't confuse it with cost-benefit analysis or focus solely on what you can count or price"],"answer_index":3,"explanation":"Gray-area problems require thinking broadly, deeply and imaginatively about the full impact of choices."},{"id":"S2-076","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"A CEO told Badaracco 'The lonely leader on Olympus is really a bad model.' What does this support?","options":["Relying mainly on gut instinct rather than on analysis","Delegating the decision entirely to the most senior expert","Gathering a group of trusted advisers and experts when analyzing options","Making the decision quickly and alone to show strong leadership"],"answer_index":2,"explanation":"Gray-area problems are rarely solved by one person's intuition."},{"id":"S2-077","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"Which techniques does Badaracco suggest to avoid rushing to conclusions or groupthink?","options":["Setting a strict 5-minute time limit","Sketching a decision tree and designating devil's advocates","Copying competitors' decisions","Voting anonymously in the team and simply following the majority view"],"answer_index":1,"explanation":"A rough decision tree and devil's advocates help find holes in your thinking."},{"id":"S2-078","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"Which ancient Chinese philosopher does Badaracco quote on promoting what is beneficial and eliminating what is harmful?","options":["Sun Tzu","Laozi","Mozi","Confucius"],"answer_index":2,"explanation":"Mozi: 'It is the business of the benevolent man to seek to promote what is beneficial to the world and to eliminate what is harmful.'"},{"id":"S2-079","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"What does the 'core obligations' question focus on?","options":["Duties to safeguard and respect the lives, rights and dignity of fellow human beings","Obligations to meet the quarterly targets agreed with the board","Legal duties toward tax authorities and industry regulators","Contractual obligations to suppliers and other business partners"],"answer_index":0,"explanation":"Beyond duties to shareholders, it asks about deeper human duties emphasized by all great religions."},{"id":"S2-080","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"Which contemporary ethicist does Badaracco quote saying 'No local loyalty can ever justify forgetting that each human being has responsibilities to every other'?","options":["Kwame Anthony Appiah","Michael Davis","Lawrence Kohlberg","Milton Friedman"],"answer_index":0,"explanation":"Appiah is quoted under the core obligations question."},{"id":"S2-081","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"What does Badaracco mean by using your 'moral imagination'?","options":["Imagining the most profitable future scenario for the company and its owners","Stepping out of your comfort zone and putting yourself in the shoes of all key stakeholders, especially the most vulnerable","Visualizing your own future promotion as motivation to decide boldly","Setting aside your biases so that you can decide faster than others"],"answer_index":1,"explanation":"Moral imagination involves recognizing biases and blind spots and imagining stakeholders' feelings and rights."},{"id":"S2-082","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"What does Badaracco say about managers' legal duty to serve the corporation?","options":["It means maximizing the short-term share price above everything else","It overrides all other human obligations a manager might have","It is a broad mandate that includes the well-being of workers, customers and the community","It applies only to board members, not to ordinary managers"],"answer_index":2,"explanation":"Managers have serious obligations to everyone simply because they are human beings."},{"id":"S2-083","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"The third question, 'What will work in the world as it is?', draws on whose thinking?","options":["Michael Davis","Milton Friedman","Kwame Anthony Appiah","Niccolò Machiavelli"],"answer_index":3,"explanation":"Machiavelli described an unpredictable world shaped by self-interest."},{"id":"S2-084","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"To answer 'What will work in the world as it is?', what does Badaracco say you need to map?","options":["The personality types of everyone on your team","The organizational chart and the formal reporting lines only","The force field of power around you: who wants what and how hard each can fight for it","The legal requirements that apply in each country of operation"],"answer_index":2,"explanation":"You must also be agile, even opportunistic, and play hardball when needed."},{"id":"S2-085","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"How does Badaracco respond to the idea that 'the world as it is' question is an 'out'?","options":["It is indeed meant to justify choosing the safest and most expedient option","It is not an excuse for expediency; it asks what will work with persistence, creativity and political savvy","It means avoiding any risk that could damage your own career","It means following the boss's preference whenever the situation is unclear"],"answer_index":1,"explanation":"It's easy to misinterpret as an excuse, but it is about making the right plan work."},{"id":"S2-086","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"Which saying does Badaracco use to introduce the 'Who are we?' question?","options":["'I am because we are.'","'Know thyself.'","'Culture eats strategy for breakfast.'","'The end justifies the means.'"],"answer_index":0,"explanation":"The African adage emphasizes that identities are shaped by the groups we belong to."},{"id":"S2-087","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"To answer 'Who are we?', what does Badaracco suggest thinking about?","options":["The organization's current market share compared with its competitors","The lowest-cost option available given the current budget","The CEO's personal preferences and leadership style","The defining stories of the group and which path best expresses what the organization stands for"],"answer_index":3,"explanation":"Imagine writing a sentence or chapter in your company's history."},{"id":"S2-088","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"Why does 'Who are we?' come fourth rather than first?","options":["It addresses you as an insider and risks an insular view, so the outsider-perspective questions should come first","It requires data that only becomes available later in the process","It is the least important of the five questions, so it is asked late","It only applies to family businesses with strong traditions"],"answer_index":0,"explanation":"We are naturally inclined to take care of our own; earlier questions counterbalance that."},{"id":"S2-089","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"According to Badaracco, good judgment relies on which two things?","options":["High-quality data and the algorithms used to analyze it","The best possible analysis of the situation and the values, ideals and experiences of the decision maker","Speed of decision making and the formal authority to enforce it","Consensus among stakeholders and a willingness to compromise"],"answer_index":1,"explanation":"Living with your decision requires both understanding and personal values."},{"id":"S2-090","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"An executive said he had to get his 'brain and gut into harmony'. Which question does this relate to?","options":["What can I live with?","What will work in the world as it is?","What are my core obligations?","Who are we?"],"answer_index":0,"explanation":"The fifth question asks you to choose, commit, act and live with the consequences."},{"id":"S2-091","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"What practical steps does Badaracco suggest for answering 'What can I live with?'","options":["Survey all employees and follow whatever the majority prefers","Reflect alone, imagine explaining your decision to a respected mentor, and write down your decision and reasons","Ask the legal department to make the final decision for you","Delay the decision until the problem resolves itself over time"],"answer_index":1,"explanation":"Writing forces clearer thinking and serves as personal commitment."},{"id":"S2-092","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"In the case study, who is Becky Friedman?","options":["A senior engineer at an international car manufacturer","An external consultant hired by the board to review performance","A vice president of human resources at a large commercial bank","A 27-year-old manager of a 14-person technology group at an online retailer"],"answer_index":3,"explanation":"She managed the technology group responsible for clothing sales."},{"id":"S2-093","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"What was the situation with Terry Fletcher in Badaracco's case?","options":["A recently hired employee who was clearly over-performing","A longer-tenured employee rated 3.5 by his previous boss who wasn't doing his part","A vice president who had been accused of financial fraud","A major customer who had threatened to sue the company"],"answer_index":1,"explanation":"Friedman believed his work did not merit 3.5 and he failed to follow through on development opportunities."},{"id":"S2-094","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"What made Friedman's situation a gray area?","options":["Her own team asked her to promote Fletcher instead of rating him","Fletcher threatened to sue the company if he received a low rating","Two vice presidents who were Fletcher's friends questioned her plan and suggested her management was the problem","Company rules prohibited giving low ratings to long-tenured staff"],"answer_index":2,"explanation":"The VPs' visit turned a black-and-white decision into a gray area."},{"id":"S2-095","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"Which options did Friedman consider?","options":["Promote Fletcher, demote herself, or resign from the company","Report the VPs, sue, or quit","Outsource the team, merge it, or close it","Stick to her plan, abandon it, or find a middle ground"],"answer_index":3,"explanation":"She weighed the consequences of each, including middle-ground options like further development opportunities."},{"id":"S2-096","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"What did Friedman ultimately decide in her counseling session with Fletcher?","options":["Put him on a PIP and lower his rating to 1.0 to force improvement","Give him a 2.5 rating but not put him on a PIP, and suggest he look for another job while continuing his work","Keep his 3.5 rating to satisfy the vice presidents and avoid conflict","Fire him immediately and explain the decision to the vice presidents"],"answer_index":1,"explanation":"She felt a PIP would be too demeaning; he eventually joined another company."},{"id":"S2-097","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"How does Badaracco evaluate the outcome of Friedman's decision?","options":["She had been lucky, but she put herself in a good position by getting the process right","She made the wrong decision, but it worked out by coincidence","Her success was guaranteed because she used all five questions","The vice presidents deserved the credit for the good outcome"],"answer_index":0,"explanation":"There was no guarantee Fletcher would react positively, but she followed a sound process and had other tactics ready."},{"id":"S2-098","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"What does Badaracco advise about using the five questions?","options":["Answer them in whatever order you personally prefer","Use only the one question that is most relevant to your situation","Systematically answer all five rather than picking your favorite","Use them only for decisions with legal implications"],"answer_index":2,"explanation":"Each question is an important voice in the long conversation about sound decisions."},{"id":"S2-099","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"According to the article's closing, what is a leader's job in gray areas?","options":["Finding the one rule that dictates the correct answer for you","Creating solutions using judgment, not merely finding them","Avoiding personal responsibility for the outcome","Waiting for someone more senior to decide"],"answer_index":1,"explanation":"'In gray areas, your job isn't finding solutions; it's creating them, relying on your judgment.'"},{"id":"S2-100","type":"reading","week":2,"topic":"Ethics","doc":"How to Tackle Your Toughest Decisions","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"Friedman's company had always claimed to be what kind of organization, a factor she weighed under 'Who are we?'","options":["A family business built mainly on loyalty to its many long-serving staff","A meritocracy with high standards and a sharp focus on customer needs","A government-like organization bound by strict seniority rules","A nonprofit organization focused primarily on philanthropy"],"answer_index":1,"explanation":"Her group prided itself on professional performance, which counted against tolerating underperformance."},{"id":"S3-071","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 2","question":"According to an HBS Online analysis of engineering job postings (Lightcast data), roughly what share of employers require communication skills?","options":["Around half","Around one-third","Nearly all","Around one-tenth of employers"],"answer_index":1,"explanation":"The article states about one-third of employers require them."},{"id":"S3-072","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 2","question":"What does the article identify as critical to success for engineering leaders?","options":["Avoiding stakeholders outside engineering to protect focus","Translating technical topics into simplified terms and confidently supporting ideas","Keeping technical details confidential from non-engineers","Writing code faster and more accurately than anyone on the team"],"answer_index":1,"explanation":"Engineering leaders present complex concepts to departments and stakeholders."},{"id":"S3-073","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 3","question":"According to the article, what is the biggest benefit of active listening for a leader?","options":["Reducing meeting time","Speaking less often in meetings","Understanding your audience","Avoiding conflict"],"answer_index":2,"explanation":"Margolis: understanding and empathizing with your audience and tailoring communication to it."},{"id":"S3-074","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 3","question":"Which tip for active listening appears in the article?","options":["Avoid paraphrasing to save time","Interrupt with your own ideas and opinions to show engagement","Ask open-ended questions to elicit more detailed responses","Keep your phone visible for urgent calls"],"answer_index":2,"explanation":"Other tips: full attention, avoid distractions, open body language, paraphrase."},{"id":"S3-075","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 3","question":"Why does the article recommend phrases like 'tell me more' and 'define that for me'?","options":["They remove the need to give the person feedback","They signal disagreement in a polite, indirect way","They help to shorten long and unfocused conversations","They elicit better answers than yes-or-no questions"],"answer_index":3,"explanation":"Technique 2, Ask Questions, is essential to active listening."},{"id":"S3-076","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 4","question":"Which of the following is NOT one of the 'six C's of communication'?","options":["Conviction","Courage","Control","Compassion"],"answer_index":2,"explanation":"The six C's: Compassion, Clarity, Conciseness, Connection, Conviction, Courage."},{"id":"S3-077","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 4","question":"In the six C's, which C means 'infusing your communication with a sense of personal investment and commitment'?","options":["Courage","Conviction","Connection","Compassion"],"answer_index":1,"explanation":"Conviction is personal investment and commitment."},{"id":"S3-078","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 4","question":"In the six C's, which C means 'exuding confidence in the face of uncertainty, risk or danger'?","options":["Connection","Clarity","Conviction","Courage"],"answer_index":3,"explanation":"Courage concerns confidence under uncertainty or risk."},{"id":"S3-079","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 4","question":"In the six C's, which C means 'ensuring your message is clear to someone unfamiliar with the situation'?","options":["Clarity","Conciseness","Connection","Compassion"],"answer_index":0,"explanation":"Conciseness, by contrast, means the message is no longer than it needs to be."},{"id":"S3-080","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 4","question":"How does the article define 'data storytelling'?","options":["Presenting raw data without interpretation so people decide","Writing fictional case studies to illustrate data concepts","Storing qualitative stories in a structured database","Communicating insights from a data set using narratives and visualizations to inspire action"],"answer_index":3,"explanation":"Data storytelling is suggested as a way to strengthen public speaking."},{"id":"S3-081","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 5","question":"According to Anthony Mayo, a 'statement of direction' should do which of the following?","options":["List every task employees must complete in the coming year","Replace the company's existing mission statement entirely","Announce upcoming compensation and promotion changes clearly","Meet employees where they are, show where the organization is going, and offer a roadmap to bridge the gap"],"answer_index":3,"explanation":"How you communicate direction is as essential as the direction itself."},{"id":"S3-082","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 5","question":"Which of the eight techniques is most directly tied to emotional intelligence in the article?","options":["Show empathy","Practice public speaking","Establish a communication strategy","Be clear and concise"],"answer_index":0,"explanation":"Empathy relates to compassion, one of the six C's, and builds trust and engagement."},{"id":"S3-083","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 6","question":"When giving feedback, what does 'save time for inquiry' mean in the article?","options":["Incorporate questions at the beginning of the conversation to understand the other person's perspective","Ask HR to investigate the situation before giving feedback","Keep the feedback session as short as possible to reduce stress","Leave all questions for a follow-up email after the meeting"],"answer_index":0,"explanation":"Other tips: exercise empathy, prepare, speak in specifics, focus on the future."},{"id":"S3-084","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 6","question":"Why does the article recommend 'speaking in specifics' when giving feedback?","options":["To avoid discussing emotions","To make the feedback sound more formal","To shorten the conversation","To communicate a problem's root cause"],"answer_index":3,"explanation":"Specific feedback identifies the root cause of the problem."},{"id":"S3-085","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 6","question":"What should leaders do with feedback they receive, according to the article?","options":["Respond immediately with counter-feedback so the discussion stays balanced","Ignore it unless it comes from their own superiors","Act on it to show they value the team and are serious about improving","Forward it to HR so it can be filed in their records"],"answer_index":2,"explanation":"Leaders set an example, encouraging employees to do the same."},{"id":"S3-086","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 6","question":"Which concept does the article say leaders use to develop a workplace communication strategy?","options":["Contextual intelligence","Artificial intelligence tools","Market intelligence","Cognitive intelligence"],"answer_index":0,"explanation":"Contextual intelligence focuses on understanding dynamics and landscape; at the micro level it applies to relationships."},{"id":"S3-087","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 7","question":"How does the article define workplace culture?","options":["The physical design and layout of the company's offices","The internal set of values and beliefs expressed in how employees interact and behave","The list of holidays and social events the company organizes","The company's official dress code and office etiquette rules"],"answer_index":1,"explanation":"Culture is largely influenced by how effectively leaders communicate with their teams."},{"id":"S3-088","type":"reading","week":3,"topic":"Effective Communication","doc":"8 Communication Techniques Engineering Leaders Need","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 7","question":"According to Margolis, what does communication do in an organization?","options":["It replaces the need for a strategy and an organizational structure","Sets an agenda, informs and builds understanding, and aligns with organizational objectives","It mainly entertains and motivates employees during hard times","It reports past results to shareholders and regulators"],"answer_index":1,"explanation":"It is also critical for inspiring the team toward a possible future."},{"id":"S3-089","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 1","question":"What did McKinsey's 1997 'War for Talent' advise companies to do?","options":["Focus on recruiting and retaining the 'best and the brightest' and invest in A players","Hire primarily for shared values and mission rather than for specific current technical skills","Reduce workforce diversity in order to increase team cohesion","Reward team performance more than individual star performance"],"answer_index":0,"explanation":"It recommended compelling employee value propositions and investment in A players."},{"id":"S3-090","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"Why, according to Satell and Windschitl, did the 'War for Talent' approach fail to yield results?","options":["It was restricted by regulators after several legal challenges","It ignored technical skills in favor of personality and values","It was too expensive for most companies to implement properly","Perverse incentives focused on individuals rather than teams encouraged employees to undermine colleagues"],"answer_index":3,"explanation":"There is evidence it contributed to Enron's destructive culture."},{"id":"S3-091","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"Which company's downfall do the authors link to the 'War for Talent' focus on individual performance?","options":["Kodak","Enron","Nokia","Volkswagen"],"answer_index":1,"explanation":"The focus on individual rather than team performance encouraged employees to undermine colleagues."},{"id":"S3-092","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"What lesson do the authors draw from the failure of the individual-star approach?","options":["Only A players should be hired","Creative work should be done alone","It is not individuals, but teams, that get results","Teams are generally less productive than talented individuals"],"answer_index":2,"explanation":"This is especially true in high-value work like creative work, complex analysis and scientific research."},{"id":"S3-093","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"According to the MIT and Carnegie Mellon study cited, high-performing teams are made up of people who:","options":["Have the highest individual IQ scores in their organization","Work independently with minimal interaction with one another","Come from the same educational and professional background","Have high social sensitivity, take turns speaking and include women in the group"],"answer_index":3,"explanation":"The study examined what makes teams perform most efficiently and productively."},{"id":"S3-094","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"What do the authors call perhaps the most important trait of any team?","options":["Members share the same personality type, background and preferred working style","Members contribute a diversity of talents, experiences and perspectives","Members have worked together closely for many years","Members are led by one strong individual star performer"],"answer_index":1,"explanation":"Diversity maximizes the possibilities explored and leads to more innovative solutions."},{"id":"S3-095","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"What is the 'diversity paradox' described in the article?","options":["Diversity improves performance, yet diverse teams also face obstacles, resistance and tribal hostility","Diversity has no measurable effect on team performance at all","Diverse teams never experience conflict, so they underperform","Diversity always reduces performance, even though it is popular"],"answer_index":0,"explanation":"Evidence for diversity's benefits is overwhelming, but challenges such as tribalism are real."},{"id":"S3-096","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"The McKinsey report covering 366 public companies found what?","options":["Homogeneous groups of high-ability individuals performed significantly better","Ethnically and gender-diverse groups performed significantly better","Diversity had no measurable effect on financial results","Only gender diversity, not ethnic diversity, mattered"],"answer_index":1,"explanation":"Another study found ethnic diversity deflated price bubbles in simulated markets."},{"id":"S3-097","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"Studies of adults randomly assigned to 'leopards' and 'tigers' showed what?","options":["Adults showed no preference for their own assigned group","Members of mixed groups immediately bonded with each other regardless of labels","Enmity toward outgroup members, suggesting some tribalism is unavoidable","Random assignment to groups eliminated all forms of bias"],"answer_index":2,"explanation":"Similar results were found in five-year-old children and even infants."},{"id":"S3-098","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 3","question":"According to the authors, what is the best way to build teams that are diverse enough to innovate but cohesive enough to work together?","options":["Hire only people with similar backgrounds","Rely on individual financial incentives","Separate diverse members into different teams","Build a culture of strong, shared values"],"answer_index":3,"explanation":"Leaders must 'square the circle' through shared mission and values."},{"id":"S3-099","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 3","question":"Which example do the authors use to show values attracting customers and talent?","options":["Steve Jobs' commitment to fusing design with technology","Enron's culture of intense internal competition among stars","McKinsey's model of investing in A players","Kodak's long-standing focus on film products"],"answer_index":0,"explanation":"More recently, Tim Cook has leveraged the value of privacy in much the same way."},{"id":"S3-100","type":"reading","week":4,"topic":"Building and Managing Teams","doc":"High-Performing Teams Start with a Culture of Shared Values","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 3","question":"What 'fundamental difference' in hiring do the authors highlight?","options":["Hiring experienced professionals versus recruiting and training inexperienced graduates","Hiring locally versus recruiting talent from around the world","Hiring permanent employees versus using temporary contractors","Hiring people to do what you want versus hiring people who already want what you want"],"answer_index":3,"explanation":"Skill value degrades over time, but people who share your mission can acquire the skills needed."},{"id":"S4-071","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 3","question":"According to Groysberg et al., how do strategy and culture differ as leadership levers?","options":["Strategy is informal and unwritten, while culture is written into contracts","They are identical levers that work through the same mechanisms","Strategy gives a formal logic for goals; culture expresses goals through values, beliefs and shared norms","Strategy is set by frontline employees, while culture is set by the board"],"answer_index":2,"explanation":"Strategy orients people around goals; culture works through shared assumptions and group norms."},{"id":"S4-072","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"Why do the authors call culture a 'more elusive lever' than strategy?","options":["It is measured only through a fixed set of financial performance indicators each year","It is protected by employment law and cannot be changed","Much of it is anchored in unspoken behaviors, mindsets and social patterns","It can only be changed by external management consultants"],"answer_index":2,"explanation":"Leaders often let culture go unmanaged or relegate it to HR."},{"id":"S4-073","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"Which of the following is NOT one of the four generally accepted attributes of culture identified by the authors?","options":["Pervasive","Shared","Enduring","Explicit"],"answer_index":3,"explanation":"The four attributes are shared, pervasive, enduring and implicit."},{"id":"S4-074","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"Which model explains why culture is 'enduring', according to the article?","options":["Kurt Lewin's force-field analysis of change","Benjamin Schneider's attraction-selection-attrition model","Friedrich Glasl's nine-level model of conflict escalation stages","Lawrence Kohlberg's stages of moral development"],"answer_index":1,"explanation":"People are drawn to similar organizations, organizations select those who fit, and misfits leave."},{"id":"S4-075","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"Culture acting as a 'silent language' that people are hardwired to recognize illustrates which attribute?","options":["Shared","Enduring","Implicit","Pervasive"],"answer_index":2,"explanation":"Despite its subliminal nature, people instinctively respond to culture."},{"id":"S4-076","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"How do the authors define culture?","options":["The tacit social order of an organization that shapes attitudes and behaviors in wide-ranging and durable ways","The written policies and rules in the employee handbook","The organization's legal structure and ownership","The CEO's personal preferences and management style"],"answer_index":0,"explanation":"Cultural norms define what is encouraged, discouraged, accepted or rejected."},{"id":"S4-077","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"How does the article contrast who determines strategy and culture?","options":["Culture is set by the HR department, while strategy is set by the marketing department","Both strategy and culture are set by shareholders at the annual general meeting","Both strategy and culture are determined only by frontline employees through daily work","Strategy is typically determined by the C-suite, while culture blends top leaders' intentions with frontline employees' knowledge and experiences"],"answer_index":3,"explanation":"Culture can evolve flexibly and autonomously."},{"id":"S4-078","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 5","question":"Cultures that lean toward 'independence' on the people-interactions dimension place greater value on:","options":["Autonomy, individual action and competition","Rules and seniority-based staffing","Integration, coordination and managing relationships","Consistency and predictability"],"answer_index":0,"explanation":"Interdependent cultures emphasize integration, relationships and coordinated group effort."},{"id":"S4-079","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 5","question":"Cultures that favor 'stability' in their response to change tend to:","options":["Pursue idealism, sustainability and global community goals","Prioritize innovation, openness, diversity and a longer-term orientation over efficiency","Emphasize fun, spontaneity and a sense of humor at work","Follow rules, use control structures, reinforce hierarchy and strive for efficiency"],"answer_index":3,"explanation":"Flexible cultures prioritize innovation, openness, diversity and longer-term orientation."},{"id":"S4-080","type":"reading","week":5,"topic":"Organizational Awareness","doc":"The Leader's Guide to Corporate Culture","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 5","question":"In the integrated culture framework, which styles are adjacent and therefore coexist easily?","options":["Enjoyment and order","Safety and order","Authority and purpose","Safety and learning"],"answer_index":1,"explanation":"Proximate styles (safety & order, learning & enjoyment) co
