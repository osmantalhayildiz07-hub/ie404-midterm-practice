lyze → Sell → Delete","Purpose → Profit → Publication → Protection → Review","Need → Permission → Purpose → Protection → Accountability","Permission → Need → Profit → Publicity → Retention"],"answer_index":2,"explanation":"Do we need it? Are we authorized? For what purpose? How protected? Who is responsible?"},{"id":"S2-036","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 35","question":"Which motto appears repeatedly on the ethics slides?","options":["Ethics is whatever the majority of employees accepts","Ethics starts where the law ends, and the law is founded upon ethics","If something is legal, it is automatically ethical as well","The law starts where ethics ends, and ethics should simply follow the law"],"answer_index":1,"explanation":"The slides repeat 'Ethics starts where the law ends and the law is founded upon ethics.'"},{"id":"S2-037","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 38","question":"In the Towers Watson ethical decision model, what is the FIRST question?","options":["Would I be embarrassed if it appeared in the media?","Is it legal?","Is it profitable?","Does my manager approve?"],"answer_index":1,"explanation":"Sequence: Is it legal? → Consistent with values? → Embarrassed if in the media? → Okay to proceed."},{"id":"S2-038","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 40","question":"In Michael Davis's seven-step guide, which step comes right after 'Check the facts'?","options":["Make a choice and accept responsibility","Test the options","Identify relevant factors","Develop the options"],"answer_index":2,"explanation":"1 State the problem, 2 Check the facts, 3 Identify relevant factors, 4 Develop options, 5 Test options, 6 Make a choice, 7 Review & learn."},{"id":"S2-039","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 40","question":"In Davis's model, which step says 'Don't accept only A or B. Generate alternatives'?","options":["Review & learn","State the problem","Develop options","Test the options"],"answer_index":2,"explanation":"Step 4, Develop options, emphasizes generating alternatives."},{"id":"S2-040","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 42","question":"Which step of Davis's model does the lecture call 'the most Industrial Engineering part'?","options":["Make a choice","Review & learn","Check the facts","State the problem"],"answer_index":1,"explanation":"Review & learn asks why the dilemma arose and how to change the system — root-cause and continuous improvement thinking."},{"id":"S2-041","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 42","question":"After an ethical failure such as Volkswagen, what does the lecture recommend beyond punishing one person?","options":["Keep the issue confidential to protect the company's reputation","Replace all engineers involved immediately and move on","Change the system — ask what organizational conditions allowed the behavior","Increase sales targets to recover the financial losses quickly"],"answer_index":2,"explanation":"'CHANGE THE SYSTEM — NOT ONLY THE DECISION': check targets, incentives, processes, culture and controls."},{"id":"S2-042","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 43","question":"How does the lecture summarize ethical decision-making for engineers?","options":["Structured problem solving with human values included","An intuitive process that cannot really be structured or taught","A task best delegated to AI","A purely legal compliance exercise"],"answer_index":0,"explanation":"It mirrors Define → Analyze → Generate → Evaluate → Decide → Improve."},{"id":"S2-043","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 43","question":"What role does the lecture give AI in ethical decisions?","options":["Use AI only to write the final justification after deciding","Avoid using AI in any question that has an ethical dimension","Use AI to make your ethical reasoning more complete, not to make the decision","Let AI make the ethical decision, since it removes human bias"],"answer_index":2,"explanation":"'Don't ask AI to make the ethical decision. Use AI to make your ethical reasoning more complete.'"},{"id":"S2-044","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 44","question":"Which test asks 'Would I consider this fair if I were the person negatively affected?'","options":["Harm test","Reversibility test","Organization test","Publicity (acid) test"],"answer_index":1,"explanation":"The reversibility test puts you on the other side of the decision."},{"id":"S2-045","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 45","question":"What important limitation does the lecture note about the publicity ('acid') test?","options":["It has replaced the law as the main standard in most countries","It applies only to publicly listed companies with media exposure","Public acceptability is not automatically ethical, so it is a warning signal, not the final decision rule","It is the only test that really matters in practice"],"answer_index":2,"explanation":"Something popular can be ethically questionable, and something ethically defensible can be unpopular."},{"id":"S2-046","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 45","question":"What is the 'AI-era acid test'?","options":["Is using the AI cheaper than hiring a human analyst?","Could the AI have reached the same decision much faster than me?","Would the AI system itself approve of my decision?","Would I be comfortable disclosing that AI was used this way?"],"answer_index":3,"explanation":"If management wants to hide the role AI played, ask 'why?' — an excellent transparency test."},{"id":"S2-047","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 47","question":"Which statement is acceptable according to the lecture's 'last warning'?","options":["'The model recommended it, so I simply followed the data.'","'My boss told me to do it, so the responsibility is theirs.'","'Everybody in the meeting agreed, so it was a team decision.'","'I made the best defensible decision with the information available, and I own it.'"],"answer_index":3,"explanation":"Never hide behind the boss, the model, AI or consensus — make the best defensible decision and own it."},{"id":"S2-048","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 48","question":"Why does the lecture say business ethics is not only individual ethics?","options":["Individuals never really influence the ethics of their organization at all","Good people can make bad decisions inside badly designed systems","Only the CEO's ethics matter","Systems are always more ethical than people"],"answer_index":1,"explanation":"Ethical business = ethical people + ethical systems; targets, incentives and pressure shape behavior."},{"id":"S2-049","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 49","question":"According to the lecture, ethical behavior equals:","options":["Profit + Compliance + Reputation","Rules + Fear + Control","Values + Judgment + Courage","Knowledge + Skills + Abilities"],"answer_index":2,"explanation":"Values (what is important), judgment (what is right), courage (willingness to act)."},{"id":"S2-050","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 50","question":"In Kohlberg's levels of moral reasoning shown in the lecture, what is the LOWEST level?","options":["Good person attitude","Law & order","Aiming at reward","Avoiding punishment"],"answer_index":3,"explanation":"The pyramid from bottom to top: avoiding punishment, aiming at reward, good person attitude, law & order, justice, ethics."},{"id":"S2-051","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 50","question":"In the Kohlberg pyramid presented, which level lies directly above 'Law & order'?","options":["Justice","Good person attitude","Aiming at reward","Ethics"],"answer_index":0,"explanation":"Order: avoiding punishment → aiming at reward → good person attitude → law & order → justice → ethics."},{"id":"S2-052","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 51","question":"When does the lecture say ethics 'becomes visible'?","options":["When there is a cost to your choice","When everyone agrees","When a new law is passed","When a company formally publishes its list of values"],"answer_index":0,"explanation":"The real test comes when doing the right thing may cost money, promotion, approval or relationships."},{"id":"S2-053","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 54","question":"Your colleague confides they will leave in two months. How does the situation change if they instead confide 'I discovered a serious safety problem, but please don't tell anyone'?","options":["You must immediately post the information publicly to warn others","Confidentiality may no longer be absolute because serious harm to others is involved","Nothing changes, because a promise of confidentiality is always absolute","Confidentiality becomes even more binding because safety is sensitive"],"answer_index":1,"explanation":"A promise of confidentiality is important but not necessarily absolute when serious harm is involved."},{"id":"S2-054","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 55","question":"In the departing-colleague case, what does the lecture suggest as a socially intelligent 'responsible C'?","options":["Immediately tell the manager everything without telling the colleague first","Ask HR to fire the colleague early","Speak first with the colleague about how and when to communicate the departure","Say nothing until the colleague leaves"],"answer_index":2,"explanation":"This attempts to protect both legitimate interests instead of choosing one side."},{"id":"S2-055","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 56","question":"The railway-track case (one child on the unused track vs. many on the active track) is used to illustrate which point?","options":["Not everything important can be reduced to one objective function","An individual's rights should always override the group's interests","The majority's interests should always override the individual's","Engineers should avoid making moral decisions altogether"],"answer_index":0,"explanation":"Majority interests and individual rights can conflict; both must be considered (Group vs. Individual)."},{"id":"S2-056","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 59","question":"An excellent employee is at the top of his salary range and cannot be promoted. Which question does the lecture ask about the organization?","options":["Should formal performance reviews simply be abolished?","Should the salary range be kept secret?","Do our systems reward the behavior we say we value?","Should the employee be asked to leave?"],"answer_index":2,"explanation":"Alternatives include a recognition bonus or expanded responsibilities; ethics includes consistency between promises and systems."},{"id":"S2-057","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 61","question":"You built a powerful spreadsheet program at work in your spare time. Which question is NOT among those the lecture uses to decide ownership?","options":["What do the employment or IP provisions say?","Were company computers, software or data used?","Was it developed during working hours?","How much would a competitor pay for it?"],"answer_index":3,"explanation":"Ownership questions: When? With what? Why? Using what information? What does the agreement say?"},{"id":"S2-058","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 63","question":"What key distinction does the lecture make about employee-created work products?","options":["Ownership and confidentiality are different questions","Ownership always belongs to the employee","Creating something automatically allows you to sell it","Confidentiality ends when the employee leaves"],"answer_index":0,"explanation":"Even if you own a spreadsheet, it may contain company formulas, customer data or proprietary processes."},{"id":"S2-059","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 64","question":"According to the CSR 'responsible to whom?' slide, what does a company owe its CUSTOMERS?","options":["Quality, safety and honest information","Sustainable use of resources","Return and long-term value","Fairness, safety and personal development"],"answer_index":0,"explanation":"Shareholders → return; employees → fairness, safety, development; customers → quality, safety, honest information; environment → sustainability."},{"id":"S2-060","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 65","question":"An IE project cuts cost by 15% but eliminates 100 jobs, increases energy use and waste. What does the lecture recommend?","options":["Ignore the non-financial effects, because they cannot be measured reliably","Declare the project a success, since a 15% cost reduction meets the stated objective","Cancel all cost-reduction projects because they always end up harming employees","Expand the objective function — optimize value subject to safety, employee, environmental and ethical constraints"],"answer_index":3,"explanation":"Success depends on how it is defined; responsible management optimizes value, not only minimizes cost."},{"id":"S2-061","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 66","question":"In the four-level CSR view, which level is described as 'Be viable — create value, remain competitive, provide jobs'?","options":["Philanthropic","Legal","Ethical","Economic"],"answer_index":3,"explanation":"A company that cannot survive economically cannot sustain its other responsibilities."},{"id":"S2-062","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 66","question":"What does the lecture say about philanthropy as part of CSR?","options":["A company cannot mistreat stakeholders and then become 'responsible' simply by donating money","Philanthropy is the most important of the four CSR levels for any company","Philanthropy is a legal requirement for companies above a certain size","Philanthropy can replace ethical responsibilities if the donations are large"],"answer_index":0,"explanation":"Philanthropic contributions are voluntary and cannot compensate for unethical conduct."},{"id":"S2-063","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 68","question":"According to Milton Friedman's Free Market View, what is the primary responsibility of business?","options":["To donate a fixed share of its profits to social causes","To create economic value for owners while operating within the rules","To solve every social problem in the community where it operates today","To maximize employee satisfaction even above profitability"],"answer_index":1,"explanation":"FMV: create economic value, serve owners' interests, compete, and operate within law and ethical norms."},{"id":"S2-064","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 70","question":"According to the 'New Frontier — AI Ethics' slide, what does AI do to good and bad decisions?","options":["It makes decisions slower but fairer","It eliminates bad decisions","It scales both","It scales only good decisions"],"answer_index":2,"explanation":"AI can make millions of decisions quickly, scaling both good and bad ones."},{"id":"S2-065","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 71","question":"Which principle does the lecture state as an IE 404 principle?","options":["Profitable is always ethical in the long run","Efficient is always ethical","Optimal is not necessarily ethical","Legal is always ethical"],"answer_index":2,"explanation":"OPTIMAL ≠ NECESSARILY ETHICAL; likewise technically feasible, legal, profitable and efficient ≠ ethical."},{"id":"S2-066","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 72","question":"Among the 5 pillars of responsible AI, which pillar asks 'What happens when the AI is wrong?'","options":["Fairness & bias","Accountability","Transparency & explainability","Safety & reliability"],"answer_index":3,"explanation":"Fairness (treated fairly?), Transparency (can we explain?), Privacy (should we collect?), Safety (when wrong?), Accountability (who owns it?)."},{"id":"S2-067","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 74","question":"What are the steps to establish an ethics management program?","options":["Run engagement surveys, set ethics targets, and pay bonuses","Hire auditors, fine every violator, and publish the results annually","Create a hotline, dismiss offenders, and issue a press release","Write a code of ethics, write and apply policies and procedures, give training"],"answer_index":3,"explanation":"Ethics should be managed as a program rather than a one-shot effort."},{"id":"S2-068","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 75","question":"'Employees will work in compliance with working hours defined by law' versus 'Working hours are 3 shifts/day totalling 45 hours/week'. How are these two statements classified?","options":["Both statements are legally binding clauses of the employment contract","The first is a code of ethics statement; the second is a policy/procedure (code of conduct)","Both statements are codes of ethics written at different levels of detail","The first is a policy/procedure; the second is a code of ethics statement"],"answer_index":1,"explanation":"The code of ethics states the principle; the policy/procedure operationalizes it."},{"id":"S2-069","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 83","question":"According to the lecture, what is one of the STRONGEST forms of ethics training?","options":["Reading the code of ethics carefully once a year","Signing a compliance form","Practice in resolving complex ethical dilemmas","Watching a short video at orientation"],"answer_index":2,"explanation":"Involving staff in reviewing codes and policies is also strong training."},{"id":"S2-070","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 84","question":"Rationalizations like 'Everyone else does it' and 'No one will know' should be prevented by considering 'RRR'. What does RRR stand for?","options":["Reputation, Revenue, Return on investment","Rules, Rewards, Risks","Report, Review, Repeat","Respect, Responsibility, Results"],"answer_index":3,"explanation":"The slide asks you to 'feel' Respect, Responsibility, Results."},{"id":"S2-071","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 2","question":"According to Badaracco, where do the toughest management calls arise?","options":["In emergencies, where there is no time at all to gather data","In routine operational decisions that are repeated every day","In gray areas, where facts and analysis are done but you still don't know what to do","In decisions that are fully covered by an existing company policy"],"answer_index":2,"explanation":"Gray areas are situations where you've gathered facts and analyzed but the answer remains unclear."},{"id":"S2-072","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 2","question":"How does Badaracco describe 'judgment'?","options":["Following the majority opinion of the management team","A purely rational calculation of all the measurable costs and benefits","An inborn instinct that cannot be improved through practice","A fusion of thinking, feelings, experience, imagination and character"],"answer_index":3,"explanation":"Judgment is hard to define but blends these elements; five questions can improve it."},{"id":"S2-073","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"Which of the following is NOT one of Badaracco's five questions?","options":["What can I live with?","What are my core obligations?","What would maximize next quarter's profit?","What are the net, net consequences of all my options?"],"answer_index":2,"explanation":"The five: net, net consequences; core obligations; what will work in the world as it is; who are we; what can I live with."},{"id":"S2-074","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"What is the FIRST of Badaracco's five questions?","options":["What are the net, net consequences of all my options?","What will work in the world as it is?","What can I personally live with?","Who are we, and what do we stand for as an organization?"],"answer_index":0,"explanation":"The first question asks you to consider every course of action and its full human consequences."},{"id":"S2-075","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"What does Badaracco warn about the 'net, net consequences' question?","options":["It should be answered alone, without involving advisers or experts","It requires precise and accurate forecasting of the future","It only applies to the financial outcomes of each option","Don't confuse it with cost-benefit analysis or focus solely on what you can count or price"],"answer_index":3,"explanation":"Gray-area problems require thinking broadly, deeply and imaginatively about the full impact of choices."},{"id":"S2-076","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"A CEO told Badaracco 'The lonely leader on Olympus is really a bad model.' What does this support?","options":["Delegating the decision entirely to the most senior expert","Making the decision quickly and alone to show strong leadership","Gathering a group of trusted advisers and experts when analyzing options","Relying mainly on gut instinct rather than on analysis"],"answer_index":2,"explanation":"Gray-area problems are rarely solved by one person's intuition."},{"id":"S2-077","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"Which techniques does Badaracco suggest to avoid rushing to conclusions or groupthink?","options":["Copying competitors' decisions","Voting anonymously in the team and simply following the majority view","Sketching a decision tree and designating devil's advocates","Setting a strict 5-minute time limit"],"answer_index":2,"explanation":"A rough decision tree and devil's advocates help find holes in your thinking."},{"id":"S2-078","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"Which ancient Chinese philosopher does Badaracco quote on promoting what is beneficial and eliminating what is harmful?","options":["Laozi","Mozi","Sun Tzu","Confucius"],"answer_index":1,"explanation":"Mozi: 'It is the business of the benevolent man to seek to promote what is beneficial to the world and to eliminate what is harmful.'"},{"id":"S2-079","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"What does the 'core obligations' question focus on?","options":["Duties to safeguard and respect the lives, rights and dignity of fellow human beings","Obligations to meet the quarterly targets agreed with the board","Legal duties toward tax authorities and industry regulators","Contractual obligations to suppliers and other business partners"],"answer_index":0,"explanation":"Beyond duties to shareholders, it asks about deeper human duties emphasized by all great religions."},{"id":"S2-080","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"Which contemporary ethicist does Badaracco quote saying 'No local loyalty can ever justify forgetting that each human being has responsibilities to every other'?","options":["Lawrence Kohlberg","Kwame Anthony Appiah","Milton Friedman","Michael Davis"],"answer_index":1,"explanation":"Appiah is quoted under the core obligations question."},{"id":"S2-081","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"What does Badaracco mean by using your 'moral imagination'?","options":["Setting aside your biases so that you can decide faster than others","Visualizing your own future promotion as motivation to decide boldly","Imagining the most profitable future scenario for the company and its owners","Stepping out of your comfort zone and putting yourself in the shoes of all key stakeholders, especially the most vulnerable"],"answer_index":3,"explanation":"Moral imagination involves recognizing biases and blind spots and imagining stakeholders' feelings and rights."},{"id":"S2-082","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 3","question":"What does Badaracco say about managers' legal duty to serve the corporation?","options":["It means maximizing the short-term share price above everything else","It overrides all other human obligations a manager might have","It is a broad mandate that includes the well-being of workers, customers and the community","It applies only to board members, not to ordinary managers"],"answer_index":2,"explanation":"Managers have serious obligations to everyone simply because they are human beings."},{"id":"S2-083","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"The third question, 'What will work in the world as it is?', draws on whose thinking?","options":["Niccolò Machiavelli","Michael Davis","Milton Friedman","Kwame Anthony Appiah"],"answer_index":0,"explanation":"Machiavelli described an unpredictable world shaped by self-interest."},{"id":"S2-084","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"To answer 'What will work in the world as it is?', what does Badaracco say you need to map?","options":["The organizational chart and the formal reporting lines only","The legal requirements that apply in each country of operation","The force field of power around you: who wants what and how hard each can fight for it","The personality types of everyone on your team"],"answer_index":2,"explanation":"You must also be agile, even opportunistic, and play hardball when needed."},{"id":"S2-085","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"How does Badaracco respond to the idea that 'the world as it is' question is an 'out'?","options":["It is not an excuse for expediency; it asks what will work with persistence, creativity and political savvy","It means avoiding any risk that could damage your own career","It is indeed meant to justify choosing the safest and most expedient option","It means following the boss's preference whenever the situation is unclear"],"answer_index":0,"explanation":"It's easy to misinterpret as an excuse, but it is about making the right plan work."},{"id":"S2-086","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"Which saying does Badaracco use to introduce the 'Who are we?' question?","options":["'Culture eats strategy for breakfast.'","'The end justifies the means.'","'Know thyself.'","'I am because we are.'"],"answer_index":3,"explanation":"The African adage emphasizes that identities are shaped by the groups we belong to."},{"id":"S2-087","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"To answer 'Who are we?', what does Badaracco suggest thinking about?","options":["The lowest-cost option available given the current budget","The CEO's personal preferences and leadership style","The organization's current market share compared with its competitors","The defining stories of the group and which path best expresses what the organization stands for"],"answer_index":3,"explanation":"Imagine writing a sentence or chapter in your company's history."},{"id":"S2-088","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"Why does 'Who are we?' come fourth rather than first?","options":["It is the least important of the five questions, so it is asked late","It addresses you as an insider and risks an insular view, so the outsider-perspective questions should come first","It requires data that only becomes available later in the process","It only applies to family businesses with strong traditions"],"answer_index":1,"explanation":"We are naturally inclined to take care of our own; earlier questions counterbalance that."},{"id":"S2-089","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"According to Badaracco, good judgment relies on which two things?","options":["The best possible analysis of the situation and the values, ideals and experiences of the decision maker","Speed of decision making and the formal authority to enforce it","High-quality data and the algorithms used to analyze it","Consensus among stakeholders and a willingness to compromise"],"answer_index":0,"explanation":"Living with your decision requires both understanding and personal values."},{"id":"S2-090","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"An executive said he had to get his 'brain and gut into harmony'. Which question does this relate to?","options":["What can I live with?","What will work in the world as it is?","What are my core obligations?","Who are we?"],"answer_index":0,"explanation":"The fifth question asks you to choose, commit, act and live with the consequences."},{"id":"S2-091","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"What practical steps does Badaracco suggest for answering 'What can I live with?'","options":["Survey all employees and follow whatever the majority prefers","Reflect alone, imagine explaining your decision to a respected mentor, and write down your decision and reasons","Ask the legal department to make the final decision for you","Delay the decision until the problem resolves itself over time"],"answer_index":1,"explanation":"Writing forces clearer thinking and serves as personal commitment."},{"id":"S2-092","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"In the case study, who is Becky Friedman?","options":["A 27-year-old manager of a 14-person technology group at an online retailer","A senior engineer at an international car manufacturer","A vice president of human resources at a large commercial bank","An external consultant hired by the board to review performance"],"answer_index":0,"explanation":"She managed the technology group responsible for clothing sales."},{"id":"S2-093","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 4","question":"What was the situation with Terry Fletcher in Badaracco's case?","options":["A vice president who had been accused of financial fraud","A longer-tenured employee rated 3.5 by his previous boss who wasn't doing his part","A recently hired employee who was clearly over-performing","A major customer who had threatened to sue the company"],"answer_index":1,"explanation":"Friedman believed his work did not merit 3.5 and he failed to follow through on development opportunities."},{"id":"S2-094","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"What made Friedman's situation a gray area?","options":["Company rules prohibited giving low ratings to long-tenured staff","Fletcher threatened to sue the company if he received a low rating","Her own team asked her to promote Fletcher instead of rating him","Two vice presidents who were Fletcher's friends questioned her plan and suggested her management was the problem"],"answer_index":3,"explanation":"The VPs' visit turned a black-and-white decision into a gray area."},{"id":"S2-095","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"Which options did Friedman consider?","options":["Outsource the team, merge it, or close it","Promote Fletcher, demote herself, or resign from the company","Report the VPs, sue, or quit","Stick to her plan, abandon it, or find a middle ground"],"answer_index":3,"explanation":"She weighed the consequences of each, including middle-ground options like further development opportunities."},{"id":"S2-096","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"What did Friedman ultimately decide in her counseling session with Fletcher?","options":["Keep his 3.5 rating to satisfy the vice presidents and avoid conflict","Put him on a PIP and lower his rating to 1.0 to force improvement","Fire him immediately and explain the decision to the vice presidents","Give him a 2.5 rating but not put him on a PIP, and suggest he look for another job while continuing his work"],"answer_index":3,"explanation":"She felt a PIP would be too demeaning; he eventually joined another company."},{"id":"S2-097","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"How does Badaracco evaluate the outcome of Friedman's decision?","options":["She had been lucky, but she put herself in a good position by getting the process right","She made the wrong decision, but it worked out by coincidence","The vice presidents deserved the credit for the good outcome","Her success was guaranteed because she used all five questions"],"answer_index":0,"explanation":"There was no guarantee Fletcher would react positively, but she followed a sound process and had other tactics ready."},{"id":"S2-098","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"What does Badaracco advise about using the five questions?","options":["Use only the one question that is most relevant to your situation","Use them only for decisions with legal implications","Systematically answer all five rather than picking your favorite","Answer them in whatever order you personally prefer"],"answer_index":2,"explanation":"Each question is an important voice in the long conversation about sound decisions."},{"id":"S2-099","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"According to the article's closing, what is a leader's job in gray areas?","options":["Avoiding personal responsibility for the outcome","Waiting for someone more senior to decide","Creating solutions using judgment, not merely finding them","Finding the one rule that dictates the correct answer for you"],"answer_index":2,"explanation":"'In gray areas, your job isn't finding solutions; it's creating them, relying on your judgment.'"},{"id":"S2-100","section":"Ethics","source":"Reading - How to Tackle Your Toughest Decisions.pdf, p. 5","question":"Friedman's company had always claimed to be what kind of organization, a factor she weighed under 'Who are we?'","options":["A government-like organization bound by strict seniority rules","A meritocracy with high standards and a sharp focus on customer needs","A nonprofit organization focused primarily on philanthropy","A family business built mainly on loyalty to its many long-serving staff"],"answer_index":1,"explanation":"Her group prided itself on professional performance, which counted against tolerating underperformance."},{"id":"S3-001","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 3","question":"According to the lecture, what does 'Own the Room' mean?","options":["Controlling the agenda so that others cannot raise objections","Speaking louder and longer than others so you dominate the meeting","Using as many slides and data points as possible to impress","Understanding yourself, reading others, communicating clearly and adapting authentically"],"answer_index":3,"explanation":"You own the room by being understood, trusted and remembered."},{"id":"S3-002","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 4","question":"In the 'Know yourself → Understand others → Work better together' model, observing how others communicate and what concerns them belongs to which step?","options":["How should I adapt? — Communication competence","What do I want? — Goal setting","Who am I? — Self-awareness","Who am I working with? — Social awareness"],"answer_index":3,"explanation":"Step 2 (social awareness) observes how others communicate, what information they need and what concerns them."},{"id":"S3-003","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 6","question":"According to the lecture, assertiveness equals:","options":["Confidence + Respect","Respect + Silence","Certainty + Authority","Confidence + Volume"],"answer_index":0,"explanation":"CONFIDENCE + RESPECT = ASSERTIVENESS; confidence without respect can become arrogance."},{"id":"S3-004","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 6","question":"'Based on our analysis, I recommend Option B. Here are the reasons.' Which communication style does this statement illustrate?","options":["Passive","Insecure","Aggressive","Assertive"],"answer_index":3,"explanation":"It states a recommendation with evidence while staying open to discussion."},{"id":"S3-005","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 6","question":"'This is obviously the correct solution.' Which style does the lecture assign to this statement?","options":["Insecure","Passive","Aggressive","Assertive"],"answer_index":2,"explanation":"The aggressive style asserts correctness without respect for other views."},{"id":"S3-006","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 6","question":"'Whatever you think is fine.' Which style does the lecture assign to this statement?","options":["Aggressive","Assertive","Passive","Insecure"],"answer_index":2,"explanation":"Passive communication gives up one's own view entirely."},{"id":"S3-007","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 8","question":"How does the lecture distinguish hearing from listening?","options":["They are the same thing; the lecture uses both terms interchangeably","Hearing is the sound reaching you; listening is deliberately trying to understand the meaning","Hearing requires eye contact, while listening can be done while multitasking","Listening is passive reception, while hearing requires active effort"],"answer_index":1,"explanation":"Active listening additionally demonstrates understanding and checks whether you understood correctly."},{"id":"S3-008","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 8","question":"What sequence describes active listening in the lecture?","options":["Listen → Agree → Respond → Close","Hear → Understand → Check → Respond","Respond → Hear → Check → Understand → Agree","Hear → Judge → Interrupt → Respond"],"answer_index":1,"explanation":"HEAR → UNDERSTAND → CHECK → RESPOND."},{"id":"S3-009","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 8","question":"According to the lecture, what is the first job of a communicator?","options":["To persuade","To be understood","To speak first","To understand"],"answer_index":3,"explanation":"'The first job of a communicator is not to be understood. It is to understand.' Listening is a form of data collection."},{"id":"S3-010","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 9","question":"Saying 'So, if I understand correctly, your main concern is…' and letting the other person correct you is which active-listening step?","options":["Give the speaker your full attention","Check your understanding","Don't interrupt","Stay curious"],"answer_index":1,"explanation":"Step 5: check understanding by paraphrasing."},{"id":"S3-011","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 9","question":"Which phrase does the lecture suggest to replace immediate judgment when listening?","options":["'That's not what I meant.'","'Help me understand.'","'I already know the answer.'","'Let me stop you there.'"],"answer_index":1,"explanation":"Step 3, Stay curious, replaces judgment with 'Help me understand.'"},{"id":"S3-012","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 10","question":"Which of the following is NOT one of the four 'listening killers' in the lecture?","options":["Multitasking","Preparing your response","Paraphrasing","Mental distraction"],"answer_index":2,"explanation":"The four killers: multitasking, digital distraction, mental distraction, preparing your response."},{"id":"S3-013","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 10","question":"What management message does the lecture attach to divided attention?","options":["AI makes attention unnecessary","Attention is a form of respect","Attention matters only in formal meetings","Attention is a waste of management time"],"answer_index":1,"explanation":"'AI can capture the meeting. You still need to be present in it.'"},{"id":"S3-014","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 12","question":"What central principle does the lecture give for staying calm?","options":["You should let others manage the emotions in the room","You cannot always control the situation, but you can control your response","You must first control the whole situation before you respond to anyone at all","You should avoid all situations that might cause you stress"],"answer_index":1,"explanation":"Self-awareness → self-regulation → constructive communication."},{"id":"S3-015","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 12","question":"Which sequence does the communication lecture use for managing irritation?","options":["Pause → Ignore → Forget → Move on","Trigger → React → Regret → Apologize","Trigger → Pause → Choose → Respond","Listen → Judge → Decide → Act"],"answer_index":2,"explanation":"TRIGGER → PAUSE → CHOOSE → RESPOND."},{"id":"S3-016","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 12","question":"According to the lecture, does staying calm mean avoiding disagreement?","options":["Yes — disagreement should only be expressed later, in writing","Yes — calm communicators never express disagreement openly","No — you can say 'I disagree with that conclusion' without saying 'That's ridiculous'","No — calm people should disagree loudly so that they are heard"],"answer_index":2,"explanation":"Staying calm does not mean avoiding disagreement; it means disagreeing respectfully."},{"id":"S3-017","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 13","question":"Which principle summarizes how to handle disagreements respectfully?","options":["Win the argument first, then repair the relationship later","Avoid the problem, protect the person","Be hard on the problem, be respectful to the person","Be soft on the problem, hard on the person"],"answer_index":2,"explanation":"Slide 13: BE HARD ON THE PROBLEM. BE RESPECTFUL TO THE PERSON."},{"id":"S3-018","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 13","question":"What does the lecture say about the advice 'Good communicators should always smile'?","options":["It is always correct, because a smile builds trust in every situation","Smiling is only necessary when dealing with external customers","Smiling should generally be avoided at work to appear professional","Match your tone to the situation; a smile may be inappropriate when discussing an accident or redundancy"],"answer_index":3,"explanation":"Authenticity and appropriateness matter more than mechanically displaying friendliness."},{"id":"S3-019","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 13","question":"What is the '10-minute rule' for non-urgent, emotionally charged communication?","options":["Send → Wait → Apologize → Resend","Call → Shout → Hang up → Email","Write → Send → Delete → Rewrite","Write → Wait → Reread → Send"],"answer_index":3,"explanation":"Waiting and rereading prevents messages you would later regret."},{"id":"S3-020","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 13","question":"How does the lecture say you 'own the room'?","options":["By controlling the people in it and the agenda of the meeting","By speaking first and having the last word","By holding the most senior title in the room","By controlling yourself, not by controlling other people"],"answer_index":3,"explanation":"'You don't own the room by controlling other people. You own the room by controlling yourself.'"},{"id":"S3-021","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 16","question":"According to the lecture, what does confidence NOT require?","options":["Clarity","Evidence","Preparation","Certainty"],"answer_index":3,"explanation":"Saying 'I don't know' or 'the data isn't sufficient' is not weakness; false certainty is more dangerous."},{"id":"S3-022","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 16","question":"How does the lecture define confidence?","options":["'Once I decide, I never change my mind.'","'I am always right, so I don't need to explain my reasoning or listen to objections.'","'I can speak for an hour without any notes.'","'I can explain what I think, why I think it, and what could change my mind.'"],"answer_index":3,"explanation":"Confidence is not 'I am right' — be confident about what you know and what you don't know."},{"id":"S3-023","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 17","question":"Which behavior is listed as typical of confident (rather than insecure) people?","options":["Acting like a know-it-all","Hiding flaws","Blaming others","Admitting mistakes"],"answer_index":3,"explanation":"Confident people celebrate others' success, admit mistakes and accept responsibility."},{"id":"S3-024","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 19","question":"Which four voice elements does the lecture highlight?","options":["Pitch, accent, speed, slang","Tone, grammar, vocabulary, length","Volume, pace, pause, emphasis","Loudness, repetition, humor, gestures"],"answer_index":2,"explanation":"VOLUME — PACE — PAUSE — EMPHASIS."},{"id":"S3-025","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 19","question":"Which voice element asks 'Are you allowing important ideas to land?'","options":["Volume","Emphasis","Pause","Pace"],"answer_index":2,"explanation":"Pause allows ideas to land; pace gives time to process; emphasis shows what matters most."},{"id":"S3-026","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 19","question":"Which statement appears on the 'Your voice is part of your message' slide?","options":["More volume ≠ more authority","Monotone speech signals expertise","More information = better communication","Louder voices are more credible"],"answer_index":0,"explanation":"Also: more information ≠ better communication. The goal is to make listening easy, not to sound theatrical."},{"id":"S3-027","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 20","question":"For international engineers, what does the lecture say matters more than accent?","options":["Clarity","Native-like pronunciation","Speaking speed","Vocabulary size"],"answer_index":0,"explanation":"The goal is to be understandable, well paced, confident and easy to follow — not to imitate an accent."},{"id":"S3-028","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 20","question":"What rehearsal advice does the lecture give?","options":["Don't only rehearse what you will say; rehearse how you will say it","Avoid rehearsing altogether so that you sound natural and spontaneous","Memorize your slides word for word so you never hesitate","Rehearse only the opening sentence and improvise the rest"],"answer_index":0,"explanation":"Your words carry the information; your voice helps people understand what matters."},{"id":"S3-029","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 22","question":"According to the lecture, what does empathy mean?","options":["Feeling sorry for the other person and expressing sympathy","Avoiding difficult topics that might upset the other person","Understanding how a situation may look and feel from the other person's perspective","Agreeing with the other person so that the relationship is protected"],"answer_index":2,"explanation":"Empathy does not mean 'I agree with you' — a distinction that is very important for managers."},{"id":"S3-030","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 23","question":"An employee says 'This new schedule is impossible.' The manager replies 'Everyone is under pressure. Just make it work.' Which response type is this?","options":["Empathetic","Assertive","Sympathetic","Dismissive"],"answer_index":3,"explanation":"The lecture contrasts dismissive, sympathetic and empathetic responses."},{"id":"S3-031","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 23","question":"Which response does the lecture classify as empathetic?","options":["'Let's not talk about this now; we'll revisit it next quarter.'","'It sounds as though the schedule is creating pressure your team can't absorb. Help me understand where the biggest problem is.'","'I'm sorry you're having such a difficult time with this.'","'Everyone is under pressure. Just make it work somehow.'"],"answer_index":1,"explanation":"The empathetic response creates both information and connection."},{"id":"S3-032","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 23","question":"Why does the lecture consider the empathetic response superior to the sympathetic one?","options":["It creates information and connection","It is shorter","It avoids discussing the problem","It transfers responsibility to the employee"],"answer_index":0,"explanation":"A sympathetic response expresses sorrow; an empathetic one seeks to understand and solve."},{"id":"S3-033","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 24","question":"Which of the following is listed as a way to be empathetic in communication?","options":["Validate how the other person is feeling","Assume you know their preferred resolution","Change the subject to facts only","Correct their emotions immediately"],"answer_index":0,"explanation":"Other listed ways: ask questions, determine the preferred resolution, offer to help, challenge your biases."},{"id":"S3-034","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 27","question":"What does the lecture say the full message consists of?","options":["Slides + Data + Charts","Title + Authority + Volume","Words + Voice + Body","Words only"],"answer_index":2,"explanation":"When verbal and nonverbal signals conflict, trust can suffer."},{"id":"S3-035","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 27","question":"A manager says 'I'm very interested in your idea' while checking the phone and rushing. What is the likely result?","options":["The employee receives the nonverbal message, and trust may suffer","The message is clear, because the spoken words themselves were positive","The employee believes the words","The employee feels highly valued"],"answer_index":0,"explanation":"When verbal and nonverbal signals conflict, the nonverbal message often dominates."},{"id":"S3-036","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 28","question":"Why does the lecture say crossed arms do not automatically mean someone is defensive?","options":["Because crossed arms always signal agreement and openness","Because body language is irrelevant to communication","Because one signal should not be interpreted in isolation — the person may simply be comfortable or cold","Because only facial expressions carry reliable meaning"],"answer_index":2,"explanation":"Rule 1: don't interpret one signal in isolation."},{"id":"S3-037","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 28","question":"Which approach to nonverbal cues does the lecture recommend?","options":["Assume → Confront → Decide → Document","Observe → Form a hypothesis → Ask","Ignore → Proceed → Review","Observe → Assume → Judge"],"answer_index":1,"explanation":"Culture, personality, comfort, disability and hierarchy influence nonverbal behavior, so verify by asking."},{"id":"S3-038","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 28","question":"Someone suddenly becomes quieter and stops participating after your proposal. What does the lecture suggest you say?","options":["'I sense some hesitation. Is there something about the proposal that concerns you?'","'Why are you being so negative about this proposal?'","'Let's move on — silence means everyone consents.'","'Great, I can see from the silence that everyone in the room agrees with the plan.'"],"answer_index":0,"explanation":"Rule 2: look for changes and clusters, then ask rather than conclude."},{"id":"S3-039","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 29","question":"Presenting a redesign, nobody objects but operators exchange glances and hesitate. What does a perceptive manager think?","options":["'Excellent. Everyone agrees.'","'The proposal is approved.'","'There may be information I'm not hearing.'","'The operators are simply resisting any change.'"],"answer_index":2,"explanation":"Nonverbal signals are clues, not proof — so ask about implementation concerns."},{"id":"S3-040","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 31","question":"In the Face–Voice–Body model, which statement does the lecture make about voice?","options":["Words carry content; voice adds context","Voice matters only in phone calls","Voice carries content; words add context","Voice is less important than posture"],"answer_index":0,"explanation":"The same sentence ('That's an interesting idea') can communicate interest, doubt, surprise or politeness."},{"id":"S3-041","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 31","question":"Which item does the lecture explicitly say it would remove as a recommended communication technique?","options":["Eye contact","Pauses","Posture","Touch"],"answer_index":3,"explanation":"The slide notes: 'I would remove Touch as a recommended communication technique.'"},{"id":"S3-042","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 32","question":"What is the key takeaway about body language versus conversation?","options":["Body language reveals the truth, while conversation tends to hide it","Body language helps you notice what may be happening; conversation helps you find out what is actually happening","Conversation becomes unnecessary once you read body language well","Body language matters only in formal negotiations, not in daily work"],"answer_index":1,"explanation":"Body language should make you more curious, not more certain."},{"id":"S3-043","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 33","question":"A relaxed participant's behavior changes suddenly when you mention three months of weekend shifts. What type of signal is this?","options":["An open/engaged signal","An authority signal","A change signal","A cultural signal"],"answer_index":2,"explanation":"Change signals — sudden shifts after a specific topic — justify curiosity."},{"id":"S3-044","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 36","question":"How does the lecture describe 'respect and responsiveness'?","options":["Agreeing with senior people to show respect for hierarchy","Speaking only when someone explicitly asks for your view","Always responding immediately to every single message that you receive at work","Letting others speak and knowing when to initiate conversation or respond"],"answer_index":3,"explanation":"One of its essential skills is listening actively and empathetically."},{"id":"S3-045","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 38","question":"Which principle does the lecture give for choosing a communication channel?","options":["Always use face-to-face","Always use email for a record","Use the fastest channel available","Match the medium to the message"],"answer_index":3,"explanation":"The wrong channel can damage an otherwise good message."},{"id":"S3-046","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 38","question":"Which four questions does the lecture use to select a channel?","options":["Cost, speed, length, format","Complexity, sensitivity, urgency, record","Hierarchy, location, language and time zone of the receiver","Audience, budget, deadline, tool"],"answer_index":1,"explanation":"These make channel selection systematic; the more complex or emotional, the richer the channel should be."},{"id":"S3-047","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 38","question":"According to the lecture, the more complex or emotional a message is:","options":["The shorter and more formal the email should be","The later in the day the message should be sent","The more people should be copied on the message","The richer the communication channel should be"],"answer_index":3,"explanation":"Richer channels (face-to-face, video) carry more nuance."},{"id":"S3-048","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 39","question":"According to the channel table, what should you use for a sensitive discussion?","options":["Face-to-face or video","A formal written report","Email with a read receipt","Instant message or chat"],"answer_index":0,"explanation":"Quick coordination → chat; documentation → email; immediate interaction → phone; sensitive → face-to-face/video."},{"id":"S3-049","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 39","question":"According to the channel table, what is recommended for a complex decision?","options":["A meeting plus a supporting document","A post on the company's internal social media page","A quick chat message to the team","A phone call with no follow-up"],"answer_index":0,"explanation":"Complex decisions need interaction and documentation together."},{"id":"S3-050","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 40","question":"Which of the following is an example of synchronous communication?","options":["Shared document","Video meeting","Email","Messaging app thread answered later"],"answer_index":1,"explanation":"Synchronous: everyone communicates at the same time (face-to-face, phone, video)."},{"id":"S3-051","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 40","question":"Asynchronous communication is best when you need:","options":["Immediate clarification during a crisis","Emotional nuance and real-time discussion","Rapid feedback, live clarification and real-time negotiation with others","Flexibility, reflection, documentation and detailed information"],"answer_index":3,"explanation":"Synchronous suits discussion, rapid feedback, negotiation and emotional nuance."},{"id":"S3-052","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 40","question":"Which pair of warnings appears on the synchronous vs. asynchronous slide?","options":["Never use chat at work, and always write formal reports instead","Always meet in person, and never use email for important decisions","Don't schedule a meeting when asynchronous communication will do; don't send 15 messages when a 5-minute conversation will solve it","Avoid meetings entirely, and communicate only through email"],"answer_index":2,"explanation":"Choose the mode that fits the problem."},{"id":"S3-053","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 41","question":"What does the lecture say about richer communication?","options":["Video calls are always superior to phone calls","Email is always the most efficient channel available","Face-to-face communication is always the best option for every message","Richer communication is not automatically better communication"],"answer_index":3,"explanation":"A 30-minute meeting for a three-sentence message is inefficient; use enough capacity without waste."},{"id":"S3-054","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 41","question":"According to the lecture, what is the result of 'right message + wrong medium'?","options":["Communication failure","Better documentation of decisions","Faster agreement","Partial success"],"answer_index":0,"explanation":"Choose the channel before you craft the message."},{"id":"S3-055","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 42","question":"Which are the three main communication styles named in the lecture?","options":["Passive, aggressive, assertive","Direct, indirect, neutral","Verbal, nonverbal, written","Formal, informal, technical and visual"],"answer_index":0,"explanation":"Assertive communication is the goal: meeting your needs and those of the other person."},{"id":"S3-056","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 43","question":"When learning to say 'No' assertively, which word does the lecture call a powerful game-changer?","options":["'Maybe'","'Because'","'Sorry'","'Never'"],"answer_index":1,"explanation":"Explaining your reasons with 'because' helps others accept a negative answer."},{"id":"S3-057","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 44","question":"When watching tone and pace to be assertive, what does the lecture recommend?","options":["Using a harsh tone so that no hesitation is shown","Raising your voice to show determination and strength","Speaking quickly and firmly so you keep control of the conversation","Speaking slowly with a calm, relaxed, somewhat quieter voice"],"answer_index":3,"explanation":"Keep it friendly and calm; the slide suggests a level around 6 on a 1–10 scale."},{"id":"S3-058","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 45","question":"When you don't get the answer you want, which behavior is passive according to the lecture?","options":["Listening more carefully to find a solution","Just agreeing and walking away","Asking more questions to explore options","Continuing calmly until the issue is resolved"],"answer_index":1,"explanation":"Assertiveness means continuing in a calm, respectful way until a solution is found (give and take)."},{"id":"S3-059","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 48","question":"Which benefit of assertiveness is explained by 'Aggressive communication is stressful. Passive is humiliating'?","options":["More trust","Less stress","Better communication","More confidence"],"answer_index":1,"explanation":"Benefits listed: better communication, less stress, more trust, more confidence."},{"id":"S3-060","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 50","question":"What risk of being assertive does the lecture mention?","options":["Some organizational and national cultures prefer passivity and may view assertiveness as rude","Assertiveness always damages working relationships in the long run","Assertive people are rarely promoted to management positions","Assertiveness is prohibited by law in some workplaces"],"answer_index":0,"explanation":"The slide cites cultures such as China as an example where assertiveness may be seen as offensive."},{"id":"S3-061","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 51","question":"Which statement is a MYTH about assertiveness according to the lecture?","options":["Assertiveness shows respect for both yourself and other people","You can be assertive on behalf of someone else","Assertiveness means expressing your view honestly","Assertiveness means getting your own way all the time"],"answer_index":3,"explanation":"Myths: #1 always getting your way; #2 being selfish; #3 passivity is the way to be loved."},{"id":"S3-062","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 51","question":"'I would like Dilara to choose the restaurant this week.' What myth does this example refute?","options":["That assertiveness means always winning the argument","That being assertive means being selfish","That passivity is the way to be loved","That assertiveness is aggressive"],"answer_index":1,"explanation":"You can also be assertive on behalf of someone else."},{"id":"S3-063","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 54","question":"How many attention-getting devices does the lecture recommend using in an introduction?","options":["All of them for maximum impact","One, two or three at most","None — start directly with data","At least five"],"answer_index":1,"explanation":"Devices include telling a story, asking a provocative question or showing a compelling image."},{"id":"S3-064","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 55","question":"In the second phase of an effective introduction, what should the speaker do?","options":["Ask each member of the audience to introduce themselves","Tell a joke to relax the audience before starting the content","Focus the presentation (state the goal or thesis) and preview what follows","Present the detailed data and analysis immediately"],"answer_index":2,"explanation":"Phase 2: tell listeners what it's about and what they'll learn."},{"id":"S3-065","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 56","question":"How does the lecture recommend making statistics meaningful?","options":["Present raw numbers with many decimals to show precision","Show every data point in one large, detailed table","Round off big numbers, interpret them and translate them into human terms","Avoid statistics entirely and use only stories instead"],"answer_index":2,"explanation":"Also use graphics, comparisons and analogies."},{"id":"S3-066","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 57","question":"Phrases like 'In the first place…' and 'The key argument is…' are examples of what?","options":["Transitions to the conclusion only","Analogies","Signposts","Summaries"],"answer_index":2,"explanation":"Signposts guide listeners; transitions show how pieces of content relate."},{"id":"S3-067","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 58","question":"What should you AVOID in the conclusion of a presentation?","options":["Introducing new evidence or a new line of argument","Restating your recommendation","Recapping the main points","Returning to the opening anecdote, quotation or remark with a twist"],"answer_index":0,"explanation":"The conclusion should summarize, refocus and create closure."},{"id":"S3-068","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 60","question":"Why does the lecture recommend recapping important details in online communication?","options":["Because nonverbal and interpersonal cues can be lost online","Because online meetings are usually much longer than live ones","Because meeting recordings are usually unreliable","Because online participants generally prefer repetition"],"answer_index":0,"explanation":"Recap key points in the meeting or with a summary at the end of a lengthy email."},{"id":"S3-069","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 61","question":"Why does the lecture recommend responding even with a quick acknowledgment (like a 'like' or WhatsApp blue tick)?","options":["Because a written reply is a legal requirement in most companies","Because a short reaction can replace a full answer later","Because the sender otherwise has no way of knowing the message was received","Because a quick acknowledgment politely ends the conversation"],"answer_index":2,"explanation":"Tip 6: don't forget to respond — inform that you received the message."},{"id":"S3-070","section":"Effective Communication","source":"LectureNotes - Effective Communication.pdf, p. 53","question":"Which tip for keeping audiences engaged is listed in the preparation phase?","options":["Avoid nonverbal communication","Hide your personality","Read your slides word for word to avoid mistakes","Don't use 10 words when one will do"],"answer_index":3,"explanation":"Also: prepare and rehearse, know your audience, organize your material, adapt to feedback."},{"id":"S3-071","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 2","question":"According to an HBS Online analysis of engineering job postings (Lightcast data), roughly what share of employers require communication skills?","options":["Nearly all","Around one-tenth of employers","Around half","Around one-third"],"answer_index":3,"explanation":"The article states about one-third of employers require them."},{"id":"S3-072","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 2","question":"What does the article identify as critical to success for engineering leaders?","options":["Keeping technical details confidential from non-engineers","Avoiding stakeholders outside engineering to protect focus","Translating technical topics into simplified terms and confidently supporting ideas","Writing code faster and more accurately than anyone on the team"],"answer_index":2,"explanation":"Engineering leaders present complex concepts to departments and stakeholders."},{"id":"S3-073","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 3","question":"According to the article, what is the biggest benefit of active listening for a leader?","options":["Avoiding conflict","Speaking less often in meetings","Understanding your audience","Reducing meeting time"],"answer_index":2,"explanation":"Margolis: understanding and empathizing with your audience and tailoring communication to it."},{"id":"S3-074","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 3","question":"Which tip for active listening appears in the article?","options":["Ask open-ended questions to elicit more detailed responses","Keep your phone visible for urgent calls","Avoid paraphrasing to save time","Interrupt with your own ideas and opinions to show engagement"],"answer_index":0,"explanation":"Other tips: full attention, avoid distractions, open body language, paraphrase."},{"id":"S3-075","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 3","question":"Why does the article recommend phrases like 'tell me more' and 'define that for me'?","options":["They signal disagreement in a polite, indirect way","They elicit better answers than yes-or-no questions","They help to shorten long and unfocused conversations","They remove the need to give the person feedback"],"answer_index":1,"explanation":"Technique 2, Ask Questions, is essential to active listening."},{"id":"S3-076","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 4","question":"Which of the following is NOT one of the 'six C's of communication'?","options":["Control","Courage","Conviction","Compassion"],"answer_index":0,"explanation":"The six C's: Compassion, Clarity, Conciseness, Connection, Conviction, Courage."},{"id":"S3-077","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 4","question":"In the six C's, which C means 'infusing your communication with a sense of personal investment and commitment'?","options":["Conviction","Courage","Compassion","Connection"],"answer_index":0,"explanation":"Conviction is personal investment and commitment."},{"id":"S3-078","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 4","question":"In the six C's, which C means 'exuding confidence in the face of uncertainty, risk or danger'?","options":["Conviction","Clarity","Courage","Connection"],"answer_index":2,"explanation":"Courage concerns confidence under uncertainty or risk."},{"id":"S3-079","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 4","question":"In the six C's, which C means 'ensuring your message is clear to someone unfamiliar with the situation'?","options":["Clarity","Conciseness","Connection","Compassion"],"answer_index":0,"explanation":"Conciseness, by contrast, means the message is no longer than it needs to be."},{"id":"S3-080","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 4","question":"How does the article define 'data storytelling'?","options":["Storing qualitative stories in a structured database","Presenting raw data without interpretation so people decide","Communicating insights from a data set using narratives and visualizations to inspire action","Writing fictional case studies to illustrate data concepts"],"answer_index":2,"explanation":"Data storytelling is suggested as a way to strengthen public speaking."},{"id":"S3-081","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 5","question":"According to Anthony Mayo, a 'statement of direction' should do which of the following?","options":["List every task employees must complete in the coming year","Announce upcoming compensation and promotion changes clearly","Replace the company's existing mission statement entirely","Meet employees where they are, show where the organization is going, and offer a roadmap to bridge the gap"],"answer_index":3,"explanation":"How you communicate direction is as essential as the direction itself."},{"id":"S3-082","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 5","question":"Which of the eight techniques is most directly tied to emotional intelligence in the article?","options":["Show empathy","Establish a communication strategy","Practice public speaking","Be clear and concise"],"answer_index":0,"explanation":"Empathy relates to compassion, one of the six C's, and builds trust and engagement."},{"id":"S3-083","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 6","question":"When giving feedback, what does 'save time for inquiry' mean in the article?","options":["Keep the feedback session as short as possible to reduce stress","Incorporate questions at the beginning of the conversation to understand the other person's perspective","Ask HR to investigate the situation before giving feedback","Leave all questions for a follow-up email after the meeting"],"answer_index":1,"explanation":"Other tips: exercise empathy, prepare, speak in specifics, focus on the future."},{"id":"S3-084","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 6","question":"Why does the article recommend 'speaking in specifics' when giving feedback?","options":["To shorten the conversation","To make the feedback sound more formal","To avoid discussing emotions","To communicate a problem's root cause"],"answer_index":3,"explanation":"Specific feedback identifies the root cause of the problem."},{"id":"S3-085","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 6","question":"What should leaders do with feedback they receive, according to the article?","options":["Forward it to HR so it can be filed in their records","Respond immediately with counter-feedback so the discussion stays balanced","Ignore it unless it comes from their own superiors","Act on it to show they value the team and are serious about improving"],"answer_index":3,"explanation":"Leaders set an example, encouraging employees to do the same."},{"id":"S3-086","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 6","question":"Which concept does the article say leaders use to develop a workplace communication strategy?","options":["Contextual intelligence","Artificial intelligence tools","Cognitive intelligence","Market intelligence"],"answer_index":0,"explanation":"Contextual intelligence focuses on understanding dynamics and landscape; at the micro level it applies to relationships."},{"id":"S3-087","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 7","question":"How does the article define workplace culture?","options":["The list of holidays and social events the company organizes","The internal set of values and beliefs expressed in how employees interact and behave","The company's official dress code and office etiquette rules","The physical design and layout of the company's offices"],"answer_index":1,"explanation":"Culture is largely influenced by how effectively leaders communicate with their teams."},{"id":"S3-088","section":"Effective Communication","source":"Reading - 8 Communication Techniques Engineering Leaders Need to Succeed.pdf, p. 7","question":"According to Margolis, what does communication do in an organization?","options":["It replaces the need for a strategy and an organizational structure","Sets an agenda, informs and builds understanding, and aligns with organizational objectives","It mainly entertains and motivates employees during hard times","It reports past results to shareholders and regulators"],"answer_index":1,"explanation":"It is also critical for inspiring the team toward a possible future."},{"id":"S3-089","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 1","question":"What did McKinsey's 1997 'War for Talent' advise companies to do?","options":["Focus on recruiting and retaining the 'best and the brightest' and invest in A players","Reduce workforce diversity in order to increase team cohesion","Rewa
