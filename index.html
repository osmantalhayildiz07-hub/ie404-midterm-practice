<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IE404 Midterm Practice</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --text: #1d2330; --muted: #5d6677; --border: #dde1e8;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --ok: #1f8a4c; --ok-soft: #e3f4ea; --bad: #c33b3b; --bad-soft: #fbe7e7;
  --radius: 12px; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 2px 8px rgba(20,30,50,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1b2029; --text: #e7eaf0; --muted: #9aa3b4; --border: #2c3340;
    --accent: #7c9cf5; --accent-soft: #233154; --ok: #4cc283; --ok-soft: #173326; --bad: #ef7676; --bad-soft: #3a1d1f;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1b2029; --text: #e7eaf0; --muted: #9aa3b4; --border: #2c3340;
  --accent: #7c9cf5; --accent-soft: #233154; --ok: #4cc283; --ok-soft: #173326; --bad: #ef7676; --bad-soft: #3a1d1f;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 1.45rem; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.1rem; margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
button, .btn { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 9px 14px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] button.primary, :root:not([data-theme="light"]) button.primary { color: #fff; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.link { border: none; background: none; color: var(--muted); padding: 4px 6px; text-decoration: underline; }
.sec-card { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 16px; min-height: 132px; }
.sec-card .num { font-size: .75rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.sec-card .name { font-weight: 600; line-height: 1.3; }
.bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.bar.ok > span { background: var(--ok); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 8px 14px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
input[type=number] { font: inherit; width: 80px; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
label.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.pill { font-size: .8rem; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.low { color: var(--bad); }
.question { font-size: 1.08rem; font-weight: 600; margin: 4px 0 14px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; width: 100%; line-height: 1.4; }
.opt .key { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); display: grid; place-items: center; font-size: .85rem; font-weight: 600; color: var(--muted); }
.opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.opt.selected .key { border-color: var(--accent); color: var(--accent); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .key { border-color: var(--ok); color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { border-color: var(--bad); color: var(--bad); }
.opt:disabled { opacity: 1; cursor: default; }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); }
.feedback.ok { border-color: var(--ok); background: var(--ok-soft); }
.feedback.bad { border-color: var(--bad); background: var(--bad-soft); }
.feedback strong { display: block; margin-bottom: 4px; }
.source { margin-top: 6px; font-size: .82rem; color: var(--muted); }
.nav { margin-top: 16px; display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.hint { margin-top: 10px; font-size: .8rem; color: var(--muted); }
.big-score { font-size: 2.4rem; font-weight: 700; line-height: 1.1; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
td, th { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.review-item { border-top: 1px solid var(--border); padding-top: 14px; }
.review-item .ans { font-size: .92rem; margin: 3px 0; }
.ans.bad { color: var(--bad); }
.ans.ok { color: var(--ok); }
.palette { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
.palette button { width: 34px; height: 30px; padding: 0; font-size: .75rem; border-radius: 6px; }
.palette button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.palette button.cur { outline: 2px solid var(--text); outline-offset: 1px; }
@media (max-width: 520px) {
  .wrap { padding: 14px 16px 40px; }
  h1 { font-size: 1.25rem; }
  .question { font-size: 1rem; }
  .big-score { font-size: 2rem; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const QUESTIONS = [{"id":"S1-001","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 2","question":"Which of the following is NOT one of the '6 Pillars for Work & Win on Purpose'?","options":["Maximize shareholder returns","Learn to work with AI","Know yourself","Learn to create value"],"answer_index":0,"explanation":"The six pillars are: know yourself, understand people, develop competencies, develop your intelligences, learn to work with AI, and learn to create value."},{"id":"S1-002","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 2","question":"According to the 6 Pillars slide, in what progression should an engineer learn to use AI?","options":["Tool → Replacement → Manager → Leader","Simulator → Challenger → Assistant → Decision maker → Replacement","Assistant → Thinking partner → Challenger → Simulator","Search engine → Calculator → Advisor → Judge"],"answer_index":2,"explanation":"Pillar 5 lists AI as Assistant → Thinking Partner → Challenger → Simulator."},{"id":"S1-003","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 2","question":"According to Pillar 6 ('Learn to create value'), value is created by combining which elements?","options":["IQ + experience + seniority + networking","Judgment + competencies + people skills + AI","Capital + labor + technology + time","Knowledge + discipline + speed + automation + capital"],"answer_index":1,"explanation":"Pillar 6 defines value creation as Judgment + Competencies + People Skills + AI."},{"id":"S1-004","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 4","question":"What formula does the lecture give for 'Your Professional Value'?","options":["Degree + GPA + Internships + Certificates","Knowledge + Skills + Abilities + Seniority","Personality + Competencies + IQ/EQ/SQ + AI leverage","Technical skill × Working hours × Years of experience in the field"],"answer_index":2,"explanation":"Slide 4 states: Your professional value = Personality + Competencies + IQ/EQ/SQ + AI leverage."},{"id":"S1-005","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 7","question":"What is the main message of the lecture about how personality models should be used?","options":["Use them mainly to replace performance data in formal evaluations","Use them mainly for hiring and firing decisions","Use them to predict exactly how a person will act","Use them to ask better questions, not to put people into boxes"],"answer_index":3,"explanation":"Slide 7: 'Use personality models to ask better questions — not to put people into boxes.'"},{"id":"S1-006","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 7","question":"Why does the lecture compare personality models to forecasting, simulation and queuing models used by industrial engineers?","options":["Because all of them produce precise numerical scores","Because all of them are validated by specialized optimization software","Because all of them are simplifications of reality, not reality itself","Because all of them eliminate uncertainty from decisions"],"answer_index":2,"explanation":"'A model is a simplification of reality—not reality itself'; personality and AI models simplify and must not be confused with reality."},{"id":"S1-007","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 9","question":"In the IE 404 4 Business Personas model, what is the 'main drive' of the Peaceful persona?","options":["Accuracy","Harmony","Results","Excitement"],"answer_index":1,"explanation":"Main drives: Playful–Excitement, Precise–Accuracy, Powerful–Results, Peaceful–Harmony."},{"id":"S1-008","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 9","question":"Which persona typically asks 'Is it correct?'","options":["Precise","Playful","Peaceful","Powerful"],"answer_index":0,"explanation":"The Precise persona focuses on facts and details and asks 'Is it correct?'."},{"id":"S1-009","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 9","question":"According to the 4 Personas table, what is the main possible risk of the Powerful persona?","options":["Impatience","Overanalysis","Lack of follow-through","Avoiding confrontation"],"answer_index":0,"explanation":"Possible risks: Playful–lack of follow-through, Precise–overanalysis, Powerful–impatience, Peaceful–avoiding confrontation."},{"id":"S1-010","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 9","question":"A colleague's main question in every project meeting is 'How will people be affected?'. Which persona does this most closely match?","options":["Playful","Peaceful","Precise","Powerful"],"answer_index":1,"explanation":"The Peaceful persona focuses on relationships and stability and asks how people will be affected."},{"id":"S1-011","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 9","question":"Which focus area is attributed to the Playful persona?","options":["Facts & details","Goals & action","People & possibilities","Relationships & stability"],"answer_index":2,"explanation":"Playful focuses on people & possibilities; Precise on facts & details; Powerful on goals & action; Peaceful on relationships & stability."},{"id":"S1-012","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 10","question":"Which equation summarizes the Playful style in the lecture?","options":["Playful = Action + Results + Control","Playful = Facts + Quality + Structure","Playful = Trust + Stability + Support","Playful = Energy + People + Ideas"],"answer_index":3,"explanation":"Slide 10: PLAYFUL = ENERGY + PEOPLE + IDEAS. The other equations describe Precise and Powerful."},{"id":"S1-013","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 10","question":"What is described as the key management challenge for a Playful person?","options":["Listening before deciding","Confronting poor performance","Turning energy into consistent execution","Making decisions with incomplete information"],"answer_index":2,"explanation":"The slide says the management challenge is to turn that energy into consistent execution."},{"id":"S1-014","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 11","question":"When working with a Playful person, besides giving room for ideas, what should a manager ALSO provide?","options":["Boundaries, consequences, evidence and some constructive challenge","Permission to disagree and time to adjust","Clear priorities, deadlines, follow-up and structure","Detailed data and time to analyze it"],"answer_index":2,"explanation":"For Playful people, also provide clear priorities, deadlines, follow-up and structure."},{"id":"S1-015","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 12","question":"Which of the following is listed as a behavior of a Precise person 'when overused'?","options":["Dominating discussions and overlooking people's feelings","Hesitating to say 'no' and avoiding hard conversations","Pursuing perfection when 'good enough' is sufficient","Promising more than they can realistically deliver to others"],"answer_index":2,"explanation":"Overused Precise behaviors include over-analysis, seeking too much information and pursuing perfection when 'good enough' is sufficient."},{"id":"S1-016","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 13","question":"When working with a Precise person, which item should the manager ALSO provide beyond facts and logic?","options":["Permission to act without perfect information","More time to adjust to change","More interaction and recognition","Different viewpoints, clear boundaries and some constructive challenge"],"answer_index":0,"explanation":"Precise people should also be given clear deadlines, decision points, priorities and permission to act without perfect information."},{"id":"S1-017","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 13","question":"What is the 'management message' for working with Precise people?","options":["Harmony creates relationships—but avoidance can be costly","Decisiveness creates momentum—but speed can be costly","Creativity creates ideas—but distraction can be costly","Accuracy creates value—but perfection can have a cost"],"answer_index":3,"explanation":"Slide 13: accuracy creates value but perfection has a cost; sometimes a good decision must be made with incomplete information."},{"id":"S1-018","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 14","question":"What is the management challenge stated for the Powerful persona?","options":["Act decisively—but listen before you decide","Turn energy into consistent execution","Speak up even when it causes friction","Decide quickly, even without having perfect information"],"answer_index":0,"explanation":"The Powerful management challenge is 'Act decisively—but listen before you decide.'"},{"id":"S1-019","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 15","question":"According to the lecture, in which situation is the Powerful style likely to be LESS effective?","options":["When bureaucracy is blocking a project","When team commitment and collaboration are required","During a crisis that requires very fast and firm decisions","When a project needs to be pushed forward"],"answer_index":1,"explanation":"A Powerful style can be very effective in a crisis, but less effective when team commitment and collaboration are required."},{"id":"S1-020","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 16","question":"Which of the following is listed as a Peaceful behavior 'when overused'?","options":["Making decisions too quickly","Struggling with routine and follow-through","Delaying confronting poor performance","Becoming overly critical"],"answer_index":2,"explanation":"Overused Peaceful behaviors: avoiding difficult conversations, hesitating to say no, resisting sudden change, delaying confronting poor performance."},{"id":"S1-021","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 17","question":"When working with a Peaceful person, which of the following should a manager ALSO provide?","options":["Encouragement to speak up and permission to disagree","Room for ideas and interaction","Adequate information, the logic behind it, and permission to ask questions","Constructive challenge and consequences"],"answer_index":0,"explanation":"For Peaceful people, also provide clear expectations, encouragement to speak up, decision deadlines and permission to disagree."},{"id":"S1-022","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 17","question":"What does the lecture warn about the Peaceful tendency to preserve harmony?","options":["Avoiding necessary conflict can create bigger problems later","Too much harmony always reduces the team's productivity","Harmony tends to make teams overly competitive and politically divided","Harmony prevents people from building trust over time"],"answer_index":0,"explanation":"Management message: harmony creates strong relationships, but avoiding necessary conflict can create bigger problems later."},{"id":"S1-023","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 18","question":"What does the lecture say about whether people belong to a single personality type?","options":["People are a blend; they may show characteristics of more than one style","Each person has exactly one dominant type that never varies across situations","Types change every few years with experience","Only managers show more than one style"],"answer_index":0,"explanation":"'People are a blend' — you may show characteristics of more than one style, and some tendencies are stronger than others."},{"id":"S1-024","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 19","question":"On the personality self-assessment word list, 'Mediator', 'Likes routine' and 'Good listener' belong to which style?","options":["Peaceful","Powerful","Playful","Precise"],"answer_index":0,"explanation":"The word table groups 'Mediator', 'Likes routine' and 'Good listener' under Peaceful."},{"id":"S1-025","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 20","question":"Which set of potential strengths is attributed to the Playful style?","options":["Creativity, energy, networking, enthusiasm","Analysis, accuracy, quality, planning","Decisions, action, results, direction","Cooperation, listening, stability and long-term trust"],"answer_index":0,"explanation":"Slide 20: Playful → creativity, energy, networking, enthusiasm."},{"id":"S1-026","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 20","question":"Are all personalities good for a workplace, according to the lecture?","options":["No, only Powerful and Precise suit management","Yes, but not every behavior is effective in every situation","No, the Playful style is unsuitable for engineering","Yes, and every behavior is equally effective in every possible situation"],"answer_index":1,"explanation":"The answer given is 'YES — but not every behavior is effective in every situation'; the best manager is one who can adapt."},{"id":"S1-027","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 21","question":"According to the 'Personality ≠ Competency' slide, what can a Precise manager learn?","options":["Active listening skills","Discipline in follow-up","Assertiveness in meetings","To decide under uncertainty"],"answer_index":3,"explanation":"Peaceful can learn assertiveness, Powerful active listening, Playful discipline, and Precise to decide under uncertainty."},{"id":"S1-028","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 21","question":"Which statement best summarizes the lecture's advice on personality development?","options":["Don't try to change who you are; expand what you can do","Change your personality to match your boss","Choose a job that never challenges your natural personality style","Hide your natural tendencies at work"],"answer_index":0,"explanation":"Slide 21: 'DON'T TRY TO CHANGE WHO YOU ARE. EXPAND WHAT YOU CAN DO.'"},{"id":"S1-029","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 25","question":"According to the 'Overdose of Personality Traits' slide, an overdose of the Precise style can turn into what?","options":["Egocentrism & hysteria","Depression & self-sacrifice","Compulsion & paranoia","Narcissism"],"answer_index":2,"explanation":"Overdoses: Playful – egocentrism & hysteria; Precise – compulsion & paranoia; Powerful – narcissism; Peaceful – depression & self-sacrifice."},{"id":"S1-030","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 25","question":"On the overdose slide, a manager for whom 'nothing is ever their fault' illustrates an overdose of which style?","options":["Powerful","Peaceful","Precise","Playful"],"answer_index":0,"explanation":"Powerful overdose is linked to narcissism, where nothing is ever their fault."},{"id":"S1-031","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 25","question":"Which consequence is linked to an overdose of the Peaceful style?","options":["Suffering from burnout","Subordinates coping with escalating demands","Blaming others for every failure","A series of rituals that serve little purpose"],"answer_index":0,"explanation":"Peaceful overdose (depression & self-sacrifice) leads to suffering from burnout."},{"id":"S1-032","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 26","question":"Which sequence summarizes 'Manage your personality — don't let it manage you'?","options":["Adapt yourself → Know yourself → Promote yourself","Know yourself → Stretch yourself → Adapt yourself","Know yourself → Change yourself → Replace yourself","Test yourself → Label yourself → Defend yourself"],"answer_index":1,"explanation":"Slide 26 ends with KNOW YOURSELF → STRETCH YOURSELF → ADAPT YOURSELF."},{"id":"S1-033","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 27","question":"What does 'watch for overdosing' mean in the personality key takeaways?","options":["Too many different personalities in one team inevitably cause conflict","Strong personalities should be avoided in teams","A strength used excessively can become a weakness","Too many personality tests distort results"],"answer_index":2,"explanation":"Key takeaway 4: a strength used excessively can become a weakness."},{"id":"S1-034","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 28","question":"According to the 'Multiplier Effect' slide, what happens when poor judgment is combined with AI?","options":["Judgment improves over time","Faster and larger mistakes","Impact stays the same as without AI","Mistakes are automatically corrected"],"answer_index":1,"explanation":"Good judgment × AI → greater impact, but poor judgment × AI → faster and larger mistakes."},{"id":"S1-035","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 29","question":"If everybody has access to the same AI, where does the lecture say competitive advantage will come from?","options":["Automating every management task as quickly as possible","Buying more expensive and more advanced AI tools","Writing better, longer and more detailed prompts than all your competitors","Your judgment, experience, creativity and ability to understand people"],"answer_index":3,"explanation":"Slide 29: 'AI may become common. Good judgment will remain scarce.'"},{"id":"S1-036","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 31","question":"How does the lecture distinguish personality from competency?","options":["Personality can be learned in training; competency is innate and fixed from birth","Personality determines your salary level; competency determines your job title","They are two different words used for exactly the same concept","Personality influences HOW you behave; competency determines WHAT you can do effectively"],"answer_index":3,"explanation":"Slide 31: personality influences how you naturally behave, competency determines what you are capable of doing effectively."},{"id":"S1-037","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 32","question":"A competency becomes credible when demonstrated through knowledge, application, results and which fourth element?","options":["Confidence","Certification","Charisma","Consistency"],"answer_index":3,"explanation":"Consistency asks: can you do it repeatedly in different situations?"},{"id":"S1-038","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 32","question":"Why does the lecture recommend replacing 'Excellent problem-solving skills' on a CV with a specific internship story?","options":["Because stories are easier to verify by AI","Because recruiters dislike short sentences","Because competency must be demonstrated, not merely claimed","Because soft skills should generally not appear on an engineering CV"],"answer_index":2,"explanation":"'Don't tell me you are competent — show me.' A concrete example demonstrates the competency."},{"id":"S1-039","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 33","question":"In the KSA model applied to improving a production line, being able to enter a real factory, identify the actual problem, work with people and turn analysis into action is an example of:","options":["Skill","Attitude","Ability","Knowledge"],"answer_index":2,"explanation":"Ability is the capacity to use knowledge and skills effectively in real, different situations."},{"id":"S1-040","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 33","question":"In the KSA production-line example, being able to analyze production data, build a model and communicate the results is an example of:","options":["Ability","Skill","Judgment","Knowledge"],"answer_index":1,"explanation":"Skills are learned proficiencies developed through training and practice (what you can DO)."},{"id":"S1-041","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 34","question":"In the lecture's chain of 'real competency', which step immediately follows 'Communicate the recommendation'?","options":["Develop alternatives","Identify the real problem","Measure the result","Convince stakeholders"],"answer_index":3,"explanation":"The chain is: identify → analyze → develop alternatives → communicate → convince stakeholders → help implement → measure."},{"id":"S1-042","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 35","question":"What is the 'Task vs. Competency' distinction the lecture uses for AI?","options":["Tasks require human judgment, while competencies are performed automatically by AI","AI has true competencies, while humans increasingly perform only routine tasks","AI should perform all tasks and competencies equally, so engineers can focus on coding","AI may perform tasks, but competency requires integrating outputs with context, people, judgment, responsibility and action"],"answer_index":3,"explanation":"Don't compete with AI at doing tasks; learn to manage AI while integrating people, judgment and responsibility."},{"id":"S1-043","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 36","question":"What is the 'AI-era competency model' formula?","options":["Competency = IQ + EQ + SQ","Competency = KSA × AI","Competency = KSA + Judgment + Responsibility","Competency = Knowledge + Experience + Seniority"],"answer_index":2,"explanation":"Slide 36: AI can strengthen KSA, but the professional remains responsible for the result."},{"id":"S1-044","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 36","question":"An AI produces an impressive recommendation for a production problem. Which question is NOT among those the lecture says the engineer should ask before accepting it?","options":["How will I verify the result afterwards?","Are the assumptions behind the recommendation realistic?","How quickly can the AI produce another version?","Is the data used by the AI reliable?"],"answer_index":2,"explanation":"The listed checks include problem definition, assumptions, data reliability, what AI overlooked, who is affected, implementability and verification."},{"id":"S1-045","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 37","question":"How does the lecture define the 'problem solving' competency employers expect in the AI era?","options":["Use the most advanced mathematics available","Define the real problem—not merely solve the problem given","Solve as many of the problems you are given as quickly as possible","Delegate problems to AI tools"],"answer_index":1,"explanation":"Slide 37: Problem solving = define the real problem, not merely solve the problem given."},{"id":"S1-046","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 40","question":"On the 'Are You Intelligent?' slide, the ability to understand people and social situations corresponds to which intelligence?","options":["EQ","AI capability","IQ","SQ"],"answer_index":3,"explanation":"Solve problems → IQ; manage emotions → EQ; understand people and social situations → SQ; use AI → AI capability."},{"id":"S1-047","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 41","question":"Which of the following is listed under EQ (Emotional Intelligence) rather than SQ?","options":["Read social situations and the political dynamics of a meeting room","Maintain motivation and respond appropriately under pressure","Influence and collaborate with other stakeholders","Build relationships across different departments"],"answer_index":1,"explanation":"EQ covers recognizing and managing your emotions, maintaining motivation and responding under pressure; the others are SQ items."},{"id":"S1-048","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 42","question":"Which phrase summarizes the lecture's view on IQ versus EQ in a career?","options":["EQ matters only for HR roles","IQ and EQ matter only at entry level","IQ helps you move up — EQ is what gets you in","IQ may get you in — EQ helps you move up"],"answer_index":3,"explanation":"Slide 42: 'IQ MAY GET YOU IN — EQ HELPS YOU MOVE UP.'"},{"id":"S1-049","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 42","question":"In the 'Mehmet' example, what changes as Mehmet's career progresses?","options":["Mehmet's IQ becomes the only thing that senior management evaluates","The technical problems become much harder than any of the people problems","The questions shift from solving the problem to leading and aligning people around the solution","Mehmet no longer needs to communicate with other departments or functions"],"answer_index":2,"explanation":"First: can he solve it? Later: can he lead a team? Later still: can he align Production, Finance, Sales…? The people problem may become harder than the technical one."},{"id":"S1-050","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 43","question":"You proved a new shift structure cuts cost by 12%. According to the lecture, what should your EQ make you ask?","options":["Which software package produced the most accurate cost forecast for me?","How can I implement it without informing the supervisors?","How will employees react and how should I communicate the change?","Can the model be re-optimized to save 15% instead of 12%?"],"answer_index":2,"explanation":"IQ tells you the alternative reduces cost; EQ asks about reactions, concerns and communication — a correct solution can still become a management failure."},{"id":"S1-051","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 44","question":"In the lecture's EQ sequence (Recognize, Understand, Observe, Listen, Adapt, Respond), which step asks 'What is happening around me?'","options":["Recognize","Observe","Listen","Adapt"],"answer_index":1,"explanation":"Recognize = what am I feeling; Understand = why; Observe = what is happening around me; Listen = what might others experience."},{"id":"S1-052","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 45","question":"Your manager criticizes your analysis in front of the team. In the higher-EQ process, what is the step right after 'Recognize: I am becoming defensive'?","options":["Control: don't react immediately","Clarify: ask questions","Observe: what exactly is being criticized","Respond: address the problem"],"answer_index":0,"explanation":"The process is Recognize → Control → Understand → Observe → Clarify → Respond."},{"id":"S1-053","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 47","question":"On the 'The higher you go, the more EQ matters' ladder, which statement belongs to the Senior Manager level?","options":["I create direction and mobilize the organization","I coordinate the work","I achieve results through people","I align different people and functions"],"answer_index":3,"explanation":"Engineer: I do the work; Team leader: I coordinate; Manager: results through people; Senior manager: align people and functions; Executive: create direction."},{"id":"S1-054","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 47","question":"What happens to the share of purely technical problems as responsibility increases?","options":["It disappears entirely once you reach the manager level","It tends to decrease while people, priority and judgment problems increase","It increases, because senior roles are more technical than junior ones","It stays roughly constant at every level of the organization"],"answer_index":1,"explanation":"Technical competence remains important, but the proportion of purely technical problems tends to decrease."},{"id":"S1-055","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 48","question":"What simple rule does the lecture give in the habit 'Pause before you respond'?","options":["Observe → Assume → Decide → Respond","Listen → Judge → Act → Review","Trigger → Pause → Think → Respond","Feel → React → Apologize → Repeat"],"answer_index":2,"explanation":"The few seconds between emotion and response can make a major difference: TRIGGER → PAUSE → THINK → RESPOND."},{"id":"S1-056","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 48","question":"According to the lecture, how does EQ develop?","options":["Through practice, not through reading about EQ","Only through formal psychometric testing and certification","Mainly through reading about EQ","It is fixed at birth and cannot develop"],"answer_index":0,"explanation":"'EQ develops through practice — not through reading about EQ.' Your default behavior is not your destiny."},{"id":"S1-057","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 49","question":"Which feedback question does the lecture suggest asking people you trust?","options":["Am I performing better than my colleagues in this department?","Which of the four personality types do you think I belong to?","Do you think I have a high EQ compared to others in the team?","What is one behavior that makes it easier to work with me—and one that makes it more difficult?"],"answer_index":3,"explanation":"Habit 4 (Seek feedback) suggests asking for one helpful and one difficult behavior."},{"id":"S1-058","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 50","question":"According to 'Practice your weaker behaviors', a person who tends to overanalyze should practice:","options":["Assertiveness","Deciding","Listening","Pausing"],"answer_index":1,"explanation":"Dominate → listening; avoid conflict → assertiveness; overanalyze → deciding; react quickly → pausing."},{"id":"S1-059","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 53","question":"In the shortcut EQ evaluation, which question corresponds to 'Accountability'?","options":["Can I change my style depending on the person?","Can I admit that I was wrong?","Can I disagree without making it personal?","Can I receive criticism without becoming defensive?"],"answer_index":1,"explanation":"Accountability (Sorumluluk) asks: 'Can I admit that I was wrong?'"},{"id":"S1-060","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 53","question":"Instead of asking 'Do I have high EQ?', what stronger self-awareness question does the lecture recommend?","options":["In which situations does my EQ become weaker?","What is my exact EQ score?","How does my EQ score compare with the scores of my peers?","Which AI tool can measure my EQ?"],"answer_index":0,"explanation":"Asking in which situations EQ becomes weaker is described as a much stronger self-awareness question."},{"id":"S1-061","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 56","question":"When you think 'My manager doesn't trust me' and AI asks 'What other explanations could fit the same behavior?', which benefit of practicing EQ with AI is illustrated?","options":["Repeatability of the same scenario five or ten times","Different perspectives that help fight premature conclusions","Availability whenever you need to practice a conversation","A safe place to make mistakes without damaging any real relationships"],"answer_index":1,"explanation":"Benefit 4 (different perspectives): AI can challenge your first interpretation."},{"id":"S1-062","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 57","question":"How does the lecture describe AI's role in evaluating your EQ?","options":["AI should replace feedback from people","AI is a reliable EQ test","AI is a mirror, not an EQ test","AI can certify high emotional intelligence"],"answer_index":2,"explanation":"AI cannot reliably declare 'You have high EQ'; compare self-perception, AI observation and real feedback."},{"id":"S1-063","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 58","question":"In the 5-step method for developing EQ with AI, why should you reflect first without AI?","options":["To avoid immediately outsourcing your self-reflection to AI","Because AI answers about behavior are always unreliable","Because AI tools cannot process text that describes emotions","To reduce the cost and time spent using AI tools"],"answer_index":0,"explanation":"Step 2 is 'Reflect first — without AI'; we don't want to outsource self-reflection immediately."},{"id":"S1-064","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 60","question":"How does the lecture characterize the IQ, EQ and SQ dimensions?","options":["Measurements that are only valid for engineers and managers","Useful frameworks, not precise scores that completely define a person","Exact scores that reliably predict a person's career success","Fixed traits that cannot be developed after early adulthood"],"answer_index":1,"explanation":"Slide 60: 'These are useful frameworks — not three precise scores that completely define a person.'"},{"id":"S1-065","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 61","question":"Which question does the lecture associate with SQ rather than EQ?","options":["What is happening between us—and how should I navigate the situation?","How can I control my own reactions under pressure?","What am I feeling right now, and why exactly am I feeling this way today?","What triggered my emotional reaction in this situation?"],"answer_index":0,"explanation":"EQ asks what I and the other person are feeling; SQ asks what is happening between us and how to navigate it."},{"id":"S1-066","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 61","question":"In the components of social intelligence, how is 'influence' defined?","options":["Controlling others' decisions","Gaining support without manipulation","Using formal authority to force others' agreement","Winning every argument"],"answer_index":1,"explanation":"SQ components include INFLUENCE — gaining support without manipulation."},{"id":"S1-067","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 62","question":"In the meeting example, Engineer A asks 'Is my proposal correct?'. What does socially intelligent Engineer B ask?","options":["What is happening in this room?","How can I prove Finance wrong?","Is my data more accurate than theirs?","How can I end the meeting quickly?"],"answer_index":0,"explanation":"Engineer B reads the room: who influences whom, who has concerns, who is silent, what priorities differ."},{"id":"S1-068","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 63","question":"SQ is described as 'Understand + Act'. Building rapport and moving people toward action belong to which component?","options":["Social facility","Self-awareness","Social awareness","Cognitive intelligence"],"answer_index":0,"explanation":"Social awareness = 'What is happening?'; social facility = 'What should I do?' (adapt, build rapport, influence, collaborate)."},{"id":"S1-069","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 63","question":"According to the lecture, what does social awareness generate about what another person thinks?","options":["Certain conclusions","Hypotheses, not certainty","Legal evidence","Objective measurements"],"answer_index":1,"explanation":"'Awareness generates hypotheses — not certainty — about what another person thinks.'"},{"id":"S1-070","section":"Winning on Purpose","source":"LectureNotes - Winning on Purpose.pdf, p. 64","question":"The Aristotle quote on anger used at the end of the lecture emphasizes that the difficult part is to be angry:","options":["Only after consulting a mediator and documenting the reasons","As rarely as possible, and never in public or in front of a team","With the right person, to the right degree, at the right time, for the right purpose and in the right way","Only with subordinates and never with superiors or customers"],"answer_index":2,"explanation":"Anyone can become angry; doing so appropriately in all those respects is not easy."},{"id":"S1-071","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 1","question":"According to Anthony Tjan, why is self-awareness essential for leaders?","options":["It allows leaders to work independently and avoid teamwork","It lies at the root of strong character and helps us know what we need from others to complement our deficiencies","It removes the need for feedback from peers, friends and mentors","It guarantees promotion to senior positions within a few years"],"answer_index":1,"explanation":"Tjan writes that self-awareness gives purpose, authenticity, openness and trust, and shows what we need from others."},{"id":"S1-072","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 2","question":"Which of the following is NOT one of Tjan's five ways to become more self-aware?","options":["Meditate","Take psychometric tests","Delegate all decisions to a mentor","Write down key plans and priorities"],"answer_index":2,"explanation":"The five ways are: meditate, write down plans and priorities, take psychometric tests, ask trusted friends, get regular feedback at work."},{"id":"S1-073","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 2","question":"Which question does Tjan ask himself during meditation?","options":["How can I avoid feedback?","How can I outperform all of my competitors this year?","Who is to blame for my failures?","What am I doing that is slowing me down?"],"answer_index":3,"explanation":"His questions: What am I trying to achieve? What is working? What is slowing me down? What can I do to change?"},{"id":"S1-074","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 2","question":"What does Tjan describe as his most frequent form of 'meditation'?","options":["Reading leadership books for an hour every night","Carrying out mundane tasks such as washing dishes or gardening","Attending formal week-long meditation retreats at least once every year","Using biofeedback devices during working hours"],"answer_index":1,"explanation":"He finds therapeutic serenity in mundane tasks like washing dishes and gardening."},{"id":"S1-075","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 2","question":"Why does Warren Buffett write down the reasons for an investment at the time he makes it?","options":["To reduce the taxes owed on successful investments","To later assess whether outcomes came from sound judgment or plain luck","To share his reasoning publicly with competing investors","To satisfy the legal reporting requirements that apply to all of his investors"],"answer_index":1,"explanation":"His journal entries are a historical record for judging sound judgment versus luck."},{"id":"S1-076","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 2","question":"What practice, inspired by Benjamin Franklin, did investor Li Lu follow?","options":["Asking strangers for anonymous feedback on his leadership","Keeping a detailed list of every investment loss he made","Meditating for an hour at sunrise before any decision","Keeping a 'balance sheet' of the assets and liabilities of his personal traits"],"answer_index":3,"explanation":"Franklin's 'balance sheet' tracks personal strengths and weaknesses to see whether the 'net worth' of character grows."},{"id":"S1-077","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 3","question":"What design point do psychometric tests such as Myers-Briggs and Predictive Index share, according to Tjan?","options":["They measure IQ rather than traits","They must be administered by a psychiatrist","They give a single final score of leadership ability","There are no right or wrong answers"],"answer_index":3,"explanation":"They compel respondents to consider which traits describe them relative to others, without right or wrong answers."},{"id":"S1-078","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 3","question":"The Heart, Smarts, Guts and Luck test asks questions like 'Is your success best described by analytics or instincts?'. What type of question format is this?","options":["Peer ratings on a 1-10 scale","Forced choices in paired question sets","True/false questions that test business knowledge","Open-ended essay questions"],"answer_index":1,"explanation":"Reflecting on forced trade-off questions helps test-takers understand their true characters."},{"id":"S1-079","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 3","question":"When asking trusted friends for feedback, what should you do to let them act as an 'honest mirror'?","options":["Avoid explaining why you are asking, so their answers stay natural","Ask them to write anonymous letters about you to your boss","Let them know you want candid, critical feedback and make them feel safe giving it","Ask only friends who usually agree with you, to avoid conflict"],"answer_index":2,"explanation":"Tjan advises signaling that you seek candid, critical perspectives and making it safe to be direct."},{"id":"S1-080","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 3","question":"Tjan gives the example of a 'story-topper' to illustrate which strategy?","options":["Hiring an external facilitator to run a 360 feedback process","Asking friends to call you out when you repeat a behavior you want to change","Writing a personal balance sheet of strengths and weaknesses","Taking forced-choice psychometric tests to reveal hidden traits"],"answer_index":1,"explanation":"You can ask friends to point out — preferably discreetly — when you one-up conversations."},{"id":"S1-081","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 4","question":"According to Tjan, what are the two keys to effective formal feedback?","options":["Full anonymity for respondents and financial rewards for honesty","Using AI tools and avoiding the HR department","High frequency and very short feedback forms","Having a process and having an effective manager of it"],"answer_index":3,"explanation":"The keys to effective formal feedback are a) a process and b) an effective manager of it."},{"id":"S1-082","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 4","question":"Why did Tjan's firm find external facilitators more effective for feedback processes?","options":["They are considerably cheaper than internal HR staff","They have the authority to fire underperforming founders","They guarantee that the feedback will be mostly positive","They come without the baggage of preconceived biases or reporting lines"],"answer_index":3,"explanation":"External facilitators lack preconceived biases and reporting-line baggage."},{"id":"S1-083","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 4","question":"What formal feedback process did Cue Ball encourage founders to institute?","options":["A monthly anonymous suggestion box for all employees","An annual 360-degree feedback process","A quarterly peer ranking","A weekly psychometric test"],"answer_index":1,"explanation":"Cue Ball encouraged a formal, annual 360-feedback process across competencies and work styles."},{"id":"S1-084","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 4","question":"What does Tjan mean by 'self-congruence'?","options":["A state in which what we say, think and feel are consistent","Having the same personality type as most members of one's team","Matching one's goals to the company's goals","Agreement between a leader and their board"],"answer_index":0,"explanation":"Self-awareness helps one move toward self-congruence: consistency between saying, thinking and feeling."},{"id":"S1-085","section":"Winning on Purpose","source":"Reading - 5 Ways to Become More Self-Aware.pdf, p. 4","question":"According to Tjan, when is the work of building self-awareness complete?","options":["After taking three psychometric tests","After completing a 360 feedback cycle","Never; it is a life-long effort","After becoming a senior leader"],"answer_index":2,"explanation":"Building self-awareness is a life-long effort; you're never 'done'."},{"id":"S1-086","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 2","question":"According to Tasha Eurich's research, what share of people think they are self-aware versus actually are?","options":["About 50% think they are; around 40% actually are","95% think they are; only 10–15% actually are","30% think they are; 5% actually are","75% think they are; 60% actually are"],"answer_index":1,"explanation":"Her five-year research program found 95% believe they are self-aware but only 10–15% are."},{"id":"S1-087","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 3","question":"In Eurich's survey of 467 working adults, which group was most frequently reported as unaware colleagues?","options":["Direct reports","Peers","Clients","Bosses"],"answer_index":1,"explanation":"Peers (73%) were the most frequent offenders, followed by direct reports (33%), bosses (32%) and clients (16%)."},{"id":"S1-088","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 3","question":"What impact can un-self-aware colleagues have on a team, according to the article's subtitle and research?","options":["They double the team's workload","They have no measurable effect","They can cut a team's chances of success in half","They usually improve team performance by adding pressure"],"answer_index":2,"explanation":"Other consequences include increased stress, decreased motivation and a higher likelihood of leaving one's job."},{"id":"S1-089","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 3","question":"Before trying to help a difficult colleague, what does Eurich say you must first determine?","options":["Whether HR has a written policy covering this kind of behavior","Whether the source of the problem is truly a lack of self-awareness","Whether the colleague is more senior than you in the hierarchy","Whether the colleague has a higher IQ than the rest of the team members"],"answer_index":1,"explanation":"Tension may also come from different priorities, incompatible communication styles or a lack of trust."},{"id":"S1-090","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 4","question":"How can you tell you are truly dealing with an un-self-aware person rather than a personal clash?","options":["They have usually received several promotions recently","There is usually a consensus about their behavior — it won't just be you","They usually admit their mistakes once you point them out","They are typically new to the organization and its norms"],"answer_index":1,"explanation":"Consider how others around them feel; typically there is a consensus about the unaware person's behavior."},{"id":"S1-091","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 4","question":"Which of the following is NOT listed as a consistent behavior of un-self-aware individuals?","options":["They have an inflated opinion of their performance","They have difficulty reading a room","They take credit for successes and blame others for failures","They frequently ask colleagues for critical feedback"],"answer_index":3,"explanation":"Unaware individuals won't listen to or accept critical feedback."},{"id":"S1-092","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 4","question":"What is the biggest difference between the unaware and the 'Aware-Don't-Care'?","options":["Their intentions","Their technical skills","Their seniority","Their personality type"],"answer_index":0,"explanation":"The unaware genuinely want to be effective but don't know they fall short; the Aware-Don't-Care know and won't change."},{"id":"S1-093","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 4","question":"A COO says 'The best management tool is fear. If they fear you, they will get the work done.' Which category does he illustrate?","options":["Highly self-aware leader","Unaware but well-intentioned","Aware-Don't-Care","Strategically patient leader"],"answer_index":2,"explanation":"He knew exactly what he was doing and was unwilling to change; he was fired months later."},{"id":"S1-094","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 5","question":"In Eurich's survey, what proportion of people who tried to help an unaware colleague were successful or very successful?","options":["50%","31%","21%","70%"],"answer_index":1,"explanation":"70% tried to help, but only 31% were successful; among those who didn't help, only 21% regretted it."},{"id":"S1-095","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 5","question":"What was the number one reason respondents gave for NOT helping an unaware colleague?","options":["They didn't think they were the right messenger","They feared the colleague would be promoted","HR policy explicitly forbade giving such feedback","They had no time because of their own workload"],"answer_index":0,"explanation":"Trust is needed; the person must believe the messenger has their best interests at heart."},{"id":"S1-096","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 6","question":"According to Eurich, with which group is the risk of giving feedback about unawareness usually LOWEST?","options":["Clients","Bosses","Direct reports","Peers"],"answer_index":2,"explanation":"Risk is highest with bosses, lower with peers and lower still with direct reports — for whom it's literally your job."},{"id":"S1-097","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 6","question":"Eurich's research found that feedback delivered via email was how much less successful than in person?","options":["10% less successful","50% less successful","About equally successful","33% less successful"],"answer_index":3,"explanation":"First practice: talk to them in person; email feedback is 33% less successful."},{"id":"S1-098","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 6","question":"What does Eurich mean by practicing 'strategic patience' when helping an unaware colleague?","options":["Waiting until they decide to leave the company on their own","Waiting until their next annual performance review comes around","Waiting until they express frustration that is actually caused by their unawareness","Waiting until HR formally intervenes in the situation"],"answer_index":2,"explanation":"Then ask if you can offer an 'observation' (the word 'feedback' risks defensiveness)."},{"id":"S1-099","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 7","question":"Eurich imagined a 'laugh track' behind her Aware-Don't-Care boss's comments. Which strategy does this illustrate?","options":["Finding their humanity","Mindfully reframing their behavior","Playing the long game","Escalating the issue to senior management and HR"],"answer_index":1,"explanation":"Noticing feelings in the moment lets us reframe the situation and be more resilient."},{"id":"S1-100","section":"Winning on Purpose","source":"Reading - Working with People Who Aren't Self-Aware.pdf, p. 8","question":"What does Eurich conclude we have complete control over, regardless of whether others change?","options":["Our boss's management style","The choice to improve our own self-awareness","Our colleagues' willingness to accept feedback","The organization's culture"],"answer_index":1,"explanation":"Whether or not others improve, we fully control improving our own self-awareness — perhaps where energy is best spent."},{"id":"S2-001","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 3","question":"According to the lecture, which question does ethics add to personality, competencies and EQ?","options":["What do I feel?","What can I do?","What will I earn from this?","What should I do?"],"answer_index":3,"explanation":"Personality, competencies and EQ are extended with a fourth question: ETHICS — WHAT SHOULD I DO?"},{"id":"S2-002","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 5","question":"Your manager says: 'This process doesn't fully meet the specification, but production is late. Release it.' Which pair of colliding forces is explicitly listed on the slide?","options":["Marketing budget targets vs. finance department cost targets","Innovation speed vs. respect for tradition","Loyalty to manager vs. professional responsibility","Centralized vs. decentralized decision-making"],"answer_index":2,"explanation":"The slide lists loyalty vs. professional responsibility, target vs. quality, short-term vs. long-term, and company vs. customer interest."},{"id":"S2-003","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 6","question":"Why does the lecture classify the Volkswagen emissions case as 'not legal and not ethical'?","options":["VW sold its cars below production cost in developing markets to quickly gain market share","Illegal software was installed in diesel vehicles, violating the Clean Air Act","VW used AI-based pricing that discriminated between customers","VW delayed payments to its suppliers during a cash shortage"],"answer_index":1,"explanation":"In September 2015 the EPA announced VW had violated the Clean Air Act by installing illegal software in diesel vehicles."},{"id":"S2-004","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 7","question":"In the 'Can we? May we? Should we?' framework, which question is the ethical one?","options":["Can we?","Should we?","May we?","Will we profit?"],"answer_index":1,"explanation":"Can we? → technically possible; May we? → legally permitted; Should we? → ethically acceptable."},{"id":"S2-005","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 8","question":"A soft-drink company sells a less healthy version in India that complies with Indian law, while its European version meets stricter rules. What does this case mainly illustrate?","options":["That governments should ban soft drinks altogether","That complying with the law may not be enough to be ethical","That the company is actually breaking Indian food and health law","That the European version of the product is illegal"],"answer_index":1,"explanation":"The slide asks 'Is complying with the law enough?' and frames dilemmas such as local law vs. global corporate standard."},{"id":"S2-006","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 9","question":"Before an important decision, the lecture asks 'Who is affected?'. What should you do next?","options":["See the decision through their eyes","Ask the legal department to approve","Choose the option with the least paperwork","Calculate the net present value"],"answer_index":0,"explanation":"After listing stakeholders, 'SEE THE DECISION THROUGH THEIR EYES': social awareness → stakeholder awareness → ethical judgment."},{"id":"S2-007","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 10","question":"How does the lecture define an ethical dilemma?","options":["A decision with no stakeholders","A legal dispute between two companies","A clear-cut violation of established moral rules for personal gain","A situation where two or more valid moral principles conflict"],"answer_index":3,"explanation":"An unethical action is a clear-cut violation; an ethical dilemma involves conflicting valid moral principles."},{"id":"S2-008","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 10","question":"What is the core difference between an unethical action and an ethical dilemma?","options":["Whether the 'right' answer is clear","Whether a manager is involved","Whether money is involved","Whether any law or regulation has been broken"],"answer_index":0,"explanation":"The core difference lies in whether the right answer is clear."},{"id":"S2-009","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 10","question":"Which of the following is NOT one of the 'dilemmatic case' categories listed in the lecture?","options":["Justice vs. Mercy","Truth vs. Loyalty","Immediate vs. Future","Profit vs. Revenue"],"answer_index":3,"explanation":"The categories are Truth vs. Loyalty, Group vs. Individual, Immediate vs. Future, Justice vs. Mercy."},{"id":"S2-010","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 11","question":"According to the comparison table, what is the typical outcome of an ethical dilemma?","options":["A legal penalty imposed on the person who made the decision","A clear ethical violation that harms others","An unavoidable compromise of at least one moral value","Full satisfaction of every value involved"],"answer_index":2,"explanation":"Dilemmas result in an unavoidable compromise of at least one moral value; unethical actions result in clear violation."},{"id":"S2-011","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 12","question":"HR manager Göksel must lay off either a single parent with average performance or a top-performing graduate. How does the lecture classify this?","options":["A legal violation","An ethical dilemma","A conflict of interest","An unethical action"],"answer_index":1,"explanation":"Compassion toward Employee A conflicts with fairness and duty to keep the business alive — two valid principles."},{"id":"S2-012","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 12","question":"Project manager Sevil tells engineers to hide critical security bug reports and tells the client the software is 100% secure. How is this classified?","options":["An ethical dilemma","An unethical action","A value-theory solution","A legitimate business risk"],"answer_index":1,"explanation":"This is a clear-cut violation (deception) for organizational gain — the right answer is clear."},{"id":"S2-013","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 14","question":"What is the first step of the lecture's general 3-step approach to solving an ethical dilemma?","options":["Report to the authorities","Let employees vote on it","Choose the greater good","Refute the dilemma"],"answer_index":3,"explanation":"Steps: 1) refute the dilemma, 2) find alternative solutions, 3) value theory approach (greater good or lesser evil)."},{"id":"S2-014","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 14","question":"Why does the lecture say 'refuting the dilemma' is something IE students already understand?","options":["Because it is essentially problem framing: checking facts, assumptions and constraints","Because it is a form of inventory control applied to ethical risks","Because it is a linear programming technique for finding the optimal choice","Because it relies on statistical sampling of employee opinions"],"answer_index":0,"explanation":"The apparent dilemma may exist because the problem is defined incorrectly — a problem-framing issue."},{"id":"S2-015","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 15","question":"In the Enron accounting fraud, what did mark-to-market (MTM) accounting do?","options":["Postponed recording revenue until the cash was actually received","Valued all assets strictly at their historical purchase cost","Recorded projected future profits immediately as actual revenue","Required external auditors to approve every trading contract"],"answer_index":2,"explanation":"MTM recorded projected future profits as actual revenue; SPEs hid billions in debt."},{"id":"S2-016","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 15","question":"What lesson does the lecture draw from the Enron & Arthur Andersen case about auditors and professionals?","options":["Only executives can be held responsible","Independence is guaranteed by regulation","Professional independence can be lost gradually","Auditors are never responsible for a client's accounting fraud"],"answer_index":2,"explanation":"Executives, financial professionals, auditors and boards were all responsible; incentives compromised professional judgment."},{"id":"S2-017","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 18","question":"According to the 'gift or conflict of interest?' slide, when does a gift become a bribe?","options":["When the benefit is intended to influence a decision improperly","When it is worth more than about one week of the receiver's salary","When it is given during a religious or national holiday","When it is given to a member of the colleague's family"],"answer_index":0,"explanation":"Gift → ordinary gesture; conflict of interest → personal benefit may interfere with judgment; bribe → intended to influence a decision improperly."},{"id":"S2-018","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 18","question":"What is the 'acid test' proposed for gifts from important clients?","options":["Would I be comfortable if my colleagues, company and customer knew about the gift?","Is the value of the gift lower than the value of the contract?","Has anyone else in the department received a similar gift?","Can I keep the gift without having to declare it for tax purposes?"],"answer_index":0,"explanation":"The acid test asks whether you'd be comfortable if others knew; boundaries aren't obvious, which is why policies are needed."},{"id":"S2-019","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 19","question":"Which of the following is an excuse the lecture tells you NOT to use when you witness unethical behavior?","options":["'I asked my manager for guidance.'","'I reported it through the ethics hotline.'","'I gathered the facts before speaking up.'","'I believed someone else would act on it.'"],"answer_index":3,"explanation":"Listed excuses include 'none of my business', 'someone else would act', 'it was common practice', 'I didn't know who to contact'."},{"id":"S2-020","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 20","question":"Under 'Do not compromise ethical standards', which reason is listed as a common but unacceptable justification?","options":["'I documented the decision carefully.'","'I was following the instructions from my manager.'","'I consulted the code of ethics before I made the decision.'","'I escalated the issue to compliance.'"],"answer_index":1,"explanation":"Unacceptable justifications include unrealistic targets, manager instructions, pressure to be a team player, fear of job loss."},{"id":"S2-021","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 21","question":"Which single question does the lecture say applies to all six common ethical issues in business?","options":["Is it legal in every country where we operate?","Who may benefit—and who may be harmed?","Is it profitable?","Will the media find out?"],"answer_index":1,"explanation":"One question applies to all six issue areas: who may benefit and who may be harmed?"},{"id":"S2-022","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 21","question":"Monitoring, personal data and AI-based decisions fall under which of the six common ethical issue areas?","options":["Health & safety","Information & confidentiality","Financial integrity","Technology & privacy"],"answer_index":3,"explanation":"Issue 6, Technology & Privacy, covers monitoring, personal data and AI-based decisions."},{"id":"S2-023","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 22","question":"What sequence does the lecture give for dealing with harassment and discrimination?","options":["Listen → Act → Prevent → Audit","Ignore → Warn → Punish → Forget","Prevent → Listen → Investigate → Act → Protect","Report → Publish → Litigate → Settle → Close the file"],"answer_index":2,"explanation":"The slide summarizes: PREVENT → LISTEN → INVESTIGATE → ACT → PROTECT."},{"id":"S2-024","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 22","question":"Which 'important distinction' does the lecture make about harassment complaints?","options":["Intent always outweighs impact","Impact matters only if it is reported in writing","Intent and impact are not always the same","Only intentional acts count as harassment"],"answer_index":2,"explanation":"Behavior can have harmful impact even without harmful intent."},{"id":"S2-025","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 23","question":"What priority hierarchy does the lecture give for health and safety decisions?","options":["Cost → Delivery → Quality → Safety → Service","Delivery → Cost → Safety → Quality","Quality → Safety → Cost → Delivery","Safety → Quality → Delivery → Cost"],"answer_index":3,"explanation":"A manager should not trade unacceptable human risk for cost, productivity or schedule."},{"id":"S2-026","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 23","question":"Maintenance recommends stopping a machine; stopping costs 1 million TL and failure probability is small. What key point does the lecture make?","options":["Production should continue whenever the probability is below 1%","Risk equals cost divided by probability","The cheapest option is always the ethical one","Acceptable risk is not purely a mathematical decision"],"answer_index":3,"explanation":"Although Risk = Probability × Consequence, deciding what risk is acceptable involves ethics, not only math."},{"id":"S2-027","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 24","question":"An AI predictive-maintenance system recommends 'Continue production. Failure probability: 0.7%.' What is the lecture's conclusion?","options":["AI can estimate risk, but management must decide what risk is acceptable and own the consequences","The AI's recommendation should be followed automatically because it is data-driven","The AI vendor becomes accountable if anyone is injured by the decision","Production must always stop whenever the AI reports any failure probability"],"answer_index":0,"explanation":"Questions include what data produced 0.7%, model reliability, who can override, and who is accountable."},{"id":"S2-028","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 25","question":"What ethical conflict does whistleblowing involve, according to the lecture?","options":["Profit targets vs. revenue targets set by the finance department","Speed of reporting vs. accuracy of the evidence collected","Loyalty to the organization vs. responsibility to customers, employees and society","Short-term financing needs vs. long-term investment plans"],"answer_index":2,"explanation":"The slide asks 'Is whistleblowing disloyal?' and frames it as loyalty vs. broader responsibility."},{"id":"S2-029","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 26","question":"What does a healthy organization need for a speak-up culture, according to the lecture?","options":["Anonymous gossip → Rumors → Informal investigation → Dismissal","Safe channels → Fair investigation → No retaliation → Corrective action","Social media posts → Public pressure → Official apology","Legal threats → Out-of-court settlement → Confidentiality agreement"],"answer_index":1,"explanation":"Speak-up culture is a management responsibility built on safe channels, fair investigation, no retaliation and corrective action."},{"id":"S2-030","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 27","question":"An engineer finds the company's approved AI system makes unsafe recommendations; the manager says 'Don't create problems.' What does the lecture conclude?","options":["Speaking up should start with posting the evidence on social media","Approved systems should not be questioned once management has signed off","The AI vendor alone is responsible for unsafe or unfair recommendations","Using AI does not remove your duty to speak up when you identify a serious risk"],"answer_index":3,"explanation":"Speaking up responsibly still respects confidentiality, evidence, due process and appropriate channels."},{"id":"S2-031","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 28","question":"Why does the lecture treat the integrity of business information as an ethical issue?","options":["Because information is expensive to store","Because business information legally belongs to the IT department","Because manipulating information means manipulating decisions","Because data must always be public"],"answer_index":2,"explanation":"Managers decide based on information, so manipulated KPIs, forecasts or safety statistics manipulate decisions."},{"id":"S2-032","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 29","question":"Target defect rate is <2% and actual is 2.6%. A manager says 'Exclude these two unusual batches, then we're below 2%.' What question does the lecture raise?","options":["Is this data cleaning — or data manipulation?","Should we change the measurement unit of the defect rate?","Should the batches be re-produced?","Is the target too ambitious?"],"answer_index":0,"explanation":"Excluding unfavorable data to meet a target may be manipulation rather than legitimate data cleaning."},{"id":"S2-033","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 30","question":"A manager asks AI to 'rewrite this quarterly report so our performance looks stronger.' What does the lecture say?","options":["AI-written reports are automatically objective","Better writing does not make misleading information ethical","AI should be used only to shorten reports","It is acceptable if the numbers are unchanged in the appendix"],"answer_index":1,"explanation":"Never ask AI merely to support the conclusion you want; ask it to challenge the conclusion too."},{"id":"S2-034","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 31","question":"You upload 12 months of confidential production data to an AI tool to reduce costs. What is the key ethical/governance question?","options":["Will the AI tool produce clear charts for management?","Were you authorized to give that data to the AI system?","Is the dataset larger than the AI tool's upload limit?","Is the AI tool fast enough to process twelve months of data?"],"answer_index":1,"explanation":"The fundamental rule: access does not mean ownership or permission to share."},{"id":"S2-035","section":"Ethics","source":"LectureNotes - Ethics.pdf, p. 33","question":"What sequence does the lecture propose for responsible data use?","options":["Collect → Store → Ana
