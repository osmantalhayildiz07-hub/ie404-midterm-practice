rd team performance more than individual star performance","Hire primarily for shared values and mission rather than for specific current technical skills"],"answer_index":0,"explanation":"It recommended compelling employee value propositions and investment in A players."},{"id":"S3-090","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"Why, according to Satell and Windschitl, did the 'War for Talent' approach fail to yield results?","options":["It was restricted by regulators after several legal challenges","It was too expensive for most companies to implement properly","It ignored technical skills in favor of personality and values","Perverse incentives focused on individuals rather than teams encouraged employees to undermine colleagues"],"answer_index":3,"explanation":"There is evidence it contributed to Enron's destructive culture."},{"id":"S3-091","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"Which company's downfall do the authors link to the 'War for Talent' focus on individual performance?","options":["Enron","Kodak","Volkswagen","Nokia"],"answer_index":0,"explanation":"The focus on individual rather than team performance encouraged employees to undermine colleagues."},{"id":"S3-092","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"What lesson do the authors draw from the failure of the individual-star approach?","options":["Creative work should be done alone","Teams are generally less productive than talented individuals","It is not individuals, but teams, that get results","Only A players should be hired"],"answer_index":2,"explanation":"This is especially true in high-value work like creative work, complex analysis and scientific research."},{"id":"S3-093","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"According to the MIT and Carnegie Mellon study cited, high-performing teams are made up of people who:","options":["Come from the same educational and professional background","Work independently with minimal interaction with one another","Have the highest individual IQ scores in their organization","Have high social sensitivity, take turns speaking and include women in the group"],"answer_index":3,"explanation":"The study examined what makes teams perform most efficiently and productively."},{"id":"S3-094","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"What do the authors call perhaps the most important trait of any team?","options":["Members have worked together closely for many years","Members share the same personality type, background and preferred working style","Members contribute a diversity of talents, experiences and perspectives","Members are led by one strong individual star performer"],"answer_index":2,"explanation":"Diversity maximizes the possibilities explored and leads to more innovative solutions."},{"id":"S3-095","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"What is the 'diversity paradox' described in the article?","options":["Diversity always reduces performance, even though it is popular","Diverse teams never experience conflict, so they underperform","Diversity has no measurable effect on team performance at all","Diversity improves performance, yet diverse teams also face obstacles, resistance and tribal hostility"],"answer_index":3,"explanation":"Evidence for diversity's benefits is overwhelming, but challenges such as tribalism are real."},{"id":"S3-096","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"The McKinsey report covering 366 public companies found what?","options":["Diversity had no measurable effect on financial results","Only gender diversity, not ethnic diversity, mattered","Ethnically and gender-diverse groups performed significantly better","Homogeneous groups of high-ability individuals performed significantly better"],"answer_index":2,"explanation":"Another study found ethnic diversity deflated price bubbles in simulated markets."},{"id":"S3-097","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 2","question":"Studies of adults randomly assigned to 'leopards' and 'tigers' showed what?","options":["Adults showed no preference for their own assigned group","Enmity toward outgroup members, suggesting some tribalism is unavoidable","Members of mixed groups immediately bonded with each other regardless of labels","Random assignment to groups eliminated all forms of bias"],"answer_index":1,"explanation":"Similar results were found in five-year-old children and even infants."},{"id":"S3-098","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 3","question":"According to the authors, what is the best way to build teams that are diverse enough to innovate but cohesive enough to work together?","options":["Build a culture of strong, shared values","Rely on individual financial incentives","Separate diverse members into different teams","Hire only people with similar backgrounds"],"answer_index":0,"explanation":"Leaders must 'square the circle' through shared mission and values."},{"id":"S3-099","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 3","question":"Which example do the authors use to show values attracting customers and talent?","options":["Kodak's long-standing focus on film products","Enron's culture of intense internal competition among stars","Steve Jobs' commitment to fusing design with technology","McKinsey's model of investing in A players"],"answer_index":2,"explanation":"More recently, Tim Cook has leveraged the value of privacy in much the same way."},{"id":"S3-100","section":"Effective Communication","source":"Reading - High-Performing Teams Start with a Culture of Shared Values.pdf, p. 3","question":"What 'fundamental difference' in hiring do the authors highlight?","options":["Hiring experienced professionals versus recruiting and training inexperienced graduates","Hiring locally versus recruiting talent from around the world","Hiring people to do what you want versus hiring people who already want what you want","Hiring permanent employees versus using temporary contractors"],"answer_index":2,"explanation":"Skill value degrades over time, but people who share your mission can acquire the skills needed."},{"id":"S4-001","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 3","question":"According to the MIT Sloan study cited in the lecture, what share of executives and middle managers responsible for executing strategy could list three of their company's strategic priorities?","options":["About 50%","About 75%","Only 5%","Only 28%"],"answer_index":3,"explanation":"Only 28% could list three priorities, and some 30% could not list even one."},{"id":"S4-002","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 5","question":"In the hierarchy from Vision & Mission down to operational tasks, how do time horizon and specificity change?","options":["Time horizon gets longer and specificity decreases","Both stay constant","Time horizon gets shorter and specificity increases","Time horizon gets shorter while specificity decreases"],"answer_index":2,"explanation":"Vision/mission are long-term and broad; operational goals and tasks are short-term and specific."},{"id":"S4-003","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 5","question":"Which message appears on the slide about vision, strategic and operational goals?","options":["Strategy should be kept confidential from most employees","Operational goals should always be set before the mission","A strategy is only really needed by large multinational companies with many units","Having a strategy is not the same as having an organization that understands it"],"answer_index":3,"explanation":"The slide stresses setting clear goals and objectives (MBOG) and communicating them."},{"id":"S4-004","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 6","question":"Which level of strategy answers 'Which businesses and markets should we participate in?'","options":["Functional strategy","Operational strategy","Corporate strategy","Business-unit strategy"],"answer_index":2,"explanation":"Corporate strategy covers portfolio, investment and resource allocation decisions."},{"id":"S4-005","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 6","question":"Which level of strategy answers 'How will we succeed in the chosen market?'","options":["Business-unit strategy","Functional and operational strategy","Philanthropic strategy","Corporate strategy"],"answer_index":0,"explanation":"Business-unit strategy covers customers, value proposition and competitive position."},{"id":"S4-006","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 7","question":"What does IKEA's business strategy statement show, according to the lecture?","options":["IKEA focuses mainly on custom-made, made-to-order furniture","IKEA targets a narrow luxury segment with exclusive designer products","IKEA competes only by offering the lowest possible price in the market","IKEA competes by combining design, functionality, variety and affordability — not on price alone"],"answer_index":3,"explanation":"The statement offers a wide range of well-designed, functional products at prices many can afford."},{"id":"S4-007","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 8","question":"In the automotive components example, 'Reduce average order lead time from 12 to 8 days' is classified as a(n):","options":["Strategic objective of the company","Operational objective","Mission","Task"],"answer_index":1,"explanation":"Mission → strategic objective (preferred supplier) → operational objective (lead time) → tasks (scheduling, changeover, inventory)."},{"id":"S4-008","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 9","question":"The purchasing department is rewarded only for minimizing purchase prices, so it picks cheap but unreliable suppliers. What principle does this illustrate?","options":["Lower purchase prices always improve supplier reliability","Local optimization ≠ organizational optimization","Strategy should be set by purchasing","Purchasing should never be measured"],"answer_index":1,"explanation":"Each department meets its targets, yet the organization suffers — a systems-thinking lesson."},{"id":"S4-009","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 9","question":"Complete the lecture's statement: 'Strategy creates direction. Objectives define results. …'","options":["Culture quietly replaces them","Operations deliver them","Finance measures them","Managers ignore them"],"answer_index":1,"explanation":"STRATEGY CREATES DIRECTION. OBJECTIVES DEFINE RESULTS. OPERATIONS DELIVER THEM."},{"id":"S4-010","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 12","question":"How does the lecture define organizational awareness?","options":["Knowing every employee in the organization personally","Following all procedures exactly without asking questions","Understanding how decisions, relationships and influence change and operate within an organization","Memorizing the official organization chart and job titles"],"answer_index":2,"explanation":"It is a competency: understand the context, map influence and anticipate impact."},{"id":"S4-011","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 12","question":"Within organizational awareness, what does 'map influence' mean?","options":["Drawing the physical layout of the factory floor and all the offices","Identifying formal decision-makers and the people who influence them","Ranking employees according to their salary levels","Listing competitors according to their market share"],"answer_index":1,"explanation":"The three elements are: understand the context, map influence, anticipate impact."},{"id":"S4-012","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 13","question":"What progression does the lecture describe from self-awareness to organizational awareness?","options":["Understand the organization → Understand yourself → Understand others → Act","Understand profits → Understand costs → Understand people","Understand rules → Follow rules → Enforce rules","Understand yourself → Understand others → Understand the organization"],"answer_index":3,"explanation":"Self-awareness → social awareness → organizational awareness."},{"id":"S4-013","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 15","question":"How does the lecture describe the time horizon of business strategy?","options":["Usually multi-year (about 3–5 years, sometimes longer) but reviewed as conditions change","One week, renewed every Monday by the management team","Exactly one fiscal quarter, after which it is replaced","Permanent; once written, it is never revised"],"answer_index":0,"explanation":"Business strategy is long-term direction or scope that achieves competitive advantage."},{"id":"S4-014","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 15","question":"According to the lecture, business strategy achieves competitive advantage through:","options":["The best use of resources while fulfilling stakeholder expectations","Copying competitors' most successful products as quickly as possible","Minimizing employee headcount in every department","Avoiding long-term commitments to keep options open"],"answer_index":0,"explanation":"It defines where and how a business will compete and how it will create value."},{"id":"S4-015","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 17","question":"How does the lecture distinguish strategy and culture?","options":["Strategy and culture are two names for the same management concept","Culture is set by the CEO, while strategy emerges from employees","Strategy defines intended direction; culture influences how people interpret and execute it","Culture only matters in large multinational organizations"],"answer_index":2,"explanation":"Culture exists from small family companies to multinationals and even nations."},{"id":"S4-016","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 18","question":"According to the lecture, organizational culture is reflected in:","options":["What is celebrated, what is tolerated, and what you cannot do inside the organization","The figures reported in the annual financial statements","The company logo, colors and other visual branding elements","The total number of employees and office locations"],"answer_index":0,"explanation":"Culture helps build desired behaviors and engage a productive workforce."},{"id":"S4-017","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 19","question":"Culture becomes visible through repeated management actions. Behaviors that 'continue without correction' are classified as:","options":["Tolerated","Corrected","Rewarded","Celebrated"],"answer_index":0,"explanation":"Rewarded: recognition/resources; tolerated: continue without correction; corrected: trigger consequences."},{"id":"S4-018","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 20","question":"Which layer of organizational culture contains 'deep beliefs about authority, risk, cooperation, customers and acceptable behavior'?","options":["Visible practices and symbols","Formal structure","Stated values","Underlying assumptions"],"answer_index":3,"explanation":"Visible practices (behaviors, symbols, routines) → stated values (goals, principles) → underlying assumptions (deep beliefs)."},{"id":"S4-019","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 21","question":"In the eight organizational culture styles, which style emphasizes 'planning, caution and preparedness'?","options":["Order","Authority","Caring","Safety"],"answer_index":3,"explanation":"Safety = planning, caution, preparedness; Order = structure, respect, shared norms."},{"id":"S4-020","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 21","question":"Which culture style emphasizes 'strength, decisiveness and boldness'?","options":["Enjoyment","Safety","Authority","Results"],"answer_index":2,"explanation":"Authority = strength, decisiveness and boldness; Results = achievement and winning."},{"id":"S4-021","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 22","question":"Which two dimensions were used to develop the eight culture styles?","options":["Independence vs. interdependence, and flexibility vs. stability","Formal vs. informal, and local vs. global","Centralized vs. decentralized control, and profit vs. nonprofit orientation","Short-term vs. long-term, and cost vs. quality"],"answer_index":0,"explanation":"How people interact (independence–interdependence) and how they respond to change (flexibility–stability)."},{"id":"S4-022","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 22","question":"On the lecture slide mapping companies to culture styles, which company is placed under 'Safety'?","options":["THY","İş Bank","BIM","Tesla"],"answer_index":0,"explanation":"The slide places Tesla under Learning, BIM under Results, İş Bank under Caring and THY under Safety."},{"id":"S4-023","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 22","question":"What caution does the lecture give about culture styles?","options":["Each organization has exactly one culture style at any time","Culture styles apply only to manufacturing companies","They describe dominant behavioral patterns, not fixed labels for an entire organization","Culture styles never change once an organization is founded"],"answer_index":2,"explanation":"Organizations may contain more than one cultural style."},{"id":"S4-024","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 23","question":"How does the lecture describe the Competing Values Framework?","options":["A personality test used to assess individual employees","A legal framework for corporate governance and board oversight","A diagnostic model that helps describe and compare cultural orientations","A financial model used for valuing companies before mergers"],"answer_index":2,"explanation":"Culture is the actual set of shared values, observed in everyday behaviors and decisions."},{"id":"S4-025","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 24","question":"In Cameron and Quinn's framework, the dynamic, entrepreneurial 'Create' culture is called:","options":["Market culture","Adhocracy culture","Clan culture","Hierarchy culture"],"answer_index":1,"explanation":"Adhocracy = Create; Clan = Collaborate; Hierarchy = Control; Market = Compete."},{"id":"S4-026","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 24","question":"In Cameron and Quinn's framework, the results-oriented, competitive 'Compete' culture is called:","options":["Adhocracy culture","Hierarchy culture","Clan culture","Market culture"],"answer_index":3,"explanation":"Market culture is results-oriented and competitive."},{"id":"S4-027","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 24","question":"Which instrument developed by Cameron and Quinn is used to assess organizational culture?","options":["The Organizational Culture Assessment Instrument (OCAI)","The Myers-Briggs Type Indicator (MBTI)","The Balanced Scorecard strategic performance measurement framework","The Thomas-Kilmann Conflict Mode Instrument"],"answer_index":0,"explanation":"The OCAI can be completed in about 15 minutes."},{"id":"S4-028","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 25","question":"How is the OCAI answered?","options":["Six questions, each with four alternatives; you divide 100 points among the alternatives","Ten yes/no questions that are scored by the HR department","A single open essay describing the company's culture","A 1–5 rating for each of fifty separate culture statements"],"answer_index":0,"explanation":"Give more points to the alternative most similar to your organization; each question totals 100."},{"id":"S4-029","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 26","question":"In the OCAI, 'The organization is a very personal place, like an extended family' describes which culture type?","options":["Hierarchy","Market","Adhocracy","Clan"],"answer_index":3,"explanation":"Family-like, people-oriented descriptions correspond to the Clan (Collaborate) culture."},{"id":"S4-030","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 26","question":"In the OCAI, 'The organization is very controlled and structured; formal procedures govern what people do' describes which culture type?","options":["Hierarchy","Clan","Adhocracy","Market"],"answer_index":0,"explanation":"Formal procedures and control indicate the Hierarchy culture."},{"id":"S4-031","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 26","question":"In the OCAI, 'The organization is a dynamic entrepreneurial place; people are willing to stick their necks out and take risks' describes which culture type?","options":["Adhocracy","Hierarchy","Clan","Market"],"answer_index":0,"explanation":"Risk-taking and entrepreneurship characterize the Adhocracy (Create) culture."},{"id":"S4-032","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 25","question":"What does the lecture say effective organizations do with the competing values?","options":["They rotate between the four culture types every year","They choose one culture type and try to eliminate the others","They let each employee choose whichever culture type they prefer","They balance competing cultural values rather than relying on one culture type in every situation"],"answer_index":3,"explanation":"The culture of an organization is a mix of the four values."},{"id":"S4-033","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 30","question":"Which company does the lecture use to show that a strong culture is not always good because of resistance to change?","options":["Kodak","IKEA","Disney","Tesla"],"answer_index":0,"explanation":"STRONG IS NOT ALWAYS GOOD — it may be toxic (Kodak: resistance to change)."},{"id":"S4-034","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 31","question":"According to the lecture, how did Enron's stated value of 'Integrity' compare with observed organizational signals?","options":["It led to strong whistleblower protection","It contrasted with misleading financial practices","It matched transparent reporting","It was reflected in low internal competition among employees"],"answer_index":1,"explanation":"Stated values (respect, integrity, communication, excellence) contrasted with harsh competition, misleading finance and concealment."},{"id":"S4-035","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 31","question":"How does the lecture characterize Enron's culture?","options":["Positive and learning-oriented, despite fraud by a few outsiders","Weak and aged: values were outdated and ignored","Strong but toxic: core values were written but not lived","Caring and order-oriented with low internal pressure"],"answer_index":2,"explanation":"Enron's shares fell from about $90 to below $1; challenging questionable practices carried personal risk."},{"id":"S4-036","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 33","question":"The saying 'A fish rots from the head' is used in the lecture to explain:","options":["How to fire employees","Why fishing industries need to be regulated by governments","Why supply chains fail","Where toxic culture may come from — leadership"],"answer_index":3,"explanation":"External pressures matter, but leadership and organizational systems influence how people respond."},{"id":"S4-037","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 35","question":"When does the lecture say an aged culture should change?","options":["When its established assumptions and practices no longer support the organization's current needs","Only when the CEO retires and a successor is appointed","Never, because aged cultures provide valuable stability","Every five years, regardless of how the organization is performing"],"answer_index":0,"explanation":"Triggers include changing circumstances, stakeholder expectations, demographics and objectives."},{"id":"S4-038","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 36","question":"Which of the following is listed as a reason culture can resist change?","options":["Past success creates confidence in familiar methods","Employees always welcome uncertainty","Change never threatens anyone's status, identity or expertise","Incentives always support new behavior"],"answer_index":0,"explanation":"Other reasons: routines reduce uncertainty, incentives reinforce current behavior, change threatens identity, distrust of leaders."},{"id":"S4-039","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 36","question":"Which type of culture does the lecture say can make adaptation an expected way of working?","options":["Authority-oriented cultures","Toxic cultures","Learning-oriented cultures","Aged cultures"],"answer_index":2,"explanation":"Culture does not always resist change; learning cultures expect adaptation."},{"id":"S4-040","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 37","question":"According to the lecture, what is the biggest challenge during organizational culture transformation?","options":["Reducing headcount","Communication of change","Changing the logo","Hiring enough external consultants"],"answer_index":1,"explanation":"Long-serving and new employees need to understand what the culture is, why it's changing and the impact."},{"id":"S4-041","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 37","question":"In 'Shared ownership of cultural change', what is the responsibility of MANAGERS?","options":["Explain the need for change and model the desired behavior at the top","Test new practices and raise concerns","Align recruitment, development and rewards","Translate the change into daily decisions and team practices"],"answer_index":3,"explanation":"Senior leaders explain and model; managers translate; HR aligns systems; employees test and reinforce."},{"id":"S4-042","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 37","question":"In shared ownership of cultural change, which group is responsible for aligning recruitment, development, rewards and employee feedback?","options":["HR","Managers","Senior leaders","External customers"],"answer_index":0,"explanation":"HR aligns people systems with the desired culture."},{"id":"S4-043","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 38","question":"What are the three phases of changing organizational culture in the lecture?","options":["Prepare/Unfreeze → Implement → Embed/Refreeze","Refreeze → Unfreeze → Implement → Review","Announce → Enforce → Audit → Reward","Plan → Restructure → Replace staff → Hire new leaders"],"answer_index":0,"explanation":"This mirrors Lewin's unfreeze–change–refreeze logic."},{"id":"S4-044","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 38","question":"'Align systems, incentives and management behavior' and 'monitor whether new practices continue' belong to which phase?","options":["Embed / Refreeze","Diagnose","Implement","Prepare / Unfreeze"],"answer_index":0,"explanation":"Embedding makes new practices consistent and sustainable."},{"id":"S4-045","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 38","question":"'Establish why change is needed' and 'assess readiness, concerns and barriers' belong to which phase?","options":["Implement","Embed / Refreeze","Evaluate","Prepare / Unfreeze"],"answer_index":3,"explanation":"Preparation ensures employees are ready for change."},{"id":"S4-046","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 39","question":"Does changing culture require changing strategy, according to the lecture?","options":["Yes, every culture change requires a new strategy","No, because strategy and culture are unrelated","Not necessarily — but strategy and culture must remain aligned","Only in publicly listed companies that must report to their shareholders"],"answer_index":2,"explanation":"Culture change may help execute an existing strategy; sometimes both must evolve."},{"id":"S4-047","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 40","question":"Who is credited in the lecture with the phrase 'Culture eats strategy for breakfast'?","options":["Edgar Schein","Peter Drucker","Milton Friedman","Daniel Goleman"],"answer_index":1,"explanation":"No matter how good the plan, it falls flat unless the team shares the appropriate culture."},{"id":"S4-048","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 41","question":"According to the 'Take away' slide, when must strategy change?","options":["When environmental conditions or organizational goals have changed","Only when profits fall below zero for a full year","Whenever a new employee joins the senior management team of the firm","Never, once it has been formally written down"],"answer_index":0,"explanation":"Kodak, Nokia and Grundig are examples of companies that couldn't change."},{"id":"S4-049","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 43","question":"Which causal chain does the lecture give for HR policies?","options":["HR practices → employee understanding and behavior → organizational performance","Training → certificates → automatic promotion","Organizational performance → HR budget → hiring decisions","Salaries → employee loyalty → profit, with no effect on how employees understand the strategy"],"answer_index":0,"explanation":"HR policies shape what employees learn, value and experience."},{"id":"S4-050","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 45","question":"In the employee learning journey, 'code of ethics', 'core values and culture' and 'role expectations' belong to which stage?","options":["Exit interviews","Organizational orientation","Job and capability development","Career and leadership development"],"answer_index":1,"explanation":"Orientation covers strategy and goals, values, code of ethics, policies and role expectations."},{"id":"S4-051","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 47","question":"Which characteristics describe a MECHANISTIC structure?","options":["No formal roles and no hierarchy","More decentralized, more flexible, adaptable roles, more lateral communication across units","More centralized, more formalized, clearly defined roles, primarily vertical communication","Fully outsourced with no office"],"answer_index":2,"explanation":"Mechanistic structures suit stable conditions; organic structures suit dynamic conditions."},{"id":"S4-052","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 47","question":"How does the lecture relate mechanistic/organic to structures such as functional or matrix?","options":["A structure can be more mechanistic or more organic; these are not separate structures like functional or matrix","Functional structures are always organic by definition","Only matrix structures can be described as organic","Mechanistic and organic are two additional structure types alongside matrix"],"answer_index":0,"explanation":"Mechanistic–organic is a spectrum describing how any structure operates."},{"id":"S4-053","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 48","question":"Using the contingency view, what structural response suits a dynamic and uncertain environment?","options":["A purely functional structure","More standardization and formalization of procedures","Greater flexibility and decentralization","Greater central coordination"],"answer_index":2,"explanation":"Stable, predictable environments call for more standardization and formalization."},{"id":"S4-054","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 48","question":"According to the contingency view, an organization with diverse markets, products or locations should consider:","options":["A single central office for all decisions","A purely functional structure","Divisional or hybrid structures","Eliminating all formal structure"],"answer_index":2,"explanation":"Concentrated operations may need only a functional structure."},{"id":"S4-055","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 49","question":"According to the lecture, divisional structures can be organized by which bases?","options":["Managers' personality type, IQ, EQ or SQ","Main vendor, bank, auditor or regulator","Product or service, location, customer, or process","Employees' salary level, age, gender or years of tenure"],"answer_index":2,"explanation":"Divisional forms group activities around products, geography, customers or processes."},{"id":"S4-056","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 50","question":"How does the lecture define a network organization?","options":["A collection of autonomous firms or units that behave as a single larger entity, coordinated by social mechanisms","A government agency that regulates an entire industry","A company that produces and sells only one product line","A single firm with a very tall hierarchy and many management layers"],"answer_index":0,"explanation":"Entities are usually legally independent, coordinated by contracts and social/economic mechanisms."},{"id":"S4-057","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 51","question":"Under which condition do network organizations tend to occur?","options":["When labor costs are negligible compared with capital costs","When demand uncertainty and fast-changing technology make vertical integration a bad idea","When one firm controls all of its suppliers through ownership","When markets and technologies are completely stable for decades"],"answer_index":1,"explanation":"Networks are halfway between vertical integration and market disaggregation; firms decouple volatile sections."},{"id":"S4-058","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 52","question":"In network organizations, everyone hearing about a difficult partner (as in the film industry) illustrates which favorable condition?","options":["Restricted access","Reputation","Joint payoffs","Macroculture"],"answer_index":1,"explanation":"Other conditions: joint payoffs, restricted access to a few long-term partners, and a shared macroculture."},{"id":"S4-059","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 52","question":"In network organizations, payments arranged so that nobody gets paid if the product fails illustrate which condition?","options":["Restricted access","Reputation","Joint payoffs","Macroculture"],"answer_index":2,"explanation":"Joint payoffs give everyone incentives to do their best."},{"id":"S4-060","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 53","question":"BMW outsourcing about 65% of a car's total production cost to long-term suppliers is an example of which network type?","options":["Market network","Dynamic network","Stable network","Internal network"],"answer_index":2,"explanation":"A central organization outsources much of its operations to long-term partners."},{"id":"S4-061","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 53","question":"A large company treating its units as separate profit centers that may also sell outside (e.g., GM's spark plug division) is a(n):","options":["Internal network","Virtual organization","Stable network","Dynamic network"],"answer_index":0,"explanation":"Headquarters acts like a broker; market prices give units an incentive to improve."},{"id":"S4-062","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 54","question":"Nike, whose own functions are mainly R&D and marketing while it assembles assets owned by others, is the center of which network type?","options":["Mechanistic bureaucracy","Stable network","Internal network","Dynamic network"],"answer_index":3,"explanation":"Dynamic networks outsource even more heavily; common in fashion, toys, publishing, film and biotech."},{"id":"S4-063","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 55","question":"Which description fits a virtual organization?","options":["A firm that contracts out almost all functions, keeping only its name and coordination, possibly without a permanent office","A firm with a large headquarters that is fully vertically integrated","A firm whose units are all profit centers selling to each other","A state-owned enterprise run directly by a government ministry"],"answer_index":0,"explanation":"Example: a fashion label run by three people subcontracting all functions — a 'hollow corporation'."},{"id":"S4-064","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 56","question":"According to the 'Key Comparison' slide, what is the primary driver of a virtual organization compared with a network organization?","options":["Vertical integration (vs. outsourcing to independent partners)","Digital/ICT connectivity and distributed work (vs. strategic alliances and inter-firm partnerships)","Government regulation (vs. open market competition between firms)","Family ownership (vs. public ownership on a stock exchange)"],"answer_index":1,"explanation":"Virtual organizations rely on digital connectivity; networks rely on strategic alliances."},{"id":"S4-065","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 59","question":"In a formal organization, authority arises from position; in an informal organization, authority arises from:","options":["Written job descriptions","Personal qualities","Seniority rules","Board resolutions"],"answer_index":1,"explanation":"Informal organization is the network of social relationships arising from interaction, not deliberately formed."},{"id":"S4-066","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 60","question":"Which is listed as a DISADVANTAGE of the informal organization?","options":["Boosts employee morale","Potential for spreading rumors","Encourages creativity and innovation","Promotes open communication"],"answer_index":1,"explanation":"Disadvantages also include lack of clear authority, inefficiency and coordination difficulty."},{"id":"S4-067","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 63","question":"Order fulfillment & logistics and product manufacturing are examples of which process type?","options":["Informal processes","Management (strategic) processes","Support processes","Core (operational) processes"],"answer_index":3,"explanation":"Core processes directly create the products or services customers buy and generate revenue."},{"id":"S4-068","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 64","question":"IT service-desk ticketing, procurement and employee leave requests are examples of:","options":["Core processes","Management processes","Support processes","Network processes"],"answer_index":2,"explanation":"Support processes don't generate money directly but provide infrastructure for core processes."},{"id":"S4-069","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 65","question":"Strategic goal setting with OKRs, internal audits and crisis management/non-conformity handling are examples of:","options":["Support (infrastructure) processes","Core (operational) processes","Informal (social) processes","Management (strategic) processes"],"answer_index":3,"explanation":"Management processes govern the operation: planning, oversight, performance and risk."},{"id":"S4-070","section":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 66","question":"According to the closing slide, what can happen if your organizational awareness skills are weak?","options":["You may be surprised by organizational events and make mistakes from misunderstanding the structure","You will be able to avoid all workplace conflicts","Your technical skills will decline over time","You will automatically be promoted faster than your peers"],"answer_index":0,"explanation":"You may also find it hard to get things done or act in ways others find inappropriate."},{"id":"S4-071","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 3","question":"According to Groysberg et al., how do strategy and culture differ as leadership levers?","options":["Strategy gives a formal logic for goals; culture expresses goals through values, beliefs and shared norms","Strategy is set by frontline employees, while culture is set by the board","They are identical levers that work through the same mechanisms","Strategy is informal and unwritten, while culture is written into contracts"],"answer_index":0,"explanation":"Strategy orients people around goals; culture works through shared assumptions and group norms."},{"id":"S4-072","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"Why do the authors call culture a 'more elusive lever' than strategy?","options":["Much of it is anchored in unspoken behaviors, mindsets and social patterns","It can only be changed by external management consultants","It is protected by employment law and cannot be changed","It is measured only through a fixed set of financial performance indicators each year"],"answer_index":0,"explanation":"Leaders often let culture go unmanaged or relegate it to HR."},{"id":"S4-073","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"Which of the following is NOT one of the four generally accepted attributes of culture identified by the authors?","options":["Enduring","Explicit","Shared","Pervasive"],"answer_index":1,"explanation":"The four attributes are shared, pervasive, enduring and implicit."},{"id":"S4-074","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"Which model explains why culture is 'enduring', according to the article?","options":["Friedrich Glasl's nine-level model of conflict escalation stages","Kurt Lewin's force-field analysis of change","Lawrence Kohlberg's stages of moral development","Benjamin Schneider's attraction-selection-attrition model"],"answer_index":3,"explanation":"People are drawn to similar organizations, organizations select those who fit, and misfits leave."},{"id":"S4-075","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"Culture acting as a 'silent language' that people are hardwired to recognize illustrates which attribute?","options":["Enduring","Implicit","Pervasive","Shared"],"answer_index":1,"explanation":"Despite its subliminal nature, people instinctively respond to culture."},{"id":"S4-076","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"How do the authors define culture?","options":["The CEO's personal preferences and management style","The tacit social order of an organization that shapes attitudes and behaviors in wide-ranging and durable ways","The written policies and rules in the employee handbook","The organization's legal structure and ownership"],"answer_index":1,"explanation":"Cultural norms define what is encouraged, discouraged, accepted or rejected."},{"id":"S4-077","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 4","question":"How does the article contrast who determines strategy and culture?","options":["Both strategy and culture are determined only by frontline employees through daily work","Culture is set by the HR department, while strategy is set by the marketing department","Strategy is typically determined by the C-suite, while culture blends top leaders' intentions with frontline employees' knowledge and experiences","Both strategy and culture are set by shareholders at the annual general meeting"],"answer_index":2,"explanation":"Culture can evolve flexibly and autonomously."},{"id":"S4-078","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 5","question":"Cultures that lean toward 'independence' on the people-interactions dimension place greater value on:","options":["Rules and seniority-based staffing","Consistency and predictability","Integration, coordination and managing relationships","Autonomy, individual action and competition"],"answer_index":3,"explanation":"Interdependent cultures emphasize integration, relationships and coordinated group effort."},{"id":"S4-079","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 5","question":"Cultures that favor 'stability' in their response to change tend to:","options":["Prioritize innovation, openness, diversity and a longer-term orientation over efficiency","Follow rules, use control structures, reinforce hierarchy and strive for efficiency","Pursue idealism, sustainability and global community goals","Emphasize fun, spontaneity and a sense of humor at work"],"answer_index":1,"explanation":"Flexible cultures prioritize innovation, openness, diversity and longer-term orientation."},{"id":"S4-080","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 5","question":"In the integrated culture framework, which styles are adjacent and therefore coexist easily?","options":["Authority and purpose","Safety and order","Safety and learning","Enjoyment and order"],"answer_index":1,"explanation":"Proximate styles (safety & order, learning & enjoyment) coexist; opposite ones (authority & purpose, safety & learning) are harder."},{"id":"S4-081","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"Which pair of styles is located across from each other and requires more organizational energy to maintain simultaneously?","options":["Safety and order","Caring and purpose","Learning and enjoyment","Safety and learning"],"answer_index":3,"explanation":"Opposite styles are less likely to be found together."},{"id":"S4-082","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"In the article's leader statements, Huawei's CEO describing a 'wolf spirit' illustrates which culture style?","options":["Authority","Learning","Enjoyment","Results"],"answer_index":0,"explanation":"The wolf metaphor reflects strength, decisiveness and a strong desire to win."},{"id":"S4-083","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"In the article's leader statements, Zappos' Tony Hsieh ('Have fun…') illustrates which style?","options":["Purpose","Caring","Learning","Enjoyment"],"answer_index":3,"explanation":"Enjoyment is expressed through fun and excitement."},{"id":"S4-084","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"In the article's leader statements, Whole Foods' John Mackey on 'a deeper, more transcendent purpose' illustrates which style?","options":["Results","Order","Purpose","Caring"],"answer_index":2,"explanation":"Purpose is exemplified by idealism and altruism."},{"id":"S4-085","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"In the article's leader statements, the SEC chairman's remarks about rule making illustrate which style?","options":["Order","Safety","Authority","Results"],"answer_index":0,"explanation":"Order focuses on respect, structure and shared norms."},{"id":"S4-086","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"What do the authors say about whether one culture style is better than another?","options":["Each style has advantages and disadvantages; no style is inherently better","Learning is always superior in any industry or context","Results is always the best style because it drives measurable financial performance","Caring should dominate every culture to keep employees loyal"],"answer_index":0,"explanation":"The framework involves trade-offs and difficult choices."},{"id":"S4-087","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"A culture emphasizing both caring and order brings loyalty and engagement, but which challenge?","options":["A lack of rules and structure that causes compliance problems","High internal competition and a psychologically unsafe climate","Excessive risk taking and a lack of planning or preparation","A tendency toward groupthink, consensus-based decisions and avoidance of difficult issues"],"answer_index":3,"explanation":"It can also produce a calcified sense of 'us versus them'."},{"id":"S4-088","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 6","question":"Why can a culture that emphasizes both results and caring confuse employees?","options":["Both styles avoid change and resist new strategic directions","Both styles reject a focus on customers and external markets","They may not know whether to optimize individual goals or emphasize collaboration and shared success","Both styles demand strict rules that limit individual autonomy"],"answer_index":2,"explanation":"The nature of the work or strategy may make it hard to be equally results-focused and caring."},{"id":"S4-089","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 7","question":"According to the 'pros and cons' table, which culture style was ranked 1st or 2nd most frequently (89%) among companies studied?","options":["Order","Results","Caring","Learning"],"answer_index":1,"explanation":"Results 89%, Caring 63%, Order 15%, Purpose 9%, Safety 8%, Learning 7%, Authority 4%, Enjoyment 2%."},{"id":"S4-090","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 7","question":"What disadvantage does the article list for an overemphasis on the Authority style?","options":["Politics, conflict and a psychologically unsafe work environment","A lack of focus and an inability to exploit the existing advantages","Bureaucracy and inflexibility","Reduced individualism and stifled creativity"],"answer_index":0,"explanation":"Authority's advantage is faster decision making and responsiveness to threats or crises."},{"id":"S4-091","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 7","question":"What disadvantage does the article list for an overemphasis on the Learning style?","options":["Politics, conflict and a psychologically unsafe environment for staff","A lack of focus and an inability to exploit existing advantages","Higher stress and anxiety","Slow consensus-based decisions"],"answer_index":1,"explanation":"Learning improves innovation, agility and organizational learning."},{"id":"S4-092","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 7","question":"What disadvantage does the article list for an overemphasis on the Safety style?","options":["Communication breakdowns and higher levels of stress and anxiety","A lack of discipline and possible compliance or governance issues","Neglect of practical and immediate concerns in favor of long-term ideals","Bureaucracy, inflexibility and dehumanization of the work environment"],"answer_index":3,"explanation":"Safety improves risk management, stability and business continuity."},{"id":"S4-093","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 8","question":"The retailer with the simple rule 'Do right by the customer' illustrates which insight?","options":["When aligned with strategy and leadership, a strong culture drives positive outcomes","Retailers should avoid hiring outside leaders to protect culture","Culture is largely irrelevant to the quality of customer service","A strong culture is always a liability in fast-growing retail markets"],"answer_index":0,"explanation":"Its culture combined results and caring with flexibility, learning and purpose."},{"id":"S4-094","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 8","question":"Facing hostile-takeover rumors, the agriculture business's board chose which type of new CEO?","options":["The internal successor with a safety and order style","A risk-taking candidate with a learning style","A hard-driving, competitive leader with an authority style","An external candidate aligned with the current purpose culture"],"answer_index":2,"explanation":"The new CEO navigated a hostile takeover attempt — showing leader selection requires a forward-looking strategy and culture."},{"id":"S4-095","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 8","question":"What do the authors say about cultural dynamics in mergers and acquisitions?","options":["They can safely be ignored if the financial case is strong","They matter only in cross-border deals between different countries","They are one of the greatest yet most frequently overlooked determinants of post-merger performance","They rarely affect integration success if the deal is well financed"],"answer_index":2,"explanation":"Designing a new culture on complementary strengths can speed integration."},{"id":"S4-096","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 9","question":"The European industrial-services firm whose strategy had to shift from cost leadership to service differentiation illustrates which insight?","options":["A strong culture always helps a company execute any strategy","A strong culture can be a significant liability when it is misaligned with strategy","Culture cannot be changed in traditional industrial firms","Cost leadership strategies always require a strongly learning-oriented culture to succeed"],"answer_index":1,"explanation":"Its results-, caring- and order-oriented culture with top-down authority became a roadblock."},{"id":"S4-097","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 9","question":"Which of the following is one of the four levers for evolving a culture?","options":["Keep the cultural aspiration confidential among top leaders","Freeze all hiring until the new culture has fully taken hold","Use organizational conversations about culture to underscore the importance of change","Delegate culture change entirely to the HR department"],"answer_index":2,"explanation":"The four levers: articulate the aspiration, select and develop aligned leaders, use organizational conversations, reinforce through organizational design."},{"id":"S4-098","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 9","question":"Why should culture change be framed in terms of tangible problems such as market pressures or growth challenges?","options":["Because regulators require culture change to be justified financially","Because employees tend to ignore any discussion of cultural topics","Because culture is ambiguous and hidden, tangible problems help people connect to the need for change","Because tangible problems are easier to hide from competitors"],"answer_index":2,"explanation":"This is part of articulating the aspiration."},{"id":"S4-099","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 9","question":"Although learning ranks fourth overall, which organizations accord it higher value?","options":["Small companies (200 employees or fewer) and those in newer industries like software and technology","Large state-owned enterprises with thousands of employees","Companies operating in very stable, mature industries","Firms with very tall hierarchies and centralized decisions"],"answer_index":0,"explanation":"In dynamic, uncertain environments learning gains importance."},{"id":"S4-100","section":"Organizational Awareness","source":"Reading - The Leader's Guide to Corporate Culture.pdf, p. 10","question":"According to the research summary, culture most directly affects which outcome?","options":["Tax obligations, followed by regulatory compliance","Stock price volatility, followed by dividend policy","Supplier payment terms, followed by inventory turnover and stock levels","Employee engagement and motivation, followed by customer orientation"],"answer_index":3,"explanation":"Engagement is most strongly related to flexibility styles: enjoyment, learning, purpose and caring."},{"id":"S5-001","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 4","question":"Why does the lecture say conflict is natural and inevitable?","options":["Because managers deliberately create conflict to increase their team's productivity","Because organizations usually hire more people than they need","Because labor laws require formal disagreement procedures","Because people are different, with contrasting values, goals or expectations"],"answer_index":3,"explanation":"'You can't run away from conflict — manage it.'"},{"id":"S5-002","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 5","question":"In the lecture's list of people differences that cause conflict, 'Individualism vs. Collectivism' is an example of differences in:","options":["Values","Needs","Policies","Perception"],"answer_index":0,"explanation":"Values differ across cultures (e.g., USA, China, Germany, Turkey)."},{"id":"S5-003","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 6","question":"Two departments compete for the same budget, people and equipment. Which cause of conflict is this?","options":["Role ambiguity","Status and power differences","Scarce resources","Task interdependence"],"answer_index":2,"explanation":"Scarce resources: teams compete for budget, people, equipment or time."},{"id":"S5-004","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 6","question":"Authority and responsibilities in a project are unclear, and two leads both think they own the decision. Which cause of conflict is this?","options":["Incompatible goals","Communication problems","Role ambiguity","Scarce resources"],"answer_index":2,"explanation":"Role ambiguity: authority and responsibilities are unclear."},{"id":"S5-005","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 7","question":"Your boss hired an unqualified 'good friend' as a senior manager. What approach does the lecture recommend for raising concerns?","options":["Tell the boss directly that hiring his friend was a poor decision","Organize the long-term employees to resign together as a signal","Complain about the friend's personality in a group email to staff","Present a calm business case showing how the mistakes raise costs or alienate customers, without insulting the boss's judgment"],"answer_index":3,"explanation":"View it from the boss's perspective; don't expect him to admit a hiring error."},{"id":"S5-006","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 8","question":"'Mr. Visionary' never shares details of his assignments. How does the lecture explain this?","options":["He is deliberately hiding information to keep control over the employee","He has a Playful personality and hasn't thought of the details, while the employee is Precise","He is a Peaceful type who avoids conflict by not giving instructions","He lacks the technical knowledge needed to specify the details"],"answer_index":1,"explanation":"Recognize each other's strengths and accommodate the differences."},{"id":"S5-007","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 8","question":"In the 'Mr. Visionary' case, which phrasing does the lecture recommend when asking for what you need?","options":["'Why can't you ever give me the details I need?'","'I honestly can't work like this anymore.'","'I'll need a decision on the format by noon in order to meet the print deadline.'","'Have you finally made a decision about the format yet? I've been waiting for days.'"],"answer_index":2,"explanation":"Focus on what you require, not on what's wrong with your boss."},{"id":"S5-008","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 12","question":"Which of the following is listed as a positive outcome when conflict is managed?","options":["Conflict disappears permanently from the team and its meetings","Long-standing problems are brought into the open","Decisions no longer need any discussion","Creativity is reduced in order to avoid risk"],"answer_index":1,"explanation":"Managed conflict enhances engagement, trust, productivity and creativity."},{"id":"S5-009","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 12","question":"According to the lecture, what is the goal of conflict management?","options":["Eliminate every form of conflict from the organization permanently","Minimize negative outcomes and promote positive outcomes of conflict to improve learning in the organization","Transfer all interpersonal conflicts to the HR department","Identify and punish the person who started the conflict"],"answer_index":1,"explanation":"Conflict can be beneficial when managed."},{"id":"S5-010","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 13","question":"What is the FIRST step in the lecture's five-step process for managing conflict?","options":["Discuss and negotiate possible solutions together","Stabilize the situation — manage emotions and prevent escalation","Agree on actions, implement them and review the results with everyone","Select an approach among the five conflict styles"],"answer_index":1,"explanation":"Steps: stabilize → analyze → select an approach → discuss and negotiate → agree, implement and review."},{"id":"S5-011","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 13","question":"In the five-step conflict process, identifying parties, issues, interests, causes and power relationships happens in which step?","options":["Stabilize the situation","Analyze the conflict","Agree, implement and review","Select an approach"],"answer_index":1,"explanation":"Step 2 is analysis."},{"id":"S5-012","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 14","question":"What are the four steps of analyzing a conflict?","options":["Listen, agree with both sides, apologize and forget it","Define the issue, identify who is involved, list each party's needs and concerns, draw the maps","Blame the initiator, punish, document the case and close it","Escalate, mediate, arbitrate and finally go to court"],"answer_index":1,"explanation":"Conflict occurs whenever people disagree over values, motivations, perceptions, ideas or desires."},{"id":"S5-013","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 15","question":"Parties disagree about HOW a task should be performed. Which conflict type is this?","options":["Task conflict","Communication conflict","Relationship conflict","Process conflict"],"answer_index":3,"explanation":"Task conflict = disagreement about the task itself; process conflict = how it should be done."},{"id":"S5-014","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 15","question":"Which conflict type does the lecture define as 'misuse of management power'?","options":["Process conflict","Leading conflict","Relationship conflict","Status or power conflict"],"answer_index":1,"explanation":"Status/power conflict is disagreement about authority, influence or decision rights."},{"id":"S5-015","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 17","question":"A secretary is told to lie that her boss is out of the office, conflicting with her ethic of telling the truth. Which level of conflict is this?","options":["Inter-group conflict","Conflict within the individual","Conflict between the individual and the group","Interpersonal conflict"],"answer_index":1,"explanation":"Role expectations conflict with the individual's own values."},{"id":"S5-016","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 19","question":"A highly efficient waitress feels she deserves more than the equally shared tip pool. Which level of conflict is this?","options":["Inter-group conflict between departments","Conflict between the individual and the group","Inter-organizational conflict between the restaurant and its customers","Conflict within the individual herself"],"answer_index":1,"explanation":"The individual wants to remain in the group but disagrees with its norms."},{"id":"S5-017","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 20","question":"Line managers resent depending on staff departments for information and recommendations. Which level of conflict is this?","options":["Inter-group conflict","Inter-organizational conflict","Interpersonal conflict","Conflict within the individual"],"answer_index":0,"explanation":"Inter-group conflicts arise from factors inherent in organizational structure (e.g., line vs. staff, union vs. management)."},{"id":"S5-018","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 21","question":"A buyer and a supplier disagree about quantity, quality and delivery times of raw materials. Which level of conflict is this?","options":["Interpersonal conflict","Inter-group conflict","Conflict between the individual and the group","Inter-organizational conflict"],"answer_index":3,"explanation":"Inter-organizational conflict occurs between organizations dependent on each other."},{"id":"S5-019","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 23","question":"According to the lecture, differences in operative goals create potential for what kind of conflict?","options":["Vertical conflict","Conflict within the individual","Horizontal conflict","Inter-organizational conflict"],"answer_index":2,"explanation":"Other needs/concerns: task dependence, insufficient resources, salaries, unclear delegation of authority."},{"id":"S5-020","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 24","question":"Production says 'Production must not stop'; its interest is meeting the customer delivery date. What is its underlying concern?","options":["Reducing overtime costs","Avoiding financial penalties and damage to customer trust","Protecting safety on the line and avoiding a larger equipment failure","Completing preventive maintenance"],"answer_index":1,"explanation":"Maintenance's underlying concern, by contrast, is protecting safety and avoiding a larger failure."},{"id":"S5-021","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 24","question":"In the engineering example, 'The equipment must stop immediately' is maintenance's:","options":["Position","Underlying concern","BATNA","Interest"],"answer_index":0,"explanation":"Position = what they say; interest = complete preventive maintenance; concern = safety."},{"id":"S5-022","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 26","question":"Which conflict map separates stated positions, underlying interests and deeper needs?","options":["Timeline","Onion model","Relationship map","Conflict tree"],"answer_index":1,"explanation":"Timeline: events and escalation; relationship map: parties and power; conflict tree: root causes, central problem, consequences."},{"id":"S5-023","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 26","question":"According to the lecture, when should you use conflict mapping?","options":["Only when lawyers are already involved","Only after the conflict has been fully resolved and documented","When you feel stuck and can't see a clear way forward","Only for international or political conflicts"],"answer_index":2,"explanation":"Benefits: see the bigger picture, gain insight and see additional perspectives; everyone can use mapping."},{"id":"S5-024","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 28","question":"In the onion example, 'I want a raise' → 'because I feel underappreciated' → 'I need security'. What is 'I need security'?","options":["The core need (inner layer)","The BATNA","The position (outer layer)","The interest (middle layer)"],"answer_index":0,"explanation":"Outer = position, middle = interest, inner = core need."},{"id":"S5-025","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 29","question":"In onion graphing, which question uncovers the middle layer (interests)?","options":["'Who started this?'","'What do you want?'","'What is your absolute bottom line here?'","'Why is this important to you?'"],"answer_index":3,"explanation":"After listing positions, asking 'why' reveals interests; probing deeper reveals core needs."},{"id":"S5-026","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 29","question":"After comparing the onion layers of both parties, what should solutions target?","options":["Shared interests or core needs, not just surface positions","An equal split between the two stated positions","The original demands, exactly as each side stated them at the start","The stated position of the more powerful party"],"answer_index":0,"explanation":"Overlaps in interests or needs often reveal room for compromise or collaboration."},{"id":"S5-027","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 30","question":"In conflict mapping symbols, what does the size of a circle represent?","options":["The power of the conflict party in relation to the conflict","How long the party has been involved in it","The number of people who belong to the party in the conflict","The size of the party's financial budget"],"answer_index":0,"explanation":"Circle = party; size symbolizes power."},{"id":"S5-028","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 30","question":"In conflict mapping symbols, what does a double line between two parties indicate?","options":["A weak, informal or intermittent link","A connection that has been broken","A very good relationship or alliance","Discord or open conflict between them"],"answer_index":2,"explanation":"Straight line = close relationship; zig-zag = discord; crossed line = broken; dotted = weak."},{"id":"S5-029","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 34","question":"In the relations tree, what goes in the ROOTS?","options":["Underlying causes such as lack of recognition, fear of losing control or broken trust","The key parties involved and their main relationships","Visible issues such as frequent arguments or missed deadlines","The solution that the parties have finally agreed on"],"answer_index":0,"explanation":"Trunk = key parties; branches/leaves = visible conflict; roots = underlying causes."},{"id":"S5-030","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 35","question":"When analyzing a relations tree, if the roots involve unfair systems, what intervention does the lecture recommend?","options":["Improve dialogue or mediation","Run trust-building activities","Ignore the roots and treat the branches","Change policies or structures"],"answer_index":3,"explanation":"Miscommunication → dialogue/mediation; unfair systems → change policies; mistrust → empathy and trust-building."},{"id":"S5-031","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 38","question":"What are the two axes of the Thomas–Kilmann conflict model?","options":["Power of each party and their formal status","Speed of the decision and cost of the outcome","Formality of communication and its frequency","Assertiveness (focus on my needs) and cooperativeness (focus on others' needs)"],"answer_index":3,"explanation":"The five styles are positioned along these two dimensions."},{"id":"S5-032","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 38","question":"In the Thomas–Kilmann model, which style is assertive and uncooperative?","options":["Avoiding","Accommodating","Collaborating","Competing"],"answer_index":3,"explanation":"Competing: high assertiveness, low cooperativeness."},{"id":"S5-033","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 38","question":"In the Thomas–Kilmann model, which style is both unassertive and uncooperative?","options":["Competing","Compromising","Accommodating","Avoiding"],"answer_index":3,"explanation":"Avoiding neither pursues one's own nor others' concerns."},{"id":"S5-034","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 39","question":"When is the competing style appropriate, according to the lecture?","options":["When the situation is not urgent and there is plenty of time available to discuss","When people are feeling sensitive about the issue","When buy-in from everyone involved is very important","When a decision must be made quickly or an unpopular decision is needed"],"answer_index":3,"explanation":"Also when someone is trying to take advantage of the situation, or as a last resort."},{"id":"S5-035","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 39","question":"Semiha decides that Cemil must handle the difficult client, ending the argument with Edip. Which style is this?","options":["Competing","Collaborating","Avoiding","Compromising"],"answer_index":0,"explanation":"The person with the firmest stand (authority) decides."},{"id":"S5-036","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 40","question":"Jale and Ali cannot agree on UX changes; the deadline is pushed back and they work on other projects for a day before resuming. Which style is this?","options":["Accommodating","Avoiding","Competing","Compromising"],"answer_index":1,"explanation":"Taking a break allows them to cool down — avoiding has its uses."},{"id":"S5-037","section":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 40","question":"When is avoiding NOT appropriate, according to the lecture?","optio
