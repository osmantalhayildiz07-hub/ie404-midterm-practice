r Team","source":"LectureNotes - Build Your Team.pdf, p. 42","question":"Which of the following is on the lecture's list of things to do BEFORE you motivate your team?","options":["Hold more frequent status meetings to keep everyone on track","Don't punish failure and don't micromanage","Hold more frequent status meetings","Pay below market to test commitment"],"answer_index":1,"explanation":"Also: pay people what they are worth, pleasant workplace, self-development, avoid useless meetings, set clear goals."},{"id":"BT-063","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 44","question":"Under Taylor's scientific management, what motivated workers?","options":["Reward — payment systems rewarded those who produced the most","The need for self-actualization","Managers taking a personal interest in workers and consulting them often","Fair comparison with colleagues' ratios"],"answer_index":0,"explanation":"Tasks were broken into small specialized units and pay was based on output."},{"id":"BT-064","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 45","question":"According to the human relations model, what motivated employees?","options":["Piece-rate pay systems based only on individual output","Fear of punishment for mistakes","Managers taking an interest in and consulting employees","Narrowly specialized tasks"],"answer_index":2,"explanation":"Employees felt valued and empowered and often worked best in teams."},{"id":"BT-065","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 43","question":"How does the lecture distinguish content theories from process theories of motivation?","options":["Content theories focus on pay; process theories focus on punishment","Content theories explain WHAT motivates us; process theories explain HOW motivation occurs","Content theories are the early theories; process theories are Taylor's scientific management methods","They are two names for the same group of theories"],"answer_index":1,"explanation":"Content: Maslow, Alderfer, McClelland, Herzberg. Process: Skinner, Vroom, Adams, Locke."},{"id":"BT-066","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 47","question":"Which of the following is a PROCESS theory of motivation?","options":["Vroom's expectancy theory","Herzberg's two-factor theory","Maslow's hierarchy of needs","McClelland's theory of needs"],"answer_index":0,"explanation":"Process theories: Skinner's reinforcement, Vroom's expectancy, Adams' equity, Locke's goal setting."},{"id":"BT-067","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 48","question":"What does the lecture say about content theories' acceptance?","options":["Greatest impact on management practice, but least accepted in academic circles","Widely accepted by academic researchers, but largely ignored by practicing managers","Required by labor law in most countries","Abandoned in both practice and academia"],"answer_index":0,"explanation":"They focus on the specific needs within a person that energize behavior."},{"id":"BT-068","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 49","question":"In Herzberg's two-factor theory, which of the following is a HYGIENE factor?","options":["Recognition","Responsibility","Salary and working conditions","Recognition for achievement at work"],"answer_index":2,"explanation":"Motivators: the work itself, responsibility, advancement, growth, achievement, recognition. Hygiene: relations, job security, conditions, salary."},{"id":"BT-069","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 49","question":"What distinguishes Alderfer's ERG theory from Maslow's hierarchy, according to the slide?","options":["It has eight levels instead of five, adding cognitive, aesthetic and transcendence needs to the top","It applies only to managers, not workers","It has eight levels instead of five","More than one level can operate at a time, and frustration leads people back to lower levels"],"answer_index":3,"explanation":"ERG = Existence, Relatedness, Growth."},{"id":"BT-070","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 49","question":"In McClelland's learned-needs theory, which need is associated with 'best when in charge'?","options":["Need for affiliation","Need for achievement","Need for power","Need for safety"],"answer_index":2,"explanation":"Achievement: challenging but not impossible projects; affiliation: best in a group environment. One need dominates due to culture and life experience."},{"id":"BT-071","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 50","question":"In Maslow's hierarchy, which needs are classified as lower-order (external)?","options":["Self-actualization and transcendence needs","Esteem and self-actualization needs","Physiological and safety needs","Social and esteem needs"],"answer_index":2,"explanation":"Higher-order (internal): social, esteem and self-actualization."},{"id":"BT-072","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 50","question":"In the adapted 8-level hierarchy (1990) shown in the lecture, what is the top level?","options":["Self-actualization — personal growth and self-fulfilment","Aesthetic needs — beauty and balance","Esteem — achievement and status","Transcendence — helping others to self-actualize"],"answer_index":3,"explanation":"The adapted model adds cognitive, aesthetic and transcendence needs to Maslow's 1943 five levels."},{"id":"BT-073","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 53","question":"Salespeople work hard to stay in the top ten to avoid being relocated to Alaska. Which reinforcement type does the lecture illustrate with this?","options":["Equity restoration","Negative reinforcement","Positive reinforcement","Extinction"],"answer_index":1,"explanation":"Removing (avoiding) an unpleasant consequence increases the desired behavior."},{"id":"BT-074","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 53","question":"You stop approving overtime and workers no longer come in on weekends. According to the reinforcement slide, what has happened to the learned behavior?","options":["It has been transferred to valence","It has been positively reinforced","It has been extinguished","It has become a hygiene factor"],"answer_index":2,"explanation":"Removing the reward leads to extinction of the behavior."},{"id":"BT-075","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 54","question":"In Vroom's expectancy theory, the belief that achieving a level of performance will lead to a desired outcome is called:","options":["Expectancy","Instrumentality","Equity","Valence"],"answer_index":1,"explanation":"Expectancy: effort → performance; instrumentality: performance → outcome; valence: value of the reward."},{"id":"BT-076","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 54","question":"In Vroom's model, how personally valuable the rewards are to the individual is called:","options":["Instrumentality","Reinforcement","Valence","Expectancy"],"answer_index":2,"explanation":"Motivation is high when effort leads to performance and performance leads to valued outcomes."},{"id":"BT-077","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 55","question":"According to equity theory, what does perceived equity depend on?","options":["Our input-to-output ratio alone","The absolute size of our salary","Comparing our own input-to-output ratio with that of relevant others","Our own input-to-output ratio alone, without any comparison with other people"],"answer_index":2,"explanation":"The slide also mentions distributive, procedural and interactional justice."},{"id":"BT-078","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 57","question":"Which are Locke and Latham's five goal-setting principles?","options":["Forming, storming, norming, performing, adjourning","Clarity, challenge, commitment, feedback, task complexity","Existence, relatedness, growth, power, affiliation","Specific, measurable, achievable, relevant and time-bound"],"answer_index":1,"explanation":"They explain why SMART goals and objectives motivate."},{"id":"BT-079","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 58","question":"Which statement about motivation appears in the lecture's summary?","options":["It is identical to job satisfaction and works the same way for everyone","It is different from job satisfaction and unique to each person","It is the same for every employee","It is fully understood by science"],"answer_index":1,"explanation":"Motivation is also a continuous, goal-oriented, context-sensitive process that can be positive or negative."},{"id":"BT-080","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 60","question":"Which three criteria does the lecture use to rate your team?","options":["Attendance, punctuality and adherence to the dress code","Budget, headcount, office size","Output, collaborative ability, individual development","Attendance, punctuality, dress code"],"answer_index":2,"explanation":"Output asks whether customers are happy with quality, quantity and delivery."},{"id":"BT-081","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 62","question":"'Do we have the right number and mix of members, and clear norms for acceptable conduct?' checks which condition?","options":["Supportive context","Strong structure","Compelling direction","Shared mindset"],"answer_index":1,"explanation":"Compelling direction = clear, challenging, consequential goal; supportive context = resources, information, training, rewards."},{"id":"BT-082","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 62","question":"'Do we readily share information and understand one another's constraints?' checks which condition?","options":["Strong structure","Compelling direction","Shared mindset","Supportive context"],"answer_index":2,"explanation":"Shared mindset is one of the four conditions used to control implementation."},{"id":"BT-083","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 63","question":"According to the summary of an effective team, what kind of coaching do teams need?","options":["No coaching once members are well selected","Individual executive coaching that focuses on improving each member's personal performance separately","Group coaching in team processes, especially at the beginning, midpoint and end of a project","Coaching only when the project has already failed"],"answer_index":2,"explanation":"Most executive coaches focus on individuals, which does not significantly improve teamwork."},{"id":"BT-084","type":"lecture","week":4,"topic":"Building and Managing Teams","doc":"Build and Manage Your Team","source":"LectureNotes - Build Your Team.pdf, p. 63","question":"What does 'Effective teams must be real' mean in the lecture's summary?","options":["The team must have a real budget line","The team must meet physically rather than online","People have to know who is on the team and who is not, and the leader must make it clear","The team must always meet physically in the same office rather than working together online"],"answer_index":2,"explanation":"Other conditions: compelling direction, enabling structures, supportive organization, expert coaching."},{"id":"S4-001","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 3","question":"According to the MIT Sloan study cited in the lecture, what share of executives and middle managers responsible for executing strategy could list three of their company's strategic priorities?","options":["About 75%","Only 5%","Only 28%","About 50%"],"answer_index":2,"explanation":"Only 28% could list three priorities, and some 30% could not list even one."},{"id":"S4-002","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 5","question":"In the hierarchy from Vision & Mission down to operational tasks, how do time horizon and specificity change?","options":["Time horizon gets shorter and specificity increases","Both stay constant","Time horizon gets shorter while specificity decreases","Time horizon gets longer and specificity decreases"],"answer_index":0,"explanation":"Vision/mission are long-term and broad; operational goals and tasks are short-term and specific."},{"id":"S4-003","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 5","question":"Which message appears on the slide about vision, strategic and operational goals?","options":["Having a strategy is not the same as having an organization that understands it","A strategy is only really needed by large multinational companies with many units","Strategy should be kept confidential from most employees","Operational goals should always be set before the mission"],"answer_index":0,"explanation":"The slide stresses setting clear goals and objectives (MBOG) and communicating them."},{"id":"S4-004","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 6","question":"Which level of strategy answers 'Which businesses and markets should we participate in?'","options":["Corporate strategy","Business-unit strategy","Operational strategy","Functional strategy"],"answer_index":0,"explanation":"Corporate strategy covers portfolio, investment and resource allocation decisions."},{"id":"S4-005","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 6","question":"Which level of strategy answers 'How will we succeed in the chosen market?'","options":["Philanthropic strategy","Functional and operational strategy","Business-unit strategy","Corporate strategy"],"answer_index":2,"explanation":"Business-unit strategy covers customers, value proposition and competitive position."},{"id":"S4-006","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 7","question":"What does IKEA's business strategy statement show, according to the lecture?","options":["IKEA competes only by offering the lowest possible price in the market","IKEA focuses mainly on custom-made, made-to-order furniture","IKEA competes by combining design, functionality, variety and affordability — not on price alone","IKEA targets a narrow luxury segment with exclusive designer products"],"answer_index":2,"explanation":"The statement offers a wide range of well-designed, functional products at prices many can afford."},{"id":"S4-007","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 8","question":"In the automotive components example, 'Reduce average order lead time from 12 to 8 days' is classified as a(n):","options":["Strategic objective of the company","Mission","Task","Operational objective"],"answer_index":3,"explanation":"Mission → strategic objective (preferred supplier) → operational objective (lead time) → tasks (scheduling, changeover, inventory)."},{"id":"S4-008","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 9","question":"The purchasing department is rewarded only for minimizing purchase prices, so it picks cheap but unreliable suppliers. What principle does this illustrate?","options":["Local optimization ≠ organizational optimization","Strategy should be set by purchasing","Lower purchase prices always improve supplier reliability","Purchasing should never be measured"],"answer_index":0,"explanation":"Each department meets its targets, yet the organization suffers — a systems-thinking lesson."},{"id":"S4-009","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 9","question":"Complete the lecture's statement: 'Strategy creates direction. Objectives define results. …'","options":["Finance measures them","Managers ignore them","Culture quietly replaces them","Operations deliver them"],"answer_index":3,"explanation":"STRATEGY CREATES DIRECTION. OBJECTIVES DEFINE RESULTS. OPERATIONS DELIVER THEM."},{"id":"S4-010","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 12","question":"How does the lecture define organizational awareness?","options":["Memorizing the official organization chart and job titles","Knowing every employee in the organization personally","Following all procedures exactly without asking questions","Understanding how decisions, relationships and influence change and operate within an organization"],"answer_index":3,"explanation":"It is a competency: understand the context, map influence and anticipate impact."},{"id":"S4-011","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 12","question":"Within organizational awareness, what does 'map influence' mean?","options":["Drawing the physical layout of the factory floor and all the offices","Ranking employees according to their salary levels","Identifying formal decision-makers and the people who influence them","Listing competitors according to their market share"],"answer_index":2,"explanation":"The three elements are: understand the context, map influence, anticipate impact."},{"id":"S4-012","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 13","question":"What progression does the lecture describe from self-awareness to organizational awareness?","options":["Understand rules → Follow rules → Enforce rules","Understand profits → Understand costs → Understand people","Understand the organization → Understand yourself → Understand others → Act","Understand yourself → Understand others → Understand the organization"],"answer_index":3,"explanation":"Self-awareness → social awareness → organizational awareness."},{"id":"S4-013","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 15","question":"How does the lecture describe the time horizon of business strategy?","options":["Usually multi-year (about 3–5 years, sometimes longer) but reviewed as conditions change","Permanent; once written, it is never revised","Exactly one fiscal quarter, after which it is replaced","One week, renewed every Monday by the management team"],"answer_index":0,"explanation":"Business strategy is long-term direction or scope that achieves competitive advantage."},{"id":"S4-014","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 15","question":"According to the lecture, business strategy achieves competitive advantage through:","options":["The best use of resources while fulfilling stakeholder expectations","Avoiding long-term commitments to keep options open","Minimizing employee headcount in every department","Copying competitors' most successful products as quickly as possible"],"answer_index":0,"explanation":"It defines where and how a business will compete and how it will create value."},{"id":"S4-015","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 17","question":"How does the lecture distinguish strategy and culture?","options":["Culture only matters in large multinational organizations","Strategy defines intended direction; culture influences how people interpret and execute it","Strategy and culture are two names for the same management concept","Culture is set by the CEO, while strategy emerges from employees"],"answer_index":1,"explanation":"Culture exists from small family companies to multinationals and even nations."},{"id":"S4-016","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 18","question":"According to the lecture, organizational culture is reflected in:","options":["The figures reported in the annual financial statements","The company logo, colors and other visual branding elements","The total number of employees and office locations","What is celebrated, what is tolerated, and what you cannot do inside the organization"],"answer_index":3,"explanation":"Culture helps build desired behaviors and engage a productive workforce."},{"id":"S4-017","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 19","question":"Culture becomes visible through repeated management actions. Behaviors that 'continue without correction' are classified as:","options":["Celebrated","Corrected","Tolerated","Rewarded"],"answer_index":2,"explanation":"Rewarded: recognition/resources; tolerated: continue without correction; corrected: trigger consequences."},{"id":"S4-018","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 20","question":"Which layer of organizational culture contains 'deep beliefs about authority, risk, cooperation, customers and acceptable behavior'?","options":["Formal structure","Visible practices and symbols","Underlying assumptions","Stated values"],"answer_index":2,"explanation":"Visible practices (behaviors, symbols, routines) → stated values (goals, principles) → underlying assumptions (deep beliefs)."},{"id":"S4-019","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 21","question":"In the eight organizational culture styles, which style emphasizes 'planning, caution and preparedness'?","options":["Safety","Caring","Order","Authority"],"answer_index":0,"explanation":"Safety = planning, caution, preparedness; Order = structure, respect, shared norms."},{"id":"S4-020","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 21","question":"Which culture style emphasizes 'strength, decisiveness and boldness'?","options":["Safety","Authority","Enjoyment","Results"],"answer_index":1,"explanation":"Authority = strength, decisiveness and boldness; Results = achievement and winning."},{"id":"S4-021","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 22","question":"Which two dimensions were used to develop the eight culture styles?","options":["Short-term vs. long-term, and cost vs. quality","Independence vs. interdependence, and flexibility vs. stability","Formal vs. informal, and local vs. global","Centralized vs. decentralized control, and profit vs. nonprofit orientation"],"answer_index":1,"explanation":"How people interact (independence–interdependence) and how they respond to change (flexibility–stability)."},{"id":"S4-022","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 22","question":"On the lecture slide mapping companies to culture styles, which company is placed under 'Safety'?","options":["THY","İş Bank","Tesla","BIM"],"answer_index":0,"explanation":"The slide places Tesla under Learning, BIM under Results, İş Bank under Caring and THY under Safety."},{"id":"S4-023","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 22","question":"What caution does the lecture give about culture styles?","options":["Culture styles never change once an organization is founded","Each organization has exactly one culture style at any time","They describe dominant behavioral patterns, not fixed labels for an entire organization","Culture styles apply only to manufacturing companies"],"answer_index":2,"explanation":"Organizations may contain more than one cultural style."},{"id":"S4-024","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 23","question":"How does the lecture describe the Competing Values Framework?","options":["A personality test used to assess individual employees","A legal framework for corporate governance and board oversight","A diagnostic model that helps describe and compare cultural orientations","A financial model used for valuing companies before mergers"],"answer_index":2,"explanation":"Culture is the actual set of shared values, observed in everyday behaviors and decisions."},{"id":"S4-025","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 24","question":"In Cameron and Quinn's framework, the dynamic, entrepreneurial 'Create' culture is called:","options":["Market culture","Hierarchy culture","Adhocracy culture","Clan culture"],"answer_index":2,"explanation":"Adhocracy = Create; Clan = Collaborate; Hierarchy = Control; Market = Compete."},{"id":"S4-026","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 24","question":"In Cameron and Quinn's framework, the results-oriented, competitive 'Compete' culture is called:","options":["Market culture","Hierarchy culture","Adhocracy culture","Clan culture"],"answer_index":0,"explanation":"Market culture is results-oriented and competitive."},{"id":"S4-027","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 24","question":"Which instrument developed by Cameron and Quinn is used to assess organizational culture?","options":["The Balanced Scorecard strategic performance measurement framework","The Organizational Culture Assessment Instrument (OCAI)","The Thomas-Kilmann Conflict Mode Instrument","The Myers-Briggs Type Indicator (MBTI)"],"answer_index":1,"explanation":"The OCAI can be completed in about 15 minutes."},{"id":"S4-028","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 25","question":"How is the OCAI answered?","options":["Six questions, each with four alternatives; you divide 100 points among the alternatives","Ten yes/no questions that are scored by the HR department","A 1–5 rating for each of fifty separate culture statements","A single open essay describing the company's culture"],"answer_index":0,"explanation":"Give more points to the alternative most similar to your organization; each question totals 100."},{"id":"S4-029","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 26","question":"In the OCAI, 'The organization is a very personal place, like an extended family' describes which culture type?","options":["Market","Adhocracy","Clan","Hierarchy"],"answer_index":2,"explanation":"Family-like, people-oriented descriptions correspond to the Clan (Collaborate) culture."},{"id":"S4-030","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 26","question":"In the OCAI, 'The organization is very controlled and structured; formal procedures govern what people do' describes which culture type?","options":["Clan","Market","Adhocracy","Hierarchy"],"answer_index":3,"explanation":"Formal procedures and control indicate the Hierarchy culture."},{"id":"S4-031","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 26","question":"In the OCAI, 'The organization is a dynamic entrepreneurial place; people are willing to stick their necks out and take risks' describes which culture type?","options":["Market","Clan","Adhocracy","Hierarchy"],"answer_index":2,"explanation":"Risk-taking and entrepreneurship characterize the Adhocracy (Create) culture."},{"id":"S4-032","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 25","question":"What does the lecture say effective organizations do with the competing values?","options":["They let each employee choose whichever culture type they prefer","They rotate between the four culture types every year","They choose one culture type and try to eliminate the others","They balance competing cultural values rather than relying on one culture type in every situation"],"answer_index":3,"explanation":"The culture of an organization is a mix of the four values."},{"id":"S4-033","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 30","question":"Which company does the lecture use to show that a strong culture is not always good because of resistance to change?","options":["IKEA","Disney","Tesla","Kodak"],"answer_index":3,"explanation":"STRONG IS NOT ALWAYS GOOD — it may be toxic (Kodak: resistance to change)."},{"id":"S4-034","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 31","question":"According to the lecture, how did Enron's stated value of 'Integrity' compare with observed organizational signals?","options":["It led to strong whistleblower protection","It matched transparent reporting","It was reflected in low internal competition among employees","It contrasted with misleading financial practices"],"answer_index":3,"explanation":"Stated values (respect, integrity, communication, excellence) contrasted with harsh competition, misleading finance and concealment."},{"id":"S4-035","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 31","question":"How does the lecture characterize Enron's culture?","options":["Caring and order-oriented with low internal pressure","Positive and learning-oriented, despite fraud by a few outsiders","Weak and aged: values were outdated and ignored","Strong but toxic: core values were written but not lived"],"answer_index":3,"explanation":"Enron's shares fell from about $90 to below $1; challenging questionable practices carried personal risk."},{"id":"S4-036","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 33","question":"The saying 'A fish rots from the head' is used in the lecture to explain:","options":["Where toxic culture may come from — leadership","How to fire employees","Why fishing industries need to be regulated by governments","Why supply chains fail"],"answer_index":0,"explanation":"External pressures matter, but leadership and organizational systems influence how people respond."},{"id":"S4-037","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 35","question":"When does the lecture say an aged culture should change?","options":["Only when the CEO retires and a successor is appointed","Every five years, regardless of how the organization is performing","When its established assumptions and practices no longer support the organization's current needs","Never, because aged cultures provide valuable stability"],"answer_index":2,"explanation":"Triggers include changing circumstances, stakeholder expectations, demographics and objectives."},{"id":"S4-038","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 36","question":"Which of the following is listed as a reason culture can resist change?","options":["Change never threatens anyone's status, identity or expertise","Employees always welcome uncertainty","Past success creates confidence in familiar methods","Incentives always support new behavior"],"answer_index":2,"explanation":"Other reasons: routines reduce uncertainty, incentives reinforce current behavior, change threatens identity, distrust of leaders."},{"id":"S4-039","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 36","question":"Which type of culture does the lecture say can make adaptation an expected way of working?","options":["Toxic cultures","Aged cultures","Learning-oriented cultures","Authority-oriented cultures"],"answer_index":2,"explanation":"Culture does not always resist change; learning cultures expect adaptation."},{"id":"S4-040","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 37","question":"According to the lecture, what is the biggest challenge during organizational culture transformation?","options":["Communication of change","Changing the logo","Reducing headcount","Hiring enough external consultants"],"answer_index":0,"explanation":"Long-serving and new employees need to understand what the culture is, why it's changing and the impact."},{"id":"S4-041","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 37","question":"In 'Shared ownership of cultural change', what is the responsibility of MANAGERS?","options":["Align recruitment, development and rewards","Explain the need for change and model the desired behavior at the top","Test new practices and raise concerns","Translate the change into daily decisions and team practices"],"answer_index":3,"explanation":"Senior leaders explain and model; managers translate; HR aligns systems; employees test and reinforce."},{"id":"S4-042","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 37","question":"In shared ownership of cultural change, which group is responsible for aligning recruitment, development, rewards and employee feedback?","options":["Senior leaders","HR","Managers","External customers"],"answer_index":1,"explanation":"HR aligns people systems with the desired culture."},{"id":"S4-043","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 38","question":"What are the three phases of changing organizational culture in the lecture?","options":["Refreeze → Unfreeze → Implement → Review","Announce → Enforce → Audit → Reward","Prepare/Unfreeze → Implement → Embed/Refreeze","Plan → Restructure → Replace staff → Hire new leaders"],"answer_index":2,"explanation":"This mirrors Lewin's unfreeze–change–refreeze logic."},{"id":"S4-044","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 38","question":"'Align systems, incentives and management behavior' and 'monitor whether new practices continue' belong to which phase?","options":["Prepare / Unfreeze","Diagnose","Embed / Refreeze","Implement"],"answer_index":2,"explanation":"Embedding makes new practices consistent and sustainable."},{"id":"S4-045","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 38","question":"'Establish why change is needed' and 'assess readiness, concerns and barriers' belong to which phase?","options":["Prepare / Unfreeze","Implement","Embed / Refreeze","Evaluate"],"answer_index":0,"explanation":"Preparation ensures employees are ready for change."},{"id":"S4-046","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 39","question":"Does changing culture require changing strategy, according to the lecture?","options":["No, because strategy and culture are unrelated","Only in publicly listed companies that must report to their shareholders","Yes, every culture change requires a new strategy","Not necessarily — but strategy and culture must remain aligned"],"answer_index":3,"explanation":"Culture change may help execute an existing strategy; sometimes both must evolve."},{"id":"S4-047","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 40","question":"Who is credited in the lecture with the phrase 'Culture eats strategy for breakfast'?","options":["Milton Friedman","Peter Drucker","Edgar Schein","Daniel Goleman"],"answer_index":1,"explanation":"No matter how good the plan, it falls flat unless the team shares the appropriate culture."},{"id":"S4-048","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 41","question":"According to the 'Take away' slide, when must strategy change?","options":["Only when profits fall below zero for a full year","When environmental conditions or organizational goals have changed","Whenever a new employee joins the senior management team of the firm","Never, once it has been formally written down"],"answer_index":1,"explanation":"Kodak, Nokia and Grundig are examples of companies that couldn't change."},{"id":"S4-049","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 43","question":"Which causal chain does the lecture give for HR policies?","options":["HR practices → employee understanding and behavior → organizational performance","Training → certificates → automatic promotion","Salaries → employee loyalty → profit, with no effect on how employees understand the strategy","Organizational performance → HR budget → hiring decisions"],"answer_index":0,"explanation":"HR policies shape what employees learn, value and experience."},{"id":"S4-050","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 45","question":"In the employee learning journey, 'code of ethics', 'core values and culture' and 'role expectations' belong to which stage?","options":["Job and capability development","Organizational orientation","Career and leadership development","Exit interviews"],"answer_index":1,"explanation":"Orientation covers strategy and goals, values, code of ethics, policies and role expectations."},{"id":"S4-051","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 47","question":"Which characteristics describe a MECHANISTIC structure?","options":["No formal roles and no hierarchy","More centralized, more formalized, clearly defined roles, primarily vertical communication","More decentralized, more flexible, adaptable roles, more lateral communication across units","Fully outsourced with no office"],"answer_index":1,"explanation":"Mechanistic structures suit stable conditions; organic structures suit dynamic conditions."},{"id":"S4-052","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 47","question":"How does the lecture relate mechanistic/organic to structures such as functional or matrix?","options":["Functional structures are always organic by definition","A structure can be more mechanistic or more organic; these are not separate structures like functional or matrix","Only matrix structures can be described as organic","Mechanistic and organic are two additional structure types alongside matrix"],"answer_index":1,"explanation":"Mechanistic–organic is a spectrum describing how any structure operates."},{"id":"S4-053","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 48","question":"Using the contingency view, what structural response suits a dynamic and uncertain environment?","options":["Greater flexibility and decentralization","Greater central coordination","A purely functional structure","More standardization and formalization of procedures"],"answer_index":0,"explanation":"Stable, predictable environments call for more standardization and formalization."},{"id":"S4-054","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 48","question":"According to the contingency view, an organization with diverse markets, products or locations should consider:","options":["Eliminating all formal structure","Divisional or hybrid structures","A purely functional structure","A single central office for all decisions"],"answer_index":1,"explanation":"Concentrated operations may need only a functional structure."},{"id":"S4-055","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 49","question":"According to the lecture, divisional structures can be organized by which bases?","options":["Product or service, location, customer, or process","Employees' salary level, age, gender or years of tenure","Managers' personality type, IQ, EQ or SQ","Main vendor, bank, auditor or regulator"],"answer_index":0,"explanation":"Divisional forms group activities around products, geography, customers or processes."},{"id":"S4-056","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 50","question":"How does the lecture define a network organization?","options":["A collection of autonomous firms or units that behave as a single larger entity, coordinated by social mechanisms","A single firm with a very tall hierarchy and many management layers","A company that produces and sells only one product line","A government agency that regulates an entire industry"],"answer_index":0,"explanation":"Entities are usually legally independent, coordinated by contracts and social/economic mechanisms."},{"id":"S4-057","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 51","question":"Under which condition do network organizations tend to occur?","options":["When one firm controls all of its suppliers through ownership","When demand uncertainty and fast-changing technology make vertical integration a bad idea","When markets and technologies are completely stable for decades","When labor costs are negligible compared with capital costs"],"answer_index":1,"explanation":"Networks are halfway between vertical integration and market disaggregation; firms decouple volatile sections."},{"id":"S4-058","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 52","question":"In network organizations, everyone hearing about a difficult partner (as in the film industry) illustrates which favorable condition?","options":["Macroculture","Restricted access","Reputation","Joint payoffs"],"answer_index":2,"explanation":"Other conditions: joint payoffs, restricted access to a few long-term partners, and a shared macroculture."},{"id":"S4-059","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 52","question":"In network organizations, payments arranged so that nobody gets paid if the product fails illustrate which condition?","options":["Reputation","Restricted access","Macroculture","Joint payoffs"],"answer_index":3,"explanation":"Joint payoffs give everyone incentives to do their best."},{"id":"S4-060","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 53","question":"BMW outsourcing about 65% of a car's total production cost to long-term suppliers is an example of which network type?","options":["Market network","Dynamic network","Internal network","Stable network"],"answer_index":3,"explanation":"A central organization outsources much of its operations to long-term partners."},{"id":"S4-061","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 53","question":"A large company treating its units as separate profit centers that may also sell outside (e.g., GM's spark plug division) is a(n):","options":["Stable network","Virtual organization","Internal network","Dynamic network"],"answer_index":2,"explanation":"Headquarters acts like a broker; market prices give units an incentive to improve."},{"id":"S4-062","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 54","question":"Nike, whose own functions are mainly R&D and marketing while it assembles assets owned by others, is the center of which network type?","options":["Mechanistic bureaucracy","Internal network","Stable network","Dynamic network"],"answer_index":3,"explanation":"Dynamic networks outsource even more heavily; common in fashion, toys, publishing, film and biotech."},{"id":"S4-063","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 55","question":"Which description fits a virtual organization?","options":["A firm whose units are all profit centers selling to each other","A firm that contracts out almost all functions, keeping only its name and coordination, possibly without a permanent office","A firm with a large headquarters that is fully vertically integrated","A state-owned enterprise run directly by a government ministry"],"answer_index":1,"explanation":"Example: a fashion label run by three people subcontracting all functions — a 'hollow corporation'."},{"id":"S4-064","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 56","question":"According to the 'Key Comparison' slide, what is the primary driver of a virtual organization compared with a network organization?","options":["Digital/ICT connectivity and distributed work (vs. strategic alliances and inter-firm partnerships)","Government regulation (vs. open market competition between firms)","Vertical integration (vs. outsourcing to independent partners)","Family ownership (vs. public ownership on a stock exchange)"],"answer_index":0,"explanation":"Virtual organizations rely on digital connectivity; networks rely on strategic alliances."},{"id":"S4-065","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 59","question":"In a formal organization, authority arises from position; in an informal organization, authority arises from:","options":["Seniority rules","Written job descriptions","Board resolutions","Personal qualities"],"answer_index":3,"explanation":"Informal organization is the network of social relationships arising from interaction, not deliberately formed."},{"id":"S4-066","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 60","question":"Which is listed as a DISADVANTAGE of the informal organization?","options":["Potential for spreading rumors","Encourages creativity and innovation","Boosts employee morale","Promotes open communication"],"answer_index":0,"explanation":"Disadvantages also include lack of clear authority, inefficiency and coordination difficulty."},{"id":"S4-067","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 63","question":"Order fulfillment & logistics and product manufacturing are examples of which process type?","options":["Support processes","Informal processes","Management (strategic) processes","Core (operational) processes"],"answer_index":3,"explanation":"Core processes directly create the products or services customers buy and generate revenue."},{"id":"S4-068","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 64","question":"IT service-desk ticketing, procurement and employee leave requests are examples of:","options":["Support processes","Core processes","Network processes","Management processes"],"answer_index":0,"explanation":"Support processes don't generate money directly but provide infrastructure for core processes."},{"id":"S4-069","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 65","question":"Strategic goal setting with OKRs, internal audits and crisis management/non-conformity handling are examples of:","options":["Core (operational) processes","Informal (social) processes","Management (strategic) processes","Support (infrastructure) processes"],"answer_index":2,"explanation":"Management processes govern the operation: planning, oversight, performance and risk."},{"id":"S4-070","type":"lecture","week":5,"topic":"Organizational Awareness","doc":"Organizational Awareness","source":"LectureNotes - Organizational Awareness.pdf, p. 66","question":"According to the closing slide, what can happen if your organizational awareness skills are weak?","options":["You may be surprised by organizational events and make mistakes from misunderstanding the structure","You will automatically be promoted faster than your peers","Your technical skills will decline over time","You will be able to avoid all workplace conflicts"],"answer_index":0,"explanation":"You may also find it hard to get things done or act in ways others find inappropriate."},{"id":"S5-001","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 4","question":"Why does the lecture say conflict is natural and inevitable?","options":["Because organizations usually hire more people than they need","Because people are different, with contrasting values, goals or expectations","Because managers deliberately create conflict to increase their team's productivity","Because labor laws require formal disagreement procedures"],"answer_index":1,"explanation":"'You can't run away from conflict — manage it.'"},{"id":"S5-002","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 5","question":"In the lecture's list of people differences that cause conflict, 'Individualism vs. Collectivism' is an example of differences in:","options":["Perception","Policies","Values","Needs"],"answer_index":2,"explanation":"Values differ across cultures (e.g., USA, China, Germany, Turkey)."},{"id":"S5-003","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 6","question":"Two departments compete for the same budget, people and equipment. Which cause of conflict is this?","options":["Role ambiguity","Scarce resources","Task interdependence","Status and power differences"],"answer_index":1,"explanation":"Scarce resources: teams compete for budget, people, equipment or time."},{"id":"S5-004","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 6","question":"Authority and responsibilities in a project are unclear, and two leads both think they own the decision. Which cause of conflict is this?","options":["Incompatible goals","Role ambiguity","Communication problems","Scarce resources"],"answer_index":1,"explanation":"Role ambiguity: authority and responsibilities are unclear."},{"id":"S5-005","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 7","question":"Your boss hired an unqualified 'good friend' as a senior manager. What approach does the lecture recommend for raising concerns?","options":["Organize the long-term employees to resign together as a signal","Complain about the friend's personality in a group email to staff","Present a calm business case showing how the mistakes raise costs or alienate customers, without insulting the boss's judgment","Tell the boss directly that hiring his friend was a poor decision"],"answer_index":2,"explanation":"View it from the boss's perspective; don't expect him to admit a hiring error."},{"id":"S5-006","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 8","question":"'Mr. Visionary' never shares details of his assignments. How does the lecture explain this?","options":["He is deliberately hiding information to keep control over the employee","He lacks the technical knowledge needed to specify the details","He is a Peaceful type who avoids conflict by not giving instructions","He has a Playful personality and hasn't thought of the details, while the employee is Precise"],"answer_index":3,"explanation":"Recognize each other's strengths and accommodate the differences."},{"id":"S5-007","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 8","question":"In the 'Mr. Visionary' case, which phrasing does the lecture recommend when asking for what you need?","options":["'Why can't you ever give me the details I need?'","'I'll need a decision on the format by noon in order to meet the print deadline.'","'Have you finally made a decision about the format yet? I've been waiting for days.'","'I honestly can't work like this anymore.'"],"answer_index":1,"explanation":"Focus on what you require, not on what's wrong with your boss."},{"id":"S5-008","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 12","question":"Which of the following is listed as a positive outcome when conflict is managed?","options":["Conflict disappears permanently from the team and its meetings","Creativity is reduced in order to avoid risk","Long-standing problems are brought into the open","Decisions no longer need any discussion"],"answer_index":2,"explanation":"Managed conflict enhances engagement, trust, productivity and creativity."},{"id":"S5-009","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 12","question":"According to the lecture, what is the goal of conflict management?","options":["Transfer all interpersonal conflicts to the HR department","Minimize negative outcomes and promote positive outcomes of conflict to improve learning in the organization","Identify and punish the person who started the conflict","Eliminate every form of conflict from the organization permanently"],"answer_index":1,"explanation":"Conflict can be beneficial when managed."},{"id":"S5-010","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 13","question":"What is the FIRST step in the lecture's five-step process for managing conflict?","options":["Stabilize the situation — manage emotions and prevent escalation","Agree on actions, implement them and review the results with everyone","Discuss and negotiate possible solutions together","Select an approach among the five conflict styles"],"answer_index":0,"explanation":"Steps: stabilize → analyze → select an approach → discuss and negotiate → agree, implement and review."},{"id":"S5-011","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 13","question":"In the five-step conflict process, identifying parties, issues, interests, causes and power relationships happens in which step?","options":["Select an approach","Analyze the conflict","Agree, implement and review","Stabilize the situation"],"answer_index":1,"explanation":"Step 2 is analysis."},{"id":"S5-012","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 14","question":"What are the four steps of analyzing a conflict?","options":["Listen, agree with both sides, apologize and forget it","Blame the initiator, punish, document the case and close it","Define the issue, identify who is involved, list each party's needs and concerns, draw the maps","Escalate, mediate, arbitrate and finally go to court"],"answer_index":2,"explanation":"Conflict occurs whenever people disagree over values, motivations, perceptions, ideas or desires."},{"id":"S5-013","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 15","question":"Parties disagree about HOW a task should be performed. Which conflict type is this?","options":["Relationship conflict","Process conflict","Task conflict","Communication conflict"],"answer_index":1,"explanation":"Task conflict = disagreement about the task itself; process conflict = how it should be done."},{"id":"S5-014","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 15","question":"Which conflict type does the lecture define as 'misuse of management power'?","options":["Status or power conflict","Leading conflict","Relationship conflict","Process conflict"],"answer_index":1,"explanation":"Status/power conflict is disagreement about authority, influence or decision rights."},{"id":"S5-015","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 17","question":"A secretary is told to lie that her boss is out of the office, conflicting with her ethic of telling the truth. Which level of conflict is this?","options":["Inter-group conflict","Conflict within the individual","Interpersonal conflict","Conflict between the individual and the group"],"answer_index":1,"explanation":"Role expectations conflict with the individual's own values."},{"id":"S5-016","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 19","question":"A highly efficient waitress feels she deserves more than the equally shared tip pool. Which level of conflict is this?","options":["Conflict between the individual and the group","Inter-group conflict between departments","Inter-organizational conflict between the restaurant and its customers","Conflict within the individual herself"],"answer_index":0,"explanation":"The individual wants to remain in the group but disagrees with its norms."},{"id":"S5-017","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 20","question":"Line managers resent depending on staff departments for information and recommendations. Which level of conflict is this?","options":["Interpersonal conflict","Inter-organizational conflict","Conflict within the individual","Inter-group conflict"],"answer_index":3,"explanation":"Inter-group conflicts arise from factors inherent in organizational structure (e.g., line vs. staff, union vs. management)."},{"id":"S5-018","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 21","question":"A buyer and a supplier disagree about quantity, quality and delivery times of raw materials. Which level of conflict is this?","options":["Interpersonal conflict","Inter-group conflict","Conflict between the individual and the group","Inter-organizational conflict"],"answer_index":3,"explanation":"Inter-organizational conflict occurs between organizations dependent on each other."},{"id":"S5-019","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 23","question":"According to the lecture, differences in operative goals create potential for what kind of conflict?","options":["Inter-organizational conflict","Horizontal conflict","Vertical conflict","Conflict within the individual"],"answer_index":1,"explanation":"Other needs/concerns: task dependence, insufficient resources, salaries, unclear delegation of authority."},{"id":"S5-020","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 24","question":"Production says 'Production must not stop'; its interest is meeting the customer delivery date. What is its underlying concern?","options":["Completing preventive maintenance","Protecting safety on the line and avoiding a larger equipment failure","Avoiding financial penalties and damage to customer trust","Reducing overtime costs"],"answer_index":2,"explanation":"Maintenance's underlying concern, by contrast, is protecting safety and avoiding a larger failure."},{"id":"S5-021","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 24","question":"In the engineering example, 'The equipment must stop immediately' is maintenance's:","options":["BATNA","Underlying concern","Interest","Position"],"answer_index":3,"explanation":"Position = what they say; interest = complete preventive maintenance; concern = safety."},{"id":"S5-022","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 26","question":"Which conflict map separates stated positions, underlying interests and deeper needs?","options":["Relationship map","Timeline","Onion model","Conflict tree"],"answer_index":2,"explanation":"Timeline: events and escalation; relationship map: parties and power; conflict tree: root causes, central problem, consequences."},{"id":"S5-023","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 26","question":"According to the lecture, when should you use conflict mapping?","options":["When you feel stuck and can't see a clear way forward","Only for international or political conflicts","Only when lawyers are already involved","Only after the conflict has been fully resolved and documented"],"answer_index":0,"explanation":"Benefits: see the bigger picture, gain insight and see additional perspectives; everyone can use mapping."},{"id":"S5-024","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 28","question":"In the onion example, 'I want a raise' → 'because I feel underappreciated' → 'I need security'. What is 'I need security'?","options":["The position (outer layer)","The interest (middle layer)","The BATNA","The core need (inner layer)"],"answer_index":3,"explanation":"Outer = position, middle = interest, inner = core need."},{"id":"S5-025","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 29","question":"In onion graphing, which question uncovers the middle layer (interests)?","options":["'Why is this important to you?'","'What do you want?'","'Who started this?'","'What is your absolute bottom line here?'"],"answer_index":0,"explanation":"After listing positions, asking 'why' reveals interests; probing deeper reveals core needs."},{"id":"S5-026","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 29","question":"After comparing the onion layers of both parties, what should solutions target?","options":["The original demands, exactly as each side stated them at the start","The stated position of the more powerful party","An equal split between the two stated positions","Shared interests or core needs, not just surface positions"],"answer_index":3,"explanation":"Overlaps in interests or needs often reveal room for compromise or collaboration."},{"id":"S5-027","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 30","question":"In conflict mapping symbols, what does the size of a circle represent?","options":["How long the party has been involved in it","The number of people who belong to the party in the conflict","The power of the conflict party in relation to the conflict","The size of the party's financial budget"],"answer_index":2,"explanation":"Circle = party; size symbolizes power."},{"id":"S5-028","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 30","question":"In conflict mapping symbols, what does a double line between two parties indicate?","options":["A very good relationship or alliance","A weak, informal or intermittent link","A connection that has been broken","Discord or open conflict between them"],"answer_index":0,"explanation":"Straight line = close relationship; zig-zag = discord; crossed line = broken; dotted = weak."},{"id":"S5-029","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 34","question":"In the relations tree, what goes in the ROOTS?","options":["The solution that the parties have finally agreed on","Underlying causes such as lack of recognition, fear of losing control or broken trust","Visible issues such as frequent arguments or missed deadlines","The key parties involved and their main relationships"],"answer_index":1,"explanation":"Trunk = key parties; branches/leaves = visible conflict; roots = underlying causes."},{"id":"S5-030","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 35","question":"When analyzing a relations tree, if the roots involve unfair systems, what intervention does the lecture recommend?","options":["Run trust-building activities","Ignore the roots and treat the branches","Change policies or structures","Improve dialogue or mediation"],"answer_index":2,"explanation":"Miscommunication → dialogue/mediation; unfair systems → change policies; mistrust → empathy and trust-building."},{"id":"S5-031","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 38","question":"What are the two axes of the Thomas–Kilmann conflict model?","options":["Speed of the decision and cost of the outcome","Power of each party and their formal status","Formality of communication and its frequency","Assertiveness (focus on my needs) and cooperativeness (focus on others' needs)"],"answer_index":3,"explanation":"The five styles are positioned along these two dimensions."},{"id":"S5-032","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 38","question":"In the Thomas–Kilmann model, which style is assertive and uncooperative?","options":["Avoiding","Competing","Collaborating","Accommodating"],"answer_index":1,"explanation":"Competing: high assertiveness, low cooperativeness."},{"id":"S5-033","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 38","question":"In the Thomas–Kilmann model, which style is both unassertive and uncooperative?","options":["Competing","Accommodating","Avoiding","Compromising"],"answer_index":2,"explanation":"Avoiding neither pursues one's own nor others' concerns."},{"id":"S5-034","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 39","question":"When is the competing style appropriate, according to the lecture?","options":["When the situation is not urgent and there is plenty of time available to discuss","When a decision must be made quickly or an unpopular decision is needed","When people are feeling sensitive about the issue","When buy-in from everyone involved is very important"],"answer_index":1,"explanation":"Also when someone is trying to take advantage of the situation, or as a last resort."},{"id":"S5-035","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 39","question":"Semiha decides that Cemil must handle the difficult client, ending the argument with Edip. Which style is this?","options":["Competing","Avoiding","Compromising","Collaborating"],"answer_index":0,"explanation":"The person with the firmest stand (authority) decides."},{"id":"S5-036","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 40","question":"Jale and Ali cannot agree on UX changes; the deadline is pushed back and they work on other projects for a day before resuming. Which style is this?","options":["Avoiding","Accommodating","Compromising","Competing"],"answer_index":0,"explanation":"Taking a break allows them to cool down — avoiding has its uses."},{"id":"S5-037","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 40","question":"When is avoiding NOT appropriate, according to the lecture?","options":["When you need time to think and gather information","When the conflict is likely to resolve itself soon","When the issue is important or the conflict will grow worse without attention","When the issue is trivial and simply not worth the considerable time and effort"],"answer_index":2,"explanation":"Avoiding is useful only for trivial or self-resolving issues, or to buy time."},{"id":"S5-038","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 41","question":"Gülay thinks color B is slightly better but lets Kerim choose color A to avoid arguing. Which style is this?","options":["Avoiding","Collaborating","Accommodating","Compromising"],"answer_index":2,"explanation":"Accommodating fits when the issue is more important to the other person."},{"id":"S5-039","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 41","question":"When is accommodating appropriate?","options":["When the other party is taking advantage","When maintaining the relationship is more important than winning","When the decision is urgent and unpopular","When many stakeholders' needs must be integrated into one solution"],"answer_index":1,"explanation":"It is not appropriate when it won't permanently solve the problem."},{"id":"S5-040","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 42","question":"Rasim wants a full-time social media hire; Ceylan wants more digital ads. They hire a part-time person and spend the rest on ads. Which style is this?","options":["Competing","Collaborating","Accommodating","Compromising"],"answer_index":3,"explanation":"Each side gives up something; both are partially satisfied."},{"id":"S5-041","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 42","question":"When is compromising NOT appropriate, according to the lecture?","options":["When one person holds more power than the other","When resolving the conflict matters more than each side winning","When a decision is needed sooner rather than later","When power among the parties is equal"],"answer_index":0,"explanation":"Compromising also fails when a variety of important needs must be met or the situation is extremely urgent."},{"id":"S5-042","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 42","question":"Why might compromising be used as a first step between parties?","options":["When the issue is trivial to everyone involved","When one party has full authority over the decision","When trust between the parties is already very high","When the parties don't know each other well or haven't developed mutual trust"],"answer_index":3,"explanation":"It can provide temporary settlements on complex issues."},{"id":"S5-043","type":"lecture","week":6,"topic":"Crisis and Conflict Management and Negotiation","doc":"Crisis and Conflict Management and Negotiation","source":"LectureNotes - Crisis and Conflict Management and Negotiation.pdf, p. 43","question":"Tarık and Jale discuss each feature, why it matters, and agree on a mix including new features th
